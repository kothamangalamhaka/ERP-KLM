<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAT Tracking - Timesheet ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; font-size: 13px; }
        .navbar { background: #0f2027; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .table-responsive { width: 100%; overflow-x: auto; max-height: calc(100vh - 65px); }
        .nav-tools { display: flex; gap: 15px; align-items: center; font-size: 13px; }
        .nav-tools label { color: #cbd5e1; }
        .btn-success { background: #10b981; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-success:hover { filter: brightness(1.1); }
        .input-box, .select-box { padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: 'Inter'; }
        
        table { border-collapse: collapse; width: max-content; background: white; }
        th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: center; }
        th { background: #1e293b; color: white; position: sticky; top: 0; z-index: 10; font-size: 12px; }
        th.sub-head { top: 33px; background: #334155; }
        
        .merged-cell { vertical-align: middle; font-weight: 600; color: #334155; background: #f8fafc; }
        .editable { cursor: pointer; min-width: 60px; height: 20px; display: inline-block; width: 100%; }
        .editable:hover { background-color: #e2e8f0; }
        .edit-input { width: 90%; padding: 4px; font-size: 12px; border: 1px solid #0d6efd; border-radius: 3px; text-align: center; outline: none; }
        
        /* Shaded Inactive Month Cells */
        .inactive-cell { 
            background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 5px, #e2e8f0 5px, #e2e8f0 10px) !important; 
            pointer-events: none; 
            color: transparent;
        }

        /* Filter Styles */
        .filter-icon { cursor: pointer; color: #94a3b8; font-size: 10px; margin-left: 5px; display: inline-block; }
        .filter-icon:hover { color: #fff; }
        .filter-menu { position: absolute; background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; color: #0f2027; display: none; min-width: 150px; text-align: left; }
        .filter-menu label { display: block; padding: 4px 0; font-size: 12px; cursor:pointer;}
        .filter-action { font-size: 12px; padding: 5px; cursor: pointer; background: #f1f5f9; text-align: center; margin-bottom: 5px; border-radius: 3px; font-weight: 600; }
        .filter-action:hover { background: #e2e8f0; }
        
        #saveStatus { margin-left: 15px; font-weight: bold; }
        .status-saving { color: #f59e0b; }
        .status-saved { color: #10b981; }
        .status-error { color: #ef4444; }
        
        /* Login Modal Styles */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 32, 39, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        .login-box h2 { margin-top: 0; color: #0f2027; }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px; text-align: center;}
        .login-box button { width: 100%; background: #10b981; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .login-box button:hover { background: #059669; }
        #loginError { color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none; }
        .clip-text {
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Quick Entry Modal Styles & HTML -->
<style>
    .quick-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.7); display: none;
        justify-content: center; align-items: center; z-index: 10000;
    }
    .quick-modal-content {
        background: white; border-radius: 8px; width: 620px; max-width: 95%;
        max-height: 90vh; display: flex; flex-direction: column;
        box-shadow: 0 15px 30px rgba(0,0,0,0.3); overflow: hidden;
    }
    .quick-modal-header {
        background: #1e293b; color: white; padding: 12px 20px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .quick-modal-body {
        padding: 15px 20px; overflow-y: auto;
    }
    .quick-modal-footer {
        padding: 10px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0;
        display: flex; justify-content: flex-end; gap: 10px;
    }
    .quick-table {
        width: 100%; border-collapse: collapse; margin-top: 10px;
    }
    .quick-table th {
        background: #334155; color: white; padding: 6px; font-size: 12px;
    }
    .quick-table td {
        border: 1px solid #cbd5e1; padding: 4px 6px; font-size: 12px; text-align: center;
    }
    .quick-input {
        width: 95%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center;
    }
    .quick-input:focus { border-color: #0284c7; outline: none; background: #f0f9ff; }
</style>

<div id="quickEntryModal" class="quick-modal-overlay">
    <div class="quick-modal-content">
        <div class="quick-modal-header">
            <div>
                <h3 id="qmSupplierTitle" style="margin: 0; font-size: 15px;">Quick VAT Data Entry</h3>
                <span id="qmVatSubtitle" style="font-size: 12px; color: #94a3b8;"></span>
            </div>
            <button onclick="closeQuickModal()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <div class="quick-modal-body">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <label><b>Select Site:</b></label>
                <select id="qmSiteSelect" class="select-box" style="flex: 1;" onchange="loadQuickTable()"></select>
            </div>
            <table class="quick-table">
                <thead>
                    <tr>
                        <th style="width: 25%;">Month</th>
                        <th style="width: 25%;">Bill No</th>
                        <th style="width: 25%;">Amount</th>
                        <th style="width: 25%; background: #0f766e;">Vendor TS</th>
                    </tr>
                </thead>
                <tbody id="quickTableBody"></tbody>
            </table>
        </div>
        <div class="quick-modal-footer">
            <button onclick="closeQuickModal()" style="padding: 7px 15px; border: none; background: #94a3b8; color: white; border-radius: 4px; cursor: pointer;">Cancel</button>
            <button onclick="saveQuickEntry()" class="btn-success">Save & Apply</button>
        </div>
    </div>
</div>

    <!-- Login Modal -->
    <div id="loginModal" class="login-overlay">
        <div class="login-box">
            <h2>VAT Tracking Access</h2>
            <p style="font-size: 12px; color: #64748b;">Please enter the secure access code.</p>
            <input type="password" id="vatAccessCode" placeholder="Enter Access Code" onkeydown="if(event.key === 'Enter') verifyLogin()">
            <div id="loginError">Invalid Access Code. Try again.</div>
            <button onclick="verifyLogin()">Unlock</button>
        </div>
    </div>

    <div class="navbar">
        <div style="display:flex; align-items:center;">
            <a href="javascript:history.back()" style="color:white; text-decoration:none; margin-right: 15px; font-size: 20px;">🔙</a>
            <span style="font-size: 18px; font-weight: 600; white-space: nowrap;">VAT Billing & Tracking</span>
            <span id="saveStatus"></span>
        </div>

        <div class="nav-tools">
            <div style="display: flex; align-items: center; gap: 5px;">
                <button id="bulkEditBtn" class="btn-success" onclick="toggleBulkEdit()">Bulk Edit</button>
                <button id="cancelBulkBtn" class="btn-success" onclick="cancelBulkEdit()" style="display: none; background: #ef4444;">Cancel</button>
            </div>

            <div style="display: flex; align-items: center; gap: 5px;">
                <label><b>Year:</b></label>
                <input type="number" id="yearFilter" class="input-box" style="width: 60px;" onchange="fetchData()">
            </div>
            
            <div style="display: flex; align-items: center; gap: 5px;">
                <label><b>Quarter:</b></label>
                <select id="quarterFilter" class="select-box" onchange="renderTable()">
                    <option value="All">All (Jan - Dec)</option>
                    <option value="Q1">Q1 (Jan - Mar)</option>
                    <option value="Q2">Q2 (Apr - Jun)</option>
                    <option value="Q3">Q3 (Jul - Sep)</option>
                    <option value="Q4">Q4 (Oct - Dec)</option>
                </select>
            </div>
<div style="display: flex; align-items: center; gap: 5px;">
                <label><b>Search:</b></label>
                <input type="text" id="searchInput" class="input-box" placeholder="Global search..." onkeyup="renderTable()" style="width: 150px;">
            </div>

            <button class="btn-success" onclick="exportCompactExcel()" style="background: #0284c7;">⬇ Compact Excel</button>
            <button class="btn-success" onclick="exportExcel()">⬇ Export Excel</button>
        </div>
    </div>

    <!-- Dropdown Filter Menu -->
    <div id="filterMenu" class="filter-menu">
        <div id="sortActionContainer" style="display: flex; gap: 5px; margin-bottom: 5px;">
            <div class="filter-action" style="flex: 1; margin-bottom: 0;" onclick="applySort('asc')">Sort A-Z</div>
            <div class="filter-action" style="flex: 1; margin-bottom: 0;" onclick="applySort('desc')">Sort Z-A</div>
        </div>
        <hr id="sortDivider" style="border: 0; border-top: 1px solid #cbd5e1; margin: 8px 0;">
        <input type="text" class="input-box" placeholder="Search..." onkeyup="searchFilterItems(this)" style="width: 100%; box-sizing:border-box; margin-bottom: 8px;">
        <div id="filterCheckboxList" style="max-height: 50vh; overflow-y: auto;"></div>
        
        <!-- Buttons container -->
        <div style="display: flex; gap: 5px; margin-top: 8px;">
            <button style="flex: 1; padding: 6px; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;" onclick="clearColumnFilter()">Clear</button>
            <button class="btn-success" style="flex: 1; padding: 6px; border-radius: 4px;" onclick="applyColumnFilter()">Apply</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="vatTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="20">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const monthsFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let rawData = [];
        let currentYear = new Date().getFullYear();
        document.getElementById("yearFilter").value = currentYear;

        let activeCol = "";
        let sortConfig = { col: null, dir: null };
        let activeFilters = { company: [], supplier: [], vat_no: [], display_name: [], site_name: [], bill_no: [] };
        
        let isBulkMode = false;
        let pendingChanges = [];

        let vatCode = sessionStorage.getItem("vatTrackerCode") || "";

        // Login Check
        // Login Check - If code already exists in session, fetch data. Otherwise, show modal without error text.
        if (vatCode) {
            document.getElementById("loginModal").style.display = "none";
            fetchData();
        } else {
            document.getElementById("loginModal").style.display = "flex";
            document.getElementById("loginError").style.display = "none";
        }

        function verifyLogin() {
            const inputCode = document.getElementById("vatAccessCode").value.trim();
            if(!inputCode) return;
            vatCode = inputCode;
            sessionStorage.setItem("vatTrackerCode", vatCode);
            document.getElementById("loginError").style.display = "none";
            document.getElementById("loginModal").style.display = "none";
            fetchData();
        }

        function triggerLoginError() {
            sessionStorage.removeItem("vatTrackerCode");
            vatCode = "";
            document.getElementById("loginModal").style.display = "flex";
            document.getElementById("loginError").style.display = "block";
            document.getElementById("vatAccessCode").value = "";
            document.getElementById("vatAccessCode").focus();
        }

        async function fetchData() {
            currentYear = document.getElementById("yearFilter").value;
            document.getElementById("tableBody").innerHTML = '<tr><td colspan="20">Loading...</td></tr>';
            try {
                const res = await fetch(`/timesheet/api/vat-tracking/data?year=${currentYear}`, {
                    headers: { "x-vat-code": vatCode }
                });
                if (res.status === 401) return triggerLoginError();
                const json = await res.json();
                if (json.success) {
                    rawData = json.data;
                    renderTable();
                } else alert("Error fetching data: " + json.message);
            } catch (err) { alert("Network error."); }
        }


        
function renderTable() {
            const displayData = getFilteredData();
            const quarter = document.getElementById("quarterFilter").value;
            let startMonth = 0, endMonth = 11;
            
            if (quarter === "Q1") { startMonth = 0; endMonth = 2; }
            else if (quarter === "Q2") { startMonth = 3; endMonth = 5; }
            else if (quarter === "Q3") { startMonth = 6; endMonth = 8; }
            else if (quarter === "Q4") { startMonth = 9; endMonth = 11; }

            let head1 = `<tr>
                <th rowspan="2" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'sn')">SN</th>
                <th rowspan="2" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'company')">Company <span class="filter-icon" onclick="openFilter(event, 'company')">▼</span></th>
                <th rowspan="2" style="min-width: 130px; max-width: 130px;" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'display_name')">Display Name <span class="filter-icon" onclick="openFilter(event, 'display_name')">▼</span></th>
                <th rowspan="2" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'supplier')">Supplier <span class="filter-icon" onclick="openFilter(event, 'supplier')">▼</span></th>
                <th rowspan="2" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'vat_no')">Vat No <span class="filter-icon" onclick="openFilter(event, 'vat_no')">▼</span></th>
                <th rowspan="2" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'site_name')">Site <span class="filter-icon" onclick="openFilter(event, 'site_name')">▼</span></th>`;
            let head2 = `<tr>`;

            for (let i = startMonth; i <= endMonth; i++) {
                let mName = monthsFull[i].substring(0, 3) + "-" + currentYear.toString().slice(-2);
                head1 += `<th colspan="3">${mName}</th>`;
                head2 += `<th class="sub-head" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'bill_no', ${i})">Bill No <span class="filter-icon" onclick="openFilter(event, 'bill_no')">▼</span></th>
                          <th class="sub-head" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'amount', ${i})">Amount</th>
                          <th class="sub-head" style="background: #0f766e;" title="Right-click to copy column" oncontextmenu="copyColumnValues(event, 'erp_total', ${i})">Vendor TS</th>`;
            }
            head1 += `</tr>`;
            head2 += `</tr>`;
            document.getElementById("tableHead").innerHTML = head1 + head2;

            let tbody = "";
            if (displayData.length === 0) {
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="20">No matching data found.</td></tr>`;
                return;
            }

            let sn = 1;
            displayData.forEach(group => {
                const siteCount = group.sites.length;
                group.sites.forEach((siteData, sIdx) => {
                    tbody += `<tr>`;
                    
                    if (sIdx === 0) {
                        tbody += `<td rowspan="${siteCount}" class="merged-cell">${sn++}</td>
                                  <td rowspan="${siteCount}" class="merged-cell">${escapeHTML(group.company)}</td>
                                  <td rowspan="${siteCount}" class="merged-cell" style="max-width: 130px;"><span class="clip-text" title="${escapeHTML(group.display_name)}">${escapeHTML(group.display_name)}</span></td>
                                  <td rowspan="${siteCount}" class="merged-cell" style="max-width: 150px;">${escapeHTML(group.supplier)}</td>
                                  <td rowspan="${siteCount}" class="merged-cell" title="Right-click for Quick Entry" oncontextmenu="openQuickEntryModal(event, '${escapeQuotes(group.company)}', '${escapeQuotes(group.supplier)}')" style="cursor: pointer; font-weight: bold; color: #0284c7;">${escapeHTML(group.vat_no)}</td>`;
                    }

                    tbody += `<td style="text-align: left; font-weight: 500; max-width:140px;">${escapeHTML(siteData.site_name)}</td>`;

                    for (let i = startMonth; i <= endMonth; i++) {
                        let bill = siteData.billing[i] || { bill_no: "", amount: "", erp_total: "" };
                        let isActive = siteData.active_months[i]; 
                        
                        let cellClass = isActive ? "" : "inactive-cell";
                        
                        // 100% Safe way to assign fields without causing String Replace bugs
                        let baseArgsStr = `this, 'FIELD_PLACEHOLDER', '${escapeQuotes(group.company)}', '${escapeQuotes(group.supplier)}', '${escapeQuotes(group.vat_no)}', '${escapeQuotes(group.display_name)}', '${escapeQuotes(siteData.site_name)}', ${i}`;
                        
                        let actionBillNo = isActive ? `ondblclick="if(!isBulkMode) editCell(${baseArgsStr.replace('FIELD_PLACEHOLDER', 'bill_no')})" onclick="if(isBulkMode) editCell(${baseArgsStr.replace('FIELD_PLACEHOLDER', 'bill_no')})"` : "";
                        let actionAmount = isActive ? `ondblclick="if(!isBulkMode) editCell(${baseArgsStr.replace('FIELD_PLACEHOLDER', 'amount')})" onclick="if(isBulkMode) editCell(${baseArgsStr.replace('FIELD_PLACEHOLDER', 'amount')})"` : "";

                        let erpVal = bill.erp_total ? Number(bill.erp_total).toFixed(2) : "";

                        tbody += `
                            <td class="${cellClass}" ${actionBillNo}><span class="${isActive ? 'editable' : ''}">${escapeHTML(bill.bill_no)}</span></td>
                            <td class="${cellClass}" ${actionAmount}><span class="${isActive ? 'editable' : ''}">${escapeHTML(bill.amount)}</span></td>
                            <td class="${cellClass}" style="font-weight: 600; color: #0f766e;"><span>${erpVal}</span></td>
                        `;
                    }
                    tbody += `</tr>`;
                });
            });
            document.getElementById("tableBody").innerHTML = tbody;
        }

        function copyVat(e, text) {
            e.preventDefault();
            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    showStatus("Vat No Copied!", "saved");
                });
            }
        }

        // Bulk Edit Logic
        function toggleBulkEdit() {
            if (document.activeElement && document.activeElement.isContentEditable) {
                document.activeElement.blur();
            }

            isBulkMode = !isBulkMode;
            const btn = document.getElementById("bulkEditBtn");
            const cancelBtn = document.getElementById("cancelBulkBtn");

            if (isBulkMode) {
                btn.innerText = "💾 Save Changes";
                btn.style.background = "#eab308";
                cancelBtn.style.display = "inline-block";
                showStatus("Bulk Edit ON (Single Click)", "saving");
            } else {
                saveBulkChanges();
            }
        }

        function cancelBulkEdit() {
            if (document.activeElement && document.activeElement.isContentEditable) {
                document.activeElement.blur();
            }
            
            isBulkMode = false;
            pendingChanges = []; // Clear unsaved changes
            
            document.getElementById("bulkEditBtn").innerText = "Bulk Edit";
            document.getElementById("bulkEditBtn").style.background = "#10b981";
            document.getElementById("cancelBulkBtn").style.display = "none";
            
            showStatus("Changes Cancelled", "error");
            fetchData(); // Fetch fresh original data from the server to wipe out unsaved local changes
        }

       function getFilteredData(excludeCol = null) {
            let result = JSON.parse(JSON.stringify(rawData)); 
            const globalSearch = document.getElementById("searchInput").value.toLowerCase();

            result = result.filter(group => {
                if (excludeCol !== 'company' && activeFilters.company.length && !activeFilters.company.includes(group.company || "")) return false;
                if (excludeCol !== 'display_name' && activeFilters.display_name.length && !activeFilters.display_name.includes(group.display_name || "")) return false;
                if (excludeCol !== 'supplier' && activeFilters.supplier.length && !activeFilters.supplier.includes(group.supplier || "")) return false;
                if (excludeCol !== 'vat_no' && activeFilters.vat_no.length && !activeFilters.vat_no.includes(group.vat_no || "")) return false;
                
                group.sites = group.sites.filter(site => {
                    if (excludeCol !== 'site_name' && activeFilters.site_name.length && !activeFilters.site_name.includes(site.site_name || "")) return false;
                    if (excludeCol !== 'bill_no' && activeFilters.bill_no.length > 0) {
                        let hasBill = false;
                        for (let i = 0; i < 12; i++) {
                            let bNo = site.billing[i] ? (site.billing[i].bill_no || "") : "";
                            if (activeFilters.bill_no.includes(bNo)) hasBill = true;
                        }
                        if (!hasBill) return false;
                    }
                    return true;
                });

                if (globalSearch && group.sites.length > 0) {
                    const searchStr = `${group.company} ${group.supplier} ${group.vat_no} ${group.display_name} ${group.sites.map(s=>s.site_name).join(" ")}`.toLowerCase();
                    if (!searchStr.includes(globalSearch)) return false;
                }
                
                return group.sites.length > 0;
            });

            if (sortConfig.col) {
                result.sort((a, b) => {
                    let valA = sortConfig.col === 'site_name' ? (a.sites[0]?.site_name || "") : (a[sortConfig.col] || "");
                    let valB = sortConfig.col === 'site_name' ? (b.sites[0]?.site_name || "") : (b[sortConfig.col] || "");
                    return sortConfig.dir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }
            return result;
        }

        /* Filter Menu Logic */
        function openFilter(e, colName) {
            e.stopPropagation();
            activeCol = colName;
            const menu = document.getElementById("filterMenu");
            menu.style.display = "block";
            menu.style.left = e.pageX + "px";
            menu.style.top = (e.pageY + 15) + "px";

            if (colName === 'vat_no' || colName === 'bill_no') {
                document.getElementById("sortActionContainer").style.display = "none";
                document.getElementById("sortDivider").style.display = "none";
            } else {
                document.getElementById("sortActionContainer").style.display = "flex";
                document.getElementById("sortDivider").style.display = "block";
            }

            // മറ്റുള്ള ആക്ടീവ് ഫിൽട്ടറുകൾ പ്രകാരം ഫിൽട്ടർ ചെയ്യപ്പെട്ട ഡാറ്റയിൽ നിന്ന് മാത്രം യൂണീക് വാല്യൂസ് എടുക്കുന്നു
            const contextualData = getFilteredData(colName);

            let uniqueVals = new Set();
            let hasBlank = false;
            contextualData.forEach(g => {
                if (colName === 'site_name') {
                    g.sites.forEach(s => {
                        let val = s.site_name || "";
                        if (val === "") hasBlank = true;
                        else uniqueVals.add(val);
                    });
                } else if (colName === 'bill_no') {
                    g.sites.forEach(s => {
                        for(let i = 0; i < 12; i++) {
                            let bNo = s.billing[i] ? (s.billing[i].bill_no || "") : "";
                            if (bNo === "") hasBlank = true;
                            else uniqueVals.add(bNo);
                        }
                    });
                } else {
                    let val = g[colName] || "";
                    if (val === "") hasBlank = true;
                    else uniqueVals.add(val);
                }
            });
            
            let isAllChecked = activeFilters[colName].length === 0;
            let listHtml = `<label style="display: block; font-weight: bold; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 5px; cursor: pointer;">
                                <input type="checkbox" id="selectAllFilter" ${isAllChecked ? "checked" : ""} onchange="toggleAllFilters(this)"> 
                                (Select All)
                            </label>`;
            
            let sortedVals = Array.from(uniqueVals).sort((a, b) => a.toString().localeCompare(b.toString(), undefined, { numeric: true, sensitivity: 'base' }));

            sortedVals.forEach(val => {
                let isChecked = isAllChecked || activeFilters[colName].includes(val) ? "checked" : "";
                listHtml += `<label class="f-item"><input type="checkbox" class="filter-cb" value="${escapeHTML(val)}" ${isChecked} onchange="checkIfAllSelected()"> ${escapeHTML(val)}</label>`;
            });

            if (hasBlank) {
                let isChecked = isAllChecked || activeFilters[colName].includes("") ? "checked" : "";
                listHtml += `<label class="f-item" style="color: #64748b; font-style: italic;"><input type="checkbox" class="filter-cb" value="" ${isChecked} onchange="checkIfAllSelected()"> (Blanks)</label>`;
            }

            document.getElementById("filterCheckboxList").innerHTML = listHtml;
        }

        function toggleAllFilters(source) {
            const checkboxes = document.querySelectorAll("#filterCheckboxList .filter-cb");
            checkboxes.forEach(cb => {
                if (cb.closest('.f-item').style.display !== "none") cb.checked = source.checked;
            });
        }

        function checkIfAllSelected() {
            const total = document.querySelectorAll("#filterCheckboxList .filter-cb").length;
            const hidden = document.querySelectorAll("#filterCheckboxList .f-item[style*='display: none']").length;
            const visibleTotal = total - hidden;
            const checked = document.querySelectorAll("#filterCheckboxList .filter-cb:checked").length;
            document.getElementById("selectAllFilter").checked = (visibleTotal > 0 && visibleTotal === checked);
        }

        function applySort(dir) {
            sortConfig = { col: activeCol, dir: dir };
            document.getElementById("filterMenu").style.display = "none";
            renderTable();
        }

        function applyColumnFilter() {
            const boxes = document.querySelectorAll("#filterCheckboxList .filter-cb");
            let selected = [];
            boxes.forEach(b => { if (b.checked) selected.push(b.value); });
            activeFilters[activeCol] = selected.length === boxes.length ? [] : selected;

        }

        function clearColumnFilter() {
            activeFilters[activeCol] = [];

        function searchFilterItems(input) {

        /* Edit and Save Logic */
        function editCell(td, field, company, supplier, vat_no, display_name, site_name, month_index) {
            if (td.classList.contains("inactive-cell")) return; 
            const span = td.querySelector("span");
            if (span.isContentEditable) return; // Prevent re-triggering if already editing

            const currentValue = span.innerText.trim();
            
            // Make span directly editable without injecting <input>
            span.contentEditable = "true";
            span.style.outline = "none"; 
            span.style.background = "transparent";
            span.style.display = "inline-block";
            span.style.minWidth = "50px";
            span.focus();

            // Set cursor to the end of the text
            let range = document.createRange();
            let sel = window.getSelection();
            if(span.childNodes.length > 0) {
                range.setStart(span.childNodes[0], span.innerText.length);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            }

            span.onblur = async function() {
                span.contentEditable = "false";
                span.style.outline = "none";
                span.style.background = "transparent";

                let newValue = this.innerText.trim();

                // 🟢 Excel-like Math Calculation (Amount കോളത്തിന് മാത്രം)
                if (field === 'amount' && newValue !== "") {
                    let mathExpr = newValue;
                    if (mathExpr.startsWith('=')) {
                        mathExpr = mathExpr.substring(1);
                    }
                    mathExpr = mathExpr.replace(/,/g, ''); 

                    if (/^[0-9+\-*/().\s]+$/.test(mathExpr)) {
                        try {
                            let calculated = new Function('return ' + mathExpr)();
                            if (isFinite(calculated)) {
                                newValue = Number(calculated.toFixed(2)).toString(); 
                            }
                        } catch (e) { 
                            console.log("Invalid math expression"); 
                        }
                    }
                }

                this.innerText = newValue; // Math calculation കഴിഞ്ഞുള്ള വാല്യൂ span-ൽ തിരികെ സെറ്റ് ചെയ്യുന്നു
                
                if (newValue !== currentValue) {
                    const grp = rawData.find(g => g.company === company && g.supplier === supplier);
                    if(grp) {
                        const sit = grp.sites.find(s => s.site_name === site_name);
                        if(sit) sit.billing[month_index][field] = newValue;
                    }
                    
                    if (isBulkMode) {
                        td.style.backgroundColor = "#fef08a"; 
                        const existingIdx = pendingChanges.findIndex(p => p.company === company && p.supplier === supplier && p.site_name === site_name && p.month_index === month_index && p.field === field);
                        
                        if (existingIdx > -1) {
                            pendingChanges[existingIdx].value = newValue; 
                        } else {
                            pendingChanges.push({ year: currentYear, company, supplier, vat_no, display_name, site_name, month_index, field, value: newValue });
                        }
                    } else {
                        await saveCell(company, supplier, vat_no, display_name, site_name, month_index, field, newValue);
                    }
                }
            };

            // Enter അടിച്ചാൽ എഡിറ്റിംഗ് സേവ് ആവാൻ വേണ്ടി
            span.onkeydown = function(e) { 
                if (e.key === "Enter") {
                    e.preventDefault(); 
                    this.blur(); 
                }
            }
        }

        async function saveCell(company, supplier, vat_no, display_name, site_name, month_index, field, value) {
            showStatus("Saving...", "saving");
            try {
                const res = await fetch(`/timesheet/api/vat-tracking/update-cell`, {
                    method: "POST", headers: { "Content-Type": "application/json", "x-vat-code": vatCode },
                    body: JSON.stringify({ year: currentYear, company, supplier, vat_no, display_name, site_name, month_index, field, value })
                });
                if (res.status === 401) return triggerLoginError();
                const json = await res.json();
                if (json.success) showStatus("✓ Saved", "saved");
                else showStatus("Error", "error");
            } catch (err) { showStatus("Error", "error"); }
        }

        async function saveBulkChanges() {
            if (pendingChanges.length === 0) {
                document.getElementById("bulkEditBtn").innerText = "Bulk Edit";
                document.getElementById("bulkEditBtn").style.background = "#10b981";
                document.getElementById("cancelBulkBtn").style.display = "none";
                showStatus("No changes to save", "saved");
                return;
            }

            showStatus("Saving bulk changes...", "saving");
            try {
                const res = await fetch(`/timesheet/api/vat-tracking/update-bulk`, {
                    method: "POST", headers: { "Content-Type": "application/json", "x-vat-code": vatCode },
                    body: JSON.stringify({ changes: pendingChanges })
                });
                if (res.status === 401) return triggerLoginError();
                const json = await res.json();
                if (json.success) {
                    showStatus("✓ Bulk Saved", "saved");
                    pendingChanges = []; 
                } else {
                    showStatus("Error", "error");
                }
            } catch (err) { showStatus("Error", "error"); }

            document.getElementById("bulkEditBtn").innerText = "Bulk Edit";
            document.getElementById("bulkEditBtn").style.background = "#10b981";
            document.getElementById("cancelBulkBtn").style.display = "none";
            renderTable(); 
        }

        function showStatus(msg, type) {
            const s = document.getElementById("saveStatus");
            s.innerText = msg; s.className = `status-${type}`;
            if (type === "saved" || type === "error") setTimeout(() => s.innerText = "", 3000);
        }

        /* EXPORT EXCEL WITH STYLES (EXCELJS) - FIXED ROW HEIGHT & WRAP */
        async function exportExcel() {
            showStatus("Exporting...", "saving");
            const displayData = getFilteredData();
            const quarter = document.getElementById("quarterFilter").value;
            let startMonth = 0, endMonth = 11;
            if (quarter === "Q1") { startMonth = 0; endMonth = 2; }
            else if (quarter === "Q2") { startMonth = 3; endMonth = 5; }
            else if (quarter === "Q3") { startMonth = 6; endMonth = 8; }
            else if (quarter === "Q4") { startMonth = 9; endMonth = 11; }

            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet("VAT Tracking", { views: [{ state: 'frozen', ySplit: 2, xSplit: 6 }] });

            // 1. Generate Headers Arrays First
            let row1 = ["SN", "Company", "Display Name", "Supplier", "Vat No", "Site"];
            let row2 = ["", "", "", "", "", ""];
            
            for (let i = startMonth; i <= endMonth; i++) {
                let mName = monthsFull[i].substring(0, 3) + "-" + currentYear.toString().slice(-2);
                row1.push(mName, "", "");
                row2.push("Bill No", "Amount", "Vendor TS");
            }

            // 2. Add Headers to Worksheet
            ws.addRow(row1);
            ws.addRow(row2);

            ws.getRow(1).height = 25;
            ws.getRow(2).height = 25;

            // 3. Apply Merges
            for (let c = 1; c <= 6; c++) {
                ws.mergeCells(1, c, 2, c);
            }
            
            let colIndex = 7;
            for (let i = startMonth; i <= endMonth; i++) {
                ws.mergeCells(1, colIndex, 1, colIndex + 2);
                colIndex += 3;
            }

            // 4. Style Headers
            const borderStyle = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
            
            ws.getRow(1).eachCell(cell => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                cell.alignment = { vertical: 'middle', horizontal: 'center' };
                cell.border = borderStyle;
            });
            
            ws.getRow(2).eachCell((cell, colNumber) => {
                if (colNumber > 6) {
                    let isERP = ((colNumber - 6) % 3 === 0);
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isERP ? 'FF0F766E' : 'FF334155' } };
                    cell.font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 11 };
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = borderStyle;
                }
            });

            const safeNumber = (val) => {
                if (val === null || val === undefined || val === "") return "";
                let num = parseFloat(val.toString().replace(/,/g, ''));
                return isNaN(num) ? val : num; 
            };

            // 5. Add Data
            let rowIndex = 3; 
            let sn = 1;

            displayData.forEach(group => {
                let startRow = rowIndex;
                group.sites.forEach((siteData, sIdx) => {
                    let rowData = [];
                    if (sIdx === 0) {
                        rowData.push(sn++, group.company, group.display_name, group.supplier, group.vat_no);
                    } else {
                        rowData.push("", "", "", "", "");
                    }
                    rowData.push(siteData.site_name);

                    let inactiveColumns = [];
                    let cIdx = 7;
                    
                    for (let i = startMonth; i <= endMonth; i++) {
                        let bill = siteData.billing[i] || { bill_no: "", amount: "", erp_total: "" };
                        if (siteData.active_months[i]) {
                            rowData.push(
                                bill.bill_no || "", 
                                safeNumber(bill.amount), 
                                safeNumber(bill.erp_total)
                            );
                        } else {
                            rowData.push("", "", "");
                            inactiveColumns.push(cIdx, cIdx + 1, cIdx + 2);
                        }
                        cIdx += 3;
                    }

                    let row = ws.addRow(rowData);
                    row.height = 25;
                    
                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        cell.alignment = { 
                            vertical: 'middle', 
                            horizontal: 'center', 
                            wrapText: colNumber > 6 
                        };
                        cell.border = borderStyle;
                        
                        if (inactiveColumns.includes(colNumber)) {
                            cell.fill = { type: 'pattern', pattern: 'lightGray', fgColor: { argb: 'FFCBD5E1' }, bgColor: { argb: 'FFE2E8F0' } };
                        }
                        
                        if (colNumber > 6 && (colNumber - 6) % 3 === 0 && !inactiveColumns.includes(colNumber)) {
                            cell.font = { bold: true, color: { argb: 'FF0F766E' } };
                        }

                        let isAmountCol = colNumber > 6 && (colNumber - 6) % 3 === 2;
                        let isERPCol = colNumber > 6 && (colNumber - 6) % 3 === 0;
                        if ((isAmountCol || isERPCol) && typeof cell.value === 'number') {
                            cell.numFmt = '#,##0.00';
                        }
                    });
                    rowIndex++;
                });

                if (group.sites.length > 1) {
                    let endRow = rowIndex - 1;
                    for (let c = 1; c <= 5; c++) {
                        ws.mergeCells(startRow, c, endRow, c);
                    }
                }
            });

            ws.getColumn(1).width = 5;
            ws.getColumn(2).width = 18;
            ws.getColumn(3).width = 25;
            ws.getColumn(4).width = 25;
            ws.getColumn(5).width = 15;
            ws.getColumn(6).width = 25;
            
            let totalCols = ws.columnCount;
            for(let c = 7; c <= totalCols; c++) {
                 ws.getColumn(c).width = 12;
            }

            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            saveAs(blob, `VAT_Tracking_${currentYear}_${quarter}.xlsx`);
            
            showStatus("Export Success!", "saved");
        }

        /* COMPACT EXCEL EXPORT - EXACT AS IMAGE (SUPPLIER-WISE CONSOLIDATED TAB) */
        async function exportCompactExcel() {
            showStatus("Exporting Compact...", "saving");
            const displayData = getFilteredData();
            const quarter = document.getElementById("quarterFilter").value;
            let startMonth = 0, endMonth = 11;
            if (quarter === "Q1") { startMonth = 0; endMonth = 2; }
            else if (quarter === "Q2") { startMonth = 3; endMonth = 5; }
            else if (quarter === "Q3") { startMonth = 6; endMonth = 8; }
            else if (quarter === "Q4") { startMonth = 9; endMonth = 11; }

            const wb = new ExcelJS.Workbook();
            const borderStyle = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

            const safeNumber = (val) => {
                if (val === null || val === undefined || val === "") return "";
                let num = parseFloat(val.toString().replace(/,/g, ''));
                return isNaN(num) ? val : num; 
            };

            // 1. ഒരേ സപ്ലയർക്ക് കീഴിലുള്ള എല്ലാ സൈറ്റുകളെയും (വ്യത്യസ്ത കമ്പനികളിൽ ആണെങ്കിലും) ഒരുമിച്ച് കൊണ്ടുവരുന്നു
            const consolidatedSuppliers = {};
            displayData.forEach(group => {
                const supKey = (group.supplier || "Unknown").trim();
                if (!consolidatedSuppliers[supKey]) {
                    consolidatedSuppliers[supKey] = {
                        supplier: supKey,
                        vat_no: group.vat_no || "",
                        display_name: group.display_name || "",
                        sites: []
                    };
                } else {
                    if (!consolidatedSuppliers[supKey].vat_no && group.vat_no) consolidatedSuppliers[supKey].vat_no = group.vat_no;
                    if (!consolidatedSuppliers[supKey].display_name && group.display_name) consolidatedSuppliers[supKey].display_name = group.display_name;
                }

                group.sites.forEach(st => {
                    // സൈറ്റുകൾ ഡ്യൂപ്ലിക്കേറ്റ് വരാതിരിക്കാൻ ചെക്ക് ചെയ്യുന്നു
                    const existingSite = consolidatedSuppliers[supKey].sites.find(s => s.site_name === st.site_name);
                    if (!existingSite) {
                        consolidatedSuppliers[supKey].sites.push(JSON.parse(JSON.stringify(st)));
                    } else {
                        // നിലവിൽ ഉള്ള സൈറ്റാണെങ്കിൽ ബില്ലിംഗും ആക്ടീവ് മന്ത്സും മെർജ് ചെയ്യുന്നു
                        for (let m = 0; m < 12; m++) {
                            if (st.active_months[m]) existingSite.active_months[m] = true;
                            if (st.billing[m]?.bill_no) existingSite.billing[m].bill_no = st.billing[m].bill_no;
                            if (st.billing[m]?.amount) existingSite.billing[m].amount = st.billing[m].amount;
                            if (st.billing[m]?.erp_total) existingSite.billing[m].erp_total = st.billing[m].erp_total;
                        }
                    }
                });
            });

            const usedSheetNames = new Set();

            Object.values(consolidatedSuppliers).forEach(supData => {
                // Excel Sheet Name ക്രമീകരിക്കുന്നു (പരമാവധി 28 അക്ഷരം, അസാധുവായ ചിഹ്നങ്ങൾ നീക്കം ചെയ്യുന്നു)
                let sheetName = (supData.supplier || "Supplier").replace(/[*?:/\\\[\]]/g, '').trim().substring(0, 28);
                if (!sheetName) sheetName = "Supplier";

                let uniqueSheetName = sheetName;
                let counter = 1;
                while (usedSheetNames.has(uniqueSheetName.toLowerCase())) {
                    uniqueSheetName = `${sheetName.substring(0, 25)}_${counter++}`;
                }
                usedSheetNames.add(uniqueSheetName.toLowerCase());

                // ഫസ്റ്റ് കോളം ഫ്രീസ് ചെയ്യുന്നില്ല (xSplit: 0), ടോപ്പ് ഹെഡറുകൾ മാത്രം ഫ്രീസ് ചെയ്യുന്നു (ySplit: 5)
                const ws = wb.addWorksheet(uniqueSheetName, { views: [{ state: 'frozen', ySplit: 5, xSplit: 0 }] });

                // Row 1: Supplier Name
                let r1 = ws.addRow(["Supplier", supData.supplier || ""]);
                r1.getCell(1).font = { bold: true };
                r1.getCell(2).font = { bold: true };

                // Row 2: VAT No
                let r2 = ws.addRow(["Vat No", supData.vat_no ? String(supData.vat_no) : ""]);
                r2.getCell(1).font = { bold: true };
                r2.getCell(2).font = { bold: true };
                r2.getCell(2).numFmt = '@'; // ടെക്സ്റ്റ് ഫോർമാറ്റായി നിലനിർത്തുന്നു

                // Row 3: Display Name
                let r3 = ws.addRow(["Display Name", supData.display_name || ""]);
                r3.getCell(1).font = { bold: true };
                r3.getCell(2).font = { bold: true };

                ws.getRow(1).height = 20;
                ws.getRow(2).height = 20;
                ws.getRow(3).height = 20;

                // Row 4: Site Names Headers & Row 5: Sub-headers (Month, Bill No, Amount, Vendor TS)
                let row4 = ["Month"];
                let row5 = [""];

                supData.sites.forEach(site => {
                    row4.push(site.site_name, "", "");
                    row5.push("Bill No", "Amount", "Vendor TS");
                });

                ws.addRow(row4); // Row 4
                ws.addRow(row5); // Row 5

                ws.getRow(4).height = 26;
                ws.getRow(5).height = 24;

                // Month കോളം വെർട്ടിക്കലായി മെർജ് ചെയ്യുന്നു (Row 4 & 5)
                ws.mergeCells(4, 1, 5, 1);

                // ഓരോ സൈറ്റിന്റെയും 3 കോളങ്ങൾക്ക് മുകളിൽ സൈറ്റിന്റെ പേര് ഹൊറിസോണ്ടലായി മെർജ് ചെയ്യുന്നു
                let colIdx = 2;
                supData.sites.forEach(() => {
                    ws.mergeCells(4, colIdx, 4, colIdx + 2);
                    colIdx += 3;
                });

                // Row 4 Header Styling (Site Name Headers & Month)
                ws.getRow(4).eachCell({ includeEmpty: true }, (cell, colNumber) => {
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
                    cell.font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 11 };
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = borderStyle;
                });

                // Row 5 Header Styling (Bill No, Amount, Vendor TS)
                ws.getRow(5).eachCell({ includeEmpty: true }, (cell, colNumber) => {
                    if (colNumber > 1) {
                        let isERP = ((colNumber - 1) % 3 === 0);
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isERP ? 'FF0F766E' : 'FF334155' } };
                        cell.font = { color: { argb: 'FFFFFFFF' }, bold: true, size: 10 };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                        cell.border = borderStyle;
                    }
                });

                // Row 6 മുതൽ ഡാറ്റ വരികൾ ചേർക്കുന്നു
                for (let m = startMonth; m <= endMonth; m++) {
                    let mName = monthsFull[m].substring(0, 3) + " - " + currentYear.toString().slice(-2);
                    let rowData = [mName];
                    let inactiveCells = [];
                    let currCol = 2;

                    supData.sites.forEach(site => {
                        const isActive = site.active_months[m];
                        const bill = site.billing[m] || { bill_no: "", amount: "", erp_total: "" };

                        if (isActive) {
                            rowData.push(
                                bill.bill_no || "",
                                safeNumber(bill.amount),
                                safeNumber(bill.erp_total)
                            );
                        } else {
                            rowData.push("", "", "");
                            inactiveCells.push(currCol, currCol + 1, currCol + 2);
                        }
                        currCol += 3;
                    });

                    let dataRow = ws.addRow(rowData);
                    dataRow.height = 22;

                    dataRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        cell.border = borderStyle;
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };

                        if (colNumber === 1) {
                            cell.font = { bold: true };
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
                        } else {
                            if (inactiveCells.includes(colNumber)) {
                                cell.fill = { type: 'pattern', pattern: 'lightGray', fgColor: { argb: 'FFCBD5E1' }, bgColor: { argb: 'FFE2E8F0' } };
                            } else {
                                // Vendor TS കോളം ഗ്രീൻ കളർ ഫോണ്ട്
                                if ((colNumber - 1) % 3 === 0) {
                                    cell.font = { bold: true, color: { argb: 'FF0F766E' } };
                                }
                                // Amount & Vendor TS നമ്പറുകൾക്ക് കറൻസി/ഡെസിമൽ ഫോർമാറ്റിംഗ്
                                let isAmt = (colNumber - 1) % 3 === 2;
                                let isERP = (colNumber - 1) % 3 === 0;
                                if ((isAmt || isERP) && typeof cell.value === 'number') {
                                    cell.numFmt = '#,##0.00';
                                }
                            }
                        }
                    });
                }

                // Column Width ക്രമീകരിക്കുന്നു
                ws.getColumn(1).width = 16;
                let totalColumns = ws.columnCount;
                for (let c = 2; c <= totalColumns; c++) {
                    ws.getColumn(c).width = 14;
                }
            });

            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            saveAs(blob, `Compact_VAT_${currentYear}_${quarter}.xlsx`);

            showStatus("Compact Export Success!", "saved");
        }
        
        function escapeHTML(str) { return str ? String(str).replace(/[&<>'"]/g, t => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" })[t] || t) : ""; }
        function escapeQuotes(str) { return str ? String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;") : ""; }

       

function copyColumnValues(e, colName, monthIndex = null) {
            e.preventDefault();
            const displayData = getFilteredData();
            let valuesToCopy = [];
            let currentSn = 1;

            displayData.forEach(group => {
                const groupSn = currentSn++;
                // ഓരോ ഗ്രൂപ്പിലെയും എല്ലാ സൈറ്റ് വരികൾക്കും പാരന്റ് ഡാറ്റ (Company, Display Name, etc.) ഓട്ടോഫിൽ ആയി നൽകുന്നു
                group.sites.forEach(siteData => {
                    let val = "";
                    if (colName === 'sn') {
                        val = groupSn;
                    } else if (colName === 'company') {
                        val = group.company;
                    } else if (colName === 'display_name') {
                        val = group.display_name;
                    } else if (colName === 'supplier') {
                        val = group.supplier;
                    } else if (colName === 'vat_no') {
                        val = group.vat_no;
                    } else if (colName === 'site_name') {
                        val = siteData.site_name;
                    } else if (monthIndex !== null) {
                        let bill = siteData.billing[monthIndex] || {};
                        if (colName === 'bill_no') val = bill.bill_no;
                        else if (colName === 'amount') val = bill.amount;
                        else if (colName === 'erp_total') val = bill.erp_total;
                    }
                    valuesToCopy.push(val !== undefined && val !== null ? String(val).trim() : "");
                });
            });

            if (valuesToCopy.length > 0) {
                navigator.clipboard.writeText(valuesToCopy.join("\n")).then(() => {
                    showStatus(`Copied ${valuesToCopy.length} rows to clipboard!`, "saved");
                }).catch(err => {
                    showStatus("Failed to copy", "error");
                });
            }
        }

        let currentQuickSites = []; // Holds all sites mapped with their parent group data

function openQuickEntryModal(e, company, supplier) {
    e.preventDefault();
    
    // Find all groups matching the same supplier (or same VAT No if supplier names vary slightly)
    const matchingGroups = rawData.filter(g => (g.supplier === supplier) || (g.company === company && g.supplier === supplier));
    if (matchingGroups.length === 0) return;

    const primaryGroup = matchingGroups.find(g => g.company === company) || matchingGroups[0];
    
    document.getElementById("qmSupplierTitle").innerText = primaryGroup.supplier;
    document.getElementById("qmVatSubtitle").innerText = `VAT No: ${primaryGroup.vat_no || 'N/A'} | Display: ${primaryGroup.display_name || 'N/A'}`;

    // Flatten all sites from matching groups across different companies
    currentQuickSites = [];
    matchingGroups.forEach(grp => {
        grp.sites.forEach(st => {
            currentQuickSites.push({
                group: grp,
                site: st
            });
        });
    });

    const siteSelect = document.getElementById("qmSiteSelect");
    siteSelect.innerHTML = "";
    
    currentQuickSites.forEach((item, index) => {
        // Show site name directly in the dropdown
        siteSelect.innerHTML += `<option value="${index}">${escapeHTML(item.site.site_name)}</option>`;
    });

    loadQuickTable();
    document.getElementById("quickEntryModal").style.display = "flex";
}

function loadQuickTable() {
    if (!currentQuickSites || currentQuickSites.length === 0) return;
    const selectedIdx = parseInt(document.getElementById("qmSiteSelect").value);
    const target = currentQuickSites[selectedIdx];
    if (!target) return;

    const siteObj = target.site;
    let html = "";
    for (let i = 0; i < 12; i++) {
        const isActive = siteObj.active_months[i];
        const bill = siteObj.billing[i] || { bill_no: "", amount: "", erp_total: "" };
        const monthLabel = monthsFull[i].substring(0, 3) + " - " + currentYear.toString().slice(-2);
        const erpVal = bill.erp_total ? Number(bill.erp_total).toFixed(2) : "";

        if (isActive) {
            html += `
                <tr>
                    <td style="font-weight: 600; background: #f8fafc;">${monthLabel}</td>
                    <td><input type="text" class="quick-input qm-bill" data-month="${i}" value="${escapeHTML(bill.bill_no || '')}"></td>
                    <td><input type="text" class="quick-input qm-amt" data-month="${i}" value="${escapeHTML(bill.amount || '')}"></td>
                    <td style="background: #f0fdfa; font-weight: 600; color: #0f766e;">${erpVal}</td>
                </tr>
            `;
        } else {
            html += `
                <tr style="background: #f1f5f9; color: #94a3b8;">
                    <td>${monthLabel}</td>
                    <td colspan="3" style="font-style: italic; font-size: 11px;">Inactive Month</td>
                </tr>
            `;
        }
    }
    document.getElementById("quickTableBody").innerHTML = html;
}

function closeQuickModal() {
    document.getElementById("quickEntryModal").style.display = "none";
    currentQuickSites = [];
}

async function saveQuickEntry() {
    if (!currentQuickSites || currentQuickSites.length === 0) return;
    const selectedIdx = parseInt(document.getElementById("qmSiteSelect").value);
    const target = currentQuickSites[selectedIdx];
    if (!target) return;

    const currentGrp = target.group;
    const siteObj = target.site;
    const selectedSiteName = siteObj.site_name;

    const billInputs = document.querySelectorAll(".qm-bill");
    const amtInputs = document.querySelectorAll(".qm-amt");
    const updates = [];

    billInputs.forEach(input => {
        const m = parseInt(input.dataset.month);
        const newBill = input.value.trim();
        const oldBill = siteObj.billing[m]?.bill_no || "";

        if (newBill !== oldBill) {
            siteObj.billing[m].bill_no = newBill;
            updates.push({
                year: currentYear,
                company: currentGrp.company,
                supplier: currentGrp.supplier,
                vat_no: currentGrp.vat_no,
                display_name: currentGrp.display_name,
                site_name: selectedSiteName,
                month_index: m,
                field: "bill_no",
                value: newBill
            });
        }
    });

    amtInputs.forEach(input => {
        const m = parseInt(input.dataset.month);
        let newAmt = input.value.trim();

        // Formula Calculation support (=100+20)
        if (newAmt !== "") {
            let expr = newAmt.startsWith("=") ? newAmt.substring(1) : newAmt;
            expr = expr.replace(/,/g, "");
            if (/^[0-9+\-*/().\s]+$/.test(expr)) {
                try {
                    let calculated = new Function("return " + expr)();
                    if (isFinite(calculated)) newAmt = Number(calculated.toFixed(2)).toString();
                } catch (e) {}
            }
        }

        const oldAmt = siteObj.billing[m]?.amount || "";
        if (newAmt !== oldAmt) {
            siteObj.billing[m].amount = newAmt;
            updates.push({
                year: currentYear,
                company: currentGrp.company,
                supplier: currentGrp.supplier,
                vat_no: currentGrp.vat_no,
                display_name: currentGrp.display_name,
                site_name: selectedSiteName,
                month_index: m,
                field: "amount",
                value: newAmt
            });
        }
    });

    if (updates.length > 0) {
        showStatus("Saving Quick Changes...", "saving");
        try {
            const res = await fetch(`/timesheet/api/vat-tracking/update-bulk`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-vat-code": vatCode },
                body: JSON.stringify({ changes: updates })
            });
            const json = await res.json();
            if (json.success) {
                showStatus("✓ Saved successfully", "saved");
            } else {
                showStatus("Error saving", "error");
            }
        } catch (e) {
            showStatus("Network Error", "error");
        }
    }

    closeQuickModal();
    renderTable(); 
}
