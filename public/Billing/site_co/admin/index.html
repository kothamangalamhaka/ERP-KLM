<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>View Bill Admin | Site Access Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px;
      }
      .admin-card {
        background: #1e293b;
        border-radius: 12px;
        padding: 25px;
        border: 1px solid #334155;
        max-width: 1100px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        border-bottom: 1px solid #334155;
        padding-bottom: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #334155;
        text-align: left;
      }
      th {
        background: #0f172a;
        color: #94a3b8;
        font-size: 11px;
        text-transform: uppercase;
      }
      select,
      input[type="text"] {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: white;
        font-size: 12px;
        outline: none;
      }
      .btn {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
      }
      .btn-success {
        background: #10b981;
        color: white;
      }
      .btn-danger {
        background: #ef4444;
        color: white;
      }
      .site-badge {
        display: inline-block;
        background: #334155;
        color: #38bdf8;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        margin: 2px;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(8px);
      }
      .modal-box {
        background: #1e293b;
        padding: 25px;
        border-radius: 12px;
        width: 450px;
        max-width: 90vw;
        border: 1px solid #334155;
      }
      #adminLoginModal {
        background:
          radial-gradient(circle at 20% 25%, rgba(56, 189, 248, 0.22), transparent 45%),
          radial-gradient(circle at 80% 75%, rgba(37, 99, 235, 0.24), transparent 45%),
          rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
      }
      .glass-login-box {
        background: rgba(30, 41, 59, 0.52) !important;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        border-radius: 16px !important;
        padding: 32px 28px !important;
      }
      .glass-login-box input {
        background: rgba(15, 23, 42, 0.55) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #f8fafc !important;
        border-radius: 8px !important;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .glass-login-box input:focus {
        border-color: #38bdf8 !important;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      }
      .glass-login-btn {
        background: linear-gradient(135deg, #0284c7, #2563eb) !important;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        border-radius: 8px !important;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .glass-login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(56, 189, 248, 0.4);
      }
      .site-checklist {
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #334155;
        padding: 10px;
        border-radius: 6px;
        margin: 15px 0;
        background: #0f172a;
      }
      .site-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #1e293b;
      }
      .admin-toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .admin-toast {
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        transform: translateX(120%);
        transition: transform 0.25s ease, opacity 0.25s ease;
        opacity: 0;
      }
      .admin-toast.show {
        transform: translateX(0);
        opacity: 1;
      }
      .admin-toast.success {
        border-left: 4px solid #10b981;
      }
      .admin-toast.error {
        border-left: 4px solid #ef4444;
      }
    </style>
  </head>
  <body>
    <!-- Super Admin Login Overlay for Admin Page -->
    <div id="adminLoginModal" class="modal-overlay" style="display: flex">
      <div class="modal-box glass-login-box" style="width: 350px; text-align: center">
        <h3 style="margin-top: 0; color: #38bdf8; font-size: 20px; letter-spacing: 0.3px">
          🔐 Super Admin Login
        </h3>
        <p style="color: #cbd5e1; font-size: 13px; margin-bottom: 20px">
          Enter credentials to manage sites & users
        </p>
        <input
          type="text"
          id="adminLoginUser"
          placeholder="Username"
          style="
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
          "
        />
        <input
          type="password"
          id="adminLoginPass"
          placeholder="Password"
          style="
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
          "
          onkeypress="if (event.key === 'Enter') executeAdminLogin();"
        />
        <button
          class="btn btn-primary glass-login-btn"
          style="width: 100%; padding: 11px; font-size: 14px"
          onclick="executeAdminLogin()"
        >
          Login to Admin Panel
        </button>
      </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div class="admin-card">
      <div class="header">
        <h2>🔒 View Bill Admin (Site Access Management)</h2>
        <div>
          <a
            href="../index.html"
            class="btn btn-primary"
            style="text-decoration: none"
            >⬅ Back to View Bill</a
          >
          <button class="btn btn-danger" onclick="adminLogout()">Logout</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Assigned Sites</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Multi-Site Assignment Modal -->
    <div id="siteModal" class="modal-overlay">
      <div class="modal-box">
        <h3 id="siteModalUserTitle" style="margin-top: 0; color: #38bdf8">
          Assign Sites
        </h3>
        <input
          type="text"
          id="siteSearchInput"
          placeholder="Search site..."
          onkeyup="filterSiteChecklist()"
          style="width: 100%; box-sizing: border-box"
        />

        <div style="display: flex; gap: 8px; margin-top: 10px">
          <input
            type="text"
            id="newSiteKeywordInput"
            placeholder="Add new site keyword (e.g. Ar Rass)..."
            style="flex: 1; box-sizing: border-box"
            onkeypress="if (event.key === 'Enter') addCustomSiteKeyword();"
          />
          <button
            type="button"
            class="btn btn-success"
            onclick="addCustomSiteKeyword()"
          >
            + Add New
          </button>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
          "
        >
          <button class="btn btn-primary" onclick="toggleAllSites(true)">
            Select All
          </button>
          <button
            class="btn btn-primary"
            style="background: #64748b"
            onclick="toggleAllSites(false)"
          >
            Clear All
          </button>
        </div>

        <div class="site-checklist" id="siteChecklist"></div>

        <div style="display: flex; justify-content: flex-end; gap: 10px">
          <button
            class="btn"
            style="background: #64748b; color: white"
            onclick="closeSiteModal()"
          >
            Cancel
          </button>
          <button class="btn btn-success" onclick="saveAssignedSites()">
            Save Sites
          </button>
        </div>
      </div>
    </div>

    <div id="adminToastContainer" class="admin-toast-container"></div>

    <script>
      function showAdminToast(message, type = "success") {
        const container = document.getElementById("adminToastContainer");
        if (!container) return;
        const toast = document.createElement("div");
        toast.className = `admin-toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 260);
        }, 2800);
      }

      let token = localStorage.getItem("view_bill_token");
      let allSystemSites = [];
      let currentEditingUserId = null;
      let usersListCache = [];

      document.addEventListener("DOMContentLoaded", async () => {
        if (token) {
          verifyAdminSession(token);
        } else {
          document.getElementById("adminLoginModal").style.display = "flex";
        }
      });

      async function executeAdminLogin() {
        const username = document.getElementById("adminLoginUser").value.trim();
        const password = document.getElementById("adminLoginPass").value;
        if (!username || !password) {
          return showAdminToast("Enter credentials", "error");
        }

        try {
          const res = await fetch("/api/view-bill/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (data.success) {
            if (data.user.role !== "Super Admin") {
              showAdminToast(
                "Access Denied: Only Super Admin can access this page.",
                "error",
              );
              return;
            }
            localStorage.setItem("view_bill_token", data.token);
            token = data.token;
            verifyAdminSession(token);
          } else {
            showAdminToast(data.message || "Login failed", "error");
          }
        } catch (e) {
          showAdminToast("Server Connection Error", "error");
        }
      }

      async function verifyAdminSession(authToken) {
        try {
          const res = await fetch("/api/view-bill/admin/users", {
            headers: { Authorization: "Bearer " + authToken },
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById("adminLoginModal").style.display = "none";
            usersListCache = data.users || [];
            renderUsersTable(usersListCache);
            await loadSitesList();
          } else {
            localStorage.removeItem("view_bill_token");
            document.getElementById("adminLoginModal").style.display = "flex";
          }
        } catch (e) {
          document.getElementById("adminLoginModal").style.display = "flex";
        }
      }

      function adminLogout() {
        localStorage.removeItem("view_bill_token");
        document.getElementById("adminLoginModal").style.display = "flex";
        document.getElementById("adminLoginUser").value = "";
        document.getElementById("adminLoginPass").value = "";
      }

      async function loadSitesList() {
        try {
          const res = await fetch("/api/view-bill/admin/sites-list", {
            headers: { Authorization: "Bearer " + token },
          });
          const data = await res.json();
          if (data.success) allSystemSites = data.sites || [];
        } catch (e) {}
      }

      async function loadUsers() {
        try {
          const res = await fetch("/api/view-bill/admin/users", {
            headers: { Authorization: "Bearer " + token },
          });
          const data = await res.json();
          if (data.success) {
            usersListCache = data.users || [];
            renderUsersTable(usersListCache);
          }
        } catch (e) {}
      }

      function renderUsersTable(users) {
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = "";

        users.forEach((u) => {
          let sitesArr = u.assigned_sites || [];
          if (typeof sitesArr === "string") {
            try {
              sitesArr = JSON.parse(sitesArr);
            } catch (e) {
              sitesArr = [];
            }
          }
          let sitesBadges =
            sitesArr.length > 0
              ? sitesArr
                  .map((s) => `<span class="site-badge">${s}</span>`)
                  .join(" ")
              : '<span style="color:#64748b;">(No Sites Assigned)</span>';

          tbody.innerHTML += `
            <tr id="userRow_${u.id}">
              <td>
                <b>${u.display_name || u.username}</b><br>
                <span style="font-size:11px; color:#94a3b8;">@${u.username}</span>
              </td>
              <td>
                <select class="role-select">
                  <option value="Site Co" ${u.role === "Site Co" ? "selected" : ""}>Site Co</option>
                  <option value="Admin" ${u.role === "Admin" ? "selected" : ""}>Admin</option>
                  <option value="Super Admin" ${u.role === "Super Admin" ? "selected" : ""}>Super Admin</option>
                </select>
              </td>
              <td>
                <select class="status-select">
                  <option value="approved" ${u.status === "approved" || u.status === "Active" ? "selected" : ""}>Approved</option>
                  <option value="pending" ${u.status === "pending" ? "selected" : ""}>Pending</option>
                  <option value="rejected" ${u.status === "rejected" ? "selected" : ""}>Rejected</option>
                </select>
              </td>
              <td>${sitesBadges}</td>
              <td style="display:flex; gap:6px;">
                <button class="btn btn-primary" onclick="openSiteModal(${u.id})">Manage Sites</button>
                <button class="btn btn-success" onclick="saveUserChanges(${u.id})">Save</button>
                <button class="btn btn-danger" onclick="deleteUser(${u.id})">Delete</button>
              </td>
            </tr>
          `;
        });
      }

      const BASE_SITE_KEYWORDS = ["Afif", "Bisha", "Humaij", "Khushaibi", "Taif"];

      function getSavedCustomKeywords() {
        try {
          const raw = localStorage.getItem("viewBillCustomSiteKeywords");
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }

      function getUniqueSiteKeywords() {
        const kwMap = new Map();
        [...BASE_SITE_KEYWORDS, ...getSavedCustomKeywords()].forEach((k) => {
          const clean = String(k || "").trim();
          if (clean && !kwMap.has(clean.toLowerCase())) {
            kwMap.set(clean.toLowerCase(), clean);
          }
        });
        return Array.from(kwMap.values()).sort((a, b) => a.localeCompare(b));
      }

      function addCustomSiteKeyword() {
        const input = document.getElementById("newSiteKeywordInput");
        const val = (input.value || "").trim();
        if (!val) return;

        // Save to localStorage so it stays available for all users
        const customList = getSavedCustomKeywords();
        if (!customList.some((k) => k.toLowerCase() === val.toLowerCase())) {
          customList.push(val);
          localStorage.setItem(
            "viewBillCustomSiteKeywords",
            JSON.stringify(customList),
          );
        }

        const checklist = document.getElementById("siteChecklist");
        const existing = Array.from(checklist.querySelectorAll(".site-cb")).find(
          (cb) => cb.value.toLowerCase() === val.toLowerCase(),
        );
        if (existing) {
          existing.checked = true;
          input.value = "";
          return;
        }

        const div = document.createElement("div");
        div.className = "site-item";
        div.innerHTML = `
          <input type="checkbox" class="site-cb" value="${val.replace(/"/g, "&quot;")}" checked />
          <label>${val.replace(/</g, "&lt;")}</label>
        `;
        checklist.appendChild(div);
        input.value = "";
      }

      function openSiteModal(userId) {
        currentEditingUserId = userId;
        const user = usersListCache.find((u) => u.id === userId);
        if (!user) return;

        document.getElementById("siteModalUserTitle").innerText =
          `Assign Sites for @${user.username}`;
        document.getElementById("siteSearchInput").value = "";
        document.getElementById("newSiteKeywordInput").value = "";

        let assigned = user.assigned_sites || [];
        if (typeof assigned === "string") {
          try {
            assigned = JSON.parse(assigned);
          } catch (e) {
            assigned = [];
          }
        }
        const assignedLower = assigned.map((s) => String(s).trim().toLowerCase());

        const checklist = document.getElementById("siteChecklist");
        const keywords = getUniqueSiteKeywords();
        checklist.innerHTML = keywords
          .map((s) => {
            const kwLower = s.toLowerCase();
            // Check exact match OR if existing old site names contain this short keyword
            const isChecked = assignedLower.some(
              (a) => a === kwLower || a.includes(kwLower),
            )
              ? "checked"
              : "";
            return `
              <div class="site-item">
                <input type="checkbox" class="site-cb" value="${s.replace(/"/g, "&quot;")}" ${isChecked} />
                <label>${s.replace(/</g, "&lt;")}</label>
              </div>
            `;
          })
          .join("");

        document.getElementById("siteModal").style.display = "flex";
      }

      function closeSiteModal() {
        document.getElementById("siteModal").style.display = "none";
        currentEditingUserId = null;
      }

      function filterSiteChecklist() {
        const val = document
          .getElementById("siteSearchInput")
          .value.toLowerCase();
        document
          .querySelectorAll("#siteChecklist .site-item")
          .forEach((item) => {
            item.style.display = item.innerText.toLowerCase().includes(val)
              ? "flex"
              : "none";
          });
      }

      function toggleAllSites(check) {
        document.querySelectorAll("#siteChecklist .site-cb").forEach((cb) => {
          if (cb.closest(".site-item").style.display !== "none")
            cb.checked = check;
        });
      }

      async function saveAssignedSites() {
        const selected = Array.from(
          document.querySelectorAll("#siteChecklist .site-cb:checked"),
        ).map((cb) => cb.value);
        const user = usersListCache.find((u) => u.id === currentEditingUserId);
        if (!user) return;

        user.assigned_sites = selected;
        closeSiteModal();

        await saveUserChanges(user.id);
      }

      async function saveUserChanges(userId) {
        const row = document.getElementById(`userRow_${userId}`);
        const role = row.querySelector(".role-select").value;
        const status = row.querySelector(".status-select").value;
        const user = usersListCache.find((u) => u.id === userId);

        try {
          const res = await fetch("/api/view-bill/admin/update-user", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({
              userId,
              role,
              status,
              assigned_sites: user ? user.assigned_sites : [],
            }),
          });
          const data = await res.json();
          if (data.success) {
            showAdminToast("User updated successfully!", "success");
            loadUsers();
          } else {
            showAdminToast(data.message || "Update failed", "error");
          }
        } catch (e) {
          showAdminToast("Error saving changes", "error");
        }
      }

      async function deleteUser(userId) {
        if (!confirm("Are you sure you want to delete this user?")) return;
        try {
          const res = await fetch(
            `/billing/view-bill/admin/delete-user/${userId}`,
            {
              method: "DELETE",
              headers: { Authorization: "Bearer " + token },
            },
          );
          const data = await res.json();
          if (data.success) {
            showAdminToast("User deleted!", "success");
            loadUsers();
          } else {
            showAdminToast(data.message || "Delete failed", "error");
          }
        } catch (e) {
          showAdminToast("Error deleting user", "error");
        }
      }
    </script>
  </body>
</html>
