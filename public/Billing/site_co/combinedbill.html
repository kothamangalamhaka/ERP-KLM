<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Combined Multi-Month Bill Generator | View Bill Access</title>
    <meta name="viewport" content="width=1650" />
    <script src="/node_xlsx_scripts/html2canvas.min.js"></script>
    <script src="/node_xlsx_scripts/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="../style/billing.css" />
    <style>
      .autocomplete-wrapper { position: relative; }
      .suggestion-box {
        position: absolute; top: 100%; left: 0; background: white;
        border: 1px solid #1a4d80; z-index: 9999; max-height: 250px;
        overflow-y: auto; display: none; text-align: left;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); border-radius: 0 0 4px 4px; width: 100%;
      }
      .suggestion-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; font-weight: bold; color: #333; }
      .suggestion-item:hover, .suggestion-item.active { background-color: #1a4d80; color: white; }
      .hidden-image { display: none !important; }
      #toast {
        visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
        text-align: center; border-radius: 5px; padding: 14px; position: fixed;
        z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%);
        font-size: 15px; font-weight: bold; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      }
      #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
      @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
      @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
  </head>
  <body>

    <!-- 🟢 Login Screen Overlay -->
    <div id="loginScreen">
      <div class="login-box">
        <h2>Haka ERP Login (Site Co)</h2>
        <input type="text" id="loginUserId" placeholder="Username" onkeypress="if (event.key === 'Enter') executeLogin();" />
        <input type="password" id="loginPass" placeholder="Password" onkeypress="if (event.key === 'Enter') executeLogin();" />
        <button onclick="executeLogin()">Secure Login</button>
      </div>
    </div>

    <!-- 🟢 Main App Container -->
    <div id="mainAppContainer" style="display: none">
      <div class="top-controls-wrapper">
        <div class="top-controls">
          <a href="./index.html" class="btn btn-dash" title="Back to Dashboard" style="text-decoration: none;">
            <i class="material-icons" style="font-size: 20px; color: #007bff">arrow_back</i>
          </a>

          <!-- Plate / Owner Type Selector -->
          <div class="selector-wrapper" style="width: 135px;">
            <select id="searchType" onchange="document.getElementById('plateSearch').value=''; document.getElementById('plateSuggestions').style.display='none'; document.getElementById('plateSearch').focus();" style="height:32px; border:none; background:transparent; font-weight:bold; font-size:12px; width:100%;">
              <option value="all">Plate / Owner</option>
              <option value="plate">Plate No</option>
              <option value="owner">Owner Name</option>
            </select>
          </div>

          <div class="selector-wrapper autocomplete-wrapper" style="width: 200px; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;">
            <input type="text" id="plateSearch" placeholder="Type Plate/Owner..." oninput="searchPlateOrOwner(this)" autocomplete="off" style="text-transform: uppercase; font-weight: bold; flex: 1; min-width: 130px; border:none; background:transparent; outline:none; font-size:12px;" />
            <div class="suggestion-box" id="plateSuggestions"></div>
          </div>

          <!-- From Month (Default: January) -->
          <div class="selector-wrapper" style="display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;">
            <label style="white-space: nowrap; font-weight: bold; color: #1a4d80; font-size: 13px; margin: 0; flex-shrink: 0;">From:</label>
            <select id="fromMonth" style="height:32px; border:none; background:transparent; font-weight:bold;">
              <option value="January" selected>January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
            <input type="number" id="fromYear" value="2026" style="width:65px; height:32px; border:none; font-weight:bold;" />
          </div>

          <!-- To Month (Auto Selected: Current Month - 1) -->
          <div class="selector-wrapper" style="display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;">
            <label style="white-space: nowrap; font-weight: bold; color: #1a4d80; font-size: 13px; margin: 0; flex-shrink: 0;">To:</label>
            <select id="toMonth" style="height:32px; border:none; background:transparent; font-weight:bold;">
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
            <input type="number" id="toYear" value="2026" style="width:65px; height:32px; border:none; font-weight:bold;" />
          </div>

          <button type="button" class="btn btn-fetch" onclick="fetchCombinedBill()">
            Generate Bill ✨
          </button>

          <!-- By Company Button -->
          <button type="button" class="btn" style="background:#b40000;" onclick="fetchCombinedBill()">
            🏢 Refresh / All Companies
          </button>

          <button type="button" class="btn" style="background:#6f42c1;" onclick="toggleCardImages()">
            <i class="material-icons" style="font-size:16px;">visibility</i> Seal/Sign
          </button>

          <!-- Split Cards Toggle Button -->
          <button type="button" id="btnToggleSplit" class="btn" style="background:#ff9800;" onclick="toggleSplitCards()">
            <i class="material-icons" style="font-size:16px;">call_split</i> Split Cards 🔀
          </button>

          <button type="button" class="btn" style="background:#1d6f42;" onclick="exportToExcel()">
            <i class="material-icons" style="font-size:16px;">table_chart</i> Excel
          </button>
          
          <button type="button" class="btn" style="background:#dc3545; margin-left: 10px;" onclick="executeLogout()">
            Logout
          </button>
        </div>
      </div>

      <!-- 🟢 Multiple Cards Container -->
      <div class="container" id="cardsContainer" style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;">
        <div style="text-align: center; padding: 40px; color: #888; background:white; border: 1px dashed #ccc; border-radius: 8px;">
          Type Plate No or Owner Name and click "Generate Bill ✨"
        </div>
      </div>
    </div>

    <!-- Security Verification Modal -->
    <div id="imageSecurityModal" class="modal-overlay" style="display: none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; align-items:center; justify-content:center;">
      <div class="modal-box" style="width: 380px; text-align: center; background:white; padding:20px; border-radius:8px;">
        <h3 style="color: #1a4d80; margin-top: 0; font-size: 18px;">Security Verification</h3>
        <p style="font-size: 14px; color: #334155; margin: 15px 0 20px 0; font-weight: 600;">Ask Lince to provide Seal and Signature</p>
        <input type="password" id="imgSecurityCode" placeholder="Enter Security Code" style="text-align: center; font-size: 15px; letter-spacing: 2px; margin-bottom: 20px; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;" onkeypress="if (event.key === 'Enter') submitImageSecurityCode();" />
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="button" class="btn" style="background: #6c757d; flex: 1; padding: 10px; justify-content: center;" onclick="closeImageSecurityModal()">Cancel</button>
          <button type="button" class="btn" style="background: #2563eb; flex: 1; padding: 10px; justify-content: center;" onclick="submitImageSecurityCode()">Verify & Show</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      let suggestionPlates = [];
      let suggestionOwners = [];
      let combinedDataCache = null;
      let currentFocus = -1;
      let imagesGloballyVisible = false;
      let isSplitMode = false;

      const ALL_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const companyData = {
        Haka: {
          header: "https://i.ibb.co/Ld752yD5/hd.png",
          seal: "https://i.ibb.co/mrLFJdBy/sl.png",
          text: "Approved By Accounts Team",
          signature: "https://i.ibb.co/CK8X4YpV/Screenshot-2026-03-28-111438.png",
        },
        Aljoda: {
          header: "https://i.ibb.co/3yMwhgD5/Screenshot-2026-03-28-103621.png",
          seal: "https://i.ibb.co/4gRPdGXc/Screenshot-2026-03-28-103653.png",
          text: "Approved By Accounts Team",
          signature: "https://i.ibb.co/Z1b8gCwT/Screenshot-2026-03-28-111323.png",
        },
        "Masar Wheels": {
          header: "https://i.ibb.co/gM7QnS59/Screenshot-2026-03-28-103016.png",
          seal: "https://i.ibb.co/Y63vHZ9/Screenshot-2026-03-28-103341.png",
          text: "Approved By Accounts Team",
          signature: "https://i.ibb.co/bMPNp3SJ/Screenshot-2026-03-28-111529.png",
        },
        "We1 Track": {
          header: "https://i.ibb.co/3mfqVqWF/we1-logo.png",
          seal: "https://i.ibb.co/XfybvXzL/Screenshot-2026-03-28-103519.png",
          text: "Approved By Accounts Team",
          signature: "https://i.ibb.co/pBmhnB2j/Screenshot-2026-03-28-111612.png",
        },
      };

      function getCompanyFromSite(siteName) {
        if (!siteName) return "Haka";
        let s = siteName.toUpperCase();
        if (s.includes("ALJODA")) return "Aljoda";
        if (s.includes("MASAR")) return "Masar Wheels";
        if (s.includes("WE1") || s.includes("WE 1")) return "We1 Track";
        return "Haka";
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("view_bill_token");
        if (token) verifyToken(token);
        else document.getElementById("loginUserId").focus();
      });

      async function verifyToken(token) {
        try {
          const res = await fetch("/api/view-bill/verify-session", {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await res.json();
            if (data.success) loadApp();
            else executeLogout();
          } else executeLogout();
        } catch (err) {
          executeLogout();
        }
      }

      async function executeLogin() {
        const username = document.getElementById("loginUserId").value.trim();
        const password = document.getElementById("loginPass").value;
        if (!username || !password) return showToast("Enter credentials");

        try {
          const res = await fetch("/api/view-bill/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem("view_bill_token", data.token);
            loadApp();
          } else {
            showToast(data.message || "Invalid Credentials!");
          }
        } catch (err) {
          showToast("Server Error.");
        }
      }

      function executeLogout() {
        localStorage.removeItem("view_bill_token");
        window.location.replace("combinedbill.html");
      }

      function initDateSelectors() {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonthIdx = now.getMonth(); // 0 to 11

        // From Month: January & Current Year
        document.getElementById("fromMonth").value = "January";
        document.getElementById("fromYear").value = currentYear;

        // To Month: Current Month - 1
        if (currentMonthIdx === 0) {
          document.getElementById("toMonth").value = "December";
          document.getElementById("toYear").value = currentYear - 1;
        } else {
          document.getElementById("toMonth").value = ALL_MONTHS[currentMonthIdx - 1];
          document.getElementById("toYear").value = currentYear;
        }
      }

      function loadApp() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainAppContainer").style.display = "block";
        initDateSelectors();
        loadSuggestions();
        attachKeyboardEvents();
      }

      async function loadSuggestions() {
        try {
          const token = localStorage.getItem("view_bill_token");
          const res = await fetch("/api/view-bill/suggestions", {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status === 401 || res.status === 403) return executeLogout();
          const data = await res.json();
          if (data.success) {
            suggestionPlates = data.plates || [];
            suggestionOwners = data.owners || [];
          }
        } catch (e) {
          console.error("Error loading suggestions", e);
        }
      }

      function searchPlateOrOwner(input) {
        const val = input.value.trim().toUpperCase();
        const type = document.getElementById("searchType").value;
        const box = document.getElementById("plateSuggestions");
        currentFocus = -1;

        if (!val) { box.style.display = "none"; return; }

        let pool = [];
        if (type === "plate") pool = suggestionPlates;
        else if (type === "owner") pool = suggestionOwners;
        else pool = [...new Set([...suggestionPlates, ...suggestionOwners])];

        const matches = pool.filter((p) => p && p.toUpperCase().includes(val));

        if (matches.length > 0) {
          box.innerHTML = "";
          matches.forEach((m, index) => {
            let div = document.createElement("div");
            div.className = "suggestion-item" + (index === 0 ? " active" : "");
            div.innerText = m;
            div.onmousedown = function (e) {
              e.preventDefault();
              input.value = m;
              box.style.display = "none";
              fetchCombinedBill();
            };
            box.appendChild(div);
          });
          box.style.display = "block";
        } else {
          box.style.display = "none";
        }
      }

      function attachKeyboardEvents() {
        const input = document.getElementById("plateSearch");
        input.addEventListener("keydown", function (e) {
          const box = document.getElementById("plateSuggestions");
          const isBoxOpen = box && box.style.display === "block";

          if (isBoxOpen) {
            let items = box.querySelectorAll(".suggestion-item");
            if (items.length > 0) {
              if (e.key === "ArrowDown") {
                e.preventDefault();
                currentFocus = (currentFocus + 1) % items.length;
                updateActiveSuggestion(items, currentFocus, box);
                return;
              } else if (e.key === "ArrowUp") {
                e.preventDefault();
                currentFocus = (currentFocus - 1 + items.length) % items.length;
                updateActiveSuggestion(items, currentFocus, box);
                return;
              } else if (e.key === "Enter" || e.key === "Tab") {
                e.preventDefault();
                let targetIdx = currentFocus > -1 ? currentFocus : 0;
                if (items[targetIdx]) {
                  input.value = items[targetIdx].innerText;
                  box.style.display = "none";
                  fetchCombinedBill();
                }
                return;
              }
            }
          }

          if (e.key === "Enter") {
            e.preventDefault();
            if (box) box.style.display = "none";
            fetchCombinedBill();
          }
        });

        document.addEventListener("click", function (e) {
          if (!e.target.closest(".autocomplete-wrapper")) {
            const box = document.getElementById("plateSuggestions");
            if (box) box.style.display = "none";
          }
        });
      }

      function updateActiveSuggestion(items, index, box) {
        items.forEach((item) => item.classList.remove("active"));
        if (items[index]) {
          items[index].classList.add("active");
          items[index].scrollIntoView({ block: "nearest" });
        }
      }

      function toggleSplitCards() {
        if (!combinedDataCache || !combinedDataCache.rows || combinedDataCache.rows.length === 0) {
          return showToast("Please generate a bill first!");
        }

        isSplitMode = !isSplitMode;
        const toggleBtn = document.getElementById("btnToggleSplit");
        const searchVal = document.getElementById("plateSearch").value.trim();
        let searchType = document.getElementById("searchType").value;
        if (searchType === "all") {
          const isPlate = suggestionPlates.some(p => p.toUpperCase() === searchVal.toUpperCase());
          searchType = isPlate ? "plate" : "owner";
        }

        if (isSplitMode) {
          toggleBtn.innerHTML = `<i class="material-icons" style="font-size:16px;">view_agenda</i> Combined View 📑`;
          toggleBtn.style.background = "#28a745";
          renderMultiCompanyCards(combinedDataCache, searchType, searchVal);
          showToast("Split into individual month cards!");
        } else {
          toggleBtn.innerHTML = `<i class="material-icons" style="font-size:16px;">call_split</i> Split Cards 🔀`;
          toggleBtn.style.background = "#ff9800";
          renderMultiCompanyCards(combinedDataCache, searchType, searchVal);
          showToast("Switched back to Combined view!");
        }
      }

      async function fetchCombinedBill() {
        const searchVal = document.getElementById("plateSearch").value.trim();
        let searchType = document.getElementById("searchType").value;
        const fromM = document.getElementById("fromMonth").value;
        const fromY = parseInt(document.getElementById("fromYear").value);
        const toM = document.getElementById("toMonth").value;
        const toY = parseInt(document.getElementById("toYear").value);

        if (!searchVal) {
          return showToast("Please enter Plate No or Owner Name.");
        }

        if (searchType === "all") {
          const isPlate = suggestionPlates.some(p => p.toUpperCase() === searchVal.toUpperCase());
          searchType = isPlate ? "plate" : "owner";
        }

        const token = localStorage.getItem("view_bill_token");
        const container = document.getElementById("cardsContainer");
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#1a4d80; font-weight:bold;">Fetching data...</div>';

        try {
          let data = null;

          if (searchType === "plate") {
            const url = `/api/view-bill/combined-bill?plate_no=${encodeURIComponent(searchVal)}&from_month=${fromM}&from_year=${fromY}&to_month=${toM}&to_year=${toY}`;
            const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
            if (res.status === 401) return executeLogout();
            data = await res.json();
            
            if (data && !data.success) {
              container.innerHTML = `<div style="text-align:center; padding:30px; color:#be123c; font-weight:bold;">${data.message || "Plate no not exist. Contact Administrator."}</div>`;
              showToast(data.message || "Plate no not exist. Contact Administrator.");
              return;
            }
          } else {
            let allRows = [];
            const fromIdx = fromY * 12 + ALL_MONTHS.indexOf(fromM);
            const toIdx = toY * 12 + ALL_MONTHS.indexOf(toM);

            for (let i = fromIdx; i <= toIdx; i++) {
              let y = Math.floor(i / 12);
              let m = ALL_MONTHS[i % 12];
              
              const url = `/api/view-bill/data?month=${m}&year=${y}&search_type=owner&search_value=${encodeURIComponent(searchVal)}`;
              const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
              
              if (res.status === 401) return executeLogout();
              
              const monthData = await res.json();
              if (monthData.success && monthData.rows) {
                const shortYear = y.toString().slice(-2);
                const shortMonth = m.substring(0, 3);
                const formattedDate = `${shortMonth} ${shortYear}`;
                
                monthData.rows.forEach(r => {
                  r.date = formattedDate; 
                  r.month = m;
                  allRows.push(r);
                });
              }
            }

            if (allRows.length > 0) {
              data = { success: true, rows: allRows };
            } else {
              data = { success: false, message: "No records found for this period." };
            }
          }

          if (data && data.success && data.rows && data.rows.length > 0) {
            combinedDataCache = data;
            renderMultiCompanyCards(data, searchType, searchVal);
          } else {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#be123c; font-weight:bold;">${data ? data.message : "No data found!"}</div>`;
          }
        } catch (e) {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:#be123c; font-weight:bold;">Server Connection Error.</div>';
        }
      }

      function renderMultiCompanyCards(data, searchType, searchVal) {
        const container = document.getElementById("cardsContainer");
        container.innerHTML = "";

        let dispOwner = searchType === "owner" ? searchVal : (data.rows[0].owner || "COMPANY VEHICLE");
        dispOwner = dispOwner.toUpperCase();

        const hasVat = data.rows.some((r) => parseFloat(r.vat_amount || 0) > 0 || parseFloat(r.vat_percent || 0) > 0);

        const companyGroups = {};
        data.rows.forEach(r => {
          let comp = getCompanyFromSite(r.site || r.site_name) || r.company || "Haka";
          if (!companyGroups[comp]) companyGroups[comp] = [];
          companyGroups[comp].push(r);
        });

        Object.keys(companyGroups).forEach(compName => {
          const compRows = companyGroups[compName];
          const compConfig = companyData[compName] || companyData["Haka"];

          // 🟢 SPLIT MODE RENDER
          if (isSplitMode) {
            compRows.forEach((r, idx) => {
              const monthName = r.month || r.date || "Month";
              const rVat = parseFloat(r.vat_amount || 0);
              const rRent = parseFloat(r.rent || 0);
              const rTotal = parseFloat(r.total || (rRent + rVat) || 0);
              const cardPlate = r.plate_no || r.plate || "";

              const singleRowTableHtml = `
                <table style="width:100%; border-collapse:collapse; margin-top:0; border:1px solid #cbd5e1; font-size: 13px;">
                  <thead>
                    <tr style="background:#1a4d80; color:white;">
                      <th style="width: 4%; padding:8px; border: 1px solid #10365c;">#</th>
                      <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Month</th>
                      <th style="width: 16%; padding:8px; border: 1px solid #10365c;">Vehicle Type</th>
                      <th style="width: 20%; padding:8px; border: 1px solid #10365c;">Driver</th>
                      <th style="width: 14%; padding:8px; border: 1px solid #10365c;">Plate No</th>
                      <th style="width: 8%; padding:8px; border: 1px solid #10365c;">N.Hr</th>
                      <th style="width: 8%; padding:8px; border: 1px solid #10365c;">OT Hr</th>
                      <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Rent</th>
                      ${hasVat ? `<th style="width: 8%; padding:8px; border: 1px solid #10365c;">VAT</th>` : ""}
                      <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">1</td>
                      <td class="date-cell" style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold; color:#1a4d80;">${escapeHTML(r.month || r.date || "")}</td>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${escapeHTML(r.vtype || r.vehicle_type || "-")}</td>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: left;">${escapeHTML(r.driver || r.driver_name || "-")}</td>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${escapeHTML(cardPlate)}</td>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${parseFloat(r.nhr || 0)}</td>
                      <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${parseFloat(r.othr || 0)}</td>

                      ${hasVat ? `<td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${rVat.toFixed(2)}</td>` : ""}
                      <td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${rTotal.toFixed(2)}</td>
                    </tr>
                  </tfoot>
                </table>
              `;

              const splitCardHtml = `
                <div class="bill-card" style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); border: 1px solid #ddd;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    <div style="font-weight: 800; font-size: 15px; color: #1a4d80; text-transform: uppercase;">
                      ${escapeHTML(monthName)} — ${escapeHTML(dispOwner)} (${escapeHTML(cardPlate)}) | <span style="color: #b40000;">${escapeHTML(compName)}</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                      <button type="button" class="btn" style="background: #007bff; padding: 4px 10px; font-size: 11px; height: 30px;" onclick="downloadSingleCard(this)" title="Download this card as PNG">
                        <i class="material-icons" style="font-size: 14px;">download</i> Download
                      </button>
                      <button type="button" class="btn" style="background: #17a2b8; padding: 4px 10px; font-size: 11px; height: 30px;" onclick="copySingleCardHQ(this)" title="Copy this card image">
                        <i class="material-icons" style="font-size: 14px;">content_copy</i> Copy
                      </button>
                    </div>
                  </div>

                  <div class="print-area" style="background: white; padding: 10px;">
                    <img src="${compConfig.header}" class="header-img ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Header" crossorigin="anonymous" style="width:100%; height:auto; max-height:200px; display:block; margin: 0 auto 15px auto;" />

                    <!-- Owner Wrapper with class for export hiding -->
                    <div class="card-owner-print-wrapper" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                      <div style="font-weight: 800; font-size: 15px; color: #1a4d80; text-transform: uppercase;">
                        OWNER : <span>${escapeHTML(dispOwner)}</span>
                      </div>
                    </div>

                    <div style="border:1px solid #cbd5e1; padding:12px; margin:15px 0; text-align:center; background:#f8fafc; font-weight:bold; font-size:18px; color:#1e293b;">
                      Bill Summary for Each Month ملخص فاتورة الشهر
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
                      ${singleRowTableHtml}
                    </div>

                    <div class="footer card-footer-sign" style="margin-top:40px; display:flex; justify-content:space-between; align-items:flex-end;">
                      <div style="text-align: left; padding-bottom: 10px;">
                        <p class="company-text ${imagesGloballyVisible ? '' : 'hidden-image'}" style="margin-bottom: 5px; font-size: 13px; color: #1e293b;"><b>${compConfig.text}</b></p>
                        <p class="company-text ${imagesGloballyVisible ? '' : 'hidden-image'}" style="border-top: 1px solid #333; width: 250px; margin: 0;"></p>
                      </div>
                      <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
                        <img src="${compConfig.signature}" class="signature-img ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Signature" crossorigin="anonymous" style="max-height: 75px;" />
                        <img src="${compConfig.seal}" class="seal ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Company Seal" crossorigin="anonymous" style="max-height: 75px;"/>
                      </div>
                    </div>
                  </div>
                </div>
              `;

              container.insertAdjacentHTML("beforeend", splitCardHtml);
            });
            return;
          }

          // 🟢 COMBINED MODE RENDER
          let innerContentHtml = "";

          if (searchType === "plate") {
            innerContentHtml = buildSingleTableHtml(compRows, hasVat);
          } else {
            const monthGroups = {};
            compRows.forEach((r) => {
              const mKey = r.date || "Unknown Month";
              if (!monthGroups[mKey]) monthGroups[mKey] = [];
              monthGroups[mKey].push(r);
            });

            const sortedMonths = Object.keys(monthGroups);
            sortedMonths.forEach(mName => {
              innerContentHtml += buildMonthTableHtml(mName, monthGroups[mName], hasVat);
            });
          }

          const cardHtml = `
            <div class="bill-card" style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); border: 1px solid #ddd;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;">
                <div style="font-weight: 800; font-size: 15px; color: #1a4d80; text-transform: uppercase;">
                  OWNER : <span>${escapeHTML(dispOwner)}</span> | <span style="color: #b40000;">${escapeHTML(compName)}</span>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button type="button" class="btn" style="background: #007bff; padding: 4px 10px; font-size: 11px; height: 30px;" onclick="downloadSingleCard(this)" title="Download this card as PNG">
                    <i class="material-icons" style="font-size: 14px;">download</i> Download
                  </button>
                  <button type="button" class="btn" style="background: #17a2b8; padding: 4px 10px; font-size: 11px; height: 30px;" onclick="copySingleCardHQ(this)" title="Copy this card image">
                    <i class="material-icons" style="font-size: 14px;">content_copy</i> Copy
                  </button>
                </div>
              </div>

              <div class="print-area" style="background: white; padding: 10px;">
                <img src="${compConfig.header}" class="header-img ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Header" crossorigin="anonymous" style="width:100%; height:auto; max-height:200px; display:block; margin: 0 auto 15px auto;" />

                <div style="border:1px solid #cbd5e1; padding:12px; margin:15px 0; text-align:center; background:#f8fafc; font-weight:bold; font-size:18px; color:#1e293b;">
                  Bill Summary for Each Month ملخص فاتورة الشهر
                </div>

                <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
                  ${innerContentHtml}
                </div>

                <div class="footer card-footer-sign" style="margin-top:40px; display:flex; justify-content:space-between; align-items:flex-end;">
                  <div style="text-align: left; padding-bottom: 10px;">
                    <p class="company-text ${imagesGloballyVisible ? '' : 'hidden-image'}" style="margin-bottom: 5px; font-size: 13px; color: #1e293b;"><b>${compConfig.text}</b></p>
                    <p class="company-text ${imagesGloballyVisible ? '' : 'hidden-image'}" style="border-top: 1px solid #333; width: 250px; margin: 0;"></p>
                  </div>
                  <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
                    <img src="${compConfig.signature}" class="signature-img ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Signature" crossorigin="anonymous" style="max-height: 75px;" />
                    <img src="${compConfig.seal}" class="seal ${imagesGloballyVisible ? '' : 'hidden-image'}" alt="Company Seal" crossorigin="anonymous" style="max-height: 75px;"/>

                </div>
              </div>
            </div>
          `;

          container.insertAdjacentHTML("beforeend", cardHtml);
        });

        showToast("Bill Generated Successfully!");
      }

      function buildSingleTableHtml(rows, hasVat) {
        let tbodyHtml = "";
        let totalNHr = 0, totalOTHr = 0, totalRent = 0, totalVat = 0, totalSum = 0;

        rows.forEach((r, idx) => {
          const nhr = parseFloat(r.nhr || 0);
          const othr = parseFloat(r.othr || 0);
          const rent = parseFloat(r.rent || 0);
          const vat = parseFloat(r.vat_amount || 0);
          const total = parseFloat(r.total || (rent + vat) || 0);

          totalNHr += nhr;
          totalOTHr += othr;
          totalRent += rent;
          totalVat += vat;
          totalSum += total;

          tbodyHtml += `
            <tr>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${idx + 1}</td>
              <td class="date-cell" style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold; color:#1a4d80;">${escapeHTML(r.month || r.date || "")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${escapeHTML(r.vtype || r.vehicle_type || "-")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: left;">${escapeHTML(r.driver || r.driver_name || "-")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${escapeHTML(r.plate_no || r.plate || "")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${nhr}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${othr}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${rent.toFixed(2)}</td>
              ${hasVat ? `<td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${vat > 0 ? vat.toFixed(2) : "0"}</td>` : ""}
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${total.toFixed(2)}</td>
            </tr>
          `;
        });

        return `
          <table style="width:100%; border-collapse:collapse; margin-top:0; border:1px solid #cbd5e1; font-size: 13px;">
            <thead>
              <tr style="background:#1a4d80; color:white;">
                <th style="width: 4%; padding:8px; border: 1px solid #10365c;">#</th>
                <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Month</th>
                <th style="width: 16%; padding:8px; border: 1px solid #10365c;">Vehicle Type</th>
                <th style="width: 20%; padding:8px; border: 1px solid #10365c;">Driver</th>
                <th style="width: 14%; padding:8px; border: 1px solid #10365c;">Plate No</th>
                <th style="width: 8%; padding:8px; border: 1px solid #10365c;">N.Hr</th>
                <th style="width: 8%; padding:8px; border: 1px solid #10365c;">OT Hr</th>
                <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Rent</th>
                ${hasVat ? `<th style="width: 8%; padding:8px; border: 1px solid #10365c;">VAT</th>` : ""}
                <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Total</th>
              </tr>
            </thead>
            <tbody>${tbodyHtml}</tbody>
            <tfoot>
              <tr class="total-row" style="background:#f8fafc; border-top:2px solid #cbd5e1;">
                <td colspan="5" style="text-align:right; padding-right:15px; padding-top:8px; padding-bottom:8px; border: 1px solid #cbd5e1; font-weight:bold;">Grand Total:</td>
                <td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${totalNHr}</td>
                <td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${totalOTHr}</td>
                <td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${totalRent.toFixed(2)}</td>
                ${hasVat ? `<td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${totalVat.toFixed(2)}</td>` : ""}
                <td style="border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${totalSum.toFixed(2)}</td>
              </tr>
            </tfoot>
          </table>
        `;
      }

      function buildMonthTableHtml(mName, rows, hasVat) {
        let tbodyHtml = "";
        let mNHr = 0, mOTHr = 0, mRent = 0, mVat = 0, mTotal = 0;

        rows.forEach((r, idx) => {
          const nhr = parseFloat(r.nhr || 0);
          const othr = parseFloat(r.othr || 0);
          const rent = parseFloat(r.rent || 0);
          const vat = parseFloat(r.vat_amount || 0);
          const total = parseFloat(r.total || (rent + vat) || 0);

          mNHr += nhr;
          mOTHr += othr;
          mRent += rent;
          mVat += vat;
          mTotal += total;

          tbodyHtml += `
            <tr>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${idx + 1}</td>
              <td class="date-cell" style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${escapeHTML(r.date)}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${escapeHTML(r.vtype || "-")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: left;">${escapeHTML(r.driver || "-")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${escapeHTML(r.plate_no || r.plate || "")}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${nhr}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${othr}</td>
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${rent.toFixed(2)}</td>
              ${hasVat ? `<td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">${vat > 0 ? vat.toFixed(2) : "0"}</td>` : ""}
              <td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; font-weight:bold;">${total.toFixed(2)}</td>
            </tr>
          `;
        });

        return `
          <div class="month-bill-section" style="width:100%; margin-bottom: 10px;">
            <div style="background:#f1f5f9; color:#1a4d80; padding:6px 12px; font-weight:800; font-size:13px; border:1px solid #cbd5e1; border-bottom:none; border-radius:4px 4px 0 0;">
              🗓️ Month: ${escapeHTML(mName)}
            </div>
            <table style="width:100%; border-collapse:collapse; margin-top:0; border:1px solid #cbd5e1; font-size: 13px;">
              <thead>
                <tr style="background:#1a4d80; color:white;">
                  <th style="width: 4%; padding:8px; border: 1px solid #10365c;">#</th>
                  <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Date</th>
                  <th style="width: 16%; padding:8px; border: 1px solid #10365c;">Vehicle Type</th>
                  <th style="width: 20%; padding:8px; border: 1px solid #10365c;">Driver</th>
                  <th style="width: 14%; padding:8px; border: 1px solid #10365c;">Plate No</th>
                  <th style="width: 8%; padding:8px; border: 1px solid #10365c;">N.Hr</th>
                  <th style="width: 8%; padding:8px; border: 1px solid #10365c;">OT Hr</th>
                  <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Rent</th>
                  ${hasVat ? `<th style="width: 8%; padding:8px; border: 1px solid #10365c;">VAT</th>` : ""}
                  <th style="width: 10%; padding:8px; border: 1px solid #10365c;">Total</th>
                </tr>
              </thead>
              <tbody>${tbodyHtml}</tbody>
              <tfoot>
                <tr class="total-row" style="background:#f8fafc; font-weight:bold; border-top:2px solid #cbd5e1;">
                  <td colspan="5" style="text-align:right; padding-right:15px; padding-top:8px; padding-bottom:8px; border: 1px solid #cbd5e1;">Sub Total:</td>
                  <td style="border: 1px solid #cbd5e1; text-align: center;">${mNHr}</td>
                  <td style="border: 1px solid #cbd5e1; text-align: center;">${mOTHr}</td>
                  <td style="border: 1px solid #cbd5e1; text-align: center;">${mRent.toFixed(2)}</td>
                  ${hasVat ? `<td style="border: 1px solid #cbd5e1; text-align: center;">${mVat.toFixed(2)}</td>` : ""}
                  <td style="border: 1px solid #cbd5e1; text-align: center;">${mTotal.toFixed(2)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      }

      function escapeHTML(str) {
        if (!str) return "";
        return String(str).replace(/[&<>'"]/g, (tag) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
      }

      function toggleCardImages() {
        imagesGloballyVisible = !imagesGloballyVisible;
        const cards = document.querySelectorAll("#cardsContainer .bill-card");
        if (cards.length === 0) {
          if (!imagesGloballyVisible) openImageSecurityModal();
          return;
        }

        if (imagesGloballyVisible) {
          cards.forEach(card => revealImages(card));
        } else {
          cards.forEach(card => hideImages(card));
        }
      }

      function revealImages(card) {
        card.querySelectorAll(".header-img, .seal, .signature-img, .company-text").forEach((img) => img.classList.remove("hidden-image"));
        showToast("Header & Stamps Enabled!");
      }

      function hideImages(card) {
        card.querySelectorAll(".header-img, .seal, .signature-img, .company-text").forEach((img) => img.classList.add("hidden-image"));
        showToast("Header & Stamps Hidden!");
      }

      function openImageSecurityModal() {
        document.getElementById("imgSecurityCode").value = "";
        document.getElementById("imageSecurityModal").style.display = "flex";
        document.getElementById("imgSecurityCode").focus();
      }

      function closeImageSecurityModal() {
        document.getElementById("imageSecurityModal").style.display = "none";
      }

      async function submitImageSecurityCode() {
        const code = document.getElementById("imgSecurityCode").value.trim();
        if (!code) return showToast("Please enter the security code!");

        const token = localStorage.getItem("view_bill_token");
        try {
          const res = await fetch("/api/view-bill/verify-combined-security", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({ code: code }),
          });

          const data = await res.json();
          if (data.success) {
            imagesGloballyVisible = true;
            closeImageSecurityModal();
            const cards = document.querySelectorAll("#cardsContainer .bill-card");
            cards.forEach(card => revealImages(card));
          } else {
            showToast(data.message || "Invalid Security Code!");
            document.getElementById("imgSecurityCode").value = "";
          }
        } catch (err) {
          showToast("Server Connection Error!");
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => (t.className = ""), 3000);
      }

      function exportToExcel() {
        if (!combinedDataCache || combinedDataCache.rows.length === 0) return showToast("No data to export!");
        const ws = XLSX.utils.json_to_sheet(combinedDataCache.rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Combined_Bill");
        XLSX.writeFile(wb, `Combined_Bill_${document.getElementById("plateSearch").value.trim() || 'Export'}.xlsx`);
      }

      async function downloadSingleCard(btn) {
        const card = btn.closest(".bill-card");
        if (!card) return;

        const printArea = card.querySelector(".print-area");
        try {
          const canvas = await html2canvas(printArea, {
            scale: 3,
            useCORS: true,
            logging: false,
            imageTimeout: 0,
            onclone: (clonedDoc) => {
              // Hide owner name wrapper in exported image
              clonedDoc.querySelectorAll(".card-owner-print-wrapper").forEach(el => el.style.display = "none");
            }
          });
          const link = document.createElement("a");
          link.download = `Bill_${Date.now()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
          showToast("Card downloaded successfully (Without Owner Name)!");
        } catch (e) {
          showToast("Unable to download card.");
        }
      }

      async function copySingleCardHQ(btn) {
        const card = btn.closest(".bill-card");
        if (!card) return;

        const printArea = card.querySelector(".print-area");
        try {
          const canvas = await html2canvas(printArea, {
            scale: 3,
            useCORS: true,
            logging: false,
            imageTimeout: 0,
            onclone: (clonedDoc) => {
              // Hide owner name wrapper in copied image
              clonedDoc.querySelectorAll(".card-owner-print-wrapper").forEach(el => el.style.display = "none");
            }
          });
          canvas.toBlob(async (blob) => {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              showToast("Card copied to clipboard (Without Owner Name)!");
            } else {
              showToast("Clipboard not supported. Downloading instead.");
              const link = document.createElement("a");
              link.download = `Card_HD_${Date.now()}.png`;
              link.href = URL.createObjectURL(blob);
              link.click();
            }
          });
        } catch (e) {
          showToast("Unable to copy card.");
        }
      }
    </script>
  </body>
</html>
