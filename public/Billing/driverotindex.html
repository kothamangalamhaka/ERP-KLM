<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Haka Driver OT Bill Generator</title>
    <meta name="viewport" content="width=1650" />
    <script src="/node_xlsx_scripts/html2canvas.min.js"></script>
    <script src="/node_xlsx_scripts/jszip.min.js"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/billing.css" />
    <style>

        a{
            text-decoration: none;
        }
        
      .hide-on-card-export {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <h3 id="loaderText" style="margin-top: 20px; color: #1a4d80">
        Processing Data...
      </h3>
    </div>

    <div id="mainAppContainer">
      <div class="top-controls-wrapper">
        <div class="top-controls">
          <a href="index.html" class="btn btn-dash" title="Vendor Billing">
            <i class="material-icons" style="font-size: 20px; color: #007bff">arrow_back</i>
          </a>

          <div class="selector-wrapper">
            <label class="month-label">Month:</label>
            <div class="custom-dropdown" id="monthDropdownContainer" style="width: 130px">
              <div class="custom-dropdown-selected" onclick="toggleDropdown('monthOptions')">
                <span id="selectedMonthText">Loading...</span>
                <span style="font-size: 10px">▼</span>
              </div>
              <div class="custom-dropdown-options" id="monthOptions"></div>
            </div>
          </div>

          <button type="button" class="btn btn-fetch" onclick="fetchDataFromERP()">
            Fetch Data
          </button>

          <button type="button" class="btn" style="background: #17a2b8" onclick="createManualTable()">
            + Manual Entry
          </button>

          <div class="selector-wrapper">
            <label>Driver:</label>
            <div class="custom-dropdown" style="width: 170px">
              <div class="custom-dropdown-selected" onclick="toggleDropdown('driverOptions')">
                <span id="driverSelectText">All Drivers</span>
                <span style="font-size: 10px">▼</span>
              </div>
              <div class="custom-dropdown-options" id="driverOptions" style="width: 250px">
                <input
                  type="text"
                  class="dropdown-search"
                  id="driverSearch"
                  placeholder="Search Driver..."
                  onkeyup="filterCheckboxList('driverSearch', 'driverList')"
                />
                <div class="checkbox-list" id="driverList">
                  <label class="check-item">
                    <input
                      type="checkbox"
                      id="selectAllDrivers"
                      checked
                      onchange="toggleAllCheckboxes('driverList', this.checked)"
                    />
                    <b>Select All</b>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div class="selector-wrapper">
            <label>Site:</label>
            <div class="custom-dropdown" style="width: 150px">
              <div class="custom-dropdown-selected" onclick="toggleDropdown('siteOptions')">
                <span id="siteSelectText">All Sites</span>
                <span style="font-size: 10px">▼</span>
              </div>
              <div class="custom-dropdown-options" id="siteOptions" style="width: 250px">
                <input
                  type="text"
                  class="dropdown-search"
                  id="siteSearch"
                  placeholder="Search Site..."
                  onkeyup="filterCheckboxList('siteSearch', 'siteList')"
                />
                <div class="checkbox-list" id="siteList">
                  <label class="check-item">
                    <input
                      type="checkbox"
                      id="selectAllSites"
                      checked
                      onchange="toggleAllCheckboxes('siteList', this.checked)"
                    />
                    <b>Select All</b>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <button
            type="button"
            class="btn"
            style="background: #6f42c1"
            onclick="arrangeByDriver()"
          >
            Arrange By Driver ✨
          </button>

          <button type="button" class="btn btn-save" onclick="submitBulkDriverData()">
            Save to ERP 💾
          </button>

          <button
            type="button"
            class="btn"
            style="background: #dc3545"
            onclick="downloadAllAsZip()"
          >
            ZIP All 📦
          </button>
        </div>
      </div>

      <div id="dynamicBillsContainer" style="display: flex; flex-direction: column; gap: 40px; margin-bottom: 50px;">
        <div style="text-align: center; padding: 50px; color: #666; background: white; border-radius: 8px; border: 1px dashed #ccc;">
          <h2>No Driver Bills Generated Yet</h2>
          <p>Click "Fetch Data", select drivers/sites, and click "Arrange By Driver ✨".</p>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script src="script/driver_billing.js"></script>
  </body>
</html>
