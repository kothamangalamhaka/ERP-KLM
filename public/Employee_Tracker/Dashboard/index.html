<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Tracker Dashboard</title>
    <script src="/node_xlsx_scripts/exceljs.min.js"></script>
    <script src="/node_xlsx_scripts/FileSaver.min.js"></script>
    <script src="/node_xlsx_scripts/sweetalert2.all.min.js"></script>
    <script src="/node_xlsx_scripts/html2canvas.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      body {
        background: #f4f7f6;
        margin: 0;
        padding: 20px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        position: relative;
        gap: 10px;
      }
      .header h2 {
        margin: 0;
        font-size: 20px;
        color: #1e293b;
        white-space: nowrap;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .mobile-menu-btn {
        display: none;
        background: #1e293b;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      @media (max-width: 960px) {
        .mobile-menu-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }
        .header-actions {
          display: none;
          position: absolute;
          top: calc(100% + 6px);
          right: 12px;
          background: #ffffff;
          flex-direction: column;
          align-items: stretch;
          width: 210px;
          padding: 12px;
          border-radius: 8px;
          border: 1px solid #cbd5e1;
          box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
          z-index: 1200;
        }
        .header-actions.show {
          display: flex;
        }
        .header-actions button {
          width: 100%;
          text-align: center;
        }
        .search-input {
          width: 170px;
        }
      }
      .filters {
        margin: 20px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        background: #f4f7f6;
        padding: 15px 0;
        z-index: 100;
        border-bottom: 1px solid #ddd;
      }
      .filters button {
        padding: 8px 15px;
        border: none;
        background: #ddd;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
        transition: 0.3s;
      }
      .filters button:hover {
        background: #bbb;
      }
      .filters button.active {
        background: #007bff;
        color: white;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .search-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .search-input-wrapper {
        position: relative;
      }
      .search-input {
        display: none;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 20px;
        width: 250px;
        outline: none;
        transition: 0.3s;
      }
      .search-input.show {
        display: block;
      }
      .search-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        padding: 5px;
      }
      .suggestions {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        margin-top: 5px;
      }
      .suggestion-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        font-size: 13px;
        color: #333;
      }
      .suggestion-item:hover {
        background: #f4f7f6;
      }
      .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
        border: 2px solid #007bff;
      }
      .card h3 {
        margin: 5px 0;
        font-size: 16px;
        color: #333;
      }
      .card p {
        margin: 3px 0;
        font-size: 13px;
        color: #666;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background: white;
        padding: 24px 28px;
        border-radius: 10px;
        width: 1180px;
        max-width: 95vw;
        max-height: 96vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      }
      .close {
        position: absolute;
        right: 18px;
        top: 14px;
        font-size: 22px;
        cursor: pointer;
        color: #64748b;
      }
      .close:hover {
        color: #dc2626;
      }
      .form-group {
        margin-bottom: 10px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 4px;
        color: #334155;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 13px;
      }
      .dynamic-textarea {
        width: 100%;
        min-height: 36px;
        field-sizing: content;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 13px;
        resize: none;
        line-height: 1.4;
        box-sizing: border-box;
      }
      .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px 14px;
      }
      .full-width {
        grid-column: 1 / -1;
      }

      /* Quick Document Buttons (4 in Row 1, 2 in Row 2) */
      .quick-doc-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      @media (max-width: 700px) {
        .quick-doc-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .qdoc-btn {
        background: #f8fafc;
        border: 1.5px solid #cbd5e1;
        color: #1e293b;
        padding: 9px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .qdoc-btn:hover {
        border-color: #007bff;
        background: #eff6ff;
        color: #0369a1;
      }
      .qdoc-btn.uploaded {
        background: #dcfce7;
        border-color: #16a34a;
        color: #15803d;
      }
      .qdoc-custom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-items: end;
        margin-bottom: 10px;
      }
      @media (max-width: 700px) {
        .qdoc-custom-row {
          grid-template-columns: 1fr;
        }
      }

      /* Secondary Popup Overlay for Quick Document Actions */
      .sub-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(2px);
        z-index: 2500;
        justify-content: center;
        align-items: center;
      }
      .sub-modal-card {
        background: #ffffff;
        width: 390px;
        max-width: 92vw;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        border: 1px solid #cbd5e1;
      }

      /* Profile View 2-Column Sections & Document Buttons */
      .pv-top-actions {
        position: absolute;
        right: 46px;
        top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pv-copy-btn {
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .pv-copy-btn:hover {
        background: #e0f2fe;
        border-color: #0284c7;
      }
      .pv-section-head {
        font-size: 14px;
        font-weight: 800;
        color: #0f172a;
        background: #f1f5f9;
        padding: 7px 12px;
        border-left: 4px solid #007bff;
        border-radius: 4px;
        margin: 14px 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .pv-two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 768px) {
        .pv-two-col {
          grid-template-columns: 1fr;
        }
      }
      .pv-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.6;
        min-height: 100%;
      }
      .pv-box h4 {
        margin: 0 0 8px 0;
        color: #007bff;
        font-size: 13px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 5px;
      }
      .pv-docs-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }
      .pv-doc-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #eff6ff;
        border: 1.5px solid #93c5fd;
        color: #1e40af;
        padding: 9px 12px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.15s ease;
        text-align: center;
      }
      .pv-doc-btn:hover {
        background: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
      }
      .progress-container {
        display: none;
        width: 100%;
        background-color: #e9ecef;
        border-radius: 5px;
        margin-top: 15px;
        overflow: hidden;
      }
      .progress-bar {
        width: 0%;
        height: 15px;
        background-color: #28a745;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 12px;
        text-align: center;
        color: #333;
        font-weight: bold;
        margin-top: 5px;
      }
      .btn {
        padding: 8px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-primary {
        background: #007bff;
      }
      .btn-danger {
        background: #dc3545;
      }
      .btn-warning {
        background: #ffc107;
        color: #333;
      }
      .btnx {
        background: #0e9db3;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btnx:hover {
        background: #0b7a8c;
      }
      .btn:hover {
        opacity: 0.9;
      }
      #toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 12px;
        position: fixed;
        z-index: 2000;
        right: 30px;
        bottom: 30px;
        font-size: 14px;
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Employee Directory</h2>
      <div class="search-container">
        <div class="search-input-wrapper">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search Name or Code..."
            oninput="showSuggestions()"
            autocomplete="off"
          />
          <div id="suggestionBox" class="suggestions"></div>
        </div>
        <button class="search-btn" onclick="toggleSearch()" title="Search">
          🔍
        </button>

        <div id="headerActionsMenu" class="header-actions">
          <button class="btn" onclick="openAddModal()">+ Add New Staff</button>
          <button
            class="btn"
            style="background: #6366f1"
            onclick="copyPublicAddLink()"
            title="Copy Self-Registration Link for Staff"
          >
            🔗 Copy Add Link
          </button>
          <button
            class="btn btn-danger"
            onclick="window.location.href = 'EMP_EXP.html'"
          >
            ⏰ Expiry Tracker
          </button>
          <button
            class="btn"
            style="background: #16a34a"
            onclick="promptExportStaff()"
            title="Export all staff to Excel"
          >
            📊 Export Excel
          </button>
          <button
            class="btnx"
            onclick="window.location.href = '../staff_salary/'"
          >
            Staff Salary
          </button>
          <button
            class="btn btn-primary"
            onclick="window.location.href = '../admin/index.html'"
          >
            Admin Panel
          </button>
          <button class="btn btn-danger" onclick="logoutTracker()">
            🚪 Logout
          </button>
        </div>

        <button
          type="button"
          class="mobile-menu-btn"
          onclick="toggleHeaderMenu(event)"
          title="Menu"
        >
          ☰
        </button>
      </div>
    </div>

    <div class="filters">
      <button class="active" onclick="filterStaff('All', this)">
        All <span id="count-All">(0)</span>
      </button>
      <button onclick="filterStaff('Director', this)">
        Directors <span id="count-Director">(0)</span>
      </button>
      <button onclick="filterStaff('Site Co', this)">
        Site Co <span id="count-SiteCo">(0)</span>
      </button>
      <button onclick="filterStaff('Field Co', this)">
        Field Co <span id="count-FieldCo">(0)</span>
      </button>
      <button onclick="filterStaff('Business Co', this)">
        Business Co <span id="count-BusinessCo">(0)</span>
      </button>
      <button onclick="filterStaff('Office Staff', this)">
        Office Staff <span id="count-OfficeAdmin">(0)</span>
      </button>
      <button onclick="filterStaff('Office Accounts', this)">
        Office Accounts <span id="count-OfficeAccounts">(0)</span>
      </button>
      <button
        onclick="filterStaff('Pending', this)"
        style="background: #f59e0b; color: #ffffff"
      >
        Pending <span id="count-Pending">(0)</span>
      </button>
      <button
        onclick="filterStaff('Released', this)"
        style="background: #dc3545; color: white"
      >
        Released <span id="count-Released">(0)</span>
      </button>
    </div>

    <div id="staffContainer"></div>

    <div id="staffModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- Quick Document Upload / Replace / Delete Sub-Modal -->
    <div id="quickDocSubModal" class="sub-modal-overlay">
      <div class="sub-modal-card" id="quickDocSubBody"></div>
    </div>

    <div id="toast"></div>

    <script>
      const user = localStorage.getItem("emp_user");
      if (!user) {
        window.location.href =
          "../index.html?redirect=" + encodeURIComponent(window.location.href);
      }

      function logoutTracker() {
        localStorage.removeItem("emp_token");
        localStorage.removeItem("emp_user");
        window.location.replace("../index.html");
      }

      function toggleHeaderMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById("headerActionsMenu");
        if (menu) menu.classList.toggle("show");
      }

      document.addEventListener("click", (e) => {
        const menu = document.getElementById("headerActionsMenu");
        if (
          menu &&
          menu.classList.contains("show") &&
          !e.target.closest("#headerActionsMenu") &&
          !e.target.closest(".mobile-menu-btn")
        ) {
          menu.classList.remove("show");
        }
      });

      let allEmployeesData = [];
      document.addEventListener("DOMContentLoaded", () => fetchAllStaff());

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.className = "show";
        toast.innerText = message;
        setTimeout(() => {
          toast.className = toast.className.replace("show", "");
        }, 3000);
      }

      function formatDate(dateStr) {
        if (!dateStr) return "N/A";
        const d = new Date(dateStr);
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return `${d.getFullYear()} ${months[d.getMonth()]} ${String(d.getDate()).padStart(2, "0")}`;
      }

      function toInputDate(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      async function fetchAllStaff() {
        const res = await fetch(`/api/employee-tracker/all?category=All`);
        const data = await res.json();
        if (data.success) {
          allEmployeesData = data.employees;
          updateCounts();
          renderStaff("All");
        }
      }

      function copyPublicAddLink() {
        const url = new URL("../add.html", window.location.href).href;
        navigator.clipboard
          .writeText(url)
          .then(() => {
            showToast("🔗 Staff registration link copied!");
          })
          .catch(() => {
            prompt("Copy this Staff Registration Link:", url);
          });
      }

      function updateCounts() {
        const counts = {
          All: allEmployeesData.length,
          Director: 0,
          "Site Co": 0,
          "Field Co": 0,
          "Business Co": 0,
          "Office Staff": 0,
          "Office Accounts": 0,
          Pending: 0,
          Released: 0,
        };
        allEmployeesData.forEach((emp) => {
          const cat =
            emp.category === "Office Admin" ? "Office Staff" : emp.category;
          if (counts[cat] !== undefined) {
            counts[cat]++;
          }
        });
        document.getElementById("count-All").innerText = `(${counts["All"]})`;
        document.getElementById("count-Director").innerText =
          `(${counts["Director"]})`;
        document.getElementById("count-SiteCo").innerText =
          `(${counts["Site Co"]})`;
        document.getElementById("count-FieldCo").innerText =
          `(${counts["Field Co"]})`;
        document.getElementById("count-BusinessCo").innerText =
          `(${counts["Business Co"]})`;
        document.getElementById("count-OfficeAdmin").innerText =
          `(${counts["Office Staff"]})`;
        document.getElementById("count-OfficeAccounts").innerText =
          `(${counts["Office Accounts"]})`;
        document.getElementById("count-Pending").innerText =
          `(${counts["Pending"]})`;
        document.getElementById("count-Released").innerText =
          `(${counts["Released"]})`;
      }

      async function loadStaff() {
        await fetchAllStaff();
      }

      function filterStaff(category, btn) {
        document
          .querySelectorAll(".filters button")
          .forEach((b) => b.classList.remove("active"));
        if (btn) btn.classList.add("active");
        document.getElementById("searchInput").value = "";
        document.getElementById("suggestionBox").style.display = "none";
        renderStaff(category);
      }

      function renderStaff(filterCategory, specificData = null) {
        const container = document.getElementById("staffContainer");
        container.innerHTML = "";

        let displayData = specificData ? specificData : allEmployeesData;
        if (filterCategory !== "All" && !specificData) {
          displayData = displayData.filter(
            (emp) => emp.category === filterCategory,
          );
        }
        if (displayData.length === 0) {
          container.innerHTML =
            '<p style="padding:20px; font-weight:bold; color:#dc3545;">No staff found in this section.</p>';
          return;
        }

        const categories = [
          "Pending",
          "Director",
          "Site Co",
          "Field Co",
          "Business Co",
          "Office Staff",
          "Office Accounts",
          "Released",
        ];
        const grouped = {};
        categories.forEach((c) => (grouped[c] = []));

        displayData.forEach((emp) => {
          const cat =
            emp.category === "Office Admin" ? "Office Staff" : emp.category;
          if (grouped[cat] !== undefined) {
            grouped[cat].push(emp);
          } else {
            grouped[cat] = [emp];
          }
        });

        for (const [cat, emps] of Object.entries(grouped)) {
          if (emps && emps.length > 0) {
            emps.sort((a, b) =>
              (a.unique_id || "").localeCompare(b.unique_id || ""),
            );
            let sectionHtml = `<div class="category-section" style="margin-bottom: 40px;"><h3 style="color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 15px;">${cat}</h3><div class="grid">`;
            emps.forEach((emp) => {
              const siteInfo = emp.site_name
                ? `<p style="color:#0284c7; font-weight:600;">📍 ${emp.site_name}</p>`
                : "";
              const vehicleInfo =
                emp.vehicle_model || emp.plate_no
                  ? `<p style="font-size:12px; color:#475569;">🚗 ${emp.vehicle_model || ""} ${emp.plate_no ? `(${emp.plate_no})` : ""}</p>`
                  : "";
              sectionHtml += `<div class="card" onclick="viewDetails(${emp.id})">
                            <img src="${emp.image_path || "https://via.placeholder.com/80"}" alt="Staff">
                            <h3>${emp.name}</h3>
                            <p><b>${emp.unique_id}</b></p>
                            <p>${emp.designation || emp.category}</p>
                            ${siteInfo}
                            ${vehicleInfo}
                            <p>📞 ${emp.mobile || "N/A"}</p>
                        </div>`;
            });
            sectionHtml += `</div></div>`;
            container.innerHTML += sectionHtml;
          }
        }
      }

      function getActiveCategoryFromButton() {
        const activeBtn = document.querySelector(".filters button.active");
        if (!activeBtn) return "All";

      function toggleSearch() {
        const input = document.getElementById("searchInput");
        input.classList.toggle("show");
        if (input.classList.contains("show")) {
          input.focus();
        } else {
          input.value = "";
          document.getElementById("suggestionBox").style.display = "none";
          renderStaff(getActiveCategoryFromButton());
        }
      }

      function showSuggestions() {
        const val = document.getElementById("searchInput").value.toLowerCase();
        const box = document.getElementById("suggestionBox");
        box.innerHTML = "";
        if (!val) {
          box.style.display = "none";
          renderStaff(getActiveCategoryFromButton());
          return;
        }

        const matches = allEmployeesData.filter(
          (emp) =>
            (emp.name || "").toLowerCase().includes(val) ||
            (emp.unique_id || "").toLowerCase().includes(val),
        );
        if (matches.length > 0) {
          matches.forEach((emp) => {
            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.innerHTML = `<b>${emp.unique_id}</b> - ${emp.name}`;
            div.onclick = () => {
              document.getElementById("searchInput").value = emp.name;
              box.style.display = "none";
              renderStaff("All", [emp]);
            };
            box.appendChild(div);
          });
          box.style.display = "block";
        } else {
          box.style.display = "none";
        }
        renderStaff("All", matches);
      }

      function uploadDataWithProgress(url, formData, btnId) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const progressContainer =
            document.getElementById("progressContainer");
          const progressBar = document.getElementById("progressBar");
          const progressText = document.getElementById("progressText");
          const btn = document.getElementById(btnId);

          progressContainer.style.display = "block";
          btn.disabled = true;
          btn.innerText = "Processing...";

          xhr.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
              const percentComplete = Math.round(
                (event.loaded / event.total) * 100,
              );
              progressBar.style.width = percentComplete + "%";
              progressText.innerText = `Uploading... ${percentComplete}%`;
            }
          });

          xhr.addEventListener("load", () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(JSON.parse(xhr.responseText));
            } else {
              reject("Upload Failed");
            }
          });

          xhr.addEventListener("error", () => reject("Network Error"));
          xhr.open("POST", url);
          xhr.send(formData);
        });
      }

      async function submitStaff(e) {
        e.preventDefault();

        if (stagedPastDesignations.length > 0) {
          formData.append(
            "past_designations",
            JSON.stringify(stagedPastDesignations),
          );
        }
        if (stagedPastVehicles.length > 0) {
          formData.append("past_vehicles", JSON.stringify(stagedPastVehicles));
        }
        stagedDocuments.forEach((doc) => {
          formData.append("documents", doc.file);
          formData.append("doc_names", doc.name);
        });
        try {
          const data = await uploadDataWithProgress(
            "/api/employee-tracker/add",
            formData,
            "submitBtn",
          );
          if (data.success) {
            showToast("Staff added successfully!");
            closeModal();
            loadStaff();
          } else {
            showToast("Error: " + data.message);
          }
        } catch (err) {
          showToast("Error connecting to server!");
        }
      }

          formData.append("doc_names", doc.name);

        try {

            `/api/employee-tracker/edit/${id}`,

      async function copyStaffProfileCardPNG(staffName) {
        const target = document.getElementById("staffProfileCaptureArea");
        if (!target || typeof html2canvas === "undefined") {
          showToast("Capture library not ready!");
          return;
        }

        const btn = document.getElementById("copyProfileCardBtn");
        if (btn) btn.innerText = "⏳";

        try {
          const canvas = await html2canvas(target, {
            scale: 3, // Ultra-HD 3x resolution
            useCORS: true,
            backgroundColor: "#ffffff",
          });

          await new Promise((resolve, reject) => {
            canvas.toBlob(
              async (blob) => {
                if (!blob) return reject(new Error("Failed to render PNG"));
                try {
                  await navigator.clipboard.write([
                    new ClipboardItem({ "image/png": blob }),
                  ]);
                  showToast("📋 Profile Card copied as HD PNG!");
                  resolve();
                } catch (clipErr) {
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url;
                  a.download = `${staffName.replace(/[^a-zA-Z0-9_-]+/g, "_")}_Profile_HD.png`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  showToast("📋 HD PNG downloaded!");
                  resolve();
                }
              },
              "image/png",
              1.0,
            );
          });
        } catch (err) {
          showToast("Error capturing card: " + err.message);
        } finally {
          if (btn) btn.innerText = "📋";
        }
      }

        const releasedBox = document.getElementById("releasedBox");

        const isWasPending = window.currentEmpCategory === "Pending";
        const isCategoryChanged =
          !isWasPending &&
          catElem &&
          catElem.value !== window.currentEmpCategory &&
          catElem.value !== "Released";
        const isSiteChanged =
          !isWasPending &&
          siteElem &&
          siteElem.value.trim() !== window.currentEmpSiteName;

        if (isCategoryChanged || isSiteChanged) {
          changeBox.style.display = "block";
          if (isCategoryChanged && isSiteChanged) {
            changeMsg.innerText = "Role & Site Change Detected! Enter dates:";
          } else if (isSiteChanged) {
            changeMsg.innerText = "Site Change Detected! Enter dates:";
          } else {
            changeMsg.innerText = "Role Change Detected! Enter dates:";
          }
          document.getElementById("prev_end_date").required = true;
          document.getElementById("new_start_date").required = true;
        } else {
          changeBox.style.display = "none";
          document.getElementById("prev_end_date").required = false;
          document.getElementById("new_start_date").required = false;
        }

        if (catElem && catElem.value === "Released") {
          releasedBox.style.display = "block";
          document.getElementById("released_date").required = true;
        } else {
          releasedBox.style.display = "none";
          document.getElementById("released_date").required = false;
        }

      async function addStagedDocument() {
        const nameInput = document.getElementById("tempDocName");
        const fileInput = document.getElementById("tempDocFile");
        if (!fileInput || !fileInput.files.length) {
          showToast("Please select a file to attach!");
          return;
        }
        const file = fileInput.files[0];
        const docName =
          nameInput.value.trim() || file.name.replace(/\.[^/.]+$/, "");

        // If we are in Edit Staff mode, upload directly to server so it immediately becomes an active button
        if (window.activeEditEmpId) {
          try {
            const fd = new FormData();
            fd.append("document", file);
            fd.append("doc_name", docName);
            const res = await fetch(
              `/api/employee-tracker/upload-doc/${window.activeEditEmpId}`,
              {
                method: "POST",
                body: fd,
              },
            );
            const data = await res.json();

      async function fetchImageAsBase64(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          const blob = await res.blob();
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64data = reader.result;
              const ext = blob.type.includes("png") ? "png" : "jpeg";
              const img = new Image();
              img.onload = () => {
                resolve({
                  base64: base64data,
                  extension: ext,
                  width: img.naturalWidth || 40,
                  height: img.naturalHeight || 40,
                });
              };
              img.onerror = () =>
                resolve({
                  base64: base64data,
                  extension: ext,
                  width: 40,
                  height: 40,
                });
              img.src = base64data;
            };
            reader.readAsDataURL(blob);
          });
        } catch (e) {
          return null;
        }
      }

      async function exportStaffToExcel(withPhoto = true) {
        if (!allEmployeesData || allEmployeesData.length === 0) {
          showToast("No employee data to export!");
          return;
        }
        if (typeof ExcelJS === "undefined" || typeof saveAs === "undefined") {
          showToast("Excel libraries not loaded!");
          return;
        }

        showToast(
          withPhoto
            ? "Generating Excel file with photos..."
            : "Generating Excel file...",
        );

        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet("Employees", {
          views: [{ showGridLines: true, zoomScale: 76 }],
        });

        // Build column definitions based on withPhoto option
        const cols = [{ header: "Employee ID", key: "unique_id", width: 14 }];

        if (withPhoto) {
          cols.push({ header: "Photo", key: "photo", width: 8 });
        }

        cols.push(
          { header: "Full Name", key: "name", width: 25 },
          { header: "Category", key: "category", width: 18 },
          { header: "Department", key: "department", width: 20 },
          { header: "Site Name", key: "site_name", width: 20 },

          { header: "Working Country", key: "country", width: 25 },
          { header: "Mobile No", key: "mobile", width: 18 },
          { header: "Alt Mobile No", key: "alt_mobile", width: 18 },
          { header: "Passport No", key: "passport_no", width: 18 },
          { header: "Passport Expiry", key: "passport_expiry", width: 15 },
          { header: "IQAMA No", key: "iqama_no", width: 18 },
          { header: "IQAMA Expiry", key: "iqama_expiry", width: 15 },
          { header: "Licence Expiry", key: "licence_expiry", width: 15 },
          {
            header: "Health Ins Expiry",
            key: "health_insurance_expiry",
            width: 15,
          },
          { header: "Sponsor Name", key: "sponsor_name", width: 25 },
          { header: "Vehicle Model", key: "vehicle_model", width: 20 },
          { header: "Plate No", key: "plate_no", width: 15 },
          { header: "Received Date", key: "vehicle_purchase_date", width: 16 },
          { header: "FAHS Expiry", key: "fahs_expiry", width: 15 },
          { header: "Insurance Expiry", key: "insurance_expiry", width: 16 },
          { header: "Address", key: "address", width: 30 },

          { header: "Emergency Contact", key: "emergency_name", width: 20 },
          { header: "Emergency Mobile", key: "emergency_mobile", width: 18 },
        );

        worksheet.columns = cols;

        // Insert Rows
        for (let i = 0; i < allEmployeesData.length; i++) {
          const emp = allEmployeesData[i];
          const currentRowNumber = i + 2;

          const rowData = {
            unique_id: emp.unique_id || "",
            name: emp.name || "",
            category: emp.category || "",
            department: emp.department || "",
            site_name: emp.site_name || "",
            designation: emp.designation || "",
            joining_date: emp.joining_date ? toInputDate(emp.joining_date) : "",
            released_date:
              emp.category === "Released" && emp.released_date
                ? toInputDate(emp.released_date)
                : "",
            country:
              emp.country === "KSA" || !emp.country
                ? "Kingdom of Saudi Arabia"
                : emp.country,
            mobile: emp.mobile || "",
            alt_mobile: emp.alt_mobile || "",
            passport_no: emp.passport_no || "",
            passport_expiry: emp.passport_expiry
              ? toInputDate(emp.passport_expiry)
              : "",
            iqama_no: emp.iqama_no || "",
            iqama_expiry: emp.iqama_expiry ? toInputDate(emp.iqama_expiry) : "",
            licence_expiry: emp.licence_expiry
              ? toInputDate(emp.licence_expiry)
              : "",
            health_insurance_expiry: emp.health_insurance_expiry
              ? toInputDate(emp.health_insurance_expiry)
              : "",
            sponsor_name: emp.sponsor_name || "",
            vehicle_model: emp.vehicle_model || "",
            plate_no: emp.plate_no || "",
            vehicle_purchase_date: emp.vehicle_purchase_date
              ? toInputDate(emp.vehicle_purchase_date)
              : "",
            fahs_expiry: emp.fahs_expiry ? toInputDate(emp.fahs_expiry) : "",
            insurance_expiry: emp.insurance_expiry
              ? toInputDate(emp.insurance_expiry)
              : "",
            address: emp.address || "",
            notes: emp.notes || "",
            emergency_name: emp.emergency_name
              ? `${emp.emergency_name} (${emp.emergency_relation || ""})`
              : "",
            emergency_mobile: emp.emergency_mobile || "",
          };

          if (withPhoto) {
            rowData.photo = "";
          }

          worksheet.addRow(rowData);

          // Embed photo if option is selected
          if (withPhoto && emp.image_path) {
            const imgData = await fetchImageAsBase64(emp.image_path);
            if (imgData) {
              const imageId = workbook.addImage({
                base64: imgData.base64,
                extension: imgData.extension,
              });

              const maxBox = 36;
              const ratio = Math.min(
                maxBox / imgData.width,
                maxBox / imgData.height,
              );
              const imgW = Math.round(imgData.width * ratio);
              const imgH = Math.round(imgData.height * ratio);

              const colPad = Math.max(0, (60 - imgW) / 2) / 60;
              const rowPad = Math.max(0, (46 - imgH) / 2) / 46;

              worksheet.addImage(imageId, {
                tl: { col: 1 + colPad, row: currentRowNumber - 1 + rowPad },
                ext: { width: imgW, height: imgH },
                editAs: "oneCell",
              });
            }
          }
        }

        const headerRow = worksheet.getRow(1);
        headerRow.height = 28;
        headerRow.eachCell((cell) => {
          cell.font = {
            name: "Arial",
            size: 11,
            bold: true,
            color: { argb: "FFFFFFFF" },
          };
          cell.fill = {
            type: "pattern",
            pattern: "solid",
            fgColor: { argb: "FF000000" },
          };
          cell.alignment = { horizontal: "center", vertical: "middle" };
          cell.border = {
            top: { style: "thin", color: { argb: "FF333333" } },
            bottom: { style: "medium", color: { argb: "FF000000" } },
            left: { style: "thin", color: { argb: "FF333333" } },
            right: { style: "thin", color: { argb: "FF333333" } },
          };
        });

        worksheet.autoFilter = {
          from: { row: 1, column: 1 },
          to: { row: 1, column: worksheet.columns.length },
        };

        worksheet.eachRow((row, rowNumber) => {
          if (rowNumber > 1) {
            row.height = withPhoto ? 35 : 20; // ഫോട്ടോ ഇല്ലാത്തപ്പോൾ നോർമൽ ഒതുങ്ങിയ ഹൈറ്റ്
            row.eachCell((cell) => {
              cell.alignment = { vertical: "middle" };
              cell.font = { name: "Arial", size: 10 };
              cell.border = {
                top: { style: "thin", color: { argb: "FFE2E8F0" } },
                bottom: { style: "thin", color: { argb: "FFE2E8F0" } },
                left: { style: "thin", color: { argb: "FFE2E8F0" } },
                right: { style: "thin", color: { argb: "FFE2E8F0" } },
              };
            });
          }
        });

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const fileSuffix = withPhoto ? "With_Photos" : "Data";
        saveAs(
          blob,
          `Employee_Directory_${fileSuffix}_${new Date().toISOString().split("T")[0]}.xlsx`,
        );
        showToast("Excel exported successfully!");
      }

      const defaultDesignations = {
        Director: ["Managing Director", "Director"],
        "Site Co": ["Co-Ordinator"],
        "Field Co": ["Co-Ordinator"],
        "Business Co": ["Business Co-ordinator"],
        "Office Staff": ["Office Administration"],
        "Office Accounts": ["Accountant", "Jr Accountant"],
      };

      function updateDesignationOptions(
        catSelectId,
        desigSelectId,
        selectedVal = "",
      ) {
        const cat = document.getElementById(catSelectId).value;
        const desigSelect = document.getElementById(desigSelectId);
        if (!desigSelect) return;

        desigSelect.innerHTML = "";
        const list = defaultDesignations[cat] || [];

        if (cat === "Site Co" || cat === "Field Co") {
          const opt = document.createElement("option");
          opt.value = "Co-Ordinator";
          opt.textContent = "Co-Ordinator";
          opt.selected = true;
          desigSelect.appendChild(opt);
        } else if (cat === "Business Co") {
          const opt = document.createElement("option");
          opt.value = "Business Co-ordinator";
          opt.textContent = "Business Co-ordinator";
          opt.selected = true;
          desigSelect.appendChild(opt);
        } else {
          let matched = false;
          list.forEach((d) => {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            if (d === selectedVal) {
              opt.selected = true;
              matched = true;
            }
            desigSelect.appendChild(opt);
          });

          if (selectedVal && !matched && selectedVal !== "Co-Ordinator") {
            const customOpt = document.createElement("option");
            customOpt.value = selectedVal;
            customOpt.textContent = selectedVal;
            customOpt.selected = true;
            desigSelect.appendChild(customOpt);
          }

          const addOpt = document.createElement("option");
          addOpt.value = "__add_new__";
          addOpt.textContent = "+ Add New";
          desigSelect.appendChild(addOpt);
        }
      }

      async function handleDesignationChange(selectElem, catSelectId) {
        if (selectElem.value === "__add_new__") {
          if (typeof Swal !== "undefined") {
            const { value: newDesig } = await Swal.fire({
              title: "Add New Designation",
              input: "text",
              inputPlaceholder: "Enter Designation Name...",
              showCancelButton: true,
              confirmButtonText: "Add",
              confirmButtonColor: "#007bff",
              cancelButtonColor: "#6c757d",
              target: document.getElementById("staffModal") || document.body,
              inputValidator: (value) => {
                if (!value || !value.trim()) {
                  return "Designation name is required!";
                }
              },
            });

            if (newDesig && newDesig.trim() !== "") {
              const val = newDesig.trim();
              const opt = document.createElement("option");
              opt.value = val;
              opt.textContent = val;
              selectElem.insertBefore(opt, selectElem.lastElementChild);
              selectElem.value = val;
            } else {
              updateDesignationOptions(catSelectId, selectElem.id);
            }
          } else {
            const val = window.prompt("Enter New Designation:");
            if (val && val.trim() !== "") {
              const cleanVal = val.trim();
              const opt = document.createElement("option");
              opt.value = cleanVal;
              opt.textContent = cleanVal;
              selectElem.insertBefore(opt, selectElem.lastElementChild);
              selectElem.value = cleanVal;
            } else {
              updateDesignationOptions(catSelectId, selectElem.id);
            }
          }
        }
      }

      function toggleSiteNameField(catSelectId, siteBoxId) {
        const cat = document.getElementById(catSelectId).value;
        const siteBox = document.getElementById(siteBoxId);
        if (!siteBox) return;
        if (cat === "Site Co") {
          siteBox.style.display = "block";
        } else {
          siteBox.style.display = "none";
          const input = siteBox.querySelector("input");
          if (input) input.value = "";
        }
      }

      function toggleKsaFields(countryVal, boxId) {
        const box = document.getElementById(boxId);
        if (box) {
          if (countryVal === "India") {
            box.style.display = "none";
          } else {
            box.style.display = "block";
          }
        }
      }
    </script>
  </body>
</html>
