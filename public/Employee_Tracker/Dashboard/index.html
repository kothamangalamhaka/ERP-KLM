<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Tracker Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filters { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; background: #f4f7f6; padding: 15px 0; z-index: 100; border-bottom: 1px solid #ddd; }
        .filters button { padding: 8px 15px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .filters button:hover { background: #bbb; }
        .filters button.active { background: #007bff; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        /* Search Bar Styles */
        .search-container { display: flex; align-items: center; gap: 10px; }
        .search-input-wrapper { position: relative; }
        .search-input { display: none; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; width: 250px; outline: none; transition: 0.3s; }
        .search-input.show { display: block; }
        .search-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; }
        .suggestions { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 5px; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
        .suggestion-item:hover { background: #f4f7f6; }
        
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #007bff; }
        .card h3 { margin: 5px 0; font-size: 16px; color: #333; }
        .card p { margin: 3px 0; font-size: 13px; color: #666; }
        
        /* Modal Popup */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 550px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close { position: absolute; right: 15px; top: 10px; font-size: 22px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* New 2-Column Grid for Modals */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        /* Progress Bar Styles */
        .progress-container { display: none; width: 100%; background-color: #e9ecef; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .progress-bar { width: 0%; height: 15px; background-color: #28a745; transition: width 0.3s ease; }
        .progress-text { font-size: 12px; text-align: center; color: #333; font-weight: bold; margin-top: 5px; }
        .btn { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #007bff; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ffc107; color: #333; }
        .btnx { background: #0e9db3; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btnx:hover { background: #0b7a8c; }
        .btn:hover { opacity: 0.9; }

        /* Custom Notification Toast */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 4px; padding: 12px; position: fixed; z-index: 2000; right: 30px; bottom: 30px; font-size: 14px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div class="header">
    <h2>Employee Directory</h2>
    <div class="search-container">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Search Name or Code..." oninput="showSuggestions()" autocomplete="off">
            <div id="suggestionBox" class="suggestions"></div>
        </div>
        <button class="search-btn" onclick="toggleSearch()" title="Search">🔍</button>
        <button class="btn" onclick="openAddModal()">+ Add New Staff</button>
        <button class="btnx" onclick="window.location.href='../staff_salary/'"">Staff Salary</button>
        <button class="btn btn-primary" onclick="window.location.href='../admin/index.html'">Admin Panel</button>
    </div>
</div>

<div class="filters">
    <button class="active" onclick="filterStaff('All', this)">All <span id="count-All">(0)</span></button>
    <button onclick="filterStaff('Director', this)">Directors <span id="count-Director">(0)</span></button>
    <button onclick="filterStaff('Site Co', this)">Site Co <span id="count-SiteCo">(0)</span></button>
    <button onclick="filterStaff('Field Co', this)">Field Co <span id="count-FieldCo">(0)</span></button>
    <button onclick="filterStaff('Office Admin', this)">Office Admin <span id="count-OfficeAdmin">(0)</span></button>
    <button onclick="filterStaff('Office Accounts', this)">Office Accounts <span id="count-OfficeAccounts">(0)</span></button>
    <button onclick="filterStaff('Released', this)" style="background: #dc3545; color: white;">Released <span id="count-Released">(0)</span></button>
</div>

<div id="staffContainer"></div>

<!-- CUSTOM MODAL -->
<div id="staffModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast"></div>

<script>
    // Authentication Check
    const user = localStorage.getItem('emp_user');
    if (!user) {
        window.location.href = '../index.html?redirect=' + encodeURIComponent(window.location.href); 
    }

    let allEmployeesData = []; // സ്റ്റാഫ് ഡാറ്റ മുഴുവനായും സൂക്ഷിക്കാൻ

    document.addEventListener('DOMContentLoaded', () => fetchAllStaff());

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.className = "show";
        toast.innerText = message;
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // Date Formatter (eg: 2026 May 26)
    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const d = new Date(dateStr);
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${d.getFullYear()} ${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}`;
    }

    // Ensure proper date input format (YYYY-MM-DD)
    function toInputDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ഡാറ്റാബേസിൽ നിന്നും ഒരിക്കൽ മാത്രം എല്ലാ സ്റ്റാഫിനെയും എടുക്കുന്നു
    async function fetchAllStaff() {
        const res = await fetch(`/api/employee-tracker/all?category=All`);
        const data = await res.json();
        if (data.success) {
            allEmployeesData = data.employees;
            updateCounts(); // പുതിയ ഫംഗ്ഷൻ വിളിക്കുന്നു 
            renderStaff('All');
        }
    }

    // ഓരോ കാറ്റഗറിയിലെയും കൗണ്ട് കണ്ടെത്തി അപ്ഡേറ്റ് ചെയ്യാനുള്ള ഫംഗ്ഷൻ
    function updateCounts() {
        const counts = {
            'All': allEmployeesData.length,
            'Director': 0,
            'Site Co': 0,
            'Field Co': 0,
            'Office Admin': 0,
            'Office Accounts': 0,
            'Released': 0
        };

        // മൊത്തം ഡാറ്റയിൽ നിന്നും ഓരോ കാറ്റഗറിയുടെയും എണ്ണം എടുക്കുന്നു
        allEmployeesData.forEach(emp => {
            if (counts[emp.category] !== undefined) {
                counts[emp.category]++;
            }
        });

        // HTML-ലെ സ്പാനുകളിലേക്ക് കൗണ്ട് നൽകുന്നു
        document.getElementById('count-All').innerText = `(${counts['All']})`;
        document.getElementById('count-Director').innerText = `(${counts['Director']})`;
        document.getElementById('count-SiteCo').innerText = `(${counts['Site Co']})`;
        document.getElementById('count-FieldCo').innerText = `(${counts['Field Co']})`;
        document.getElementById('count-OfficeAdmin').innerText = `(${counts['Office Admin']})`;
        document.getElementById('count-OfficeAccounts').innerText = `(${counts['Office Accounts']})`;
        document.getElementById('count-Released').innerText = `(${counts['Released']})`;
    }

    // ഡാറ്റ സേവ് ചെയ്യുമ്പോഴും ഡിലീറ്റ് ചെയ്യുമ്പോഴും ഇത് വിളിക്കാം
    async function loadStaff() {
        await fetchAllStaff();
    }

    // കാറ്റഗറി ഫിൽറ്റർ (ഉദാ: Site Co ക്ലിക്ക് ചെയ്യുമ്പോൾ)
    function filterStaff(category, btn) {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        
        // സെർച്ച് റീസെറ്റ് ചെയ്യുക
        document.getElementById('searchInput').value = '';
        document.getElementById('suggestionBox').style.display = 'none';
        
        renderStaff(category);
    }

    // ഡാറ്റ സ്ക്രീനിൽ കാണിക്കാൻ (All ആയാലും കാറ്റഗറി ആയാലും)
    function renderStaff(filterCategory, specificData = null) {
        const container = document.getElementById('staffContainer');
        container.innerHTML = '';
        
        // സെർച്ച് റിസൾട്ട് ആണെങ്കിൽ അത് എടുക്കുക, അല്ലെങ്കിൽ ഫിൽറ്റർ ചെയ്തത് എടുക്കുക
        let displayData = specificData ? specificData : allEmployeesData;
        
        if (filterCategory !== 'All' && !specificData) {
            displayData = displayData.filter(emp => emp.category === filterCategory);
        }

        if (displayData.length === 0) {
            container.innerHTML = '<p style="padding:20px; font-weight:bold; color:#dc3545;">No staff found in this section.</p>';
            return;
        }

        const categories = ['Director', 'Site Co', 'Field Co', 'Office Admin', 'Office Accounts', 'Released'];
        const grouped = {};
        categories.forEach(c => grouped[c] = []);

        displayData.forEach(emp => {
            if(grouped[emp.category] !== undefined) {
                grouped[emp.category].push(emp);
            } else {
                grouped[emp.category] = [emp];
            }
        });

        for (const [cat, emps] of Object.entries(grouped)) {
            if (emps && emps.length > 0) {
                // കാറ്റഗറിക്ക് ഉള്ളിൽ ഐഡി വെച്ച് കൃത്യമായി ഓർഡർ ചെയ്യുന്നു
                emps.sort((a, b) => (a.unique_id || '').localeCompare(b.unique_id || ''));

                let sectionHtml = `
                    <div class="category-section" style="margin-bottom: 40px;">
                        <h3 style="color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 15px;">${cat}</h3>
                        <div class="grid">
                `;
                
                emps.forEach(emp => {
                    sectionHtml += `
                        <div class="card" onclick="viewDetails(${emp.id})">
                            <img src="${emp.image_path || 'https://via.placeholder.com/80'}" alt="Staff">
                            <h3>${emp.name}</h3>
                            <p><b>${emp.unique_id}</b></p>
                            <p>${emp.designation || emp.category}</p>
                            <p>📞 ${emp.mobile || 'N/A'}</p>
                        </div>
                    `;
                });
                sectionHtml += `</div></div>`;
                container.innerHTML += sectionHtml;
            }
        }
    }

    // --- Search & Suggestion Functionality ---
    function toggleSearch() {
        const input = document.getElementById('searchInput');
        input.classList.toggle('show');
        if (input.classList.contains('show')) {
            input.focus();
        } else {
            input.value = '';
            document.getElementById('suggestionBox').style.display = 'none';
            
            // നിലവിൽ സെലക്ട് ചെയ്ത ടാബ് തിരികെ കൊണ്ടുവരാൻ
            const activeBtn = document.querySelector('.filters button.active');
            const cat = activeBtn ? (activeBtn.innerText === 'Directors' ? 'Director' : activeBtn.innerText) : 'All';
            renderStaff(cat);
        }
    }

    // ടൈപ്പ് ചെയ്യുമ്പോൾ സജഷൻസ് കാണിക്കാൻ
    function showSuggestions() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        const box = document.getElementById('suggestionBox');
        box.innerHTML = '';
        
        if (!val) {
            box.style.display = 'none';
            const activeBtn = document.querySelector('.filters button.active');
            const cat = activeBtn ? (activeBtn.innerText === 'Directors' ? 'Director' : activeBtn.innerText) : 'All';
            renderStaff(cat);
            return;
        }

        const matches = allEmployeesData.filter(emp => 
            (emp.name || '').toLowerCase().includes(val) || 
            (emp.unique_id || '').toLowerCase().includes(val)
        );

        if (matches.length > 0) {
            matches.forEach(emp => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<b>${emp.unique_id}</b> - ${emp.name}`;
                // സജഷനിൽ ക്ലിക്ക് ചെയ്താൽ ആ വ്യക്തിയെ മാത്രം കാണിക്കും
                div.onclick = () => {
                    document.getElementById('searchInput').value = emp.name;
                    box.style.display = 'none';
                    renderStaff('All', [emp]); 
                };
                box.appendChild(div);
            });
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
        
        // ടൈപ്പ് ചെയ്യുമ്പോഴും സ്ക്രീനിലെ കാർഡുകൾ അപ്ഡേറ്റ് ആവാൻ 
        renderStaff('All', matches);
    }



// Open Add Staff Modal (2-Column Layout)
    function openAddModal() {
    stagedDocuments = []; // Clear previous docs

    document.getElementById('modalBody').innerHTML = `
        <h2>Add New Staff</h2>
        <form id="addStaffForm" onsubmit="submitStaff(event)">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>Division / Category</label>
                        <select name="category" required>
                            <option value="Director">Director</option>
                            <option value="Site Co">Site Co</option>
                            <option value="Field Co">Field Co</option>
                            <option value="Office Admin">Office Admin</option>
                            <option value="Office Accounts">Office Accounts</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Designation</label><input type="text" name="designation"></div>
                    <div class="form-group"><label>Joining Date</label><input type="date" name="joining_date" required></div>
                    <div class="form-group"><label>Mobile No</label><input type="text" name="mobile"></div>
                    <div class="form-group"><label>Alt Mobile No</label><input type="text" name="alt_mobile"></div>
                    <div class="form-group"><label>Passport No</label><input type="text" name="passport_no"></div>
                    <div class="form-group"><label>Staff Photo</label><input type="file" name="image" accept=".jpg, .jpeg, .png"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group full-width"><label>Address</label><textarea name="address" rows="2"></textarea></div>
                    <div class="form-group full-width"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
                </div>

                <h4 style="margin:10px 0 5px 0; color:#007bff; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Emergency Contact</h4>
                <div class="form-row">
                    <div class="form-group"><label>Name</label><input type="text" name="emergency_name"></div>
                    <div class="form-group"><label>Relationship</label><input type="text" name="emergency_relation"></div>
                    <div class="form-group"><label>Mobile</label><input type="text" name="emergency_mobile"></div>
                    <div class="form-group"><label>Alt Mobile</label><input type="text" name="emergency_alt"></div>
                </div>

                <h4 style="margin:10px 0 5px 0; color:#007bff; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Upload Documents</h4>
                <div class="form-row" style="align-items: flex-end;">
                    <div class="form-group"><label>Document Name (e.g., Aadhar)</label><input type="text" id="tempDocName" placeholder="Enter Name"></div>
                    <div class="form-group">
                        <label>Attach File (PDF, PNG, JPG)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="file" id="tempDocFile" accept=".pdf, .png, .jpg, .jpeg" style="flex:1;">
                            <button type="button" onclick="addStagedDocument()" class="btn btn-primary" style="padding: 8px 15px;">Add</button>
                        </div>
                    </div>
                </div>
                <ul id="stagedDocsList" style="list-style:none; padding:0; margin:10px 0;"></ul>
                
                <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
                <div class="progress-text" id="progressText"></div>

                <button type="submit" id="submitBtn" class="btn" style="width:100%; margin-top:15px;">Save Staff</button>
            </form>
        `;

        // Reset staged document list after UI is created
        renderStagedDocuments();

        document.getElementById('staffModal').style.display = 'flex';
    }

    // Open Edit Staff Modal (2-Column Layout)
    async function openEditModal(id) {

    // Clear previously staged documents
    stagedDocuments = [];

    const res = await fetch(`/api/employee-tracker/details/${id}`);
    const data = await res.json();

    if (!data.success) return;

    const emp = data.employee;
    const docs = data.documents || []; 

    window.currentEmpCategory = emp.category;

        document.getElementById('modalBody').innerHTML = `
            <h2>Edit Staff (${emp.unique_id})</h2>
            <form id="editStaffForm" onsubmit="updateStaff(event, ${emp.id})">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" name="name" value="${emp.name || ''}" required></div>
                    <div class="form-group"><label>Division / Category</label>
                        <select name="category" id="categorySelect" onchange="checkCategoryChange(this)" required>
                            <option value="Director" ${emp.category === 'Director' ? 'selected' : ''}>Director</option>
                            <option value="Site Co" ${emp.category === 'Site Co' ? 'selected' : ''}>Site Co</option>
                            <option value="Field Co" ${emp.category === 'Field Co' ? 'selected' : ''}>Field Co</option>
                            <option value="Office Admin" ${emp.category === 'Office Admin' ? 'selected' : ''}>Office Admin</option>
                            <option value="Office Accounts" ${emp.category === 'Office Accounts' ? 'selected' : ''}>Office Accounts</option>
                            <option value="Released" ${emp.category === 'Released' ? 'selected' : ''}>Released</option>
                        </select>
                    </div>
                    
                    <!-- Hidden Boxes -->
                    <div id="roleChangeBox" class="full-width" style="display:none; background:#fff3cd; padding:10px; border-radius:5px; border:1px solid #ffeeba;">
                        <p style="margin:0 0 8px 0; font-size:13px; color:#856404; font-weight:bold;">Role Change Detected! Enter dates:</p>
                        <div class="form-row">
                            <div class="form-group"><label>Previous Role End Date</label><input type="date" name="prev_end_date" id="prev_end_date"></div>
                            <div class="form-group"><label>New Role Start Date</label><input type="date" name="new_start_date" id="new_start_date"></div>
                        </div>
                    </div>
                    <div id="releasedBox" class="full-width" style="display:${emp.category === 'Released' ? 'block' : 'none'}; background:#f8d7da; padding:10px; border-radius:5px; border:1px solid #f5c6cb;">
                        <div class="form-group"><label style="color:#721c24;">Released Date</label><input type="date" name="released_date" id="released_date" value="${toInputDate(emp.released_date) || ''}"></div>
                    </div>

                    <div class="form-group"><label>Designation</label><input type="text" name="designation" value="${emp.designation || ''}"></div>
                    <div class="form-group"><label>Joining Date</label><input type="date" name="joining_date" value="${toInputDate(emp.joining_date)}" required></div>
                    <div class="form-group"><label>Mobile No</label><input type="text" name="mobile" value="${emp.mobile || ''}"></div>
                    <div class="form-group"><label>Alt Mobile No</label><input type="text" name="alt_mobile" value="${emp.alt_mobile || ''}"></div>
                    <div class="form-group"><label>Passport No</label><input type="text" name="passport_no" value="${emp.passport_no || ''}"></div>
                    <div class="form-group"><label>Update Photo</label><input type="file" name="image" accept=".jpg, .jpeg, .png"></div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width"><label>Address</label><textarea name="address" rows="2">${emp.address || ''}</textarea></div>
                    <div class="form-group full-width"><label>Notes</label><textarea name="notes" rows="2">${emp.notes || ''}</textarea></div>
                </div>

                <h4 style="margin:10px 0 5px 0; color:#007bff; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Emergency Contact</h4>
                <div class="form-row">
                    <div class="form-group"><label>Name</label><input type="text" name="emergency_name" value="${emp.emergency_name || ''}"></div>
                    <div class="form-group"><label>Relationship</label><input type="text" name="emergency_relation" value="${emp.emergency_relation || ''}"></div>
                    <div class="form-group"><label>Mobile</label><input type="text" name="emergency_mobile" value="${emp.emergency_mobile || ''}"></div>
                    <div class="form-group"><label>Alt Mobile</label><input type="text" name="emergency_alt" value="${emp.emergency_alt || ''}"></div>
                </div>

                <h4 style="margin:10px 0 5px 0; color:#007bff; border-bottom: 1px solid #ddd; padding-bottom: 5px;">Manage & Remove Documents</h4>
                ${docs.length > 0 ? `
                    <div style="background:#e9ecef; padding:10px; border-radius:5px; margin-bottom:12px;">
                        <label style="font-weight:600; font-size:13px; margin-bottom:5px; display:block; color:#333;">Existing Documents (Click ✖ to Remove)</label>
                        <ul style="list-style:none; padding:0; margin:0;">
                            ${docs.map((d) => {
    const fileName = (d.file_path || '').split('/').pop();

    const match = fileName.match(/-(\d+)\.[^.]+$/);

    const actualDocNumber = match
        ? parseInt(match[1], 10)
        : '';

    return `
        <li style="display:flex; justify-content:space-between; background:#fff; padding:6px 10px; margin-bottom:4px; border-radius:4px; font-size:13px; align-items:center; border:1px solid #ddd;">
            <span>
                <a href="${d.file_path}" target="_blank">
                    ${d.doc_name}
                </a>
                <small>(${actualDocNumber})</small>
            </span>

            <button
                type="button"
                style="color:#dc3545; border:none; background:none; cursor:pointer; font-weight:bold; font-size:16px;"
                onclick="deleteExistingDocument(${d.id}, ${emp.id})"
            >✖</button>
        </li>
    `;
}).join('')}

                        </ul>
                    </div>
                ` : '<p style="font-size:13px; color:#666;">No documents attached yet.</p>'}

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Document Action</label>
                        <select name="doc_action" onchange="toggleDocAction(this)">
                            <option value="none" selected>-- No Document Updates --</option>
                            <option value="add_new">Add New Document</option>
                        </select>
                    </div>
                </div>

                <div id="uploadDocSection" style="display:none; margin-top: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1.5fr auto; gap: 10px; align-items: flex-end;">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Document Name</label>
                            <input type="text" id="tempDocName" placeholder="Enter Name">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Attach File (PDF, JPG)</label>
                            <input type="file" id="tempDocFile" accept=".pdf, .png, .jpg, .jpeg">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <button type="button" onclick="addStagedDocument()" class="btn btn-primary" style="padding: 8px 15px; height: 38px;">Add</button>
                        </div>
                    </div>
                    <ul id="stagedDocsList" style="list-style:none; padding:0; margin:10px 0;"></ul>
                </div>

                <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
                <div class="progress-text" id="progressText"></div>

                <button type="submit" id="updateBtn" class="btn btn-warning" style="width:100%; margin-top:15px;">Update Staff</button>
            </form>
        `;
    }


    // Reusable Upload Function with Progress Bar
    function uploadDataWithProgress(url, formData, btnId) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const btn = document.getElementById(btnId);

            progressContainer.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Processing...";

            xhr.upload.addEventListener("progress", (event) => {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percentComplete + "%";
                    progressText.innerText = `Uploading... ${percentComplete}%`;
                }
            });

            xhr.addEventListener("load", () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    resolve(JSON.parse(xhr.responseText));
                } else {
                    reject("Upload Failed");
                }
            });
            
            xhr.addEventListener("error", () => reject("Network Error"));
            xhr.open("POST", url);
            xhr.send(formData);
        });
    }

    async function submitStaff(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        // Staged ഫയലുകൾ ഒന്നിനുപുറകെ ഒന്നായി ഫോമിലേക്ക് ചേർക്കുന്നു
        stagedDocuments.forEach(doc => {
            formData.append('documents', doc.file); // ശ്രദ്ധിക്കുക: പേര് 'documents' എന്നാണ്
            formData.append('doc_names', doc.name);
        });

        try {
            const data = await uploadDataWithProgress('/api/employee-tracker/add', formData, 'submitBtn');
            if (data.success) {
                showToast("Staff added successfully!");
                closeModal();
                loadStaff();
            } else {
                showToast("Error: " + data.message);
            }
        } catch (err) {
            showToast("Error connecting to server!");
        }
    }

    async function updateStaff(e, id) {
    e.preventDefault();

    const formData = new FormData(e.target);

    // Add staged documents to FormData
    stagedDocuments.forEach(doc => {
        formData.append('documents', doc.file);
        formData.append('doc_names', doc.name);
    });

    // Debug: Check files before sending
    console.log("Files being uploaded:");

    for (const [key, value] of formData.entries()) {
        if (value instanceof File) {
            console.log(
                "File:",
                key,
                value.name,
                value.size,
                value.type
            );
        }
    }

    try {
        const data = await uploadDataWithProgress(
            `/api/employee-tracker/edit/${id}`,
            formData,
            'updateBtn'
        );

        if (data.success) {
            showToast("Staff updated successfully!");

            // Clear staged documents
            stagedDocuments = [];

            closeModal();
            await loadStaff();

        } else {
            showToast("Error: " + data.message);
        }

    } catch (err) {
        console.error("Update Error:", err);
        showToast("Error updating data!");
    }
}
    

    // View Details Modal with Timeline History
    async function viewDetails(id) {
        const res = await fetch(`/api/employee-tracker/details/${id}`);
        const data = await res.json();
        if (!data.success) return;

        const emp = data.employee;
        const history = data.history;
        const docs = data.documents;

        let docSectionHtml = '';
        if (docs && docs.length > 0) {
            let docHtml = docs.map((d) => {
    const fileName = (d.file_path || '').split('/').pop();

    // Extract number from:
    // EMP-001-1.pdf
    // EMP-001-10.pdf
    const match = fileName.match(/-(\d+)\.[^.]+$/);

    const actualDocNumber = match
        ? parseInt(match[1], 10)
        : '';

    return `
        <li>
            ${actualDocNumber} &nbsp;&nbsp;
            <a href="${d.file_path}" target="_blank">
                ${d.doc_name}
            </a>
        </li>
    `;
}).join('');

            docSectionHtml = `
                <h4 style="margin:10px 0 5px 0; color:#007bff;">Attached Documents</h4>
                <ul>${docHtml}</ul>
            `;
        }
        
        // Timeline Generation
        let timelineHtml = '';
        if (history && history.length > 0) {
            history.forEach(h => {
                timelineHtml += `<li style="margin-bottom:8px;"><b>${formatDate(h.start_date)} - ${formatDate(h.end_date)}</b> : ${h.previous_category} ${h.previous_designation ? `(${h.previous_designation})` : ''}</li>`;
            });
        }
        // Append Current Role
        timelineHtml += `<li style="margin-bottom:8px; color:green;"><b>${formatDate(emp.joining_date)} - Present</b> : ${emp.category} ${emp.designation ? `(${emp.designation})` : ''}</li>`;

        document.getElementById('modalBody').innerHTML = `
            <div style="text-align:center;">
                <img src="${emp.image_path || 'https://via.placeholder.com/80'}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;">
                <h2>${emp.name}</h2>
                <p style="color:#007bff; font-weight:bold;">${emp.unique_id} - ${emp.designation || emp.category}</p>
            </div>
            <hr>
            <p><b>Mobile:</b> ${emp.mobile || 'N/A'} | <b>Alt Mobile:</b> ${emp.alt_mobile || 'N/A'}</p>
            <p><b>Address:</b> ${emp.address || 'N/A'}</p>
            <p><b>Passport No:</b> ${emp.passport_no || 'N/A'}</p>
            <p><b>Notes:</b> ${emp.notes || 'N/A'}</p>
            
            <h4 style="margin:10px 0 5px 0; color:#007bff;">Emergency Contact</h4>
            <p><b>Name:</b> ${emp.emergency_name || 'N/A'} (${emp.emergency_relation || 'N/A'})</p>
            <p><b>Mobile:</b> ${emp.emergency_mobile || 'N/A'} | <b>Alt:</b> ${emp.emergency_alt || 'N/A'}</p>
            
            ${docSectionHtml}

            <h4 style="margin:10px 0 5px 0; color:#007bff;">Position History Log</h4>
            <ul style="list-style-type: none; padding-left: 0;">${timelineHtml}</ul>

            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button class="btn btn-warning" onclick="openEditModal(${emp.id})">✏️ Edit Staff</button>
                <button class="btn btn-danger" onclick="deleteStaff(${emp.id})">🗑️ Delete Staff</button>
            </div>
        `;
        document.getElementById('staffModal').style.display = 'flex';
    }

    // Detect if category is changed
    function checkCategoryChange(selectElem) {
        const changeBox = document.getElementById('roleChangeBox');
        const releasedBox = document.getElementById('releasedBox');
        
        // History Tracking Box
        if (selectElem.value !== window.currentEmpCategory && selectElem.value !== 'Released') {
            changeBox.style.display = 'block';
            document.getElementById('prev_end_date').required = true;
            document.getElementById('new_start_date').required = true;
        } else {
            changeBox.style.display = 'none';
            document.getElementById('prev_end_date').required = false;
            document.getElementById('new_start_date').required = false;
        }

        // Released Date Box
        if (selectElem.value === 'Released') {
            releasedBox.style.display = 'block';
            document.getElementById('released_date').required = true;
        } else {
            releasedBox.style.display = 'none';
            document.getElementById('released_date').required = false;
        }
    }


    function deleteStaff(id) {
        document.getElementById('modalBody').innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <h3 style="color: #dc3545; margin-bottom: 10px;">Security Verification</h3>
                <p style="font-size: 14px; color: #555;">Enter Admin Delete Security Key to proceed:</p>
                <div class="form-group" style="margin: 15px 0;">
                    <input type="password" id="deleteSecretInput" placeholder="Enter Security Key" style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 16px;">
                </div>
                <button class="btn btn-danger" onclick="confirmDelete(${id})">Confirm Delete</button>
                <button class="btn" onclick="viewDetails(${id})" style="background: #6c757d; margin-left: 10px;">Cancel</button>
            </div>
        `;
    }

    async function confirmDelete(id) {
        const deleteSecret = document.getElementById('deleteSecretInput').value;
        if (!deleteSecret) {
            showToast("Please enter the security key!");
            return;
        }

        const res = await fetch(`/api/employee-tracker/delete/${id}`, { 
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deleteSecret })
        });
        
        const data = await res.json();
        if (data.success) {
            showToast("Staff deleted successfully!");
            closeModal();
            loadStaff();
        } else {
            showToast("Error: " + (data.message || "Deletion failed!"));
        }
    }

    function toggleDocAction(select) {
        const replaceSection = document.getElementById('replaceDocSection');
        const uploadSection = document.getElementById('uploadDocSection');
        
        if (select.value === 'none') {
            if (replaceSection) replaceSection.style.display = 'none';
            if (uploadSection) uploadSection.style.display = 'none';
        } else if (select.value === 'add_new') {
            if (replaceSection) replaceSection.style.display = 'none';
            if (uploadSection) uploadSection.style.display = 'block';
        } else if (select.value === 'replace') {
            if (replaceSection) replaceSection.style.display = 'block';
            if (uploadSection) uploadSection.style.display = 'block';
        }
    }

    let stagedDocuments = []; // ഡോക്യുമെന്റുകൾ താൽക്കാലികമായി സൂക്ഷിക്കാൻ

    function addStagedDocument() {
        const nameInput = document.getElementById('tempDocName');
        const fileInput = document.getElementById('tempDocFile');

        if (!fileInput.files.length) {
            showToast("Please select a file to attach!");
            return;
        }

        const file = fileInput.files[0];
        const docName = nameInput.value.trim() || file.name;

        stagedDocuments.push({ name: docName, file: file });

        // ഫീൽഡുകൾ ക്ലിയർ ചെയ്യുന്നു
        nameInput.value = '';
        fileInput.value = '';
        
        renderStagedDocuments();
    }

    function renderStagedDocuments() {
        const list = document.getElementById('stagedDocsList');
        list.innerHTML = stagedDocuments.map((doc, index) => `
            <li style="display:flex; justify-content:space-between; background:#e9ecef; padding:8px 12px; margin-bottom:5px; border-radius:4px; font-size:13px; align-items:center;">
                <span><b>${doc.name}</b> <small>(${doc.file.name})</small></span>
                <button type="button" style="color:#dc3545; border:none; background:none; cursor:pointer; font-weight:bold; font-size:16px;" onclick="removeStagedDocument(${index})">✖</button>
            </li>
        `).join('');
    }

    function removeStagedDocument(index) {
        stagedDocuments.splice(index, 1);
        renderStagedDocuments();
    }

    function deleteExistingDocument(docId, empId) {
        document.getElementById('modalBody').innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <h3 style="color: #dc3545; margin-bottom: 10px;">Confirm Deletion</h3>
                <p style="font-size: 14px; color: #555;">Are you sure you want to remove this attached document?</p>
                <div style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
                    <button class="btn btn-danger" onclick="confirmDeleteDocument(${docId}, ${empId})">Yes, Delete</button>
                    <button class="btn" onclick="openEditModal(${empId})" style="background: #6c757d;">Cancel</button>
                </div>
            </div>
        `;
    }

    async function confirmDeleteDocument(docId, empId) {
        try {
            const res = await fetch(`/api/employee-tracker/document/${docId}`, {
                method: 'DELETE'
            });
            const data = await res.json();
            if (data.success) {
                showToast("Document removed successfully!");
                openEditModal(empId);
                loadStaff();
            } else {
                showToast("Error: " + data.message);
            }
        } catch (err) {
            showToast("Error connecting to server!");
        }
    }

    function closeModal() {
        document.getElementById('staffModal').style.display = 'none';
    }
</script>
