<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags to Prevent Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Employee Tracker - Authentication</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        .auth-card h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #219150; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; cursor: pointer; color: #2980b9; }
        .alert { display: none; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 13px; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="auth-card">
    <div id="alertBox" class="alert"></div>
    
    <div id="loginForm">
        <h2>Employee Tracker</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUser" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" autocomplete="new-password" required>
        </div>
        <button class="btn" onclick="handleLogin()">Login</button>
        <div class="toggle-link" onclick="toggleView('signup')">New User? Sign Up Here</div>
    </div>

    <div id="signupForm" style="display: none;">
        <h2>User Signup</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="signupUser" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPass" autocomplete="new-password" required>
        </div>
        <button class="btn" style="background: #2980b9;" onclick="handleSignup()">Request Access</button>
        <div class="toggle-link" onclick="toggleView('login')">Already have an account? Login</div>
    </div>
</div>

<script>
// Clears all inputs when the page is loaded or restored from bfcache
window.addEventListener('pageshow', function(event) {
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('signupUser').value = '';
    document.getElementById('signupPass').value = '';
});

// Function to handle redirection properly with a default dashboard page
function navigateBack() {
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');
    
    if (redirectUrl) {
        window.location.replace(redirectUrl);
    } else {
        // ലോഗിൻ ആയിട്ടുണ്ടെങ്കിൽ നേരിട്ട് ഡാഷ്‌ബോർഡിലേക്ക് റീഡയറക്റ്റ് ചെയ്യുന്നു
        window.location.replace('/Employee_Tracker/Dashboard/');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('emp_token');
    if (token) {
        navigateBack();
    }
});

function toggleView(type) {
    document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = type === 'signup' ? 'block' : 'none';
    showAlert('', '');
}

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    if (!box) return;
    if (!msg) { box.style.display = 'none'; return; }
    box.className = `alert alert-${type}`;
    box.innerText = msg;
    box.style.display = 'block';
}

async function handleLogin() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;

    if (!username || !password) return showAlert('Please enter both username and password', 'error');

    try {
        const res = await fetch('/api/employee-tracker/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('emp_token', data.token);
            localStorage.setItem('emp_user', JSON.stringify(data.user));
            
            // Redirect using the new navigateBack function
            navigateBack();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (err) {
        showAlert('Server error! Please try again.', 'error');
    }
}

async function handleSignup() {
    const username = document.getElementById('signupUser').value;
    const password = document.getElementById('signupPass').value;

    if (!username || !password) return showAlert('Please enter username and password', 'error');

    try {
        const res = await fetch('/api/employee-tracker/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
            showAlert(data.message, 'success');
            setTimeout(() => toggleView('login'), 2000);
        } else {
            showAlert(data.message, 'error');
        }
    } catch (err) {
        showAlert('Server error! Please try again.', 'error');
    }
}
</script>
</body>
</html>
