<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voucher Entry - ERP Accounting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #212529; color: white; padding-top: 20px; width: 220px; flex-shrink: 0; }
    .sidebar .brand { font-size: 1rem; font-weight: 700; color: #fff; text-align: center; padding: 0 15px 15px; border-bottom: 1px solid #444; margin-bottom: 10px; }
    .sidebar a { color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 8px; padding: 10px 20px; margin: 2px 8px; border-radius: 6px; font-size: 0.9rem; }
    .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: #fff; }
    .sidebar .nav-section { color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 10px 20px 4px; margin-top: 6px; }
    .main-content { padding: 24px; flex: 1; }
    .entry-card { max-width: 820px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    /* KEY FIX: Prevent dropdowns from overlapping each other */
    .form-select { position: relative; z-index: auto; }
    .account-row .col-md-6 { position: static; }
    .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: #6c757d; margin-bottom: 6px; }
    .dr-badge { background: #fff5f5; border: 1px solid #f5c6cb; border-radius: 6px; padding: 12px; }
    .cr-badge { background: #f0fff4; border: 1px solid #c3e6cb; border-radius: 6px; padding: 12px; }
    .dr-label { color: #dc3545; font-weight: 600; }
    .cr-label { color: #198754; font-weight: 600; }
    select.form-select option { padding: 6px; }
  </style>
</head>
<body>
<div class="d-flex">

  <!-- Sidebar -->
  <div class="sidebar d-none d-md-flex flex-column">
    <div class="brand"><i class="bi bi-journal-richtext me-2"></i>ERP Accounts</div>
    <span class="nav-section">Main Menu</span>
    <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="entry.html" class="active"><i class="bi bi-journal-plus"></i> Voucher Entry</a>
    <a href="daybook.html"><i class="bi bi-journal-text"></i> Daybook</a>
    <span class="nav-section">Reports</span>
    <a href="ledgers.html"><i class="bi bi-book"></i> Chart of Accounts</a>
    <a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Financial Reports</a>
    <a href="log.html"><i class="bi bi-shield-lock"></i> Audit Logs</a>
    <span class="nav-section" id="adminSection" style="display:none;">Admin</span>
    <a href="admin.html" id="adminLink" style="display:none;"><i class="bi bi-people"></i> Manage Users</a>
  </div>

  <!-- Main -->
  <div class="flex-grow-1 d-flex flex-column">
    <nav class="navbar bg-white border-bottom px-3 py-2">
      <button class="btn btn-outline-secondary btn-sm d-md-none me-2"><i class="bi bi-list"></i></button>
      <span class="fw-bold text-muted small">Voucher Entry</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="fw-bold" id="userNameDisplay">User</span>
        <button class="btn btn-sm btn-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="entry-card">
        <h4 class="mb-4 text-primary border-bottom pb-3"><i class="bi bi-pencil-square me-2"></i>New Voucher Entry</h4>

        <div id="alertBox" class="alert d-none mb-3"></div>

        <form id="voucherForm" autocomplete="off">

          <!-- Row 1: Date & Type -->
          <div class="row g-3 mb-3">
            <div class="col-md-5">
              <label class="form-label fw-semibold">Voucher Date</label>
              <input type="date" class="form-control" id="voucherDate" required />
            </div>
            <div class="col-md-7">
              <label class="form-label fw-semibold">Voucher Type</label>
              <select class="form-select" id="voucherType" required onchange="onTypeChange()">
                <option value="Payment">Payment (Cash/Bank Out)</option>
                <option value="Receipt">Receipt (Cash/Bank In)</option>
                <option value="Journal">Journal (Non-Cash Entry)</option>
                <option value="Contra">Contra (Cash ↔ Bank)</option>
                <option value="Sales">Sales (Credit/Cash Sales)</option>
                <option value="Purchase">Purchase (Credit/Cash Purchases)</option>
              </select>
            </div>
          </div>

          <!-- Row 2: Dr & Cr Accounts — FIXED LAYOUT -->
          <div class="row g-3 mb-3 account-row">
            <div class="col-md-6">
              <div class="dr-badge">
                <div class="dr-label mb-2"><i class="bi bi-arrow-right-circle-fill me-1"></i>Debit (Dr) Account</div>
                <div class="section-label" id="drHint">Account being Debited</div>
                <select class="form-select" id="drAccount" required size="1">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="cr-badge">
                <div class="cr-label mb-2"><i class="bi bi-arrow-left-circle-fill me-1"></i>Credit (Cr) Account</div>
                <div class="section-label" id="crHint">Account being Credited</div>
                <select class="form-select" id="crAccount" required size="1">
                  <option value="">Loading...</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Row 3: Amount -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Amount (₹)</label>
            <div class="input-group">
              <span class="input-group-text">₹</span>
              <input type="number" class="form-control form-control-lg" id="amount" step="0.01" min="0.01" placeholder="0.00" required />
            </div>
          </div>

          <!-- Row 4: Narration -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Narration / Remarks</label>
            <textarea class="form-control" id="narration" rows="2" placeholder="Enter details about this transaction..." required></textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted"><i class="bi bi-info-circle me-1"></i>All entries are logged in Audit Trail</small>
            <div>
              <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">Clear</button>
              <button type="submit" class="btn btn-primary px-4" id="submitBtn">
                <i class="bi bi-check-lg me-1"></i>Save Entry
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const token = localStorage.getItem("acc_token");
  if (!token) window.location.href = "login.html";

  const userData = JSON.parse(localStorage.getItem("acc_user") || "{}");
  document.getElementById("userNameDisplay").innerText = userData.username || "User";
  if (userData.role === "Admin") {
    document.getElementById("adminSection").style.display = "";
    document.getElementById("adminLink").style.display = "";
  }

  // Ensure local timezone date is used, preventing UTC shift
  function getLocalDate() {
    const today = new Date();
    return new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
  }
  document.getElementById("voucherDate").value = getLocalDate();

  function logout() {
    localStorage.removeItem("acc_token");
    localStorage.removeItem("acc_user");
    window.location.href = "login.html";
  }

  function showAlert(message, type) {
    const alertBox = document.getElementById("alertBox");
    alertBox.className = `alert alert-${type}`;
    alertBox.innerHTML = `<i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>${message}`;
    setTimeout(() => alertBox.classList.add("d-none"), 5000);
  }

  // Voucher type changes hint text
  const hints = {
    Payment:  { dr: "Expense / Asset / Creditor", cr: "Cash / Bank account" },
    Receipt:  { dr: "Cash / Bank account", cr: "Income / Revenue / Debtor" },
    Journal:  { dr: "Account Debited", cr: "Account Credited" },
    Contra:   { dr: "Bank account (if receiving)", cr: "Cash account (if paying out)" },
    Sales:    { dr: "Debtor / Cash / Bank", cr: "Sales Account" },
    Purchase: { dr: "Purchase Account", cr: "Creditor / Cash / Bank" },
  };
  function onTypeChange() {
    const t = document.getElementById("voucherType").value;
    document.getElementById("drHint").innerText = hints[t]?.dr || "";
    document.getElementById("crHint").innerText = hints[t]?.cr || "";
  }
  onTypeChange();

  let allLedgers = [];

  async function loadLedgerDropdowns() {
    try {
      const res = await fetch("/api/oeledger/ledgers", {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      allLedgers = data.ledgers || [];

      let optionsHtml = '<option value="">-- Select Account --</option>';
      // Group by main_group for easier selection
      const groups = {};
      allLedgers.forEach(l => {
        if (!groups[l.main_group]) groups[l.main_group] = [];
        groups[l.main_group].push(l);
      });

      Object.keys(groups).sort().forEach(grp => {
        optionsHtml += `<optgroup label="${grp}">`;
        groups[grp].forEach(l => {
          optionsHtml += `<option value="${l.id}">${l.ledger_name}</option>`;
        });
        optionsHtml += `</optgroup>`;
      });

      document.getElementById("drAccount").innerHTML = optionsHtml;
      document.getElementById("crAccount").innerHTML = optionsHtml;
    } catch (err) {
      console.error(err);
    }
  }

  function resetForm() {
    document.getElementById("voucherForm").reset();
    document.getElementById("voucherDate").value = getLocalDate();
    onTypeChange();
  }

  document.getElementById("voucherForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");

    const drId = document.getElementById("drAccount").value;
    const crId = document.getElementById("crAccount").value;

    if (!drId || !crId) {
      showAlert("Please select both Debit and Credit accounts.", "danger");
      return;
    }
    if (drId === crId) {
      showAlert("Debit and Credit accounts cannot be the same.", "danger");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

    const payload = {
      voucher_date: document.getElementById("voucherDate").value,
      voucher_type: document.getElementById("voucherType").value,
      dr_account_id: drId,
      cr_account_id: crId,
      amount: parseFloat(document.getElementById("amount").value),
      narration: document.getElementById("narration").value,
    };

    try {
      const res = await fetch("/api/oeledger/vouchers/add", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.success) {
        showAlert("Voucher Entry Saved Successfully!", "success");
        resetForm();
      } else {
        showAlert(data.message || "Error saving voucher.", "danger");
      }
    } catch {
      showAlert("Server Error. Please try again.", "danger");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Save Entry';
    }
  });

  loadLedgerDropdowns();
</script>
</body>
</html>
