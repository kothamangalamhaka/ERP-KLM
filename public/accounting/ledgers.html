<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chart of Accounts - ERP Accounting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body{font-family:'Segoe UI',sans-serif;background:#f8f9fa;}
    .sidebar{min-height:100vh;background:#212529;width:220px;flex-shrink:0;padding-top:20px;}
    .sidebar .brand{font-weight:700;color:#fff;text-align:center;padding:0 15px 15px;border-bottom:1px solid #444;margin-bottom:10px;}
    .sidebar a{color:#adb5bd;text-decoration:none;display:flex;align-items:center;gap:8px;padding:10px 20px;margin:2px 8px;border-radius:6px;font-size:.9rem;}
    .sidebar a:hover,.sidebar a.active{background:#0d6efd;color:#fff;}
    .sidebar .nav-section{color:#6c757d;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:10px 20px 4px;margin-top:6px;}
    .main-content{padding:20px;flex:1;}
    .grp-badge{font-size:.72rem;padding:2px 8px;border-radius:12px;}
    .grp-Assets{background:#d1ecf1;color:#0c5460;}
    .grp-Liabilities{background:#f8d7da;color:#721c24;}
    .grp-Capital{background:#d4edda;color:#155724;}
    .grp-Revenue{background:#cce5ff;color:#004085;}
    .grp-Expenses{background:#fff3cd;color:#856404;}
    .sys-badge{font-size:.68rem;background:#e9ecef;color:#6c757d;border-radius:10px;padding:1px 6px;}
  </style>
</head>
<body>
<div class="d-flex">
  <div class="sidebar d-none d-md-flex flex-column">
    <div class="brand"><i class="bi bi-journal-richtext me-2"></i>ERP Accounts</div>
    <span class="nav-section">Main Menu</span>
    <a href="index.html"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a href="entry.html"><i class="bi bi-journal-plus"></i>Voucher Entry</a>
    <a href="daybook.html"><i class="bi bi-journal-text"></i>Daybook</a>
    <span class="nav-section">Reports</span>
    <a href="ledgers.html" class="active"><i class="bi bi-book"></i>Chart of Accounts</a>
    <a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i>Financial Reports</a>
    <a href="log.html"><i class="bi bi-shield-lock"></i>Audit Logs</a>
    <span class="nav-section" id="adminSection" style="display:none;">Admin</span>
    <a href="admin.html" id="adminLink" style="display:none;"><i class="bi bi-people"></i>Manage Users</a>
  </div>

  <div class="flex-grow-1 d-flex flex-column">
    <nav class="navbar bg-white border-bottom px-3 py-2">
      <span class="fw-bold text-muted small">Chart of Accounts</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="fw-bold" id="userNameDisplay">User</span>
        <button class="btn btn-sm btn-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h4 class="mb-0 fw-bold">Chart of Accounts</h4>
          <small class="text-muted">All ledger accounts — system + custom</small>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="bi bi-plus-lg me-1"></i>Add Ledger
        </button>
      </div>

      <!-- Filter Tabs -->
      <ul class="nav nav-pills mb-3 flex-wrap gap-1" id="filterTabs">
        <li><button class="btn btn-sm btn-dark active" onclick="filter('')">All</button></li>
        <li><button class="btn btn-sm btn-outline-info" onclick="filter('Assets')">Assets</button></li>
        <li><button class="btn btn-sm btn-outline-danger" onclick="filter('Liabilities')">Liabilities</button></li>
        <li><button class="btn btn-sm btn-outline-success" onclick="filter('Capital & Reserves')">Capital</button></li>
        <li><button class="btn btn-sm btn-outline-primary" onclick="filter('Revenue')">Revenue</button></li>
        <li><button class="btn btn-sm btn-outline-warning" onclick="filter('Expenses')">Expenses</button></li>
      </ul>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0" id="ledgerTable">
            <thead class="table-dark">
              <tr>
                <th class="ps-3" style="width:40px;">#</th>
                <th>Ledger Name</th>
                <th style="width:160px;">Main Group</th>
                <th style="width:180px;">Sub Group</th>
                <th class="text-end" style="width:100px;">Opening Bal</th>
                <th class="text-center" style="width:80px;">Flags</th>
                <th class="text-center" style="width:60px;"></th>
              </tr>
            </thead>
            <tbody id="ledgerBody">
              <tr><td colspan="7" class="text-center py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Ledger Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Add New Ledger Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addForm" autocomplete="off">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Ledger Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="lName" required placeholder="e.g. John Antony - Debtor"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Main Group <span class="text-danger">*</span></label>
              <select class="form-select" id="mGroup" required onchange="onGroupChange()">
                <option value="">Select</option>
                <option value="Assets">Assets</option>
                <option value="Liabilities">Liabilities</option>
                <option value="Capital & Reserves">Capital & Reserves</option>
                <option value="Revenue">Revenue / Income</option>
                <option value="Expenses">Expenses</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Sub Group <span class="text-danger">*</span></label>
              <select class="form-select" id="sGroup" required>
                <option value="">Select Main Group first</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Account Type</label>
              <select class="form-select" id="accType">
                <option value="general">General</option>
                <option value="debtor">Debtor</option>
                <option value="creditor">Creditor</option>
                <option value="employee">Employee (Staff)</option>
                <option value="cash">Cash Account</option>
                <option value="bank">Bank Account</option>
                <option value="gst">GST Account</option>
                <option value="salary">Salary / Payroll</option>
                <option value="capital">Capital Account</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Opening Balance (₹)</label>
              <input type="number" class="form-control" id="obAmt" value="0" step="0.01" min="0"/>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Dr / Cr</label>
              <select class="form-select" id="obType">
                <option value="Dr">Dr (Debit)</option>
                <option value="Cr">Cr (Credit)</option>
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="isEmployee"/>
                <label class="form-check-label" for="isEmployee">Mark as Staff / Employee</label>
              </div>
            </div>
          </div>
          <div id="addAlert" class="alert d-none mt-3"></div>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Ledger</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem("acc_token");
if (!token) window.location.href = "login.html";
const userData = JSON.parse(localStorage.getItem("acc_user") || "{}");
document.getElementById("userNameDisplay").innerText = userData.username || "User";
if (userData.role === "Admin") {
  document.getElementById("adminSection").style.display = "";
  document.getElementById("adminLink").style.display = "";
}
function logout() { localStorage.removeItem("acc_token"); localStorage.removeItem("acc_user"); window.location.href = "login.html"; }

const subGroupMap = {
  "Assets": ["Cash & Bank", "Current Assets", "Fixed Assets", "Loans & Advances", "GST / Tax Receivables", "Debtors", "Inventory"],
  "Liabilities": ["Current Liabilities", "Long Term Liabilities", "Creditors", "Duties & Taxes", "Loans", "Salary Outstanding"],
  "Capital & Reserves": ["Capital Accounts", "Reserves", "Drawings"],
  "Revenue": ["Direct Income", "Indirect Income", "Sales"],
  "Expenses": ["Direct Expenses", "Indirect Expenses", "Office Expenses", "Employee Expenses", "Salary & Wages"],
};

function onGroupChange() {
  const g = document.getElementById("mGroup").value;
  const sgs = subGroupMap[g] || [];
  let html = `<option value="">-- Select Sub Group --</option>`;
  sgs.forEach(sg => html += `<option value="${sg}">${sg}</option>`);
  // Custom option
  html += `<option value="__custom__">+ Type custom...</option>`;
  document.getElementById("sGroup").innerHTML = html;
  document.getElementById("sGroup").onchange = function() {
    if (this.value === "__custom__") {
      const v = prompt("Enter custom sub-group name:");
      if (v) { const o = new Option(v, v, true, true); this.add(o); }
      else this.value = "";
    }
  };
}

let allLedgers = [];
let activeFilter = "";

function filter(grp) {
  activeFilter = grp;
  document.querySelectorAll("#filterTabs button").forEach(b => {
    b.className = b.innerText.trim() === (grp || "All")
      ? b.className.replace("outline-", "").replace(" active", "") + " active"
      : b.className.replace(" active", "");
  });
  renderLedgers();
}

function renderLedgers() {
  const tbody = document.getElementById("ledgerBody");
  const data = activeFilter
    ? allLedgers.filter(l => l.main_group === activeFilter || l.main_group.startsWith(activeFilter))
    : allLedgers;

  if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No ledgers found.</td></tr>'; return; }

  // Group by main_group + sub_group for display
  let html = ""; let idx = 0;
  let lastGrp = "";
  data.forEach(l => {
    const grp = l.main_group;
    if (grp !== lastGrp) {
      html += `<tr class="table-secondary"><td colspan="7" class="ps-3 fw-bold small text-uppercase py-1" style="letter-spacing:.08em;">${grp}</td></tr>`;
      lastGrp = grp;
    }
    idx++;
    const grpKey = grp.replace(" & Reserves","").replace(" / Income","");
    const grpClass = `grp-${grpKey.split(" ")[0]}`;
    const sysTag = l.is_system ? '<span class="sys-badge">system</span>' : "";
    const empTag = l.is_employee ? '<i class="bi bi-person-badge text-info ms-1" title="Employee"></i>' : "";
    const ob = parseFloat(l.opening_balance || 0);
    const obText = ob > 0 ? `<span class="${l.opening_balance_type==='Dr'?'text-danger':'text-success'}">${ob.toFixed(2)} ${l.opening_balance_type}</span>` : '<span class="text-muted">—</span>';
    const delBtn = !l.is_system && userData.role === "Admin"
      ? `<button class="btn btn-outline-danger btn-sm p-1 lh-1" onclick="deleteLedger(${l.id},'${l.ledger_name.replace(/'/g,"\\'")}')"><i class="bi bi-trash" style="font-size:.7rem;"></i></button>` : "";

    html += `<tr>
      <td class="ps-4 text-muted small">${idx}</td>
      <td class="fw-semibold">${l.ledger_name} ${sysTag}${empTag}</td>
      <td><span class="grp-badge ${grpClass}">${l.main_group}</span></td>
      <td class="text-muted small">${l.sub_group || "—"}</td>
      <td class="text-end small">${obText}</td>
      <td class="text-center">${l.is_employee ? '<span class="badge bg-info text-dark">Staff</span>' : ""}</td>
      <td class="text-center">${delBtn}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

async function loadLedgers() {
  const res = await fetch("/api/oeledger/ledgers", { headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  if (data.success) { allLedgers = data.ledgers; renderLedgers(); }
}

async function deleteLedger(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const res = await fetch(`/api/oeledger/ledgers/delete/${id}`, {
    method: "DELETE", headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  alert(data.message);
  if (data.success) loadLedgers();
}

document.getElementById("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const alertBox = document.getElementById("addAlert");
  const payload = {
    ledger_name: document.getElementById("lName").value,
    main_group: document.getElementById("mGroup").value,
    sub_group: document.getElementById("sGroup").value,
    account_type: document.getElementById("accType").value,
    is_employee: document.getElementById("isEmployee").checked,
    opening_balance: parseFloat(document.getElementById("obAmt").value) || 0,
    opening_balance_type: document.getElementById("obType").value,
  };
  try {
    const res = await fetch("/api/oeledger/ledgers/add", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      bootstrap.Modal.getInstance(document.getElementById("addModal")).hide();
      document.getElementById("addForm").reset();
      loadLedgers();
    } else {
      alertBox.className = "alert alert-danger mt-3"; alertBox.innerText = data.message; alertBox.classList.remove("d-none");
    }
  } catch { alertBox.className = "alert alert-danger mt-3"; alertBox.innerText = "Server error."; alertBox.classList.remove("d-none"); }
});

loadLedgers();
</script>
</body>
</html>
