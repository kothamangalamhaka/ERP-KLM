<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Logs - ERP Accounting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #212529; color: white; padding-top: 20px; width: 220px; flex-shrink: 0; }
    .sidebar .brand { font-size: 1rem; font-weight: 700; color: #fff; text-align: center; padding: 0 15px 15px; border-bottom: 1px solid #444; margin-bottom: 10px; }
    .sidebar a { color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 8px; padding: 10px 20px; margin: 2px 8px; border-radius: 6px; font-size: 0.9rem; }
    .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: #fff; }
    .sidebar .nav-section { color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 10px 20px 4px; margin-top: 6px; }
    .main-content { padding: 24px; flex: 1; }
    .log-details-box { background: #f8f9fa; padding: 8px 12px; border-radius: 5px; border-left: 3px solid #6c757d; font-size: 0.82rem; }
    .log-details-box ul { margin: 0; padding-left: 16px; }
  </style>
</head>
<body>
<div class="d-flex">

  <!-- Sidebar -->
  <div class="sidebar d-none d-md-flex flex-column">
    <div class="brand"><i class="bi bi-journal-richtext me-2"></i>ERP Accounts</div>
    <span class="nav-section">Main Menu</span>
    <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="entry.html"><i class="bi bi-journal-plus"></i> Voucher Entry</a>
    <a href="daybook.html"><i class="bi bi-journal-text"></i> Daybook</a>
    <span class="nav-section">Reports</span>
    <a href="ledgers.html"><i class="bi bi-book"></i> Chart of Accounts</a>
    <a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Financial Reports</a>
    <a href="log.html" class="active"><i class="bi bi-shield-lock"></i> Audit Logs</a>
    <span class="nav-section" id="adminSection" style="display:none;">Admin</span>
    <a href="admin.html" id="adminLink" style="display:none;"><i class="bi bi-people"></i> Manage Users</a>
  </div>

  <!-- Main -->
  <div class="flex-grow-1 d-flex flex-column">
    <nav class="navbar bg-white border-bottom px-3 py-2">
      <button class="btn btn-outline-secondary btn-sm d-md-none me-2"><i class="bi bi-list"></i></button>
      <span class="fw-bold text-muted small">Audit Logs</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="fw-bold" id="userNameDisplay">User</span>
        <button class="btn btn-sm btn-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill me-2 text-danger"></i>System Audit Logs</h4>
          <small class="text-danger fw-semibold">GST Compliant Edit Log — All changes are permanently recorded</small>
        </div>
        <button class="btn btn-outline-primary btn-sm" onclick="loadLogs()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th style="width:160px;">Date & Time</th>
                  <th style="width:130px;">User</th>
                  <th style="width:150px;">Action</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="logTableBody">
                <tr><td colspan="4" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span> Loading logs...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const token = localStorage.getItem("acc_token");
  if (!token) window.location.href = "login.html";

  const userData = JSON.parse(localStorage.getItem("acc_user") || "{}");
  document.getElementById("userNameDisplay").innerText = userData.username || "User";
  if (userData.role === "Admin") {
    document.getElementById("adminSection").style.display = "";
    document.getElementById("adminLink").style.display = "";
  }

  function logout() {
    localStorage.removeItem("acc_token");
    localStorage.removeItem("acc_user");
    window.location.href = "login.html";
  }

  function formatDate(dateString) {
    return new Date(dateString).toLocaleString("en-IN", {
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function formatDetails(details) {
    if (!details || Object.keys(details).length === 0)
      return '<span class="text-muted small">No additional details.</span>';
    let items = "";
    for (const [key, value] of Object.entries(details)) {
      const displayKey = key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      let displayValue = String(value);
      if (key.includes("old") || key.includes("deleted"))
        displayValue = `<span class="text-danger text-decoration-line-through">${value}</span>`;
      else if (key.includes("new"))
        displayValue = `<span class="text-success fw-semibold">${value}</span>`;
      else if (key === "status" || key === "warning")
        displayValue = `<span class="badge bg-danger">${value}</span>`;
      items += `<li><strong>${displayKey}:</strong> ${displayValue}</li>`;
    }
    return `<div class="log-details-box"><ul>${items}</ul></div>`;
  }

  async function loadLogs() {
    const tbody = document.getElementById("logTableBody");
    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary"></span></td></tr>';

    try {
      const res = await fetch("/api/oeledger/logs", { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      tbody.innerHTML = "";

      if (data.success && data.logs.length > 0) {
        data.logs.forEach(log => {
          let badgeClass = "bg-secondary";
          let rowClass = "";
          if (log.action.includes("CREATE") || log.action.includes("ENTRY")) badgeClass = "bg-success";
          if (log.action.includes("LOGIN")) badgeClass = "bg-info text-dark";
          if (log.action.includes("UPDATE") || log.action.includes("EDIT")) { badgeClass = "bg-warning text-dark"; rowClass = "table-warning"; }
          if (log.action.includes("DELETE")) { badgeClass = "bg-danger"; rowClass = "table-danger"; }

          tbody.innerHTML += `
            <tr class="${rowClass}">
              <td class="small text-secondary fw-semibold" style="white-space:nowrap;">${formatDate(log.created_at)}</td>
              <td class="fw-bold"><i class="bi bi-person-badge me-1"></i>${log.username}</td>
              <td><span class="badge ${badgeClass} w-100 text-wrap">${log.action}</span></td>
              <td>${formatDetails(log.details)}</td>
            </tr>`;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No audit logs found.</td></tr>';
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Error loading logs from server.</td></tr>';
    }
  }

  loadLogs();
</script>
</body>
</html>
