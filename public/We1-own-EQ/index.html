<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We1 Own EQ Management</title>
    <style>
        /* Minimalist, Fast-loading Text-Editor like CSS */
        :root {
            --bg: #ffffff;
            --text-main: #24292f;
            --border: #d0d7de;
            --ribbon-bg: #f6f8fa;
            --btn-bg: #ffffff;
            --btn-border: #1b1f2426;
            --btn-hover: #0969da;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 13px;
        }

        /* Top Ribbon */
        .ribbon {
            background-color: var(--ribbon-bg);
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .ribbon-title {
            font-size: 16px;
            font-weight: 700;
            margin-right: auto; /* Pushes buttons to the right if needed, or keep them together */
            color: #0f172a;
        }

        .ribbon button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #24292f;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 1px 0 rgba(27,31,36,0.04);
        }

        .ribbon button:hover {
            border-color: var(--btn-hover);
            color: var(--btn-hover);
        }

        /* Table Container */
        .container {
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--ribbon-bg);
            font-weight: 600;
            color: #57606a;
        }
        
        tbody tr {
            background-color: #ffffff;
        }

        tbody tr:hover {
            background-color: #f3f4f6;
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #cf222e;
        }

        /* 🟢 Split Log Layout CSS */
        .split-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .log-left-form {
            flex: 1;
            background: #f6f8fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .log-right-history {
            flex: 2;
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .log-right-history table {
            width: 100%;
            border-collapse: collapse;
        }
        .log-right-history th {
            position: sticky;
            top: 0;
            background: #e5e7eb;
            z-index: 10;
            font-size: 12px;
        }
        .log-right-history td, .log-right-history th {
            padding: 6px 10px;
            font-size: 12px;
        }
        .edit-icon {
            cursor: pointer;
            color: #0969da;
            font-weight: bold;
        }

        td.sn-col {
            color: #6e7781;
            font-weight: 500;
        }

        td.plate-col {
            font-weight: 700;
            color: #000000;
        }

        a{
            text-decoration: none;
        }

        .status-running { color: #1a7f37; font-weight: 600; }
        .status-released { color: #cf222e; font-weight: 600; }
        .status-mobilizing { color: #d97706; font-weight: 600; }
    </style>
</head>
<body>

    <div class="ribbon">
        <div class="ribbon-title">We1 Own EQ Data</div>
        <button style="background: #1a7f37; color: white; border: none;" onclick="openAddModal()">➕ Add New</button>
        <button onclick="openLog('SiteLog')">🏢 Site Log</button>
        <button onclick="openLog('VehicleTypeLog')">🚜 Vehicle Type Log</button>
        <button onclick="openLog('DriverLog')">👤 Driver Log</button>
        <button onclick="openLog('OwnerLog')">📋 Owner Log</button>
        <button onclick="openLog('SanthookLog')">📦 Santhook Log</button>

        <button class="salary" style="background: #f7c111; color: white; border: none; margin-left: 10px;">
            <a href="EQ_Driver_payroll.html" style="color: rgb(5, 5, 5);">Driver Salary</a>
        </button>
        <!-- 🟢 Added id="exportBtn" -->
        <button id="exportBtn" style="background: #0969da; color: white; border: none; margin-left: 10px;" onclick="exportToExcel()">📊 Export Excel</button>
        <!-- 🟢 Logout Button -->
        <button style="background: #cf222e; color: white; border: none; margin-left: 10px;" onclick="logout()">🚪 Logout</button>
    </div>

    <!-- Popup Modal -->
    <div id="commonModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Title</span>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>
            <div id="modalBody" style="font-size: 13px;">
                <!-- Dynamic content will load here -->
            </div>
        </div>
    </div>

    <!-- 🟢 Plate Selection Modal -->
    <div id="plateSelectModal" class="modal-overlay" style="z-index: 2000;">
        <div class="modal-content" style="width: 300px;">
            <div class="modal-header">
                <span>Select Plate for Log</span>
                <button class="close-btn" onclick="document.getElementById('plateSelectModal').style.display='none'">✖</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" id="tempLogType">
                <select id="logPlateDropdown" style="padding: 8px; border: 1px solid #d0d7de; border-radius: 4px; width: 100%;">
                    <!-- Options populated via JS -->
                </select>
                <button onclick="fetchLogData()" style="padding: 8px; background: #0969da; color: white; border: none; border-radius: 4px; cursor: pointer;">Fetch Data</button>
            </div>
        </div>
    </div>

    <!-- 🟢 Split Log Master Modal -->
    <div id="splitLogModal" class="modal-overlay">
        <div class="modal-content" style="width: 900px; max-width: 95vw;">
            <div class="modal-header">
                <span id="splitLogTitle">Log Details</span>
                <button class="close-btn" onclick="document.getElementById('splitLogModal').style.display='none'">✖</button>
            </div>
            <div class="split-layout">
                <div class="log-left-form">
                    <input type="hidden" id="editLogId">
                    <input type="hidden" id="activeLogType">
                    <input type="hidden" id="activeLogPlate">
                    <div id="dynamicLogForm" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Form renders here -->
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button onclick="saveLogEntry()" style="flex: 2; padding: 8px; background: #1a7f37; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Update Log</button>
                        <button onclick="changePlate()" style="flex: 1; padding: 8px; background: #5f4b0f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-shadow: 0 1px 1px rgba(0,0,0,0.2);">Next Plate ⏭</button>
                    </div>
                </div>
                <div class="log-right-history">
                    <table>
                        <thead id="logTableHead"></thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <table id="eqTable">
            <thead>
                <tr>
                    <th>SN</th>
                    <th>Mobilisation Date</th>
                    <th>Vehicle Type</th>
                    <th>Plate No</th>
                    <th>Driver Name</th>
                    <th>Mobile</th>
                    <th>Joining Date</th>
                    <th>Site Name</th>
                    <th>Vehicle Owner</th>
                    <th>Santhook</th>
                    <th>Salary</th>
                    <th>Status</th>
                    <th style="min-width: 150px;">Note ✏️</th>
                </tr>
            </thead>
            <tbody id="eqTableBody">
                <tr>
                    <td colspan="11" style="text-align: center; padding: 20px; color: #57606a;">
                        Fetching data via Load Balancer...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
       // Format Date nicely for UI (dd-MMM-yy)
        function formatUIDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (isNaN(d)) return "-";
            
            const day = String(d.getDate()).padStart(2, '0');
            const month = d.toLocaleString('en-GB', { month: 'short' }); // Jan, Feb, etc.
            const year = String(d.getFullYear()).slice(-2); // 24, 25, 26
            
            return `${day}-${month}-${year}`;
        }

        // Clean null/undefined values
        function cleanVal(val) {
            return val === null || val === undefined ? "-" : val;
        }

        // Global variables to store unique values for suggestions
        let uniqueVehicleTypes = new Set();
        let uniqueSiteNames = new Set();
        let globalPlates = []; // 🟢 Store plates for dropdown

        // High-performance DOM rendering strategy
        async function loadTableData() {
            const tbody = document.getElementById('eqTableBody');
            
            try {
                const token = localStorage.getItem("timesheetToken"); 
                const res = await fetch('/api/we1-own-eq/data', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                if (!data.success) {
                    if (data.message && (data.message.toLowerCase().includes("session") || data.message.toLowerCase().includes("token") || data.message.toLowerCase().includes("unauthorized"))) {
                        promptForAccessCode();
                        return;
                    }
                    throw new Error(data.message);
                }

                tbody.innerHTML = ''; 
                uniqueVehicleTypes.clear();
                uniqueSiteNames.clear();
                globalPlates = [];
                
                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="12" style="text-align: center; padding: 20px;">No vehicles found. Click Add New to start.</td></tr>';
                    return;
                }

                const fragment = document.createDocumentFragment();

                data.data.forEach((row, index) => {
                    if (row.vehicle_type && row.vehicle_type.trim() !== "") uniqueVehicleTypes.add(row.vehicle_type.trim());
                    if (row.site_name && row.site_name.trim() !== "") uniqueSiteNames.add(row.site_name.trim());
                    if (row.plate_no) globalPlates.push(row.plate_no);

                    const tr = document.createElement('tr');
                    const currentStatus = cleanVal(row.status);
                    const statusClass = currentStatus === 'Running' ? 'status-running' : (currentStatus === 'Mobilizing' ? 'status-mobilizing' : 'status-released');

                    tr.innerHTML = `
                        <td class="sn-col">${index + 1}</td>
                        <td>${formatUIDate(row.mob_date)}</td>
                        <td>${cleanVal(row.vehicle_type)}</td>
                        <td class="plate-col">${cleanVal(row.plate_no)}</td>
                        <td>${cleanVal(row.driver_name)}</td>
                        <td>${cleanVal(row.driver_mobile)}</td>
                        <td>${formatUIDate(row.joining_date)}</td>
                        <td>${cleanVal(row.site_name)}</td>
                        <td>${cleanVal(row.vehicle_owner)}</td>
                        <td>${cleanVal(row.santhook)}</td>
                        <td>${cleanVal(row.salary)}</td>
                        <td class="${statusClass}">${currentStatus}</td>
                        <td ondblclick="enableNoteEdit(this)" onblur="saveNoteDirect(this, '${row.plate_no}')" data-old="${cleanVal(row.note)}" style="white-space: pre-wrap; cursor: pointer; outline: none; min-width: 150px; transition: background 0.3s;" title="Double click to edit">${cleanVal(row.note)}</td>
                    `;
                    fragment.appendChild(tr);
                });

                tbody.appendChild(fragment);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align: center; color: red;">Error fetching data: ${error.message}</td></tr>`;
            }
        }

        // Modal Handlers
        function openModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('commonModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('commonModal').style.display = 'none';
        }

        // 🟢 1. Opens Plate Selection
        function openLog(logName) {
            document.getElementById('tempLogType').value = logName;
            const drop = document.getElementById('logPlateDropdown');
            drop.innerHTML = '<option value="">Select Plate No...</option>' + [...new Set(globalPlates)].map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('plateSelectModal').style.display = 'flex';
        }

        // 🟢 2. Fetch Data & Open Split Modal
        function fetchLogData() {
            const plate = document.getElementById('logPlateDropdown').value;
            const type = document.getElementById('tempLogType').value;
            if(!plate) return alert("Please select a Plate No");
            
            document.getElementById('plateSelectModal').style.display = 'none';
            document.getElementById('splitLogTitle').innerText = `📂 ${type} - ${plate}`;
            document.getElementById('activeLogType').value = type;
            document.getElementById('activeLogPlate').value = plate;
            document.getElementById('editLogId').value = ''; // Reset ID for new entry

            renderLogForm(type);
            loadLogHistory(type, plate);
            document.getElementById('splitLogModal').style.display = 'flex';
        }

        // 🟢 3. Render Form Dynamically based on Log Type
        const logConfigs = {
            'SiteLog': [
                { id: 'f_site_name', label: 'Site Name', type: 'text' },
                { id: 'f_mob_date', label: 'Mobilisation Date', type: 'date' },
                { id: 'f_work_end_date', label: 'Work End Date', type: 'date' },
                { id: 'f_replaced_date', label: 'Replaced Date', type: 'date' }
            ],
            'DriverLog': [
                { id: 'f_driver_name', label: 'Driver Name', type: 'text' },
                { id: 'f_join_date', label: 'Joining Date', type: 'date' },
                { id: 'f_work_end_date', label: 'Work End Date', type: 'date' },
                { id: 'f_salary', label: 'Salary', type: 'number' }
            ],
            'VehicleTypeLog': [
                { id: 'f_vehicle_type', label: 'Vehicle Type', type: 'text' },
                { id: 'f_start_date', label: 'Date', type: 'date' }
            ],
            'OwnerLog': [
                { id: 'f_owner_name', label: 'Owner Name', type: 'text' },
                { id: 'f_start_date', label: 'Start Date', type: 'date' },
                { id: 'f_end_date', label: 'End Date', type: 'date' }
            ],
            'SanthookLog': [
                { id: 'f_santhook_name', label: 'Santhook Name', type: 'text' },
                { id: 'f_start_date', label: 'Start Date', type: 'date' },
                { id: 'f_end_date', label: 'End Date', type: 'date' }
            ]
        };

        function renderLogForm(type) {
            const formContainer = document.getElementById('dynamicLogForm');
            const fields = logConfigs[type];
            formContainer.innerHTML = fields.map(f => `
                <div>
                    <label style="font-weight:600; font-size:11px; display:block; margin-bottom:3px;">${f.label}</label>
                    <input type="${f.type}" id="${f.id}" style="width:100%; box-sizing:border-box; padding:6px; border:1px solid #d0d7de; border-radius:4px;">
                </div>
            `).join('');
        }

        // 🟢 4. Load History Table
        async function loadLogHistory(type, plate) {
            const tbody = document.getElementById('logTableBody');
            const thead = document.getElementById('logTableHead');
            tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
            
            let headers = [];
            if(type === 'SiteLog') headers = ['Site', 'Mob Date', 'End Date', 'Replaced', 'Status', 'Edit'];
            else if(type === 'DriverLog') headers = ['Driver Name', 'Join Date', 'End Date', 'Salary', 'Edit'];
            else if(type === 'VehicleTypeLog') headers = ['Vehicle Type', 'Date', 'Edit'];
            else if(type === 'OwnerLog') headers = ['Owner Name', 'Start Date', 'End Date', 'Edit'];
            else if(type === 'SanthookLog') headers = ['Santhook Name', 'Start Date', 'End Date', 'Edit'];

            thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            try {
                // CHANGED TO POST REQUEST TO PREVENT URL ENCODING ISSUES
                const res = await fetch(`/api/we1-own-eq/log/history`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem("timesheetToken") 
                    },
                    body: JSON.stringify({ type: type, plate: plate })
                });
                const data = await res.json();
                
                if (!data.success) throw new Error("Failed to load");
                
                if(data.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center;">No history found</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.data.map(r => {
                    let tdHtml = '';
                    if(type === 'SiteLog') {
                        let status = 'Running';
                        if(r.replaced_date) status = '<span style="color:#cf222e; font-weight:bold;">Replaced</span>';
                        else if(r.work_end_date) status = '<span style="color:#d97706; font-weight:bold;">Released</span>';
                        else status = '<span style="color:#1a7f37; font-weight:bold;">Running</span>';
                        
                        tdHtml = `<td>${r.site_name || '-'}</td><td>${formatUIDate(r.mob_date)}</td><td>${formatUIDate(r.work_end_date)}</td><td>${formatUIDate(r.replaced_date)}</td><td>${status}</td>`;
                    } else if(type === 'DriverLog') {
                        tdHtml = `<td>${r.driver_name || '-'}</td><td>${formatUIDate(r.join_date)}</td><td>${formatUIDate(r.work_end_date)}</td><td>${r.salary || '-'}</td>`;
                    } else if(type === 'VehicleTypeLog') {
                        tdHtml = `<td>${r.vehicle_type || '-'}</td><td>${formatUIDate(r.start_date)}</td>`;
                    } else if(type === 'OwnerLog') {
                        tdHtml = `<td>${r.owner_name || '-'}</td><td>${formatUIDate(r.start_date)}</td><td>${formatUIDate(r.end_date)}</td>`;
                    } else if(type === 'SanthookLog') {
                        tdHtml = `<td>${r.santhook_name || '-'}</td><td>${formatUIDate(r.start_date)}</td><td>${formatUIDate(r.end_date)}</td>`;
                    }
                    
                    // Add Edit Icon storing row data as JSON
                    const safeData = JSON.stringify(r).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    tdHtml += `<td><span class="edit-icon" onclick="editLogEntry('${safeData}')">✏️</span></td>`;
                    return `<tr>${tdHtml}</tr>`;
                }).join('');

            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; color:red;">Error fetching data</td></tr>`;
            }
        }

        // 🟢 5. Populate form for Editing
        function editLogEntry(jsonStr) {
            const data = JSON.parse(jsonStr);
            document.getElementById('editLogId').value = data.id;
            
            // Map DB columns to form inputs
            const type = document.getElementById('activeLogType').value;
            const fields = logConfigs[type];
            fields.forEach(f => {
                const dbVal = data[f.id.replace('f_', '')];
                if(f.type === 'date' && dbVal) {
                    document.getElementById(f.id).value = dbVal.split('T')[0]; // Format for date input
                } else {
                    document.getElementById(f.id).value = dbVal || '';
                }
            });
        }

        // 🟢 Change Plate / Next Button Logic (Updated with Auto-Save & Auto-Next)
        async function changePlate() {
            const currentType = document.getElementById('activeLogType').value;
            const currentPlate = document.getElementById('activeLogPlate').value;
            
            // ഫീൽഡുകളിൽ വല്ല ഡാറ്റയും എന്റർ ചെയ്തിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുന്നു
            let hasData = false;
            logConfigs[currentType].forEach(f => {
                if (document.getElementById(f.id).value.trim() !== '') {
                    hasData = true;
                }
            });

            // ഫോമിൽ ഡാറ്റ ഉണ്ടെങ്കിൽ 'Next' അമർത്തുമ്പോൾ ആദ്യം ഡാറ്റ സേവ് ചെയ്യും
            if (hasData) {
                const isSaved = await saveLogEntry(true);
                if (!isSaved) return; // സേവിങ്ങിൽ പ്രശ്നം ഉണ്ടെങ്കിൽ അടുത്തതിലേക്ക് പോകില്ല
            }

            // ഡ്രോപ്പ്-ഡൗണിലെ ലിസ്റ്റിൽ നിന്നും അടുത്ത പ്ലേറ്റ് കണ്ടുപിടിക്കുന്നു
            const uniquePlates = [...new Set(globalPlates)];
            const currentIndex = uniquePlates.indexOf(currentPlate);
            let nextIndex = currentIndex + 1;
            
            // ലിസ്റ്റ് തീർന്നാൽ വീണ്ടും ഒന്നാമത്തെ വണ്ടിയിലേക്ക് തന്നെ പോകും
            if (nextIndex >= uniquePlates.length) {
                nextIndex = 0; 
            }

            const nextPlate = uniquePlates[nextIndex];
            
            // പുതിയ പ്ലേറ്റ് ഡീറ്റെയിൽസ് UI-ൽ സെറ്റ് ചെയ്ത് ഹിസ്റ്ററി ലോഡ് ചെയ്യുന്നു
            document.getElementById('activeLogPlate').value = nextPlate;
            document.getElementById('splitLogTitle').innerText = `📂 ${currentType} - ${nextPlate}`;
            document.getElementById('editLogId').value = ''; // Reset ID
            
            renderLogForm(currentType); 
            loadLogHistory(currentType, nextPlate); 
        }

        // 🟢 6. Save or Update Log
        async function saveLogEntry(isAutoSave = false) {
            const type = document.getElementById('activeLogType').value;
            const plate = document.getElementById('activeLogPlate').value;
            const id = document.getElementById('editLogId').value;

            const payload = { type, plate_no: plate, id: id || null, data: {} };
            logConfigs[type].forEach(f => {
                const val = document.getElementById(f.id).value.trim();
                payload.data[f.id.replace('f_', '')] = val === "" ? null : val;
            });

            try {
                const res = await fetch('/api/we1-own-eq/log/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem("timesheetToken") },
                    body: JSON.stringify(payload)
                });
                const responseData = await res.json();
                
                if (responseData.success) {
                    document.getElementById('editLogId').value = ''; // Reset
                    
                    // Auto-save വഴി അല്ലാതെ നേരിട്ട് 'Update Log' അമർത്തിയാൽ മാത്രം ഫോം ക്ലിയർ ചെയ്യുക
                    if (!isAutoSave) {
                        renderLogForm(type);
                        loadLogHistory(type, plate);
                    }
                    loadTableData(); // മെയിൻ ടേബിൾ അപ്ഡേറ്റ് ആകാൻ
                    return true;
                } else {
                    alert("Error: " + responseData.message);
                    return false;
                }
            } catch(e) {
                alert("Network Error");
                return false;
            }
        }

        // Save new vehicle to database with all fields
        async function saveNewVehicle() {
            const plate_no = document.getElementById('newPlateNo').value.trim();
            if (!plate_no) {
                alert("Please enter a Plate Number.");
                return;
            }

            const payload = {
                plate_no: plate_no,
                mob_date: document.getElementById('newMobDate').value,
                vehicle_type: document.getElementById('newVType').value.trim(),
                driver_name: document.getElementById('newDriver').value.trim(),
                driver_mobile: document.getElementById('newDriverMob').value.trim(),
                joining_date: document.getElementById('newJoinDate').value,
                site_name: document.getElementById('newSite').value.trim(),
                vehicle_owner: document.getElementById('newOwner').value.trim(),
                santhook: document.getElementById('newSanthook').value,
                salary: document.getElementById('newSalary').value,
                status: document.getElementById('newStatus').value
            };

            try {
                const token = localStorage.getItem("timesheetToken");
                const res = await fetch('/api/we1-own-eq/add', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    closeModal();
                    loadTableData(); // Refresh grid automatically
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Network error occurred.");
            }
        }


        // 🟢 7. Note Edit Logic (Double Click to Edit - DOM Lightweight)
        
        function enableNoteEdit(cell) {
            if (cell.innerText === '-') cell.innerText = ''; // Clear default hyphen
            
            // Enable editing on double click
            cell.setAttribute('contenteditable', 'plaintext-only');
            cell.style.background = '#eff6ff';
            cell.style.cursor = 'text';
            cell.focus();
            
            // Move cursor to the end of the text
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(cell);
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        async function saveNoteDirect(cell, plateNo) {
            cell.setAttribute('contenteditable', 'false'); // Disable editing
            cell.style.background = 'transparent'; // Remove focus background
            cell.style.cursor = 'pointer';
            
            let newNote = cell.innerText.trim();
            if (newNote === '-') newNote = '';
            
            let oldNote = cell.getAttribute('data-old');
            if (oldNote === '-') oldNote = '';

            // ഡാറ്റയിൽ മാറ്റമൊന്നും ഇല്ലെങ്കിൽ വെറുതെ API കാൾ പോകുന്നത് ഒഴിവാക്കാൻ
            if (newNote === oldNote) {
                if (newNote === '') cell.innerText = '-';
                return;
            }

            cell.style.backgroundColor = '#fff3cd'; // Yellow (Saving state)

            try {
                const token = localStorage.getItem("timesheetToken");
                const res = await fetch('/api/we1-own-eq/update-note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ plate_no: plateNo, note: newNote })
                });
                const data = await res.json();
                
                if(data.success) {
                    cell.style.backgroundColor = '#d1e7dd'; // Green (Success state)
                    cell.setAttribute('data-old', newNote || '-');
                    if (newNote === '') cell.innerText = '-';
                    setTimeout(() => cell.style.backgroundColor = 'transparent', 1000);
                } else {
                    alert("Error saving note: " + data.message);
                    cell.style.backgroundColor = '#f8d7da'; // Red (Error state)
                    cell.innerText = oldNote || '-'; // Revert to old text
                }
            } catch(e) {
                alert("Network error while saving note");
                cell.style.backgroundColor = '#f8d7da'; // Red (Error state)
                cell.innerText = oldNote || '-'; // Revert to old text
            }
        }

        // 🟢 8. Export to Excel Logic (Routed to Python Backend)
        async function exportToExcel() {
            const btn = document.getElementById('exportBtn');
            const originalText = btn.innerHTML;
            
            // ⏳ Show Loading Animation
            btn.innerHTML = '⏳ Exporting...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const token = localStorage.getItem("timesheetToken"); 
                // 🟢 പൈത്തൺ പ്രോക്സി പോർട്ട് (8001) ലേക്ക് കോൾ പോകുന്നു
                const res = await fetch('/py/api/we1-own-eq/export', {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) throw new Error("Failed to generate Excel file from server.");

                // ഡൗൺലോഡ് ചെയ്യാനുള്ള ലോജിക്
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `We1_Own_EQ_Report_${new Date().toISOString().split('T')[0]}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
            } catch (e) {
                alert("Failed to export: " + e.message);
            } finally {
                // Restore button state
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        // 🟢 9. External User Access Logic
        function promptForAccessCode() {
            let formHtml = `
                <div style="display: flex; flex-direction: column; gap: 12px; padding: 5px;">
                    <p style="margin: 0; color: #57606a; font-size: 13px;">You need an access code to view and edit this database.</p>
                    <input type="password" id="accessCodeInput" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d0d7de; border-radius: 4px;" placeholder="Enter Security Code">
                    <button onclick="verifyAccessCode()" style="padding: 10px; background: #0969da; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Verify & Access</button>
                </div>
            `;
            openModal('🔒 Security Verification', formHtml);
            
            // Enter key support
            setTimeout(() => {
                const input = document.getElementById('accessCodeInput');
                if (input) {
                    input.focus();
                    input.addEventListener("keypress", function(event) {
                        if (event.key === "Enter") verifyAccessCode();
                    });
                }
            }, 100);
        }

        async function verifyAccessCode() {
            const codeInput = document.getElementById('accessCodeInput').value;
            if (!codeInput) return alert("Please enter the access code.");

            try {
                const res = await fetch('/api/we1-own-eq/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });
                const data = await res.json();
                
                if (data.success) {
                    // 🟢 ടോക്കൺ സേവ് ചെയ്ത ശേഷം ഡാറ്റ വീണ്ടും ലോഡ് ചെയ്യുന്നു
                    localStorage.setItem("timesheetToken", data.token);
                    closeModal();
                    loadTableData(); 
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Network error. Please try again.");
            }
        }

        // 🟢 10. Logout & Inactivity Auto-Logout Logic
        function logout() {
            localStorage.removeItem("timesheetToken"); // ടോക്കൺ ഡിലീറ്റ് ചെയ്യുന്നു
            window.location.reload(); // പേജ് റീലോഡ് ചെയ്യുന്നു (അപ്പോൾ വീണ്ടും പാസ്‌വേഡ് ചോദിക്കും)
        }

        let inactivityTimer;
        const INACTIVITY_LIMIT = 120 * 60 * 1000; // 2 Hour in milliseconds

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                alert("Session expired due to 2 hours of inactivity. Please login again.");
                logout();
            }, INACTIVITY_LIMIT);
        }

        // യൂസർ മൗസ് അനക്കുകയോ, ടൈപ്പ് ചെയ്യുകയോ, സ്ക്രോൾ ചെയ്യുകയോ ചെയ്താൽ ടൈമർ റീസെറ്റ് ആകും
        ['mousemove', 'mousedown', 'keypress', 'touchmove', 'scroll'].forEach(evt => 
            document.addEventListener(evt, resetInactivityTimer, true)
        );

        // പേജ് ലോഡ് ആകുമ്പോൾ തന്നെ ടൈമർ സ്റ്റാർട്ട് ചെയ്യുന്നു
        resetInactivityTimer();

        // Initialize table on load
        document.addEventListener('DOMContentLoaded', loadTableData);
    </script>
