<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We1 Own EQ Management</title>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #24292f;
            --border: #d0d7de;
            --ribbon-bg: #f6f8fa;
            --btn-bg: #ffffff;
            --btn-border: #1b1f2426;
            --btn-hover: #0969da;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 13px;
        }

        /* Top Ribbon */
        .ribbon {
            background-color: var(--ribbon-bg);
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .ribbon-title {
            font-size: 16px;
            font-weight: 700;
            margin-right: auto;
            color: #0f172a;
        }

        .ribbon button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #24292f;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 1px 0 rgba(27,31,36,0.04);
        }

        .ribbon button:hover {
            border-color: var(--btn-hover);
            color: var(--btn-hover);
        }

        /* Table Container */
        .container {
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--ribbon-bg);
            font-weight: 600;
            color: #57606a;
            position: relative;
            user-select: none;
        }

        .th-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .filter-btn {
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 11px;
            color: #57606a;
            border: 1px solid transparent;
            background: transparent;
        }

        .filter-btn:hover {
            background: #e1e4e8;
            border-color: #d0d7de;
        }

        .filter-btn.active {
            color: #0969da;
            background: #ddf4ff;
            border-color: #54aeff;
            font-weight: bold;
        }
        
        tbody tr {
            background-color: #ffffff;
        }

        tbody tr:hover {
            background-color: #f3f4f6;
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #cf222e;
        }

        /* Split Log Layout CSS */
        .split-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .log-left-form {
            flex: 1;
            background: #f6f8fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .log-right-history {
            flex: 2;
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .log-right-history table {
            width: 100%;
            border-collapse: collapse;
        }
        .log-right-history th {
            position: sticky;
            top: 0;
            background: #e5e7eb;
            z-index: 10;
            font-size: 12px;
        }
        .log-right-history td, .log-right-history th {
            padding: 6px 10px;
            font-size: 12px;
        }
        .edit-icon {
            cursor: pointer;
            color: #0969da;
            font-weight: bold;
        }

        td.sn-col {
            color: #6e7781;
            font-weight: 500;
        }

        td.plate-col {
            font-weight: 700;
            color: #000000;
        }

        a {
            text-decoration: none;
        }

        .status-running { color: #1a7f37; font-weight: 600; }
        .status-released { color: #cf222e; font-weight: 600; }
        .status-mobilizing { color: #d97706; font-weight: 600; }

        /* Excel-like Header Filter Popup */
        #excelFilterMenu {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(140,149,159,0.2);
            width: 260px;
            min-width: 220px;
            max-width: 500px;
            min-height: 280px;
            max-height: 80vh;
            z-index: 1050;
            padding: 10px;
            font-size: 12px;
            resize: both;              
            overflow: hidden;          
            box-sizing: border-box;
            display: flex;             
            flex-direction: column;
        }

        .sort-btn-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .sort-btn-group button {
            flex: 1;
            padding: 6px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .sort-btn-group button:hover {
            background: #eaeef2;
            border-color: #0969da;
            color: #0969da;
        }

        .filter-search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            margin-bottom: 8px;
            outline: none;
        }

        .filter-search-box:focus {
            border-color: #0969da;
        }

        .filter-list-container {
            flex: 1;
            min-height: 140px;
            max-height: none;
            overflow-y: auto;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 4px 6px;
            background: #fafbfc;
            margin-bottom: 10px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
            cursor: pointer;
        }

        .filter-item input {
            cursor: pointer;
        }

        .filter-actions {
            display: flex;
            gap: 6px;
        }

        .filter-actions button {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-apply { background: #0969da; color: #fff; }
        .btn-cancel { background: #e1e4e8; color: #24292f; }
    </style>
</head>
<body>

    <div class="ribbon">
        <div class="ribbon-title">We1 Own EQ Data</div>
        <button style="background: #1a7f37; color: white; border: none;" onclick="openAddModal()">➕ Add New</button>
        <button onclick="openLog('SiteLog')">🏢 Site Log</button>
        <button onclick="openLog('VehicleTypeLog')">🚜 Vehicle Type Log</button>
        <button onclick="openLog('DriverLog')">👤 Driver Log</button>
        <button onclick="openLog('OwnerLog')">📋 Owner Log</button>
        <button onclick="openLog('SanthookLog')">📦 Santhook Log</button>

        <button class="salary" style="background: #f7c111; color: white; border: none; margin-left: 10px;">
            <a href="EQ_Driver_payroll.html" style="color: rgb(5, 5, 5);">Driver Salary</a>
        </button>
        <button id="exportBtn" style="background: #0969da; color: white; border: none; margin-left: 10px;" onclick="exportToExcel()">📊 Export Excel</button>
        <button style="background: #cf222e; color: white; border: none; margin-left: 10px;" onclick="logout()">🚪 Logout</button>
    </div>

    <!-- Excel Filter Popup Floating Container -->
    <div id="excelFilterMenu">
        <div class="sort-btn-group">
            <button onclick="sortGrid('asc')">🔼 Sort A-Z</button>
            <button onclick="sortGrid('desc')">🔽 Sort Z-A</button>
        </div>
        <input type="text" id="filterSearchInput" class="filter-search-box" placeholder="Search..." oninput="onFilterSearchInput()">
        <div class="filter-list-container">
            <label class="filter-item" style="font-weight: bold; border-bottom: 1px solid #e1e4e8; padding-bottom: 4px; margin-bottom: 4px;">
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"> (Select All)
            </label>
            <div id="filterItemsList"></div>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" onclick="applyCurrentFilter()">Apply</button>
            <button class="btn-cancel" onclick="closeFilterMenu()">Cancel</button>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="commonModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Title</span>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>
            <div id="modalBody" style="font-size: 13px;"></div>
        </div>
    </div>

    <!-- Plate Selection Modal -->
    <div id="plateSelectModal" class="modal-overlay" style="z-index: 2000;">
        <div class="modal-content" style="width: 300px;">
            <div class="modal-header">
                <span>Select Plate for Log</span>
                <button class="close-btn" onclick="document.getElementById('plateSelectModal').style.display='none'">✖</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" id="tempLogType">
                <select id="logPlateDropdown" style="padding: 8px; border: 1px solid #d0d7de; border-radius: 4px; width: 100%;"></select>
                <button onclick="fetchLogData()" style="padding: 8px; background: #0969da; color: white; border: none; border-radius: 4px; cursor: pointer;">Fetch Data</button>
            </div>
        </div>
    </div>

    <!-- Split Log Master Modal -->
    <div id="splitLogModal" class="modal-overlay">
        <div class="modal-content" style="width: 900px; max-width: 95vw;">
            <div class="modal-header">
                <span id="splitLogTitle">Log Details</span>
                <button class="close-btn" onclick="document.getElementById('splitLogModal').style.display='none'">✖</button>
            </div>
            <div class="split-layout">
                <div class="log-left-form">
                    <input type="hidden" id="editLogId">
                    <input type="hidden" id="activeLogType">
                    <input type="hidden" id="activeLogPlate">
                    <div id="dynamicLogForm" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button onclick="saveLogEntry()" style="flex: 2; padding: 8px; background: #1a7f37; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Update Log</button>
                        <button onclick="changePlate()" style="flex: 1; padding: 8px; background: #5f4b0f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-shadow: 0 1px 1px rgba(0,0,0,0.2);">Next Plate ⏭</button>
                    </div>
                </div>
                <div class="log-right-history">
                    <table>
                        <thead id="logTableHead"></thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <table id="eqTable">
            <thead>
                <tr>
                    <th>SN</th>
                    <th>
                        <div class="th-content">
                            <span>Mobilisation Date</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'mob_date_ui')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Vehicle Type</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'vehicle_type')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Plate No</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'plate_no')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Driver Name</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'driver_name')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Mobile</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'driver_mobile')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Joining Date</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'joining_date_ui')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Site Name</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'site_name')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Vehicle Owner</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'vehicle_owner')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Santhook</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'santhook')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Salary</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'salary')">▼</button>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <span>Status</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'status')">▼</button>
                        </div>
                    </th>
                    <th style="min-width: 150px;">
                        <div class="th-content">
                            <span>Note ✏️</span>
                            <button class="filter-btn" onclick="openExcelFilter(event, 'note')">▼</button>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody id="eqTableBody">
                <tr>
                    <td colspan="13" style="text-align: center; padding: 20px; color: #57606a;">
                        Fetching data via Load Balancer...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function formatUIDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (isNaN(d)) return "-";
            
            const day = String(d.getDate()).padStart(2, '0');
            const month = d.toLocaleString('en-GB', { month: 'short' });
            const year = String(d.getFullYear()).slice(-2);
            
            return `${day}-${month}-${year}`;
        }

        function cleanVal(val) {
            return val === null || val === undefined ? "-" : val;
        }

        let uniqueVehicleTypes = new Set();
        let uniqueSiteNames = new Set();
        let globalPlates = [];

        // Grid Master Data & Filter States
        let masterTableData = [];
        let activeFilters = {}; // { columnKey: Set of allowed values }
        let currentFilterKey = null;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('emp_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            loadTableData();
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                const token = localStorage.getItem('emp_token');
                if (!token) {
                    window.location.replace('login.html');
                }
            }
        });

        // Close Filter popup on clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('excelFilterMenu');
            if (menu.style.display === 'block' && !menu.contains(e.target) && !e.target.classList.contains('filter-btn')) {
                closeFilterMenu();
            }
        });

        async function loadTableData() {
            const tbody = document.getElementById('eqTableBody');
            try {
                const token = localStorage.getItem("emp_token"); 
                const res = await fetch('/api/we1-own-eq/data', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                if (!data.success) {
                    if (data.message && (data.message.toLowerCase().includes("session") || data.message.toLowerCase().includes("token") || data.message.toLowerCase().includes("unauthorized"))) {
                        logout();
                        return;
                    }
                    throw new Error(data.message);
                }

                uniqueVehicleTypes.clear();
                uniqueSiteNames.clear();
                globalPlates = [];
                
                masterTableData = (data.data || []).map(row => {
                    const mob_date_ui = formatUIDate(row.mob_date);
                    const joining_date_ui = formatUIDate(row.joining_date);
                    
                    if (row.vehicle_type && row.vehicle_type.trim() !== "") uniqueVehicleTypes.add(row.vehicle_type.trim());
                    if (row.site_name && row.site_name.trim() !== "") uniqueSiteNames.add(row.site_name.trim());
                    if (row.plate_no) globalPlates.push(row.plate_no);

                    return {
                        ...row,
                        mob_date_ui,
                        joining_date_ui,
                        status: cleanVal(row.status),
                        note: cleanVal(row.note),
                        driver_mobile: cleanVal(row.driver_mobile),
                        vehicle_type: cleanVal(row.vehicle_type),
                        driver_name: cleanVal(row.driver_name),
                        site_name: cleanVal(row.site_name),
                        vehicle_owner: cleanVal(row.vehicle_owner),
                        santhook: cleanVal(row.santhook),
                        salary: cleanVal(row.salary),
                        plate_no: cleanVal(row.plate_no)
                    };
                });

                renderFilteredTable();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="13" style="text-align: center; color: red;">Error fetching data: ${error.message}</td></tr>`;
            }
        }

        function renderFilteredTable() {
            const tbody = document.getElementById('eqTableBody');
            tbody.innerHTML = '';

            let filteredRows = masterTableData.filter(row => {
                for (const key in activeFilters) {
                    const allowed = activeFilters[key];
                    const val = String(row[key] ?? '-');
                    if (allowed && !allowed.has(val)) {
                        return false;
                    }
                }
                return true;
            });

            if (filteredRows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px;">No matching records found.</td></tr>';
                return;
            }

            const fragment = document.createDocumentFragment();

            filteredRows.forEach((row, index) => {
                const tr = document.createElement('tr');
                const statusClass = row.status === 'Running' ? 'status-running' : (row.status === 'Mobilizing' ? 'status-mobilizing' : 'status-released');

                tr.innerHTML = `
                    <td class="sn-col">${index + 1}</td>
                    <td>${row.mob_date_ui}</td>
                    <td>${row.vehicle_type}</td>
                    <td class="plate-col">${row.plate_no}</td>
                    <td>${row.driver_name}</td>
                    <td>${row.driver_mobile}</td>
                    <td>${row.joining_date_ui}</td>
                    <td>${row.site_name}</td>
                    <td>${row.vehicle_owner}</td>
                    <td>${row.santhook}</td>
                    <td>${row.salary}</td>
                    <td class="${statusClass}">${row.status}</td>
                    <td ondblclick="enableNoteEdit(this)" onblur="saveNoteDirect(this, '${row.plate_no}')" data-old="${row.note}" style="white-space: pre-wrap; cursor: pointer; outline: none; min-width: 150px; transition: background 0.3s;" title="Double click to edit">${row.note}</td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }

        // Excel-like Filter Logic
        function openExcelFilter(event, columnKey) {
            event.stopPropagation();
            currentFilterKey = columnKey;
            
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const menu = document.getElementById('excelFilterMenu');
            
            menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
            menu.style.left = `${Math.min(rect.left + window.scrollX, window.innerWidth - 270)}px`;
            menu.style.display = 'flex';

            document.getElementById('filterSearchInput').value = '';
            populateFilterOptions(columnKey);
        }

        function closeFilterMenu() {
            document.getElementById('excelFilterMenu').style.display = 'none';
            currentFilterKey = null;
        }

        function populateFilterOptions(columnKey, searchTerm = '') {
            const container = document.getElementById('filterItemsList');
            container.innerHTML = '';

            const uniqueValues = [...new Set(masterTableData.map(r => String(r[columnKey] ?? '-')))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            const currentSelected = activeFilters[columnKey] || new Set(uniqueValues);

            const filteredValues = uniqueValues.filter(val => val.toLowerCase().includes(searchTerm.toLowerCase()));

            filteredValues.forEach(val => {
                const isChecked = currentSelected.has(val);
                const label = document.createElement('label');
                label.className = 'filter-item';
                label.innerHTML = `
                    <input type="checkbox" class="col-filter-check" value="${val.replace(/"/g, '&quot;')}" ${isChecked ? 'checked' : ''} onchange="onCheckboxChange()">
                    <span>${val}</span>
                `;
                container.appendChild(label);
            });

            syncSelectAllCheckbox();
        }

        function onFilterSearchInput() {
            const query = document.getElementById('filterSearchInput').value;
            if (currentFilterKey) {
                populateFilterOptions(currentFilterKey, query);
            }
        }

        function toggleSelectAll(masterCb) {
            const cbs = document.querySelectorAll('.col-filter-check');
            cbs.forEach(cb => cb.checked = masterCb.checked);
        }

        function onCheckboxChange() {
            syncSelectAllCheckbox();
        }

        function syncSelectAllCheckbox() {
            const allCbs = document.querySelectorAll('.col-filter-check');
            const checkedCbs = document.querySelectorAll('.col-filter-check:checked');
            const selectAll = document.getElementById('selectAllCheckbox');
            if (allCbs.length === 0) {
                selectAll.checked = false;
                selectAll.indeterminate = false;
            } else if (allCbs.length === checkedCbs.length) {
                selectAll.checked = true;
                selectAll.indeterminate = false;
            } else if (checkedCbs.length === 0) {
                selectAll.checked = false;
                selectAll.indeterminate = false;
            } else {
                selectAll.indeterminate = true;
            }
        }

        function applyCurrentFilter() {
            if (!currentFilterKey) return;

            const allUnique = [...new Set(masterTableData.map(r => String(r[currentFilterKey] ?? '-')))];
            const checkedBoxes = document.querySelectorAll('.col-filter-check:checked');
            const selectedSet = new Set(Array.from(checkedBoxes).map(cb => cb.value));

            if (selectedSet.size === allUnique.length) {
                delete activeFilters[currentFilterKey]; // Filter removed if all selected
            } else {
                activeFilters[currentFilterKey] = selectedSet;
            }

            // Update UI Button style if active
            const thButtons = document.querySelectorAll('.filter-btn');
            thButtons.forEach(btn => {
                const fnStr = btn.getAttribute('onclick') || '';
                if (fnStr.includes(`'${currentFilterKey}'`)) {
                    if (activeFilters[currentFilterKey]) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            renderFilteredTable();
            closeFilterMenu();
        }

        function sortGrid(direction) {
            if (!currentFilterKey) return;

            masterTableData.sort((a, b) => {
                let valA = String(a[currentFilterKey] ?? '').toLowerCase();
                let valB = String(b[currentFilterKey] ?? '').toLowerCase();

                const numA = parseFloat(valA);
                const numB = parseFloat(valB);

                if (!isNaN(numA) && !isNaN(numB)) {
                    return direction === 'asc' ? numA - numB : numB - numA;
                }

                return direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            renderFilteredTable();
            closeFilterMenu();
        }

        function renderLogForm(type) {

        async function loadLogHistory(type, plate) {
            const tbody = document.getElementById('logTableBody');
            const thead = document.getElementById('logTableHead');
            tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
            
            let headers = [];
            if(type === 'SiteLog') headers = ['Site', 'Mob Date', 'End Date', 'Replaced', 'Status', 'Edit'];
            else if(type === 'DriverLog') headers = ['Driver Name', 'Join Date', 'End Date', 'Salary', 'Edit'];
            else if(type === 'VehicleTypeLog') headers = ['Vehicle Type', 'Date', 'Edit'];
            else if(type === 'OwnerLog') headers = ['Owner Name', 'Start Date', 'End Date', 'Edit'];
            else if(type === 'SanthookLog') headers = ['Santhook Name', 'Start Date', 'End Date', 'Edit'];

            thead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            try {
                const res = await fetch(`/api/we1-own-eq/log/history`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem("emp_token") 
                    },
                    body: JSON.stringify({ type: type, plate: plate })
                });
                const data = await res.json();
                
                if (!data.success) throw new Error("Failed to load");
                
                if(data.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center;">No history found</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.data.map(r => {
                    let tdHtml = '';
                    if(type === 'SiteLog') {
                        let status = 'Running';
                        if(r.replaced_date) status = '<span style="color:#cf222e; font-weight:bold;">Replaced</span>';
                        else if(r.work_end_date) status = '<span style="color:#d97706; font-weight:bold;">Released</span>';
                        else status = '<span style="color:#1a7f37; font-weight:bold;">Running</span>';
                        
                        tdHtml = `<td>${r.site_name || '-'}</td><td>${formatUIDate(r.mob_date)}</td><td>${formatUIDate(r.work_end_date)}</td><td>${formatUIDate(r.replaced_date)}</td><td>${status}</td>`;
                    } else if(type === 'DriverLog') {
                        tdHtml = `<td>${r.driver_name || '-'}</td><td>${formatUIDate(r.join_date)}</td><td>${formatUIDate(r.work_end_date)}</td><td>${r.salary || '-'}</td>`;
                    } else if(type === 'VehicleTypeLog') {
                        tdHtml = `<td>${r.vehicle_type || '-'}</td><td>${formatUIDate(r.start_date)}</td>`;
                    } else if(type === 'OwnerLog') {
                        tdHtml = `<td>${r.owner_name || '-'}</td><td>${formatUIDate(r.start_date)}</td><td>${formatUIDate(r.end_date)}</td>`;
                    } else if(type === 'SanthookLog') {
                        tdHtml = `<td>${r.santhook_name || '-'}</td><td>${formatUIDate(r.start_date)}</td><td>${formatUIDate(r.end_date)}</td>`;
                    }
                    
                    const safeData = JSON.stringify(r).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    tdHtml += `<td><span class="edit-icon" onclick="editLogEntry('${safeData}')">✏️</span></td>`;
                    return `<tr>${tdHtml}</tr>`;
                }).join('');

            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; color:red;">Error fetching data</td></tr>`;
            }
        }

        function editLogEntry(jsonStr) {
            const data = JSON.parse(jsonStr);
            document.getElementById('editLogId').value = data.id;
            
            const type = document.getElementById('activeLogType').value;
            const fields = logConfigs[type];
            fields.forEach(f => {
                const dbVal = data[f.id.replace('f_', '')];
                if(f.type === 'date' && dbVal) {
                    document.getElementById(f.id).value = dbVal.split('T')[0];
                } else {
                    document.getElementById(f.id).value = dbVal || '';
                }
            });
        }

        async function changePlate() {
            const currentType = document.getElementById('activeLogType').value;
            const currentPlate = document.getElementById('activeLogPlate').value;
            
            let hasData = false;
            logConfigs[currentType].forEach(f => {
                if (document.getElementById(f.id).value.trim() !== '') {
                    hasData = true;
                }
            });

            if (hasData) {
                const isSaved = await saveLogEntry(true);
                if (!isSaved) return;
            }

            const uniquePlates = [...new Set(globalPlates)];
            const currentIndex = uniquePlates.indexOf(currentPlate);
            let nextIndex = currentIndex + 1;
            
            if (nextIndex >= uniquePlates.length) {
                nextIndex = 0; 
            }

            const nextPlate = uniquePlates[nextIndex];
            
            document.getElementById('activeLogPlate').value = nextPlate;
            document.getElementById('splitLogTitle').innerText = `📂 ${currentType} - ${nextPlate}`;
            document.getElementById('editLogId').value = '';
            
            renderLogForm(currentType); 
            loadLogHistory(currentType, nextPlate); 
        }

        async function saveLogEntry(isAutoSave = false) {
            const type = document.getElementById('activeLogType').value;
            const plate = document.getElementById('activeLogPlate').value;
            const id = document.getElementById('editLogId').value;

            const payload = { type, plate_no: plate, id: id || null, data: {} };
            logConfigs[type].forEach(f => {
                const val = document.getElementById(f.id).value.trim();
                payload.data[f.id.replace('f_', '')] = val === "" ? null : val;
            });

            try {
                const res = await fetch('/api/we1-own-eq/log/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem("emp_token") },
                    body: JSON.stringify(payload)
                });
                const responseData = await res.json();
                
                if (responseData.success) {
                    document.getElementById('editLogId').value = '';
                    
                    if (!isAutoSave) {
                        renderLogForm(type);
                        loadLogHistory(type, plate);
                    }
                    loadTableData();
                    return true;
                } else {
                    alert("Error: " + responseData.message);
                    return false;
                }
            } catch(e) {
                alert("Network Error");
                return false;
            }
        }

        async function saveNewVehicle() {
            const plate_no = document.getElementById('newPlateNo').value.trim();
            if (!plate_no) {
                alert("Please enter a Plate Number.");
                return;
            }

            const payload = {
                plate_no: plate_no,
                mob_date: document.getElementById('newMobDate').value,
                vehicle_type: document.getElementById('newVType').value.trim(),
                driver_name: document.getElementById('newDriver').value.trim(),
                driver_mobile: document.getElementById('newDriverMob').value.trim(),
                joining_date: document.getElementById('newJoinDate').value,
                site_name: document.getElementById('newSite').value.trim(),
                vehicle_owner: document.getElementById('newOwner').value.trim(),
                santhook: document.getElementById('newSanthook').value,
                salary: document.getElementById('newSalary').value,
                status: document.getElementById('newStatus').value
            };

            try {
                const token = localStorage.getItem("emp_token");
                const res = await fetch('/api/we1-own-eq/add', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    closeModal();
                    loadTableData();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                alert("Network error occurred.");
            }
        }

        function enableNoteEdit(cell) {
            if (cell.innerText === '-') cell.innerText = '';
            
            cell.setAttribute('contenteditable', 'plaintext-only');
            cell.style.background = '#eff6ff';
            cell.style.cursor = 'text';
            cell.focus();
            
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(cell);
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        async function saveNoteDirect(cell, plateNo) {
            cell.setAttribute('contenteditable', 'false');
            cell.style.background = 'transparent';
            cell.style.cursor = 'pointer';
            
            let newNote = cell.innerText.trim();
            if (newNote === '-') newNote = '';
            
            let oldNote = cell.getAttribute('data-old');
            if (oldNote === '-') oldNote = '';

            if (newNote === oldNote) {
                if (newNote === '') cell.innerText = '-';
                return;
            }

            cell.style.backgroundColor = '#fff3cd';

            try {
                const token = localStorage.getItem("emp_token");
                const res = await fetch('/api/we1-own-eq/update-note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ plate_no: plateNo, note: newNote })
                });
                const data = await res.json();
                
                if(data.success) {
                    cell.style.backgroundColor = '#d1e7dd';
                    cell.setAttribute('data-old', newNote || '-');
                    if (newNote === '') cell.innerText = '-';
                    setTimeout(() => cell.style.backgroundColor = 'transparent', 1000);
                } else {
                    alert("Error saving note: " + data.message);
                    cell.style.backgroundColor = '#f8d7da';
                    cell.innerText = oldNote || '-';
                }
            } catch(e) {
                alert("Network error while saving note");
                cell.style.backgroundColor = '#f8d7da';
                cell.innerText = oldNote || '-';
            }
        }

        async function exportToExcel() {
            const btn = document.getElementById('exportBtn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '⏳ Exporting...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const token = localStorage.getItem("emp_token"); 
                const res = await fetch('/py/api/we1-own-eq/export', {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) throw new Error("Failed to generate Excel file from server.");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `We1_Own_EQ_Report_${new Date().toISOString().split('T')[0]}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (e) {
                alert("Failed to export: " + e.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        function logout() {
            localStorage.removeItem("emp_token");
            localStorage.removeItem("emp_user");
            window.location.href = "login.html";
        }

        let inactivityTimer;
        const INACTIVITY_LIMIT = 120 * 60 * 1000;

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                alert("Session expired due to 2 hours of inactivity. Please login again.");
                logout();
            }, INACTIVITY_LIMIT);
        }

        ['mousemove', 'mousedown', 'keypress', 'touchmove', 'scroll'].forEach(evt => 
            document.addEventListener(evt, resetInactivityTimer, true)
        );

        resetInactivityTimer();
    </script>
