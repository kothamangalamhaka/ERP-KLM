<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annual Master Report & Zoho Sync</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 0.8rem;
      }
      .header-title {
        background: #0f172a;
        color: white;
        padding: 15px 25px;
        margin-bottom: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .table-container {
        max-height: 80vh;
        overflow: auto;
        background: #fff;
        border: 1px solid #dee2e6;
        margin: 0 15px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        min-width: max-content;
      }
      thead th {
        position: sticky;
        top: 0;
        background-color: #1e293b;
        color: #fff;
        text-align: center;
        border: 1px solid #334155;
        z-index: 10;
      }
      thead tr:nth-child(2) th {
        top: 35px;
        background-color: #334155;
        font-size: 0.75rem;
        font-weight: normal;
      }
      .sticky-col {
        position: sticky;
        background-color: #f1f5f9;
        font-weight: bold;
        z-index: 5;
        border-right: 2px solid #cbd5e1 !important;
      }
      thead th.sticky-col {
        z-index: 20;
        background-color: #0f172a;
      }
      thead tr:nth-child(2) th.sticky-col {
        top: 35px;
        z-index: 20;
        background-color: #1e293b;
      }
      td {
        border: 1px solid #e2e8f0;
        padding: 5px 8px;
        vertical-align: middle;
        text-align: center;
      }
      td input {
        width: 60px;
        font-size: 0.75rem;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 3px;
        padding: 2px;
      }
      .col-ts {
        background-color: #f0fdf4;
      }
      .col-zoho {
        background-color: #eff6ff;
      }
      .col-bill {
        background-color: #fdf2f8;
      }
      .col-rev {
        background-color: #fffbeb;
        font-weight: bold;
      }

      #syncLoader {
        display: none;
        font-weight: bold;
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="header-title d-flex justify-content-between align-items-center">
      <h5 class="m-0">
        <i class="fa-solid fa-chart-line me-2"></i> Master Annual Report & Zoho
        Integration
      </h5>
      <div class="d-flex gap-2 align-items-center">
        <span id="syncLoader"
          ><i class="fa-solid fa-spinner fa-spin me-1"></i> Syncing
          Zoho...</span
        >
        <select
          id="yearSelect"
          class="form-select form-select-sm"
          style="width: 100px"
        >
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
        </select>
        <button
          class="btn btn-primary btn-sm fw-bold"
          onclick="loadMasterData()"
        >
          <i class="fa-solid fa-cloud-arrow-down me-1"></i> Load ERP Data
        </button>
        <button class="btn btn-success btn-sm fw-bold" onclick="syncZohoData()">
          <i class="fa-solid fa-rotate me-1"></i> Auto Sync Zoho API
        </button>
        <button class="btn btn-warning btn-sm fw-bold">
          <i class="fa-solid fa-file-excel me-1"></i> Export
        </button>
      </div>
    </div>

    <div class="table-container">
      <table class="table table-hover" id="masterTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      // Full month names mapping fix
      const months = [
        { short: "Jan", full: "January", num: "01" },
        { short: "Feb", full: "February", num: "02" },
        { short: "Mar", full: "March", num: "03" },
        { short: "Apr", full: "April", num: "04" },
        { short: "May", full: "May", num: "05" },
        { short: "Jun", full: "June", num: "06" },
        { short: "Jul", full: "July", num: "07" },
        { short: "Aug", full: "August", num: "08" },
        { short: "Sep", full: "September", num: "09" },
        { short: "Oct", full: "October", num: "10" },
        { short: "Nov", full: "November", num: "11" },
        { short: "Dec", full: "December", num: "12" },
      ];

      const fixedCols = [
        { name: "SN", width: 40 },
        { name: "Start Date", width: 80 },
        { name: "Status", width: 70 },
        { name: "Last Day", width: 80 },
        { name: "Rate", width: 60 },
        { name: "Owner Name", width: 120 },
        { name: "Site Name", width: 100 },
        { name: "Project Name", width: 150 },
        { name: "Type", width: 80 },
        { name: "Driver", width: 100 },
        { name: "Plate No", width: 90 },
      ];

      let currentVehicles = []; // Store loaded vehicles for Zoho Sync

      document.addEventListener("DOMContentLoaded", generateTableStructure);

      function generateTableStructure() {
        const thead = document.getElementById("tableHead");
        let topRow = "<tr>";
        let subRow = "<tr>";
        let currentLeft = 0;

        fixedCols.forEach((col) => {
          topRow += `<th class="sticky-col" rowspan="2" style="left: ${currentLeft}px; min-width: ${col.width}px; max-width: ${col.width}px;">${col.name}</th>`;
          currentLeft += col.width;
        });

        months.forEach((m) => {
          topRow += `<th colspan="17">${m.short.toUpperCase()}</th>`;
          subRow += `
                <th>Vendor TS</th>
                <th>Pwas & Oth</th>
                <th>ERP</th>
                <th class="col-ts" title="Normal Time">TS NR</th>
                <th class="col-ts" title="Over Time">TS OT</th>
                
                <th class="col-zoho text-primary">Zoho NR</th>
                <th class="col-zoho text-primary">NR Rate</th>
                <th class="col-zoho text-primary">Zoho OT</th>
                <th class="col-zoho text-primary">OT Rate</th>
                <th class="col-zoho text-primary">Total Amount</th>
                
                <th class="col-bill text-danger">Bill NR</th>
                <th class="col-bill text-danger">NR Rate</th>
                <th class="col-bill text-danger">Bill OT</th>
                <th class="col-bill text-danger">OT Rate</th>
                <th class="col-bill text-danger">Amount</th>
                
                <th>Adjs</th>
                <th class="col-rev text-success">Gain/Loss</th>
                <th>Payment</th>
                <th>Mubarak</th>
            `;
        });

        topRow += "</tr>";
        subRow += "</tr>";
        thead.innerHTML = topRow + subRow;
      }

      async function loadMasterData() {
        const year = document.getElementById("yearSelect").value;
        const token =
          localStorage.getItem("token") ||
          localStorage.getItem("timesheetToken"); // Support both tokens

        try {
          const res = await axios.get(
            `/api/annual-report/master-data?year=${year}`,
            {
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          if (res.data.success) {
            currentVehicles = res.data.vehicles; // Save for Zoho sync
            renderTableBody(
              res.data.vehicles,
              res.data.mappings,
              res.data.timesheets,
              res.data.billings,
            );
          }
        } catch (e) {
          console.error(e);
          alert("Failed to load ERP Data");
        }
      }

      function renderTableBody(vehicles, mappings, timesheets, billings) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        vehicles.forEach((veh, index) => {
          let row = `<tr id="row-${veh.plate_no.replace(/\s+/g, "-")}">`;
          let currentLeft = 0;

          let projectName = "-";
          if (veh.site_name) {
            const match = mappings.find((m) =>
              veh.site_name
                .toLowerCase()
                .includes(m.erp_site_keyword.toLowerCase()),
            );
            if (match) projectName = match.zoho_project_name;
          }

          const rowData = [
            index + 1,
            veh.work_start_date || "-",
            veh.status || "-",
            veh.last_working_day || "-",
            veh.rate || "-",
            veh.owner_name || "-",
            veh.site_name || "-",
            projectName,
            veh.vehicle_type || "-",
            veh.driver_name || "-",
            veh.plate_no,
          ];

          rowData.forEach((data, i) => {
            row += `<td class="sticky-col text-truncate" style="left: ${currentLeft}px; min-width: ${fixedCols[i].width}px; max-width: ${fixedCols[i].width}px;" title="${data}">${data}</td>`;
            currentLeft += fixedCols[i].width;
          });

          // Map data for 12 months dynamically using bulletproof month checking
          months.forEach((mObj) => {
            // TS Matching: Check Num ("01"), Short ("Jan"), or Full ("January")
            const tsMatch = timesheets.find(
              (t) =>
                t.plate_no === veh.plate_no &&
                (t.month == mObj.num ||
                  t.month === mObj.short ||
                  t.month === mObj.full),
            );

            const tsNr =
              tsMatch && tsMatch.nr_time
                ? parseFloat(tsMatch.nr_time).toFixed(1)
                : "-";
            const tsOt =
              tsMatch && tsMatch.ot_time
                ? parseFloat(tsMatch.ot_time).toFixed(1)
                : "-";

            // Billing Matching: Check if billing_month string contains the full month name
            const billMatch = billings.find(
              (b) =>
                b.plate_no === veh.plate_no &&
                b.billing_month &&
                b.billing_month.toLowerCase().includes(mObj.full.toLowerCase()),
            );

            // Create unique IDs for Zoho cells so we can inject data later
            const safePlate = veh.plate_no.replace(/\s+/g, "-");
            const zohoIdPrefix = `zoho-${safePlate}-${mObj.short}`;

            row += `
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                    <td class="col-ts fw-bold">${tsNr}</td>
                    <td class="col-ts fw-bold">${tsOt}</td>
                    
                    <td class="col-zoho" id="${zohoIdPrefix}-nr">-</td>
                    <td class="col-zoho" id="${zohoIdPrefix}-nrate">-</td>
                    <td class="col-zoho" id="${zohoIdPrefix}-ot">-</td>
                    <td class="col-zoho" id="${zohoIdPrefix}-otrate">-</td>
                    <td class="col-zoho fw-bold" id="${zohoIdPrefix}-total">-</td>
                    
                    <td class="col-bill">${billMatch ? billMatch.nhr || "-" : "-"}</td>
                    <td class="col-bill">${billMatch ? billMatch.nrate || "-" : "-"}</td>
                    <td class="col-bill">${billMatch ? billMatch.othr || "-" : "-"}</td>
                    <td class="col-bill">${billMatch ? billMatch.otrate || "-" : "-"}</td>
                    <td class="col-bill fw-bold">${billMatch ? billMatch.total || "-" : "-"}</td>
                    
                    <td><input type="number"></td>
                    <td class="col-rev">-</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                `;
          });

          row += "</tr>";
          tbody.innerHTML += row;
        });
      }

      // ==========================================
      // AUTOMATION: ZOHO API SYNC LOGIC
      // ==========================================
      async function syncZohoData() {
        if (currentVehicles.length === 0)
          return alert("Please Load ERP Data first!");

        const token =
          localStorage.getItem("token") ||
          localStorage.getItem("timesheetToken");
        document.getElementById("syncLoader").style.display = "inline-block";

        // Loop through all loaded vehicles and call Zoho API
        for (let veh of currentVehicles) {
          try {
            const res = await axios.post(
              "/api/zoho/test-fetch",
              {
                plate_no: veh.plate_no,
                full_site_name: veh.site_name || "Unknown",
              },
              {
                headers: { Authorization: `Bearer ${token}` },
              },
            );

            if (res.data.success && res.data.data.length > 0) {
              const invoices = res.data.data;

              invoices.forEach((inv) => {
                // 1. Get the month from invoice date (e.g., "2026-05-15" -> "05")
                const invDate = new Date(inv.date);
                const invMonthNum = String(invDate.getMonth() + 1).padStart(
                  2,
                  "0",
                );
                const mObj = months.find((m) => m.num === invMonthNum);

                if (!mObj) return;

                // 2. Parse NR and OT logic (Based on item description/name checking)
                let nrHrs = 0,
                  nrRate = 0;
                let otHrs = 0,
                  otRate = 0;
                let totalAmt = inv.total || 0;

                // Assuming Zoho returns line_items. If not, the backend API might need tweaking to fetch full invoice details.
                if (inv.line_items) {
                  inv.line_items.forEach((item) => {
                    const desc = (
                      item.name +
                      " " +
                      item.description
                    ).toLowerCase();

                    // Logic: If description contains "over time", it's OT. Else it's Normal Time.
                    if (
                      desc.includes("over time") ||
                      desc.includes("miscellaneous")
                    ) {
                      otHrs += parseFloat(item.quantity || 0);
                      otRate = parseFloat(item.rate || 0);
                    } else {
                      nrHrs += parseFloat(item.quantity || 0);
                      nrRate = parseFloat(item.rate || 0);
                    }
                  });
                } else {
                  // Fallback if Zoho List API doesn't return line items
                  // You can map total amounts or default to NR if line items are missing
                  nrHrs = "Check Zoho";
                }

                // 3. Inject data into the correct table cells
                const safePlate = veh.plate_no.replace(/\s+/g, "-");
                const zohoIdPrefix = `zoho-${safePlate}-${mObj.short}`;

                try {
                  document.getElementById(`${zohoIdPrefix}-nr`).innerText =
                    nrHrs || "-";
                  document.getElementById(`${zohoIdPrefix}-nrate`).innerText =
                    nrRate || "-";
                  document.getElementById(`${zohoIdPrefix}-ot`).innerText =
                    otHrs || "-";
                  document.getElementById(`${zohoIdPrefix}-otrate`).innerText =
                    otRate || "-";
                  document.getElementById(`${zohoIdPrefix}-total`).innerText =
                    totalAmt || "-";
                } catch (err) {
                  // Ignore if cell doesn't exist
                }
              });
            }
          } catch (e) {
            console.log("Zoho Sync Error for plate:", veh.plate_no);
          }
        }

        document.getElementById("syncLoader").style.display = "none";
        alert("Zoho Sync Completed!");
      }
    </script>
  </body>
</html>
