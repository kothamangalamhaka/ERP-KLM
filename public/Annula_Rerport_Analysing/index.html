<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annual Master Report & Zoho Sync</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 0.8rem;
      }
      .header-title {
        background: #0f172a;
        color: white;
        padding: 15px 25px;
        margin-bottom: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      /* Table Container for Horizontal Scrolling */
      .table-container {
        max-height: 80vh;
        overflow: auto;
        background: #fff;
        border: 1px solid #dee2e6;
        margin: 0 15px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
      }

      table {
        border-collapse: separate;
        border-spacing: 0;
        min-width: max-content;
      }

      /* Sticky Headers */
      thead th {
        position: sticky;
        top: 0;
        background-color: #1e293b;
        color: #fff;
        text-align: center;
        border: 1px solid #334155;
        z-index: 10;
      }
      thead tr:nth-child(2) th {
        top: 35px;
        background-color: #334155;
        font-size: 0.75rem;
        font-weight: normal;
      }

      /* Sticky Left Fixed Columns (1 to 11) */
      .sticky-col {
        position: sticky;
        background-color: #f1f5f9;
        font-weight: bold;
        z-index: 5;
        border-right: 2px solid #cbd5e1 !important;
      }
      thead th.sticky-col {
        z-index: 20;
        background-color: #0f172a;
      }
      thead tr:nth-child(2) th.sticky-col {
        top: 35px;
        z-index: 20;
        background-color: #1e293b;
      }

      td {
        border: 1px solid #e2e8f0;
        padding: 5px 8px;
        vertical-align: middle;
        text-align: center;
      }
      td input {
        width: 60px;
        font-size: 0.75rem;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 3px;
        padding: 2px;
      }

      /* Highlighting Groups */
      .col-ts {
        background-color: #f0fdf4;
      }
      .col-zoho {
        background-color: #eff6ff;
      }
      .col-bill {
        background-color: #fdf2f8;
      }
      .col-rev {
        background-color: #fffbeb;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="header-title d-flex justify-content-between align-items-center">
      <h5 class="m-0">
        <i class="fa-solid fa-chart-line me-2"></i> Master Annual Report & Zoho
        Integration
      </h5>
      <div class="d-flex gap-2">
        <select
          id="yearSelect"
          class="form-select form-select-sm"
          style="width: 100px"
        >
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
        </select>
        <button
          class="btn btn-primary btn-sm fw-bold"
          onclick="loadMasterData()"
        >
          <i class="fa-solid fa-cloud-arrow-down me-1"></i> Load ERP Data
        </button>
        <button class="btn btn-success btn-sm fw-bold">
          <i class="fa-solid fa-rotate me-1"></i> Sync Zoho API
        </button>
        <button class="btn btn-warning btn-sm fw-bold">
          <i class="fa-solid fa-file-excel me-1"></i> Export
        </button>
      </div>
    </div>

    <div class="table-container">
      <table class="table table-hover" id="masterTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];

      // Width definitions for sticky columns to stack them perfectly side-by-side
      const fixedCols = [
        { name: "SN", width: 40 },
        { name: "Start Date", width: 80 },
        { name: "Status", width: 70 },
        { name: "Last Day", width: 80 },
        { name: "Rate", width: 60 },
        { name: "Owner Name", width: 120 },
        { name: "Site Name", width: 100 },
        { name: "Project Name", width: 150 },
        { name: "Type", width: 80 },
        { name: "Driver", width: 100 },
        { name: "Plate No", width: 90 },
      ];

      document.addEventListener("DOMContentLoaded", generateTableStructure);

      function generateTableStructure() {
        const thead = document.getElementById("tableHead");
        let topRow = "<tr>";
        let subRow = "<tr>";

        let currentLeft = 0;

        // Generate Fixed 11 Columns Headers
        fixedCols.forEach((col) => {
          topRow += `<th class="sticky-col" rowspan="2" style="left: ${currentLeft}px; min-width: ${col.width}px; max-width: ${col.width}px;">${col.name}</th>`;
          currentLeft += col.width;
        });

        // Generate 12 Months Columns
        months.forEach((month) => {
          // Top Row (Month Name spanning across all sub columns)
          topRow += `<th colspan="17">${month.toUpperCase()}</th>`;

          // Sub Row (a to j columns)
          subRow += `
                <th>Vendor TS Status</th>
                <th>Pwas & Others</th>
                <th>ERP</th>
                <th class="col-ts" title="Normal Time">TS NR</th>
                <th class="col-ts" title="Over Time">TS OT</th>
                
                <th class="col-zoho text-primary">Zoho NR</th>
                <th class="col-zoho text-primary">NR Rate</th>
                <th class="col-zoho text-primary">Zoho OT</th>
                <th class="col-zoho text-primary">OT Rate</th>
                <th class="col-zoho text-primary">Total Amount</th>
                
                <th class="col-bill text-danger">Bill NR</th>
                <th class="col-bill text-danger">NR Rate</th>
                <th class="col-bill text-danger">Bill OT</th>
                <th class="col-bill text-danger">OT Rate</th>
                <th class="col-bill text-danger">Amount</th>
                
                <th>Adjustments</th>
                <th class="col-rev text-success">Gain/Loss</th>
                <th>Payment</th>
                <th>Mubarak Rev</th>
            `;
        });

        topRow += "</tr>";
        subRow += "</tr>";
        thead.innerHTML = topRow + subRow;
      }

      async function loadMasterData() {
        const year = document.getElementById("yearSelect").value;
        const token = localStorage.getItem("token");
        if (!token) return alert("Please Login via Admin screen first.");

        try {
          const res = await axios.get(
            `/api/annual-report/master-data?year=${year}`,
            {
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          if (res.data.success) {
            renderTableBody(res.data.vehicles, res.data.mappings);
          }
        } catch (e) {
          console.error(e);
          alert("Failed to load ERP Data");
        }
      }

      function renderTableBody(vehicles, mappings) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        vehicles.forEach((veh, index) => {
          let row = "<tr>";
          let currentLeft = 0;

          // Map Zoho Project Name based on site keyword
          let projectName = "-";
          if (veh.site_name) {
            const match = mappings.find((m) =>
              veh.site_name.toLowerCase().includes(m.erp_site_keyword),
            );
            if (match) projectName = match.zoho_project_name;
          }

          const rowData = [
            index + 1,
            veh.work_start_date || "-",
            veh.status || "-",
            veh.last_working_day || "-",
            veh.rate || "-",
            veh.owner_name || "-",
            veh.site_name || "-",
            projectName,
            veh.vehicle_type || "-",
            veh.driver_name || "-",
            veh.plate_no,
          ];

          // Render Fixed Columns
          rowData.forEach((data, i) => {
            row += `<td class="sticky-col text-truncate" style="left: ${currentLeft}px; min-width: ${fixedCols[i].width}px; max-width: ${fixedCols[i].width}px;" title="${data}">${data}</td>`;
            currentLeft += fixedCols[i].width;
          });

          // Render Empty Inputs/Cells for 12 months (Will map actual data next)
          months.forEach((month) => {
            row += `
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                    <td class="col-ts">-</td>
                    <td class="col-ts">-</td>
                    
                    <td class="col-zoho">-</td>
                    <td class="col-zoho">-</td>
                    <td class="col-zoho">-</td>
                    <td class="col-zoho">-</td>
                    <td class="col-zoho fw-bold">-</td>
                    
                    <td class="col-bill">-</td>
                    <td class="col-bill">-</td>
                    <td class="col-bill">-</td>
                    <td class="col-bill">-</td>
                    <td class="col-bill fw-bold">-</td>
                    
                    <td><input type="number"></td>
                    <td class="col-rev">-</td>
                    <td><input type="text"></td>
                    <td><input type="text"></td>
                `;
          });

          row += "</tr>";
          tbody.innerHTML += row;
        });
      }
    </script>
  </body>
</html>
