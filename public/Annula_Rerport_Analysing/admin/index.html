<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoho Hub Integration Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", sans-serif;
      }
      .header-title {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        padding: 18px;
        border-radius: 8px;
        margin-bottom: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .nav-tabs .nav-link {
        font-weight: 600;
        color: #495057;
        border: none;
        padding: 12px 20px;
      }
      .nav-tabs .nav-link.active {
        color: #0d6efd;
        background-color: #fff;
        border-bottom: 3px solid #0d6efd;
      }
      .card {
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        border-radius: 8px;
      }
      .table th {
        background-color: #ebedf2;
        font-size: 0.88rem;
        color: #333;
      }
      .table td {
        vertical-align: middle;
        font-size: 0.85rem;
      }
      .token-hidden {
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #888;
        font-family: monospace;
      }

      /* Login Screen Styles */
      .login-wrapper {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e9ecef;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
        padding: 30px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper" id="loginScreen" style="display: none">
      <div class="login-card">
        <div class="text-center mb-4">
          <h4 class="text-primary">
            <i class="fa-solid fa-shield-halved"></i> Admin Login
          </h4>
          <p class="text-muted small">Zoho Mapping Configuration</p>
        </div>
        <form id="adminLoginForm">
          <div class="mb-3">
            <label class="small fw-bold">Username</label>
            <input
              type="text"
              class="form-control"
              id="loginUser"
              required
              placeholder="Enter ZOHO_ADMIN_USER"
            />
          </div>
          <div class="mb-3">
            <label class="small fw-bold">Password</label>
            <input
              type="password"
              class="form-control"
              id="loginPass"
              required
              placeholder="Enter ZOHO_ADMIN_PASS"
            />
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary fw-bold">
              Login Securely
            </button>
          </div>
          <div
            id="loginError"
            class="alert alert-danger small mt-3 py-2 text-center"
            style="display: none"
          ></div>
        </form>
      </div>
    </div>

    <div
      class="container-fluid py-4 px-4"
      id="mainDashboard"
      style="display: none"
    >
      <div
        class="header-title d-flex justify-content-between align-items-center"
      >
        <h4 class="m-0">
          <i class="fa-solid fa-circle-nodes me-2"></i> Zoho Hub Integration
          Panel
        </h4>
        <div>
          <button
            class="btn btn-light btn-sm fw-bold me-2"
            onclick="refreshAll()"
          >
            <i class="fa-solid fa-sync"></i> Sync Tables
          </button>
          <button class="btn btn-danger btn-sm fw-bold" onclick="logout()">
            <i class="fa-solid fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <ul class="nav nav-tabs mb-4" id="zohoTabs" role="tablist">
        <li class="nav-item">
          <button
            class="nav-link active"
            id="companies-tab"
            data-bs-toggle="tab"
            data-bs-target="#companies"
            type="button"
            role="tab"
          >
            <i class="fa-solid fa-building me-1"></i> 1. Zoho Companies Setup
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="projects-tab"
            data-bs-toggle="tab"
            data-bs-target="#projects"
            type="button"
            role="tab"
            onclick="populateCompanyDropdown()"
          >
            <i class="fa-solid fa-link me-1"></i> 2. Site & Project Linking
            Rules
          </button>
        </li>
      </ul>

      <div class="tab-content" id="zohoTabsContent">
        <div class="tab-pane fade show active" id="companies" role="tabpanel">
          <div class="row">
            <div class="col-lg-4">
              <div class="card p-3 mb-3">
                <h6 class="text-primary border-bottom pb-2 mb-3">
                  <i class="fa-solid fa-plus-circle"></i> Add / Edit Zoho
                  Profile
                </h6>
                <form id="companyForm">
                  <input type="hidden" id="companyId" />
                  <div class="mb-2">
                    <label class="small fw-bold">Company Profile Name</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="compName"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label class="small fw-bold">Zoho Organization ID</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="compOrgId"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label class="small fw-bold">Client ID</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="compClientId"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label class="small fw-bold">Client Secret</label>
                    <input
                      type="password"
                      class="form-control form-control-sm"
                      id="compSecret"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="small fw-bold">Refresh Token</label>
                    <input
                      type="password"
                      class="form-control form-control-sm"
                      id="compRefreshToken"
                      required
                    />
                  </div>
                  <div class="d-grid gap-1">
                    <button type="submit" class="btn btn-primary btn-sm">
                      <i class="fa-solid fa-save"></i> Save Profile
                    </button>
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      onclick="resetCompanyForm()"
                    >
                      Clear
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="col-lg-8">
              <div class="card p-0 table-responsive">
                <table
                  class="table table-hover table-striped mb-0"
                  id="companiesTable"
                >
                  <thead>
                    <tr>
                      <th>Profile Name</th>
                      <th>Organization ID</th>
                      <th>Client ID</th>
                      <th>Refresh Token</th>
                      <th class="text-center">Actions</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="projects" role="tabpanel">
          <div class="row">
            <div class="col-lg-4">
              <div class="card p-3 mb-3">
                <h6 class="text-primary border-bottom pb-2 mb-3">
                  <i class="fa-solid fa-link"></i> Map ERP Site to Zoho Project
                </h6>
                <form id="projectForm">
                  <input type="hidden" id="projectId" />
                  <div class="mb-2">
                    <label class="small fw-bold"
                      >Select Zoho Company Profile</label
                    >
                    <select
                      class="form-select form-select-sm"
                      id="projCompanyId"
                      required
                    >
                      <option value="">-- Choose Profile --</option>
                    </select>
                  </div>
                  <div class="mb-2">
                    <label class="small fw-bold">ERP Site Keyword</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="projKeyword"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="small fw-bold">Exact Zoho Project Name</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="projZohoName"
                      required
                    />
                  </div>
                  <div class="d-grid gap-1">
                    <button type="submit" class="btn btn-success btn-sm">
                      <i class="fa-solid fa-circle-check"></i> Bind Mapping Rule
                    </button>
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      onclick="resetProjectForm()"
                    >
                      Clear
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="col-lg-8">
              <div class="card p-0 table-responsive">
                <table
                  class="table table-hover table-striped mb-0"
                  id="projectsTable"
                >
                  <thead>
                    <tr>
                      <th>Linked Company</th>
                      <th>Zoho Org ID</th>
                      <th>ERP Site Keyword</th>
                      <th>Target Zoho Project</th>
                      <th class="text-center">Actions</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      // --- AUTHENTICATION LOGIC ---
      let token = localStorage.getItem("token");
      let axiosConfig = {};

      function checkAuth() {
        if (!token) {
          document.getElementById("loginScreen").style.display = "flex";
          document.getElementById("mainDashboard").style.display = "none";
        } else {
          axiosConfig = { headers: { Authorization: `Bearer ${token}` } };
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("mainDashboard").style.display = "block";
          loadCompanies();
          loadProjects();
        }
      }

      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const u = document.getElementById("loginUser").value;
          const p = document.getElementById("loginPass").value;
          const errDiv = document.getElementById("loginError");

          try {
            const res = await axios.post("/api/zoho/admin-login", {
              username: u,
              password: p,
            });
            if (res.data.success) {
              localStorage.setItem("token", res.data.token);
              location.reload();
            } else {
              errDiv.innerText = res.data.message;
              errDiv.style.display = "block";
            }
          } catch (err) {
            errDiv.innerText = "Server connection failed.";
            errDiv.style.display = "block";
          }
        });

      function logout() {
        localStorage.removeItem("token");
        location.reload();
      }

      // Initialize checking
      document.addEventListener("DOMContentLoaded", checkAuth);

      let cachedCompanies = [];

      function refreshAll() {
        loadCompanies();
        loadProjects();
      }

      // --- COMPANY LOGIC ---
      async function loadCompanies() {
        try {
          const res = await axios.get("/api/zoho/companies", axiosConfig);
          if (res.data.success) {
            cachedCompanies = res.data.data;
            const tbody = document.querySelector("#companiesTable tbody");
            tbody.innerHTML = "";
            cachedCompanies.forEach((c) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                        <td><strong>${c.company_name}</strong></td>
                        <td><span class="badge bg-secondary">${c.zoho_org_id}</span></td>
                        <td><div class="token-hidden" title="${c.client_id}">${c.client_id}</div></td>
                        <td><div class="token-hidden" title="${c.refresh_token}">${c.refresh_token}</div></td>
                        <td class="text-center">
                            <button class="btn btn-warning btn-sm py-0 px-2" onclick='editCompany(${JSON.stringify(c)})'><i class="fa-solid fa-edit"></i></button>
                            <button class="btn btn-danger btn-sm py-0 px-2" onclick="deleteCompany(${c.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
              tbody.appendChild(tr);
            });
            populateCompanyDropdown();
          }
        } catch (err) {
          if (err.response && err.response.status === 401) logout();
        }
      }

      document
        .getElementById("companyForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            id: document.getElementById("companyId").value || null,
            company_name: document.getElementById("compName").value,
            zoho_org_id: document.getElementById("compOrgId").value,
            client_id: document.getElementById("compClientId").value,
            client_secret: document.getElementById("compSecret").value,
            refresh_token: document.getElementById("compRefreshToken").value,
          };
          const res = await axios.post(
            "/api/zoho/company",
            payload,
            axiosConfig,
          );
          if (res.data.success) {
            alert(res.data.message);
            resetCompanyForm();
            loadCompanies();
          }
        });

      function editCompany(c) {
        document.getElementById("companyId").value = c.id;
        document.getElementById("compName").value = c.company_name;
        document.getElementById("compOrgId").value = c.zoho_org_id;
        document.getElementById("compClientId").value = c.client_id;
        document.getElementById("compSecret").value = c.client_secret;
        document.getElementById("compRefreshToken").value = c.refresh_token;
      }

      async function deleteCompany(id) {
        if (
          confirm(
            "Warning: Deleting this profile will automatically delete all linked site mappings! Proceed?",
          )
        ) {
          const res = await axios.post(
            "/api/zoho/company/delete",
            { id },
            axiosConfig,
          );
          if (res.data.success) {
            loadCompanies();
            loadProjects();
          }
        }
      }

      function resetCompanyForm() {
        document.getElementById("companyId").value = "";
        document.getElementById("companyForm").reset();
      }

      // --- PROJECT MAPPING LOGIC ---
      function populateCompanyDropdown() {
        const select = document.getElementById("projCompanyId");
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- Choose Profile --</option>';
        cachedCompanies.forEach((c) => {
          select.innerHTML += `<option value="${c.id}">${c.company_name} (${c.zoho_org_id})</option>`;
        });
        select.value = currentVal;
      }

      async function loadProjects() {
        try {
          const res = await axios.get("/api/zoho/projects", axiosConfig);
          if (res.data.success) {
            const tbody = document.querySelector("#projectsTable tbody");
            tbody.innerHTML = "";
            res.data.data.forEach((p) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                        <td><i class="fa-solid fa-building text-muted me-1"></i> ${p.company_name}</td>
                        <td><small class="text-muted">${p.zoho_org_id}</small></td>
                        <td><span class="badge bg-info text-dark font-monospace">${p.erp_site_keyword}</span></td>
                        <td><strong>${p.zoho_project_name}</strong></td>
                        <td class="text-center">
                            <button class="btn btn-warning btn-sm py-0 px-2" onclick='editProject(${JSON.stringify(p)})'><i class="fa-solid fa-edit"></i></button>
                            <button class="btn btn-danger btn-sm py-0 px-2" onclick="deleteProject(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
              tbody.appendChild(tr);
            });
          }
        } catch (err) {
          console.error(err);
        }
      }

      document
        .getElementById("projectForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            id: document.getElementById("projectId").value || null,
            company_id: document.getElementById("projCompanyId").value,
            erp_site_keyword: document.getElementById("projKeyword").value,
            zoho_project_name: document.getElementById("projZohoName").value,
          };
          const res = await axios.post(
            "/api/zoho/project",
            payload,
            axiosConfig,
          );
          if (res.data.success) {
            alert(res.data.message);
            resetProjectForm();
            loadProjects();
          }
        });

      function editProject(p) {
        document.getElementById("projectId").value = p.id;
        document.getElementById("projCompanyId").value = p.company_id;
        document.getElementById("projKeyword").value = p.erp_site_keyword;
        document.getElementById("projZohoName").value = p.zoho_project_name;
      }

      async function deleteProject(id) {
        if (
          confirm("Are you sure you want to delete this site mapping link?")
        ) {
          const res = await axios.post(
            "/api/zoho/project/delete",
            { id },
            axiosConfig,
          );
          if (res.data.success) {
            loadProjects();
          }
        }
      }

      function resetProjectForm() {
        document.getElementById("projectId").value = "";
        document.getElementById("projectForm").reset();
      }
    </script>
  </body>
</html>
