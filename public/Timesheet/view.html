<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timesheet Card Viewer - Haka ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- 🟢 ADD THIS MISSING LINE FOR PDF MERGING -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <!-- Include PDF.js for Logsheet Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: #e2e8f0;
        margin: 0;
        padding: 0;
        color: #111;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Prevent full body scroll, handle inside containers */
      }
      
      .lt a{
        text-decoration: none;
        color: white;
      }

      .lt{
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 4px;
        border: none;
      }

      .controls-wrapper {
        background: #0f2027;
        color: white;
        padding: 15px 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 100;
        flex-shrink: 0;
      }

      .controls-inner {
        max-width: 1300px;
        margin: 0 auto;
        display: flex;
        gap: 15px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .form-group label {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 5px;
        color: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input,
      select,
      textarea {
        padding: 8px 12px;
        border: 1px solid #334155;
        border-radius: 4px;
        font-family: "Inter";
        font-size: 13px;
        background: #1e293b;
        color: white;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #38bdf8;
      }

      .btn-generate,
      .btn-pdf {
        color: white;
        border: none;
        padding: 9px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        height: 35px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: opacity 0.2s;
      }

      .btn-generate {
        background-color: #2563eb;
        padding: 9px 25px;
      }
      .btn-generate:hover:not(:disabled) {
        background-color: #1d4ed8;
      }
      .btn-pdf {
        background-color: #e11d48;
      }
      .btn-pdf:hover:not(:disabled) {
        background-color: #be123c;
      }
      .btn-generate:disabled,
      .btn-pdf:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .loader {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #fff;
        border-bottom-color: transparent;
        border-radius: 50%;
        animation: rotation 1s linear infinite;
        display: none;
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #cbd5e1;
        max-height: 250px;
        overflow-y: auto;
        z-index: 1000;
        border-radius: 0 0 5px 5px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        color: #333;
        display: none;
      }

      .suggestions div.suggest-item {
        padding: 10px;
        cursor: pointer;
        font-weight: 500;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13px;
      }

      .suggestions div.suggest-item:hover,
      .suggestion-active {
        background: #eff6ff !important;
        color: #0d6efd !important;
        font-weight: 600 !important;
      }

      .multi-select-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        font-size: 13px;
        color: #000000 !important;
        font-weight: 700 !important;
        background: #fff;
      }
      .multi-select-box:hover {
        background: #f8fafc;
      }
      .multi-select-box input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        cursor: pointer;
      }

      /* 🟢 SPLIT SCREEN LAYOUT */
      #splitContainer {
        display: flex;
        flex: 1;
        overflow: hidden;
        width: 100%;
      }

      #leftCardsArea {
        flex: 1;
        overflow-y: auto;
        overflow-x: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #e2e8f0;
        padding-bottom: 50px;
      }

      #rightLogsheetArea {
        width: 0;
        display: none;
        background: #fff;
        border-left: 2px solid #cbd5e1;
        flex-direction: column;
        position: relative;
        z-index: 50;
      }

      body.split-active #rightLogsheetArea {
        width: 48%;
        min-width: 450px;
        display: flex;
      }

      .report-container {
        padding: 30px 15px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: center;
        width: max-content;
      }

      .ts-card {
        background: white;
        width: 210mm;
        min-height: 297mm;
        padding: 12mm;
        box-sizing: border-box;
        border-radius: 4px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        position: relative;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .card-dl-btn {
        position: absolute;
        bottom: 10mm;
        right: 12mm;
        background: #e2e8f0;
        color: #334155;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: background 0.2s;
      }

      .card-dl-btn:hover {
        background: #cbd5e1;
        color: #0f2027;
      }

      .btn-log-window {
        position: absolute;
        top: 10mm;
        right: 12mm;
        background: #8b5cf6;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 700;
        font-size: 11px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: background 0.2s;
        z-index: 10;
      }
      .btn-log-window:hover {
        background: #7c3aed;
      }
      body.split-active .btn-log-window {
        display: none;
      } /* Hide button when already split */

      .invoice-box {
        border: 2px dotted #333;
        border-radius: 4px;
        padding: 6px;
        text-align: center;
        font-weight: 700;
        font-size: 12px;
        margin-bottom: 10px;
        background-color: #f8fafc;
      }
      .red-border-box-bottom {
        border: 1px dashed #b91c1c;
        border-radius: 6px;
        padding: 8px;
        color: #b91c1c;
        font-weight: 600;
        font-size: 12px;
        margin-top: auto;
        margin-bottom: 5px;
      }

      .ts-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .ts-month-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #111;
        text-align: right;
      }
      .info-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 35%;
      }
      .info-row {
        display: flex;
        font-size: 12.5px;
      }
      .info-lbl {
        width: 90px;
        color: #333;
        font-weight: 700;
        flex-shrink: 0;
      }
      .info-val {
        color: #000;
        font-weight: 600;
        word-break: break-word;
      }
      .plate-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 30%;
      }
      .asset-code {
        font-weight: 800;
        font-size: 15px;
        color: #000;
        margin-bottom: 2px;
        text-align: center;
      }
      .plate-pill {
        background-color: #22c55e;
        color: white;
        padding: 4px 20px;
        border-radius: 30px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        display: inline-block;
      }

      .ts-table {
        width: 100%;
        border-collapse: collapse;
        border: 2px solid #000;
        font-size: 11px;
        margin-top: 5px;
        margin-bottom: 5px;
        table-layout: fixed;
      }
      .ts-table th,
      .ts-table td {
        border: 1px solid #000;
        padding: 4px 2px;
        text-align: center;
        vertical-align: middle;
        height: 19px;
        word-wrap: break-word;
      }
      .ts-table th {
        font-weight: 700;
        background-color: #fff;
        padding: 5px 2px;
      }
      .ts-table tr:nth-child(even) {
        background-color: #fafafa;
      }
      .ts-table td.note-col {
        text-align: left;
        padding-left: 5px;
        font-size: 10px;
        line-height: 1.1;
      }

      .ts-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        font-size: 12px;
        font-weight: 700;
      }
      .footer-left,
      .footer-right {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .footer-right {
        text-align: right;
      }
      .ts-owner-details {
        margin-top: 15px;
        font-size: 11.5px;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .co-details {
        display: flex;
        gap: 30px;
      }

      .hm,
      .tsdb {
        padding: 9px 15px;
        border-radius: 4px;
        border: none;
        transition: 0.2s;
      }

      .lt {
        background-color: #8b5cf6;
      }
      
      .hm {
        background-color: #2563eb;
      }
      .tsdb {
        background-color: #2e0a4b;
      }
      .hm a,
      .tsdb a {
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      .tsdb:hover {
        background-color: #5b21b6;
      }

      /* 🟢 MOBILE RESPONSIVE FIXES */
      @media (max-width: 768px) {
        .controls-inner {
          flex-direction: column;
          align-items: stretch;
        }
        .form-group,
        select,
        input,
        .btn-generate {
          width: 100% !important;
          box-sizing: border-box;
        }
        .btn-pdf,
        .hm,
        .tsdb {
          flex: 1;
          text-align: center;
          justify-content: center;
        }

        body.split-active #splitContainer {
          flex-direction: column;
        }
        body.split-active #rightLogsheetArea {
          width: 100%;
          min-width: 100%;
          height: 50vh;
          border-left: none;
          border-top: 2px solid #cbd5e1;
        }

        .report-container {
          padding: 15px 5px;
        }
        /* Card wrapper scrolls horizontally, card stays 210mm */
        #leftCardsArea {
          padding-bottom: 20px;
          align-items: flex-start;
        }
      }

      /* Logsheet Inline Viewer specific CSS */
      .logsheet-header-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }
      .logsheet-header-panel h3 {
        margin: 0;
        color: #0f172a;
        font-size: 14px;
      }
      .logsheet-body-panel {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .logsheet-sidebar-panel {
        width: 200px;
        border-right: 1px solid #e2e8f0;
        background: #f8fafc;
        overflow-y: auto;
        padding: 10px;
      }
      .logsheet-viewer-panel {
        flex: 1;
        background: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      .logsheet-file-item {
        padding: 8px;
        margin-bottom: 5px;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .logsheet-file-item:hover,
      .logsheet-file-item.active {
        border-color: #8b5cf6;
        background: #f3e8ff;
        color: #6d28d9;
      }

      .image-zoom-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
        position: relative;
      }
      .image-zoom-wrapper:active {
        cursor: grabbing;
      }
      .image-zoom-wrapper img {
        transform-origin: center center;
        transition: transform 0.1s ease-out;
        user-select: none;
        pointer-events: none;
      }
      .zoom-controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        background: rgba(15, 23, 42, 0.85);
        padding: 8px 25px;
        border-radius: 30px;
        z-index: 10;
      }
      .zoom-btn {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 16px;
        transition: transform 0.1s;
      }
      .zoom-btn:hover {
        color: #38bdf8;
        transform: scale(1.1);
      }

      @media print {
        body {
          background-color: white;
          overflow: visible;
          height: auto;
          display: block;
        }
        .controls-wrapper,
        .card-dl-btn,
        .btn-log-window,
        #rightLogsheetArea {
          display: none !important;
        }
        #splitContainer,
        #leftCardsArea,
        .report-container {
          display: block;
          width: 100%;
          height: auto;
          overflow: visible;
          padding: 0;
        }
        .ts-card {
          width: 210mm;
          min-height: 297mm;
          padding: 12mm;
          box-shadow: none;
          border: none;
          border-radius: 0;
          margin: 0;
          page-break-after: always;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>

  <body>
    <div class="controls-wrapper">
      <div class="controls-inner">
        <div class="form-group" style="width: 110px">
          <label>Month</label>
          <select id="selMonth">
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>
        <div class="form-group" style="width: 80px">
          <label>Year</label>
          <input type="number" id="selYear" value="2026" />
        </div>
        <div class="form-group" style="width: 140px">
          <label>Filter By</label>
          <select id="filterType" onchange="setupFilterUI()">
            <option value="All">All Vehicles</option>
            <option value="Plate No">Plate No</option>
            <option value="Owner Name">Owner Name</option>
            <option value="Asset Code">Asset Code</option>
            <option value="Site Name">Site Name</option>
            <option value="Bulk Mode">Bulk Mode</option>
          </select>
        </div>

        <div
          class="form-group"
          id="filterValGroup"
          style="display: none; width: 220px"
        >
          <label id="filterLbl">Value</label>
          <input
            type="text"
            id="filterVal"
            placeholder="Type here..."
            autocomplete="off"
            style="text-transform: uppercase"
          />
          <div id="filterSuggestions" class="suggestions"></div>
          <div
            id="multiSiteDropdown"
            class="suggestions"
            style="padding: 5px"
          ></div>
          <textarea
            id="filterBulk"
            placeholder="Plate1, Plate2..."
            style="display: none; height: 35px; resize: none"
          ></textarea>
        </div>

        <div
          class="form-group"
          id="secondarySiteGroup"
          style="display: none; width: 200px"
        >
          <label>Site Filter (Optional)</label>
          <input
            type="text"
            id="secondarySiteVal"
            placeholder="All Sites"
            readonly
            style="cursor: pointer; text-transform: uppercase"
          />
          <div
            id="secondarySiteDropdown"
            class="suggestions"
            style="padding: 5px"
          ></div>
        </div>

        <button class="btn-generate" onclick="generateReport()" id="btnGen">
          <span class="loader" id="genLoader"></span> Generate Report
        </button>

        <div
          style="margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap"
        >
          <button class="btn-pdf" onclick="downloadAllPDF()" id="btnPdf">
            <span class="loader" id="pdfLoader"></span> 📄 PDF
          </button>
          <button class="lt"><a href="LTview.html">LT View</a></button>
          <button class="hm"><a href="index.html">Home</a></button>
          <button class="tsdb"><a href="./entry.html">Data Entry</a></button>
        </div>
      </div>
    </div>

    <div id="splitContainer">
      <div id="leftCardsArea">
        <div class="report-container" id="reportArea">
          <div
            style="
              color: #64748b;
              margin-top: 50px;
              font-weight: 500;
              font-size: 16px;
              text-align: center;
            "
          >
            Select filters and click "Generate Report"
          </div>
        </div>
      </div>

      <!-- Right Logsheet Panel (Hidden by default) -->
      <div id="rightLogsheetArea">
        <div class="logsheet-header-panel">
          <h3 id="logsheetTitlePanel">Logsheet Viewer</h3>
          <div style="display: flex; gap: 8px; align-items: center">
            <button
              id="btnPanelDownloadCurrent"
              onclick="downloadPanelCurrentImage()"
              style="
                background: #e0f2fe;
                border: 1px solid #0284c7;
                border-radius: 4px;
                color: #0284c7;
                font-size: 11px;
                font-weight: bold;
                padding: 4px 8px;
                cursor: pointer;
              "
            >
              Current
            </button>
            <button
              id="btnPanelDownloadSelected"
              onclick="downloadPanelSelectedAsPdf()"
              style="
                background: #fef3c7;
                border: 1px solid #d97706;
                border-radius: 4px;
                color: #d97706;
                font-size: 11px;
                font-weight: bold;
                padding: 4px 8px;
                cursor: pointer;
              "
            >
              Selected
            </button>
            <button
              id="btnPanelDownloadPdf"
              onclick="downloadPanelAllAsPdf()"
              style="
                background: #fee2e2;
                border: 1px solid #ef4444;
                border-radius: 4px;
                color: #ef4444;
                font-size: 11px;
                font-weight: bold;
                padding: 4px 8px;
                cursor: pointer;
              "
            >
              PDF
            </button>
            <button
              style="
                background: none;
                border: none;
                font-size: 18px;
                cursor: pointer;
                color: #ef4444;
                margin-left: 5px;
              "
              onclick="closeSplitLogsheet()"
              title="Close Panel"
            >
              ✖
            </button>
          </div>
        </div>
        <div class="logsheet-body-panel">
          <div class="logsheet-sidebar-panel" id="logsheetFileListPanel"></div>
          <div class="logsheet-viewer-panel" id="logsheetViewerContainerPanel">
            <div style="text-align: center; padding: 50px; color: #64748b">
              Select a file from the list to view
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let dbVehicles = [];
      let currentFocus = -1;
      let selectedSites = [];
      let selectedSecondarySites = [];
      let specialRulesCache = [];

      const dDate = new Date();
      document.getElementById("selYear").value = dDate.getFullYear();
      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      document.getElementById("selMonth").value = months[dDate.getMonth()];

      async function loadMasterData() {
        try {
          const res = await fetch("/timesheet/api/public/vehicles");
          const data = await res.json();
          if (data.success) dbVehicles = data.data;
        } catch (e) {
          console.error("Failed to load master data", e);
        }
      }
      loadMasterData();

      async function ensureSpecialRules() {
        try {
          let token = localStorage.getItem("timesheetToken") || "";
          const srRes = await fetch("/timesheet/api/special-rules", {
            headers: { Authorization: "Bearer " + token },
          });
          if (srRes.ok) {
            const srData = await srRes.json();
            if (srData.success) specialRulesCache = srData.data;
          }
        } catch (err) {
          console.warn("Could not fetch special rules", err);
        }
      }

      function setupFilterUI() {
        const type = document.getElementById("filterType").value;
        const group = document.getElementById("filterValGroup");
        const secGroup = document.getElementById("secondarySiteGroup");
        const inp = document.getElementById("filterVal");
        const txtArea = document.getElementById("filterBulk");
        const multiSite = document.getElementById("multiSiteDropdown");
        const sugg = document.getElementById("filterSuggestions");
        const lbl = document.getElementById("filterLbl");

        sugg.style.display = "none";
        multiSite.style.display = "none";
        secGroup.style.display = "none";
        inp.value = "";
        selectedSites = [];
        selectedSecondarySites = [];
        document.getElementById("secondarySiteVal").value = "";

        if (type === "All") {
          group.style.display = "none";
        } else {
          group.style.display = "flex";
          lbl.innerText = type;
          if (type === "Bulk Mode") {
            inp.style.display = "none";
            txtArea.style.display = "block";
          } else if (type === "Site Name") {
            inp.style.display = "block";
            txtArea.style.display = "none";

            inp.readOnly = true;
            populateMultiSites();
          } else {

      }

      document
        .getElementById("filterVal")
        .addEventListener("input", function () {
          const type = document.getElementById("filterType").value;
          if (type === "Site Name") return;
          const val = this.value.toUpperCase();
          const sugg = document.getElementById("filterSuggestions");
          sugg.innerHTML = "";
          currentFocus = -1;
          if (!val) {
            sugg.style.display = "none";
            return;
          }

          let matches = [];
          if (type === "Plate No")
            matches = [...new Set(dbVehicles.map((v) => v.plate_no))];
          else if (type === "Owner Name")
            matches = [...new Set(dbVehicles.map((v) => v.owner_name))].filter(
              Boolean,
            );
          else if (type === "Asset Code")
            matches = [...new Set(dbVehicles.map((v) => v.asset_code))].filter(
              Boolean,
            );

          matches = matches.filter((m) => m && m.toUpperCase().includes(val));

          if (matches.length > 0) {
            sugg.style.display = "block";
            matches.forEach((m) => {
              let div = document.createElement("div");
              div.className = "suggest-item";
              div.innerText = m;
              div.onclick = () => {
                document.getElementById("filterVal").value = m;
                sugg.style.display = "none";
                if (type === "Owner Name") populateSecondarySites(m);
              };
              sugg.appendChild(div);
            });
          } else {
            sugg.style.display = "none";
          }
        });

      document
        .getElementById("filterVal")
        .addEventListener("keydown", function (e) {
          const type = document.getElementById("filterType").value;
          if (type === "Site Name") return;
          let sugg = document.getElementById("filterSuggestions");
          if (sugg.style.display === "none" && e.key === "Enter") {
            e.preventDefault();
            if (type === "Owner Name")
              populateSecondarySites(this.value.trim());
            generateReport();
            return;
          }
          let items = sugg.getElementsByClassName("suggest-item");
          if (e.key === "ArrowDown") {
            e.preventDefault();
            currentFocus++;
            addActive(items);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            currentFocus--;
            addActive(items);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (currentFocus > -1 && items[currentFocus])
              items[currentFocus].click();
            else {
              if (type === "Owner Name")
                populateSecondarySites(this.value.trim());
              generateReport();
            }
          }
        });

      function addActive(items) {
        if (!items) return;
        for (let i = 0; i < items.length; i++)
          items[i].classList.remove("suggestion-active");
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("suggestion-active");
        items[currentFocus].scrollIntoView({ block: "nearest" });
      }

      function updateSecondarySites() {

      document.addEventListener("click", function (e) {
        if (!document.getElementById("filterValGroup").contains(e.target)) {

      function getDaysInMonth(monthStr, year) {
        return new Date(year, months.indexOf(monthStr) + 1, 0).getDate();
      }
      function getDayName(dayNum, monthStr, year) {
        return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][
          new Date(`${monthStr} ${dayNum}, ${year}`).getDay()
        ];
      }
      function formatDate(dStr) {
        if (!dStr) return "";
        const parts = dStr.split("T")[0].split("-");
        if (parts.length !== 3) return "";
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      function parseLogDate(dStr, defaultDate) {
        if (!dStr) return defaultDate;
        let parts = dStr.split("T")[0].split("-");
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function getGapStatus(d, sLogs, dLogs) {
        let sActive = false,
          sGap = false,
          isReplaced = false,
          isBeforeStart = false,
          isAfterEnd = false,
          dActive = false,
          dGap = false;
        if (sLogs && sLogs.length > 0) {
          let ascSLogs = [...sLogs].sort(
            (a, b) =>
              parseLogDate(a.work_start_date, new Date("2000-01-01")) -
              parseLogDate(b.work_start_date, new Date("2000-01-01")),
          );
          for (let i = 0; i < ascSLogs.length; i++) {
            let st = parseLogDate(
                ascSLogs[i].work_start_date,
                new Date("2000-01-01"),
              ),
              ed = parseLogDate(
                ascSLogs[i].work_end_date,
                new Date("2099-01-01"),
              );
            if (d >= st && d <= ed) {
              sActive = true;
              break;
            }
            if (d > ed) {
              if (ascSLogs[i].status === "Replaced") isReplaced = true;
              else isReplaced = false;
            }
          }
          if (!sActive) {
            let firstStart = parseLogDate(
                ascSLogs[0].work_start_date,
                new Date("2000-01-01"),
              ),
              lastEnd = parseLogDate(
                ascSLogs[ascSLogs.length - 1].work_end_date,
                new Date("2099-01-01"),
              );
            if (d >= firstStart && d <= lastEnd) sGap = true;
            else if (d < firstStart) isBeforeStart = true;
            else if (d > lastEnd) isAfterEnd = true;
          }
        } else {
          sActive = true;
        }

        if (!sActive) {
          if (isReplaced) return "R";
          if (sGap) return "SC";
          if (isBeforeStart) return "WS";  
          if (isAfterEnd) return "Re";
          return "AB";
        }

        if (dLogs && dLogs.length > 0) {
          let ascDLogs = [...dLogs].sort(
            (a, b) =>
              parseLogDate(a.work_start_date, new Date("2000-01-01")) -
              parseLogDate(b.work_start_date, new Date("2000-01-01")),
          );
          for (let i = 0; i < ascDLogs.length; i++) {
            let st = parseLogDate(
                ascDLogs[i].work_start_date,
                new Date("2000-01-01"),
              ),
              ed = parseLogDate(
                ascDLogs[i].work_end_date,
                new Date("2099-01-01"),
              );
            if (d >= st && d <= ed) {
              dActive = true;
              break;
            }
          }
        } else {
          dActive = true;
        }

        if (!dActive) return "DC";
        return "ACTIVE";
      }

      async function generateReport() {
        const m = document.getElementById("selMonth").value;
        const y = document.getElementById("selYear").value;
        const type = document.getElementById("filterType").value;
        let val = "";

        if (type === "Bulk Mode")
          val = document.getElementById("filterBulk").value.trim();
        else if (type === "Site Name") val = selectedSites.join(",");
        else if (type !== "All")
          val = document.getElementById("filterVal").value.trim();

        if (type !== "All" && !val)
          return alert(`Please enter or select a value for ${type}`);

        document.getElementById("filterSuggestions").style.display = "none";
        document.getElementById("multiSiteDropdown").style.display = "none";
        document.getElementById("secondarySiteDropdown").style.display = "none";

        const btn = document.getElementById("btnGen");
        const loader = document.getElementById("genLoader");
        const area = document.getElementById("reportArea");

        btn.disabled = true;
        loader.style.display = "inline-block";
        area.innerHTML =
          '<div style="color: #64748b; margin-top: 50px;">Generating data from server...</div>';

        // Close split mode if open when generating new report
        if (document.body.classList.contains("split-active"))
          closeSplitLogsheet();

        try {
          await ensureSpecialRules();

          const payload = {
            month: m,
            year: y,
            filterType: type,
            filterValue: val,
          };
          const res = await fetch("/timesheet/api/public/view-report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (!data.success) throw new Error(data.message);
          if (data.vehicles.length === 0) {
            area.innerHTML =
              '<div style="color: #b91c1c; margin-top: 50px; font-weight:bold;">No vehicles found matching criteria.</div>';
            return;
          }

          let mIdx = months.indexOf(m);
          let monthStart = new Date(y, mIdx, 1);
          let monthEnd = new Date(y, mIdx + 1, 0);

          let filteredVehicles = data.vehicles;
          if (type === "Owner Name" && selectedSecondarySites.length > 0) {
            filteredVehicles = filteredVehicles.filter((v) => {
              const sLogs = data.logs.sites.filter(
                (l) => l.plate_no === v.plate_no,
              );
              let activeSites = sLogs.filter((s) => {
                let st = parseLogDate(
                    s.work_start_date,
                    new Date("2000-01-01"),
                  ),
                  ed = parseLogDate(s.work_end_date, new Date("2099-01-01"));
                return st <= monthEnd && ed >= monthStart;
              });
              let currSite = activeSites[0]
                ? activeSites[0].site_name
                : v.site_name || "N/A";
              return selectedSecondarySites.includes(currSite);
            });
          }

          if (filteredVehicles.length === 0) {
            area.innerHTML =
              '<div style="color: #b91c1c; margin-top: 50px; font-weight:bold;">No vehicles found for the selected site(s).</div>';
            return;
          }

          let allCardsHTML = "";
          filteredVehicles.forEach((v) => {
            const plate = v.plate_no;
            const vRecords = data.records.filter((r) => r.plate_no === plate);
            const dLogs = data.logs.drivers.filter((l) => l.plate_no === plate);
            const sLogs = data.logs.sites.filter((l) => l.plate_no === plate);
            allCardsHTML += buildCardHTML(v, m, y, vRecords, dLogs, sLogs);
          });

          area.innerHTML = allCardsHTML;

          // 🟢 After rendering, setup the scroll tracker
          setupScrollTracking();
        } catch (error) {
          area.innerHTML = `<div style="color: #b91c1c; margin-top: 50px; font-weight:bold;">Error: ${error.message}</div>`;
        } finally {
          btn.disabled = false;
          loader.style.display = "none";
        }
      }

      function buildCardHTML(vehicle, month, year, records, dLogs, sLogs) {
        let mIdx = months.indexOf(month);
        let monthStart = new Date(year, mIdx, 1);
        let monthEnd = new Date(year, mIdx + 1, 0);
        dLogs.sort(
          (a, b) =>
            new Date(b.work_start_date || "2000-01-01") -
            new Date(a.work_start_date || "2000-01-01"),
        );
        sLogs.sort(
          (a, b) =>
            new Date(b.work_start_date || "2000-01-01") -
            new Date(a.work_start_date || "2000-01-01"),
        );

        let activeDrivers = dLogs.filter((d) => {
          let st = parseLogDate(d.work_start_date, new Date("2000-01-01")),
            ed = parseLogDate(d.work_end_date, new Date("2099-01-01"));
          return st <= monthEnd && ed >= monthStart;
        });
        let activeSites = sLogs.filter((s) => {
          let st = parseLogDate(s.work_start_date, new Date("2000-01-01")),
            ed = parseLogDate(s.work_end_date, new Date("2099-01-01"));
          return st <= monthEnd && ed >= monthStart;
        });

        let currDriver = activeDrivers[0]
          ? activeDrivers[0].driver_name
          : vehicle.driver_name || "N/A";
        let currMobile = "";

        if (activeDrivers.length > 0) {
          let logMob =
            activeDrivers[0].driver_mobile ||
            activeDrivers[0].mobile_no ||
            activeDrivers[0].mobile;
          if (
            logMob &&
            String(logMob).trim() !== "null" &&
            String(logMob).trim() !== ""
          )
            currMobile = String(logMob).trim();
        }
        if (!currMobile) {
          let vehMob =
            vehicle.driver_mobile || vehicle.mobile_no || vehicle.mobile;
          if (
            vehMob &&
            String(vehMob).trim() !== "null" &&
            String(vehMob).trim() !== ""
          )
            currMobile = String(vehMob).trim();
        }
        if (!currMobile) currMobile = "N/A";
        let prevDriver =
          activeDrivers.length > 1 ? activeDrivers[1].driver_name : "";

        let currSite = activeSites[0]
          ? activeSites[0].site_name
          : vehicle.site_name || "N/A";
        let prevSite = activeSites.length > 1 ? activeSites[1].site_name : "";

        let bottomBoxTextArr = [];
        if (activeSites.length > 0) {
          activeSites.forEach((s) => {
            let startStr = s.work_start_date
              ? formatDate(s.work_start_date)
              : "";
            let endStr = s.work_end_date ? formatDate(s.work_end_date) : "";
            let replaceStr = s.replaced_by ? s.replaced_by : "";
            let siteStr = s.site_name || "Site";

            let line = `▶ <b style="color:#b91c1c;">${siteStr}</b> :: `;
            let details = [];
            if (startStr) details.push(`Work Start : ${startStr}`);
            if (endStr) details.push(`Work End : ${endStr}`);
            if (replaceStr && replaceStr !== "null")
              details.push(`Replaced By : ${replaceStr}`);
            if (details.length > 0) {
              line += details.join(" &nbsp;|&nbsp; ");
              bottomBoxTextArr.push(line);
            }
          });
        }
        let bottomBoxTextHTML =
          bottomBoxTextArr.length > 0
            ? bottomBoxTextArr.join("<br>")
            : "▶ Work Start: N/A";

        let dispVType = vehicle.vehicle_type || "N/A";
        let dispOName = vehicle.owner_name || "N/A";
        let dispOMob = vehicle.owner_mobile || "";
        let dispFieldCo =
          activeSites.length > 0 && activeSites[0].field_co
            ? activeSites[0].field_co
            : vehicle.field_co || "N/A";
        let dispSiteCo =
          activeSites.length > 0 && activeSites[0].site_co
            ? activeSites[0].site_co
            : vehicle.site_co || "N/A";

        let assetCodeHtml = vehicle.asset_code
          ? `<div class="asset-code">${vehicle.asset_code}</div>`
          : "";
        let invoiceInfoHtml = vehicle.invoice_info
          ? `<div class="invoice-box">${vehicle.invoice_info}</div>`
          : "";

        const daysInMonth = getDaysInMonth(month, year);
        let tableRowsHTML = "";
        let sumDist = 0,
          sumFuel = 0,
          sumNormal = 0,
          sumOT = 0;
        let siteForRule = currSite.split("&")[0].trim().toUpperCase();

        for (let i = 1; i <= daysInMonth; i++) {
          const rec = records.find((r) => parseInt(r.record_date) === i) || {};
          let dayName = getDayName(i, month, year);
          let checkDate = new Date(year, mIdx, i);
          let formattedDate = checkDate
            .toLocaleDateString("en-GB", {
              day: "2-digit",
              month: "short",
              year: "numeric",
            })
            .replace(/ /g, " ");
          let specialRule = specialRulesCache.find(
            (r) =>
              r.is_active &&
              (r.sites.includes("ALL") || r.sites.includes(siteForRule)) &&
              r.dates.includes(formattedDate),
          );

          let isFullOT = dayName === "Fri" || i === 31;
          if (specialRule && specialRule.rule_type === "FULL_OT")
            isFullOT = true;

          let timeRaw = parseFloat(rec.calc_time) || 0;
          let normalHr = 0,
            otHr = 0;
          let dist = parseFloat(rec.calc_distance) || 0;
          let fuel = parseFloat(rec.fuel) || 0;
          let bdStr = String(rec.bd || "").trim().toUpperCase();
          
          if (bdStr === "B") bdStr = "BD";
          else if (bdStr === "N") bdStr = "NW";
          else if (bdStr === "S") bdStr = "NS";
          else if (bdStr === "F") bdStr = "Fri";

          let statusCode = getGapStatus(checkDate, sLogs, dLogs);
          if (rec.wrk_start && rec.wrk_end && String(rec.wrk_start).trim() !== "" && String(rec.wrk_end).trim() !== "") {
            if (["BD", "NW", "NS", "NR", "H", "AB", "DC", "SC", "R", "WS", "RE", "FRI", "Fri"].includes(bdStr)) {
              bdStr = "";
            }
          }

          let hasData =
            timeRaw > 0 || bdStr !== "" || rec.wrk_start || rec.hmr_start;
          let noteStr = rec.remark || "";

          if (!hasData && specialRule && specialRule.rule_type !== "FULL_OT") {
            bdStr = specialRule.rule_type;
            hasData = true;
            if (!noteStr) noteStr = specialRule.reason || "";
          }

          let timeDisplay = timeRaw > 0 ? timeRaw : "";

          if (hasData) {
            if (statusCode === "AB")
              noteStr = "Absent" + (noteStr ? " - " + noteStr : "");
            else if (statusCode === "SC")
              noteStr = "Site Change" + (noteStr ? " - " + noteStr : "");
            else if (statusCode === "DC")
              noteStr = "Driver Change" + (noteStr ? " - " + noteStr : "");
            else if (statusCode === "WS")
              noteStr = "No Work Started" + (noteStr ? " - " + noteStr : "");
            else if (statusCode === "Re")
              noteStr = "Released" + (noteStr ? " - " + noteStr : "");

            if (["BD", "NW", "NS", "NR", "H", "ID", "NP", "Fri", "FRI"].includes(bdStr)) {
              timeDisplay = bdStr === "FRI" ? "Fri" : bdStr;
            }

            if (["BD", "NW", "NS", "NR", "H", "Fri", "FRI"].includes(bdStr)) {
              normalHr = 0;
              otHr = 0;
            } else if (bdStr === "ID" || bdStr === "NP") {
              if (isFullOT) {
                normalHr = 0;
                otHr = 10;
              } else {
                normalHr = 10;
                otHr = 0;
              }
            } else if (timeRaw > 0) {
              if (isFullOT) {
                otHr = timeRaw;
              } else {
                if (timeRaw > 10) {
                  normalHr = 10;
                  otHr = timeRaw - 10;
                } else {
                  normalHr = timeRaw;
                }
              }
            }
          } else {
            if (statusCode !== "ACTIVE") {
              timeDisplay = statusCode;
              normalHr = 0;
              otHr = 0;
            }
          }

          sumDist += dist;
          sumFuel += fuel;
          sumNormal += normalHr;
          sumOT += otHr;

          let isGapCode = ["AB", "SC", "DC", "WS", "Re"].includes(timeDisplay);
          let isRepCode = timeDisplay === "R";
          let isBdCode = ["BD", "NW", "NS", "NR", "H", "ID", "NP", "Fri", "FRI"].includes(timeDisplay);

          let timeStyle = "";
          if (isGapCode || isBdCode)
            timeStyle = "font-weight:bold; color:#b91c1c;";
          else if (isRepCode) timeStyle = "font-weight:bold; color:#f97316;";

          tableRowsHTML += `
                <tr>
                    <td>${i}</td><td>${dayName}</td>
                    <td>${rec.wrk_start || ""}</td><td>${rec.wrk_end || ""}</td>
                    <td>${rec.hmr_start || ""}</td><td>${rec.hmr_end || ""}</td>
                    <td>${rec.fuel || ""}</td><td>${dist > 0 ? dist.toFixed(1) : ""}</td>
                    <td style="${timeStyle}">${timeDisplay}</td>
                    <td>${normalHr > 0 ? normalHr : ""}</td><td>${otHr > 0 ? otHr : ""}</td>
                    <td class="note-col">${noteStr}</td>
                </tr>`;
        }

        let totalHr = sumNormal + sumOT;
        let mileage = sumFuel > 0 ? (sumDist / sumFuel).toFixed(2) : "0.00";

        // 🟢 ADDED data-plate AND LOG WINDOW BUTTON
        return `
        <div class="ts-card" id="card_${vehicle.plate_no}" data-plate="${vehicle.plate_no}">
            <button class="btn-log-window" onclick="toggleSplitLogsheet('${vehicle.plate_no}')">📁 Log Window</button>
            ${invoiceInfoHtml}
            <div class="ts-month-title">${month} - ${year}</div>
            
            <div class="ts-header">
                <div class="info-col">
                    <div class="info-row"><div class="info-lbl">Driver</div><div class="info-val">: ${currDriver}</div></div>
                    ${prevDriver ? `<div class="info-row"><div class="info-lbl" style="color:#64748b;">Old Driver</div><div class="info-val" style="color:#64748b;">: ${prevDriver}</div></div>` : ""}
                    <div class="info-row"><div class="info-lbl">Mobile</div><div class="info-val">: ${currMobile}</div></div>
                </div>
                
                <div class="plate-wrapper">
                    ${assetCodeHtml}
                    <div class="plate-pill">${vehicle.plate_no}</div>
                </div>
                
                <div class="info-col">
                    <div class="info-row"><div class="info-lbl">Site</div><div class="info-val">: ${currSite}</div></div>
                    ${prevSite ? `<div class="info-row"><div class="info-lbl" style="color:#64748b;">Prev Site</div><div class="info-val" style="color:#64748b;">: ${prevSite}</div></div>` : ""}
                    <div class="info-row"><div class="info-lbl">Vehicle</div><div class="info-val">: ${dispVType}</div></div>
                </div>
            </div>

            <table class="ts-table">
                <thead>
                    <tr><th style="width: 25px;">Date</th><th style="width: 30px;">Day</th><th style="width: 40px;">Start</th><th style="width: 40px;">End</th><th style="width: 60px;">HMR S</th><th style="width: 60px;">HMR E</th><th style="width: 40px;">Fuel</th><th style="width: 45px;">Dist</th><th style="width: 35px;">Time</th><th style="width: 40px;">Normal</th><th style="width: 30px;">OT</th><th>Note</th></tr>
                </thead>
                <tbody>${tableRowsHTML}</tbody>
            </table>

            <div class="ts-footer">
                <div class="footer-left">
                    <div>Total Dist: ${sumDist.toFixed(1)}</div>
                    <div>Total Fuel: ${sumFuel.toFixed(1)}</div>
                    <div>Mileage : ${mileage} Km/L</div>
                </div>
                <div class="footer-right">
                    <div>Normal Hr : ${sumNormal}</div>
                    <div>OT Hr &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: ${sumOT}</div>
                    <div>Total Hr &nbsp;&nbsp;&nbsp;: ${totalHr}</div>
                </div>
            </div>

            <div class="ts-owner-details">
                <div>Owner :: ${dispOName} ${dispOMob ? "(" + dispOMob + ")" : ""}</div>
                <div class="co-details"><span>Field Co :: ${dispFieldCo}</span><span>Site Co :: ${dispSiteCo}</span></div>
                <div style="font-size:6px; color:transparent;">XXXXX</div>
            </div>

            <div class="red-border-box-bottom">${bottomBoxTextHTML}</div>
            
            <div class="card-actions-wrapper" style="position: absolute; bottom: 10mm; right: 12mm; display: flex; gap: 8px;">
                <button class="card-dl-btn" style="position: relative; bottom: auto; right: auto;" onclick="copyCardImage(this)" title="Copy Image">📋</button>
                <button class="card-dl-btn" style="position: relative; bottom: auto; right: auto;" onclick="downloadPNG(this, '${vehicle.plate_no}')">⬇️ PNG</button>
            </div>
        </div>`;
      }

      async function downloadAllPDF() {
        const area = document.getElementById("reportArea");
        const cards = area.querySelectorAll(".ts-card");
        if (cards.length === 0) return alert("No reports generated yet.");

        const btn = document.getElementById("btnPdf");
        const loader = document.getElementById("pdfLoader");
        const btns = area.querySelectorAll(".card-dl-btn");
        const logBtns = area.querySelectorAll(".btn-log-window"); // 🟢 Hide log buttons

        btns.forEach((b) => (b.style.display = "none"));
        logBtns.forEach((b) => (b.style.display = "none"));
        btn.disabled = true;
        loader.style.display = "inline-block";

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4", true);

        try {
          for (let i = 0; i < cards.length; i++) {
            const originalMargin = cards[i].style.margin;
            const originalShadow = cards[i].style.boxShadow;
            cards[i].style.width = "210mm";
            cards[i].style.minHeight = "297mm";
            cards[i].style.margin = "0";
            cards[i].style.boxShadow = "none";

            const canvas = await html2canvas(cards[i], {
              scale: 2.0,
              useCORS: true,
              logging: false,
            });
            const imgData = canvas.toDataURL("image/jpeg", 0.95);

            if (i > 0) pdf.addPage();
            pdf.addImage(imgData, "JPEG", 0, 0, 210, 297, undefined, "FAST");

            cards[i].style.margin = originalMargin;
            cards[i].style.boxShadow = originalShadow;
          }

          const m = document.getElementById("selMonth").value;
          const y = document.getElementById("selYear").value;
          pdf.save(`Timesheet_Reports_${m}_${y}.pdf`);
        } catch (err) {
          alert("Error generating PDF.");
        } finally {
          btns.forEach((b) => (b.style.display = "flex"));
          logBtns.forEach((b) => (b.style.display = "block"));
          btn.disabled = false;
          loader.style.display = "none";
        }
      }

      async function downloadPNG(btnElement, plateNo) {
        const card = btnElement.closest(".ts-card");
        const originalText = btnElement.innerHTML;
        const logBtn = card.querySelector(".btn-log-window");
        const actionContainer = card.querySelector(".card-actions-wrapper"); // 🟢 Hide wrapper for PNG

        if (logBtn) logBtn.style.display = "none";

        btnElement.innerHTML = "⏳ Loading...";
        btnElement.style.background = "#e2e8f0";
        btnElement.disabled = true;

        setTimeout(async () => {
          if (actionContainer) actionContainer.style.display = "none";
          try {
            const canvas = await html2canvas(card, {
              scale: 2,
              useCORS: true,
              backgroundColor: "#ffffff",
            });
            const link = document.createElement("a");
            link.download = `Timesheet_${plateNo}_${document.getElementById("selMonth").value}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
          } catch (e) {
            alert("Error generating PNG.");
          } finally {
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
            btnElement.style.background = "#e2e8f0";
            if (actionContainer) actionContainer.style.display = "flex";
            if (!document.body.classList.contains("split-active") && logBtn)
              logBtn.style.display = "block";
          }
        }, 50);
      }

      async function copyCardImage(btnElement) {
        const card = btnElement.closest(".ts-card");
        const logBtn = card.querySelector(".btn-log-window");
        const actionContainer = card.querySelector(".card-actions-wrapper");
        const originalText = btnElement.innerHTML;

        if (logBtn) logBtn.style.display = "none";
        
        btnElement.innerHTML = "⏳";
        btnElement.disabled = true;

        setTimeout(async () => {
          if (actionContainer) actionContainer.style.display = "none"; // Hide buttons in screenshot
          try {
            const canvas = await html2canvas(card, {
              scale: 2, // High quality
              useCORS: true,
              backgroundColor: "#ffffff",
            });
            
            canvas.toBlob(async (blob) => {
                try {
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    btnElement.innerHTML = "✅"; // Success icon
                } catch (err) {
                    console.error(err);
                    alert("Copy failed. Your browser might not support clipboard API.");
                    btnElement.innerHTML = originalText;
                }
                setTimeout(() => { btnElement.innerHTML = originalText; }, 1500); // Reset text after 1.5s
            }, "image/png", 1.0);

          } catch (e) {
            alert("Error copying image.");
            btnElement.innerHTML = originalText;
          } finally {
            btnElement.disabled = false;
            if (actionContainer) actionContainer.style.display = "flex";
            if (!document.body.classList.contains("split-active") && logBtn)
              logBtn.style.display = "block";
          }
        }, 50);
      }

      // ==========================================
      // 🟢 SPLIT SCREEN & AUTO-SYNC LOGIC
      // ==========================================
      let cardObserver;
      let currentActivePlate = "";

      function toggleSplitLogsheet(plateNo) {
        // Only works well on larger screens, ignore on mobile
        if (window.innerWidth < 768) {
          alert("Log Window is available only on PC view.");
          return;
        }

        document.body.classList.add("split-active");

        // Scroll specifically to the card that opened it
        const card = document.getElementById(`card_${plateNo}`);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        // Load the logsheet for this plate
        loadLogsheetPanel(plateNo);
      }

      function closeSplitLogsheet() {
        document.body.classList.remove("split-active");
        document.getElementById("logsheetViewerContainerPanel").innerHTML =
          '<div style="text-align: center; padding: 50px; color: #64748b">Select a file from the list to view</div>';
        document.getElementById("logsheetFileListPanel").innerHTML = "";
        currentActivePlate = "";
      }

      // Automatically updates right side when scrolling the left side
      function setupScrollTracking() {
        if (cardObserver) cardObserver.disconnect();

        const options = {
          root: document.getElementById("leftCardsArea"),
          rootMargin: "0px",
          threshold: 0.6, // Card must be 60% visible to become "active"
        };

        cardObserver = new IntersectionObserver((entries) => {
          // Only sync if the split screen is actually active
          if (!document.body.classList.contains("split-active")) return;

          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const plate = entry.target.dataset.plate;
              if (plate && currentActivePlate !== plate) {
                currentActivePlate = plate;
                loadLogsheetPanel(plate);
              }
            }
          });
        }, options);

        // Observe all newly generated cards
        document.querySelectorAll(".ts-card").forEach((card) => {
          cardObserver.observe(card);
        });
      }

      // ==========================================
      // 🟢 LOGSHEET VIEWER LOGIC (Embedded for Split Panel)
      // ==========================================
      let panelFiles = [];
      let currentZoom = 1;
      let currentRotation = 0;
      let posX = 0,
        posY = 0;
      let isDragging = false;
      let startX, startY;

      async function loadLogsheetPanel(plate) {
        const title = document.getElementById("logsheetTitlePanel");
        const sidebar = document.getElementById("logsheetFileListPanel");
        const viewer = document.getElementById("logsheetViewerContainerPanel");

        const month = document.getElementById("selMonth").value;
        const year = document.getElementById("selYear").value;

        title.innerText = `Logsheets - ${plate}`;
        sidebar.innerHTML =
          '<div style="text-align:center; padding:20px;">Loading...</div>';
        viewer.innerHTML =
          '<div style="text-align:center; padding: 50px; color:#64748b;">Select a file from the list to view</div>';

        try {
          const token = localStorage.getItem("timesheetToken");
          const reqHeaders = {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          };

          const response = await fetch("/timesheet/api/logsheets/list", {
            method: "POST",
            headers: reqHeaders,
            body: JSON.stringify({ month, year, plate_no: plate }),
          });

          const data = await response.json();

          if (!data.success) {
            sidebar.innerHTML = `<div style="color:#ef4444; font-weight:bold; padding:10px;">${data.message}</div>`;
            return;
          }

          if (data.files.length === 0) {
            sidebar.innerHTML = `<div style="padding:10px; color:#64748b; text-align:center;">No files found.</div>`;
            panelFiles = [];
            return;
          }

          panelFiles = data.files.sort((a, b) =>
            a.basename.localeCompare(b.basename, undefined, {
              numeric: true,
              sensitivity: "base",
            }),
          );

          sidebar.innerHTML = "";
          panelFiles.forEach((file, index) => {
            const div = document.createElement("div");
            div.className = "logsheet-file-item";
            div.id = `panel-file-${index}`;

            // Added checkbox for multi download support
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:6px; overflow:hidden; width:100%;">
                <input type="checkbox" class="panel-ls-checkbox" id="panel-check-${index}" onclick="event.stopPropagation();" style="width: 14px; height: 14px; cursor: pointer; margin: 0;" />
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1;" title="${file.basename}">${file.basename}</span>
              </div>
            `;
            div.onclick = () => selectPanelFile(index);
            sidebar.appendChild(div);
          });

          if (panelFiles.length > 0) selectPanelFile(0);
        } catch (error) {
          sidebar.innerHTML = `<div style="color:#ef4444; font-weight:bold; padding:10px;">Connection failed.</div>`;
        }
      }

      function selectPanelFile(index) {
        document
          .querySelectorAll("#logsheetFileListPanel .logsheet-file-item")
          .forEach((el) => el.classList.remove("active"));
        const activeEl = document.getElementById(`panel-file-${index}`);
        if (activeEl) {
          activeEl.classList.add("active");
          activeEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
        renderPanelFile(panelFiles[index]);
      }

      function renderPanelFile(file) {
        const viewer = document.getElementById("logsheetViewerContainerPanel");
        viewer.innerHTML =
          '<div style="text-align:center; padding:20px; font-weight:bold; color:#8b5cf6;">Loading File...</div>';
        currentZoom = 1;
        currentRotation = 0;
        posX = 0;
        posY = 0;

        const token = localStorage.getItem("timesheetToken");
        fetch(
          `/timesheet/api/logsheets/file?path=${encodeURIComponent(file.filename)}`,
          { headers: { Authorization: "Bearer " + token } },
        )
          .then((res) => res.blob())
          .then(async (blob) => {
            if (file.mime.includes("pdf")) {
              try {
                const arrayBuffer = await blob.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer })
                  .promise;

                viewer.innerHTML = `
                  <div class="image-zoom-wrapper" id="panelImgWrapper">
                    <div id="panelZoomContent" style="display: flex; flex-direction: column; gap: 20px; align-items: center; transition: transform 0.1s ease-out; padding: 20px;"></div>
                  </div>
                  <div class="zoom-controls">
                    <button class="zoom-btn" onclick="panelAdjustZoom(-0.2)">➖</button>
                    <button class="zoom-btn" onclick="panelResetZoom()">🔄</button>
                    <button class="zoom-btn" onclick="panelAdjustZoom(0.2)">➕</button>
                    <button class="zoom-btn" onclick="panelRotate()" style="color:#f59e0b;">⟳</button>
                  </div>
                `;

                const content = document.getElementById("panelZoomContent");
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                  const page = await pdf.getPage(pageNum);
                  const viewport = page.getViewport({ scale: 1.5 });
                  const canvas = document.createElement("canvas");
                  canvas.width = viewport.width;
                  canvas.height = viewport.height;
                  canvas.style.maxWidth = "100%";
                  canvas.style.height = "auto";
                  canvas.style.boxShadow = "0 4px 10px rgba(0,0,0,0.2)";
                  const ctx = canvas.getContext("2d");
                  await page.render({ canvasContext: ctx, viewport: viewport })
                    .promise;
                  content.appendChild(canvas);
                }
                panelApplyTransform();
                attachPanelEvents();
              } catch (e) {
                viewer.innerHTML = `<div style="color:#ef4444; font-weight:bold;">Failed to render PDF.</div>`;
              }
            } else {
              const fileURL = URL.createObjectURL(blob);
              viewer.innerHTML = `
                <div class="image-zoom-wrapper" id="panelImgWrapper">
                  <div id="panelZoomContent" style="display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease-out;">
                    <img src="${fileURL}" draggable="false" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
                  </div>
                </div>
                <div class="zoom-controls">
                  <button class="zoom-btn" onclick="panelAdjustZoom(-0.2)">➖</button>
                  <button class="zoom-btn" onclick="panelResetZoom()">🔄</button>
                  <button class="zoom-btn" onclick="panelAdjustZoom(0.2)">➕</button>
                  <button class="zoom-btn" onclick="panelRotate()" style="color:#f59e0b;">⟳</button>
                </div>
              `;
              panelApplyTransform();
              attachPanelEvents();
            }
          })
          .catch(() => {
            viewer.innerHTML = `<div style="color:#ef4444; font-weight:bold;">Failed to load file.</div>`;
          });
      }

      function panelAdjustZoom(amt) {
        currentZoom += amt;
        if (currentZoom < 0.2) currentZoom = 0.2;
        if (currentZoom > 5) currentZoom = 5;
        panelApplyTransform();
      }
      function panelRotate() {
        currentRotation += 90;
        if (currentRotation >= 360) currentRotation = 0;
        panelApplyTransform();
      }
      function panelResetZoom() {
        currentZoom = 1;
        currentRotation = 0;
        posX = 0;
        posY = 0;
        panelApplyTransform();
      }

      function panelApplyTransform() {
        const content = document.getElementById("panelZoomContent");
        if (!content) return;
        content.style.transform = `translate(${posX}px, ${posY}px) scale(${currentZoom})`;
        for (let i = 0; i < content.children.length; i++) {
          content.children[i].style.transform = `rotate(${currentRotation}deg)`;
          content.children[i].style.margin =
            currentRotation % 180 !== 0 ? "10% 0" : "0";
        }
      }

      function attachPanelEvents() {
        const wrapper = document.getElementById("panelImgWrapper");
        if (!wrapper) return;
        wrapper.onwheel = (e) => {
          e.preventDefault();
          e.deltaY < 0 ? panelAdjustZoom(0.2) : panelAdjustZoom(-0.2);
        };
        wrapper.onmousedown = (e) => {
          e.preventDefault();
          isDragging = true;
          startX = e.clientX - posX;
          startY = e.clientY - posY;
          wrapper.style.cursor = "grabbing";
        };
        wrapper.onmouseleave = () => {
          isDragging = false;
          wrapper.style.cursor = "grab";
        };
        wrapper.onmouseup = () => {
          isDragging = false;
          wrapper.style.cursor = "grab";
        };
        wrapper.onmousemove = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          posX = e.clientX - startX;
          posY = e.clientY - startY;
          panelApplyTransform();
        };
      }

      // ==========================================
      // 🟢 LOGSHEET PANEL DOWNLOAD FUNCTIONS
      // ==========================================
      async function generatePanelPdfFromFiles(
        filesArray,
        pdfFilename,
        btnElement,
        originalBtnText,
      ) {
        if (!filesArray.length) {
          alert("No valid files selected.");
          return;
        }
        btnElement.disabled = true;
        btnElement.innerHTML = `Wait...`;

        try {
          const { PDFDocument } = PDFLib;
          const { jsPDF } = window.jspdf;
          const mergedPdf = await PDFDocument.create();
          const token = localStorage.getItem("timesheetToken");

          for (let i = 0; i < filesArray.length; i++) {
            const file = filesArray[i];
            const res = await fetch(
              `/timesheet/api/logsheets/file?path=${encodeURIComponent(file.filename)}`,
              { headers: { Authorization: "Bearer " + token } },
            );
            if (!res.ok) continue;

            const blob = await res.blob();
            const arrayBuffer = await blob.arrayBuffer();

            if (file.mime && file.mime.includes("pdf")) {
              const existingPdf = await PDFDocument.load(arrayBuffer);
              const copiedPages = await mergedPdf.copyPages(
                existingPdf,
                existingPdf.getPageIndices(),
              );
              copiedPages.forEach((page) => mergedPdf.addPage(page));
            } else {
              const bitmap = await createImageBitmap(blob, {
                imageOrientation: "from-image",
              });
              const canvas = document.createElement("canvas");
              canvas.width = bitmap.width;
              canvas.height = bitmap.height;
              canvas.getContext("2d").drawImage(bitmap, 0, 0);

              const imgData = canvas.toDataURL("image/jpeg", 0.9);
              const singleImgPdf = new jsPDF({
                orientation: bitmap.width > bitmap.height ? "l" : "p",
                unit: "mm",
                format: [bitmap.width * 0.264583, bitmap.height * 0.264583],
              });
              singleImgPdf.addImage(
                imgData,
                "JPEG",
                0,
                0,
                bitmap.width * 0.264583,
                bitmap.height * 0.264583,
                undefined,
                "FAST",
              );

              const tempPdf = await PDFDocument.load(
                singleImgPdf.output("arraybuffer"),
              );
              const [copiedPage] = await mergedPdf.copyPages(tempPdf, [0]);
              mergedPdf.addPage(copiedPage);
            }
          }
          const pdfBytes = await mergedPdf.save();
          const link = document.createElement("a");
          link.href = URL.createObjectURL(
            new Blob([pdfBytes], { type: "application/pdf" }),
          );
          link.download = pdfFilename;
          link.click();
        } catch (e) {
          alert("PDF generation failed.");
        } finally {
          btnElement.disabled = false;
          btnElement.innerHTML = originalBtnText;
        }
      }

      async function downloadPanelAllAsPdf() {
        const btn = document.getElementById("btnPanelDownloadPdf");
        const validFiles = panelFiles.filter((f) => f.size > 0);
        await generatePanelPdfFromFiles(
          validFiles,
          `${currentActivePlate || "Logsheets"}.pdf`,
          btn,
          "PDF",
        );
      }

      async function downloadPanelSelectedAsPdf() {
        const btn = document.getElementById("btnPanelDownloadSelected");
        const checkboxes = document.querySelectorAll(".panel-ls-checkbox");
        const selected = [];
        checkboxes.forEach((cb, idx) => {
          if (cb.checked && panelFiles[idx].size > 0)
            selected.push(panelFiles[idx]);
        });
        if (!selected.length) {
          alert("Please select at least one file using checkboxes.");
          return;
        }
        await generatePanelPdfFromFiles(
          selected,
          `${currentActivePlate || "Logsheets"}_Selected.pdf`,
          btn,
          "Selected",
        );
      }

      async function downloadPanelCurrentImage() {
        if (currentFileIndex === -1 || !panelFiles[currentFileIndex]) {
          alert("No file selected.");
          return;
        }
        const file = panelFiles[currentFileIndex];
        const btn = document.getElementById("btnPanelDownloadCurrent");
        btn.disabled = true;
        btn.innerHTML = "...";

        try {
          const token = localStorage.getItem("timesheetToken");
          const res = await fetch(
            `/timesheet/api/logsheets/file?path=${encodeURIComponent(file.filename)}`,
            { headers: { Authorization: "Bearer " + token } },
          );
          const blob = await res.blob();
          const a = document.createElement("a");
          a.href = window.URL.createObjectURL(blob);
          a.download = file.basename;
          a.click();
        } catch (error) {
          alert("Download failed.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Current";
        }
      }
    </script>
