<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yearly Summary</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-blue { background: #2980b9; color: white; }
        
        /* Checkbox Dropdown Styling */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: white; padding: 8px 15px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .dropdown-content { display: none; position: absolute; background: #fff; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        .dropdown-content label { display: block; padding: 4px 0; cursor: pointer; font-size: 13px; }
        .dropdown:hover .dropdown-content { display: block; }

        /* 3 Cards in a Row Layout */
        .summary-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: flex-start; }
        .summary-card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: calc(50% - 14px); min-width: 420px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #000; padding: 5px 6px; text-align: left; }
        th { background: #bdd7ee; text-align: center; }
        .text-center { text-align: center; }
        .text-right { text-align: right; font-weight: bold; }
        .inner-table { width: 100%; border-collapse: collapse; margin-top: 2px; }
        .inner-table td { border: 1px solid #ccc; padding: 2px 4px; font-size: 11px; }
    </style>
</head>
<body>

<div class="top-bar">
    <h2 style="margin:0; font-size: 20px; color: #2c3e50;">Yearly Profit & Loss Summary</h2>
    <div class="controls">
            <!-- Year Selection Checkboxes -->
            <div class="dropdown">
                <button class="dropbtn">Select Years ▼</button>
                <div class="dropdown-content" id="yearCheckboxes">
                    <!-- Populated via JS -->
                </div>
            </div>
            <button class="btn" style="background: #16a085; color: white;" onclick="window.location.href='list.html'">Expand</button>
            <button class="btn btn-blue" onclick="window.location.href='Dashboard.html'">Back to Dashboard</button>
        </div>
</div>

<div class="summary-container" id="summaryWrapper"></div>

<script>
    let globalData = [];

    async function fetchSummaryData() {
        try {
            const res = await fetch('/api/own-equipment/tracker/summary-data');
            globalData = await res.json();
            initYearCheckboxes();
            loadSummary();
        } catch (err) {
            console.error("Error loading summary:", err);
        }
    }

    function initYearCheckboxes() {
        const container = document.getElementById('yearCheckboxes');
        container.innerHTML = `<label><input type="checkbox" id="chkAll" checked onchange="toggleAllYears(this)"> <b>Select All</b></label><hr style="margin:4px 0;">`;
        
        globalData.forEach(d => {
            container.innerHTML += `<label><input type="checkbox" class="year-chk" value="${d.year}" checked onchange="loadSummary()"> ${d.year}</label>`;
        });
    }

    function toggleAllYears(source) {
        document.querySelectorAll('.year-chk').forEach(chk => chk.checked = source.checked);
        loadSummary();
    }

    function loadSummary() {
        const wrapper = document.getElementById('summaryWrapper');
        wrapper.innerHTML = '';

        const checkedYears = Array.from(document.querySelectorAll('.year-chk:checked')).map(chk => chk.value);

        globalData.forEach(d => {
            if (!checkedYears.includes(d.year.toString())) return;

            let prevHtml = '';
            if (d.prevBalance < 0) {
                prevHtml = `<tr><td class="text-center">${d.year}</td><td>Previous Year OP Loss</td><td class="text-right">${Math.abs(d.prevBalance).toFixed(2)}</td><td></td><td></td><td></td></tr>`;
            } else if (d.prevBalance > 0) {
                prevHtml = `<tr><td></td><td></td><td></td><td class="text-center">${d.year}</td><td>Previous Year OP Profit</td><td class="text-right">${d.prevBalance.toFixed(2)}</td></tr>`;
            }

            let resultHtml = '';
            if (d.isNetLoss) {
                resultHtml = `
                    <tr><td></td><td></td><td></td><td class="text-center"><b>${d.year}</b></td><td><b>Net Loss ::</b>
                        <table class="inner-table">
                            <tr><td>Asset Cost</td><td class="text-right">${d.purchaseCost.toFixed(2)}</td></tr>
                            <tr><td>Operational Loss</td><td class="text-right">${d.opDiff.toFixed(2)}</td></tr>
                        </table>
                    </td><td class="text-right" style="color:red;"><b>${d.netDiff.toFixed(2)}</b></td></tr>
                `;
            } else {
                resultHtml = `
                    <tr><td class="text-center"><b>${d.year}</b></td><td><b>Net Profit ::</b>
                        <table class="inner-table">
                            <tr><td>Operational Profit</td><td class="text-right">${d.opDiff.toFixed(2)}</td></tr>
                        </table>
                    </td><td class="text-right" style="color:green;"><b>${d.netDiff.toFixed(2)}</b></td><td></td><td></td><td></td></tr>
                `;
            }

            wrapper.innerHTML += `
                <div class="summary-card">
                    <h3 style="text-align:center; margin: 5px 0 10px 0; color:#34495e;">Summary - ${d.year}</h3>
                    <table>
                        <thead>
                            <tr><th style="width:12%;">Date</th><th style="width:40%;">Expense</th><th style="width:18%;">Amount</th><th style="width:12%;">Date</th><th style="width:40%;">Income</th><th style="width:18%;">Amount</th></tr>
                        </thead>
                        <tbody>
                            <tr><td class="text-center">${d.year}</td><td>Total Purchase Cost</td><td class="text-right">${d.purchaseCost.toFixed(2)}</td><td></td><td></td><td></td></tr>
                            ${prevHtml}
                            <tr><td class="text-center">${d.year}</td><td>Total Maintenance Cost</td><td class="text-right">${d.maint.toFixed(2)}</td>
                                <td class="text-center">${d.year}</td><td>Total Operational Revenue</td><td class="text-right">${d.revenue.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td class="text-center">${d.year}</td>
                                <td>Total Operating Expenses
                                    <table class="inner-table">
                                        <tr><td colspan="2"><b>Driver Salary</b></td></tr>
                                        <tr><td>Net Salary (Basic Salary + Overtime)</td><td class="text-right">${d.driverNet.toFixed(2)}</td></tr>
                                        <tr><td>Penalty</td><td class="text-right">${d.driverPenalty.toFixed(2)}</td></tr>
                                        <tr><td colspan="2"><b>Santook Rent</b></td></tr>
                                        <tr><td>Total Rent</td><td class="text-right">${d.santook.toFixed(2)}</td></tr>
                                        <tr><td colspan="2"><b>Commission</b></td></tr>
                                        <tr><td>Kafil</td><td class="text-right">${d.kafil.toFixed(2)}</td></tr>
                                        <tr><td>Owner</td><td class="text-right">${d.owner.toFixed(2)}</td></tr>
                                        <tr><td>Investor</td><td class="text-right">${d.inv.toFixed(2)}</td></tr>
                                    </table>
                                </td>
                                <td class="text-right" style="vertical-align:bottom;">${d.opCost.toFixed(2)}</td>
                                <td></td><td></td><td></td>
                            </tr>
                            ${resultHtml}
                            <tr><td colspan="2" style="text-align:center; font-weight:bold;">Total</td><td class="text-right"><b>${d.totalBal.toFixed(2)}</b></td>
                                <td colspan="2" style="text-align:center; font-weight:bold;">Total</td><td class="text-right"><b>${d.totalBal.toFixed(2)}</b></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        });
    }

    window.onload = fetchSummaryData;
</script>
</body>
</html>
