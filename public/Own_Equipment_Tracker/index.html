<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Own Equipment Tracker - Authentication</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        position: relative;
        isolation: isolate;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        overflow-x: hidden;
        color: #f8fafc;
        background:
          radial-gradient(
            ellipse at 15% 10%,
            rgba(14, 116, 144, 0.28),
            transparent 38%
          ),
          radial-gradient(
            ellipse at 88% 85%,
            rgba(79, 70, 229, 0.22),
            transparent 36%
          ),
          linear-gradient(135deg, #070b14 0%, #101827 52%, #080d18 100%);
      }
      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        content: "";
        filter: blur(90px);
        opacity: 0.45;
        pointer-events: none;
      }
      body::before {
        top: -130px;
        left: -90px;
        background: #06b6d4;
      }
      body::after {
        right: -100px;
        bottom: -150px;
        background: #6366f1;
      }
      .auth-card {
        position: relative;
        z-index: 1;
        width: min(100%, 390px);
        padding: 36px 34px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        background: linear-gradient(
          145deg,
          rgba(30, 41, 59, 0.76),
          rgba(15, 23, 42, 0.62)
        );
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        backdrop-filter: blur(24px) saturate(150%);
      }
      .auth-card h2 {
        margin: 0 0 26px;
        color: #f8fafc;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.5px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #dbeafe;
        font-size: 13px;
        font-weight: 600;
      }
      .form-group input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid rgba(203, 213, 225, 0.24);
        border-radius: 9px;
        outline: none;
        color: #f8fafc;
        background: rgba(2, 6, 23, 0.44);
        font-size: 15px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }
      .form-group input:focus {
        border-color: #22d3ee;
        background: rgba(2, 6, 23, 0.62);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.16);
      }
      .btn {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9px;
        color: white;
        background: linear-gradient(100deg, #0f9f8f, #0e7490);
        box-shadow: 0 8px 20px rgba(8, 145, 178, 0.2);
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        transition:
          transform 0.2s ease,
          filter 0.2s ease,
          box-shadow 0.2s ease;
      }
      .btn:hover {
        filter: brightness(1.12);
        box-shadow: 0 10px 26px rgba(8, 145, 178, 0.3);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn-face {
        background: linear-gradient(100deg, #10b981, #059669);
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.22);
        margin-top: 10px;
      }
      .btn-face-capture {
        background: linear-gradient(100deg, #0284c7, #0369a1);
        box-shadow: 0 8px 20px rgba(2, 132, 199, 0.22);
        margin-top: 2px;
        margin-bottom: 10px;
        padding: 10px;
        font-size: 14px;
      }
      .btn-cancel {
        background: linear-gradient(100deg, #ef4444, #dc2626);
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.22);
      }
      .btn-secondary {
        background: rgba(100, 116, 139, 0.72);
        box-shadow: none;
      }
      .face-status {
        display: none;
        margin-bottom: 10px;
        color: #4ade80;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }
      .toggle-link {
        margin-top: 16px;
        color: #67e8f9;
        cursor: pointer;
        font-size: 13px;
        text-align: center;
        transition: color 0.2s ease;
      }
      .toggle-link:hover {
        color: #cffafe;
        text-decoration: underline;
      }
      .sub-link {
        margin-top: 10px;
        color: #93c5fd;
        font-size: 12.5px;
      }
      .alert {
        display: none;
        margin-bottom: 18px;
        padding: 11px 13px;
        border: 1px solid transparent;
        border-radius: 9px;
        font-size: 13px;
      }
      .alert-error {
        border-color: rgba(248, 113, 113, 0.3);
        color: #fecaca;
        background: rgba(127, 29, 29, 0.42);
      }
      .alert-success {
        border-color: rgba(74, 222, 128, 0.3);
        color: #bbf7d0;
        background: rgba(20, 83, 45, 0.42);
      }
      .face-modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10002;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: rgba(7, 11, 20, 0.84);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .face-modal-card {
        width: min(100%, 360px);
        padding: 26px 24px;
        text-align: center;
      }
      .face-modal-card h2 {
        margin-bottom: 8px;
        font-size: 20px;
      }
      .face-modal-subtitle {
        margin: 0 0 18px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .face-instruction {
        min-height: 20px;
        margin: 6px 0 14px;
        color: #38bdf8;
        font-size: 13.5px;
        font-weight: 700;
      }
      .face-video {
        width: 100%;
        max-width: 300px;
        height: auto;
        border: 2px solid rgba(56, 189, 248, 0.55);
        border-radius: 12px;
        background: #020617;
        transform: scaleX(-1);
      }
      @media (max-width: 480px) {
        body {
          padding: 18px;
        }
        .auth-card {
          padding: 30px 24px;
          border-radius: 17px;
        }
        .auth-card h2 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div id="alertBox" class="alert"></div>
      <div id="loginForm">
        <h2>Equipment Tracker Login</h2>
        <div class="form-group">
          <label>Username</label>
          <!-- Added autocomplete="off" -->
          <input type="text" id="loginUser" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <!-- Added autocomplete="new-password" -->
          <input
            type="password"
            id="loginPass"
            autocomplete="new-password"
            required
          />
        </div>
        <button class="btn" onclick="handleLogin()">Login</button>
        <button
          type="button"
          class="btn btn-face"
          onclick="startEqFaceAuth('login')"
        >
          📸 Face Login
        </button>
        <div class="toggle-link" onclick="toggleView('signup')">
          New User? Sign Up Here
        </div>
        <div
          class="toggle-link sub-link"
          onclick="openEqResetFaceModal()"
        >
          📸 Reset / Update Face Data
        </div>
      </div>

      <div id="signupForm" style="display: none">
        <h2>User Signup</h2>
        <div class="form-group">
          <label>Username</label>
          <!-- Added autocomplete="off" -->
          <input type="text" id="signupUser" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <!-- Added autocomplete="new-password" -->
          <input
            type="password"
            id="signupPass"
            autocomplete="new-password"
            required
          />
        </div>
        <button
          type="button"
          id="regFaceBtn"
          class="btn btn-face-capture"
          onclick="startEqFaceAuth('register')"
        >
          📷 Capture Face for Signup
        </button>
        <div id="regFaceStatus" class="face-status">
          ✓ Face Captured Successfully!
        </div>
        <button
          class="btn"
          style="background: #2980b9"
          onclick="handleSignup()"
        >
          Request Access
        </button>
        <div class="toggle-link" onclick="toggleView('login')">
          Already have an account? Login
        </div>
      </div>
    </div>

    <!-- Credentials Modal for Reset / Update Face Data -->
    <div id="eqResetVerifyModal" class="face-modal-backdrop">
      <div class="auth-card face-modal-card">
        <h2>Verify Credentials</h2>
        <p class="face-modal-subtitle">
          Enter username and password to re-register Face ID.
        </p>
        <div class="form-group" style="text-align: left">
          <label>Username</label>
          <input
            type="text"
            id="eqRfUsername"
            placeholder="Username"
            autocomplete="off"
          />
        </div>
        <div class="form-group" style="text-align: left">
          <label>Password</label>
          <input
            type="password"
            id="eqRfPassword"
            placeholder="Password"
            autocomplete="new-password"
          />
        </div>
        <button
          type="button"
          class="btn btn-face-capture"
          onclick="verifyAndStartEqFaceReset()"
        >
          Continue to Face Scan
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          onclick="closeEqResetFaceModal()"
        >
          Cancel
        </button>
      </div>
    </div>

    <!-- Universal Direct Camera Face Verification Modal -->
    <div id="eqUniversalFaceModal" class="face-modal-backdrop">
      <div class="auth-card face-modal-card">
        <h2 id="eqFaceModalTitle">Face Verification</h2>
        <div id="eqUniversalInstruction" class="face-instruction">
          Initializing Camera...
        </div>
        <video
          id="eqUniversalVideo"
          class="face-video"
          width="320"
          height="240"
          autoplay
          muted
          playsinline
        ></video>
        <canvas
          id="eqUniversalCanvas"
          width="320"
          height="240"
          style="display: none"
        ></canvas>
        <div style="margin-top: 16px">
          <button
            type="button"
            class="btn btn-cancel"
            onclick="closeEqUniversalFace()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- External JS Link -->
    <script src="js/eq-session.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
