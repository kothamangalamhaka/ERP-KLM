<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing & Report - Admin Panel</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: #f1f5f9;
        color: #1e293b;
      }
      select {
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #cbd5e1;
      }
      button {
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-update {
        background-color: #0ea5e9;
        color: white;
      }
      .btn-update:hover {
        background-color: #0284c7;
      }
      .btn-delete {
        background-color: #ef4444;
        color: white;
      }
      .btn-delete:hover {
        background-color: #dc2626;
      }
      #toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      /* Admin Auth Overlay CSS */
      #adminAuthModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(12px);
      }
      .admin-login-box {
        background: white;
        padding: 40px 35px;
        border-radius: 16px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .admin-login-box h3 {
        margin-top: 0;
        color: #0f172a;
        margin-bottom: 25px;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      .admin-login-box input {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 18px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        transition: all 0.3s ease;
        color: #1e293b;
        outline: none;
      }
      .admin-login-box input:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
      }
      .admin-login-box button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.3);
      }
      .admin-login-box button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- Dedicated Admin Login Modal -->
    <div id="adminAuthModal">
      <div class="admin-login-box">
        <h3>Super Admin Authentication</h3>
        <input
          type="text"
          id="adminUsername"
          placeholder="Super Admin Username"
          onkeypress="if (event.key === 'Enter') adminLogin();"
        />
        <input
          type="password"
          id="adminPassword"
          placeholder="Password"
          onkeypress="if (event.key === 'Enter') adminLogin();"
        />
        <button onclick="adminLogin()">Verify</button>
        <button
          onclick="startAdminFaceLogin()"
          style="background: #10b981; margin-top: 10px; box-shadow: none"
        >
          📸 Face Login
        </button>
        <div
          id="adminAuthError"
          style="
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
          "
        ></div>
      </div>
    </div>

    <div class="container" id="mainAdminContent" style="display: none">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2>User Management (Billing & Report)</h2>
        <button onclick="logout()" style="background: #64748b; color: white">
          Logout
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Display Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="6" style="text-align: center">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Admin Face Login Modal -->
    <div
      id="adminFaceModal"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          background: white;
          padding: 20px;
          border-radius: 12px;
          text-align: center;
        "
      >
        <h3 style="margin-top: 0; color: #0f172a">Super Admin Face Login</h3>
        <h4 id="adminLivenessInstruction" style="margin-top:5px; margin-bottom:15px; font-weight:bold; color:#d97706; min-height: 20px;">Loading Security Module...</h4>
        <video
          id="adminFaceVideo"
          width="320"
          height="240"
          autoplay
          muted
          playsinline
          style="border-radius: 6px; transform: scaleX(-1)"
        ></video>
        <canvas
          id="adminFaceCanvas"
          width="320"
          height="240"
          style="display: none"
        ></canvas>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
          <button
            onclick="closeAdminFace()"
            style="background: #dc2626; color: white"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script>
      let token = "";

      // Evidennu vannuvo avide thirichu pokan (illenkil report.html)
      function goBackToWhereCameFrom() {
        const ref = document.referrer;
        const sameSite = ref && ref.startsWith(window.location.origin);
        const isThisPage = ref && ref.includes("/invoice_data/admin");
        if (sameSite && !isThisPage) {
          window.location.replace(ref);
        } else {
          window.location.replace("../report.html");
        }
      }

      // ---------- Face Login (Super Admin) ----------
      let adminVideoStream = null;
      let adminFaceMesh = null;
      let adminMpCamera = null;
      let adminLivenessChallenge = null;
      let adminChallengePassed = false;
      let isAdminVerifying = false;

      async function startAdminFaceLogin() {
        const modal = document.getElementById("adminFaceModal");
        const video = document.getElementById("adminFaceVideo");
        const instruction = document.getElementById("adminLivenessInstruction");
        modal.style.display = "flex";
        adminChallengePassed = false;
        isAdminVerifying = false;

        const challenges = ["Turn your head LEFT", "Turn your head RIGHT"];
        adminLivenessChallenge = challenges[Math.floor(Math.random() * challenges.length)];
        instruction.innerText = adminLivenessChallenge;
        instruction.style.color = "#d97706";

        try {
          if (!adminFaceMesh) {
            adminFaceMesh = new FaceMesh({
              locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            adminFaceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
            adminFaceMesh.onResults(onAdminFaceMeshResults);
          }

          adminVideoStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = adminVideoStream;

          adminMpCamera = new Camera(video, {
            onFrame: async () => { await adminFaceMesh.send({ image: video }); },
            width: 320,
            height: 240
          });
          adminMpCamera.start();
        } catch (err) {
          showToast("Camera access denied or not available.");
          closeAdminFace();
        }
      }

      async function onAdminFaceMeshResults(results) {
        if (isAdminVerifying || adminChallengePassed) return;

        const instruction = document.getElementById("adminLivenessInstruction");

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          const nose = landmarks[1];
          const leftEdge = landmarks[234];
          const rightEdge = landmarks[454];

          const yawRatio = (nose.x - leftEdge.x) / (rightEdge.x - leftEdge.x);

          let passed = false;
          if (adminLivenessChallenge === "Turn your head LEFT" && yawRatio > 0.65) passed = true;
          if (adminLivenessChallenge === "Turn your head RIGHT" && yawRatio < 0.35) passed = true;

          if (passed) {
            adminChallengePassed = true;
            instruction.innerText = "Challenge Passed! Verifying...";
            instruction.style.color = "#10b981";
            await captureAndVerifyAdminFace(results.image);
          }
        }
      }

      async function captureAndVerifyAdminFace(videoFrame) {
        isAdminVerifying = true;
        const canvas = document.getElementById("adminFaceCanvas");
        const ctx = canvas.getContext("2d");
        ctx.drawImage(videoFrame, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL("image/jpeg");

        try {
          const res = await fetch("/py/face-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData }),
          });
          const data = await res.json();

          if (data.success) {
            if (data.user && data.user.role === "Super Admin") {
              token = data.token;
              closeAdminFace();
              document.getElementById("adminAuthModal").style.display = "none";
              document.getElementById("mainAdminContent").style.display = "block";
              fetchUsers();
              showToast("Welcome " + (data.user.displayName || ""));
              return;
            }
            closeAdminFace();
            const errDiv = document.getElementById("adminAuthError");
            errDiv.innerText = "Access Denied: Super Admin Only.";
            errDiv.style.display = "block";
            return;
          }

          closeAdminFace();
          const errDiv = document.getElementById("adminAuthError");
          errDiv.innerText = data.message || "Face recognition failed.";
          errDiv.style.display = "block";
        } catch (e) {
          closeAdminFace();
          showToast("Server connection failed.");
        }
      }

      function closeAdminFace() {
        document.getElementById("adminFaceModal").style.display = "none";
        isAdminVerifying = false;
        adminChallengePassed = false;
        if (adminMpCamera) {
          adminMpCamera.stop();
          adminMpCamera = null;
        }
        if (adminVideoStream) {
          adminVideoStream.getTracks().forEach((t) => t.stop());
          adminVideoStream = null;
        }
      }

      // Initial check blocked to force dedicated login
      async function adminLogin() {
        const u = document.getElementById("adminUsername").value.trim();
        const p = document.getElementById("adminPassword").value;
        const errDiv = document.getElementById("adminAuthError");

        if (!u || !p) {
          errDiv.innerText = "Enter credentials";
          errDiv.style.display = "block";
          return;
        }

        errDiv.style.display = "none";

        try {
          const res = await fetch("/api/invoice-auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p }),
          });

          const data = await res.json();

          if (data.success && data.user && data.user.role === "Super Admin") {
            token = data.token;
            closeAdminFace();
            document.getElementById("adminAuthModal").style.display = "none";
            document.getElementById("mainAdminContent").style.display = "block";
            fetchUsers();
          } else {
            errDiv.innerText = "Access Denied: Super Admin Only.";
            errDiv.style.display = "block";
          }
        } catch (err) {
          errDiv.innerText = "Server Error";
          errDiv.style.display = "block";
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => {
          t.className = t.className.replace("show", "");
        }, 3000);
      }

      function logout() {
        localStorage.removeItem("invoiceToken");
        localStorage.removeItem("token");
        localStorage.removeItem("timesheetToken");
        sessionStorage.setItem("skipAdminAutoFace", "1");
        goBackToWhereCameFrom();
      }

      async function fetchUsers() {
        try {
          const res = await fetch("/api/invoice-auth/admin/users", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();

          if (!data.success) {
            alert(data.message);
            if (data.message.includes("Super Admin")) {
              goBackToWhereCameFrom();
            }
            return;
          }

          const tbody = document.getElementById("userTableBody");
          tbody.innerHTML = "";

          data.users.forEach((user) => {
            tbody.innerHTML += `
                        <tr>
                            <td>${user.display_name}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>
                                <select id="role_${user.id}">
                                    <option value="User" ${user.role === "User" ? "selected" : ""}>User</option>
                                    <option value="Super Admin" ${user.role === "Super Admin" ? "selected" : ""}>Super Admin</option>
                                </select>
                            </td>
                            <td>
                                <select id="status_${user.id}">
                                    <option value="Pending" ${user.status === "Pending" ? "selected" : ""}>Pending</option>
                                    <option value="Approved" ${user.status === "Approved" ? "selected" : ""}>Approved</option>
                                    <option value="Rejected" ${user.status === "Rejected" ? "selected" : ""}>Rejected</option>
                                </select>
                            </td>
                            <td>
                                <button class="btn-update" onclick="updateUser(${user.id})">Save</button>
                                <button class="btn-delete" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        </tr>
                    `;
          });
        } catch (err) {
          console.error(err);
          alert("Failed to load users.");
        }
      }

      async function updateUser(id) {
        const role = document.getElementById(`role_${id}`).value;
        const status = document.getElementById(`status_${id}`).value;

        try {
          const res = await fetch("/api/invoice-auth/admin/update-user", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ userId: id, role, status }),
          });
          const data = await res.json();
          showToast(data.message);
          if (data.success) fetchUsers();
        } catch (err) {
          showToast("Update failed.");
        }
      }

      async function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;
        try {
          const res = await fetch(`/api/invoice-auth/admin/delete-user/${id}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          showToast(data.message);
          if (data.success) fetchUsers();
        } catch (err) {
          showToast("Delete failed.");
        }
      }

      // fetchUsers(); is now called only after successful adminLogin()
      if (sessionStorage.getItem("skipAdminAutoFace")) {
        sessionStorage.removeItem("skipAdminAutoFace");
      } else {
        startAdminFaceLogin(); // auto face scan on page open
      }
    </script>
  </body>
</html>
