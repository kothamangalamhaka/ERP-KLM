<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zoho Invoice Sync Hub</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --secondary-color: #10b981;
        --secondary-hover: #059669;
        --bill-color: #f59e0b;
        --bill-hover: #d97706;

        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(
          135deg,
          #e0e7ff 0%,
          #f1f5f9 100%
        );

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        margin: 0;

        color: var(--text-main);
      }

      .app-wrapper {
        background: var(--card-bg);

        padding: 40px;

        border-radius: 16px;

        box-shadow:
          0 10px 40px -10px rgba(0, 0, 0, 0.1),
          0 0 0 1px rgba(0, 0, 0, 0.02);

        width: 100%;
        max-width: 540px;

        text-align: center;

        position: relative;
        overflow: hidden;
      }

      .app-wrapper::before {
        content: "";

        position: absolute;

        top: 0;
        left: 0;
        right: 0;

        height: 6px;

        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--secondary-color)
        );
      }

      .header-icon {
        background: #eff6ff;

        color: var(--primary-color);

        width: 64px;
        height: 64px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 20px;

        font-size: 28px;

        box-shadow:
          0 4px 6px -1px rgba(37, 99, 235, 0.1);
      }

      h2 {
        margin: 0 0 10px 0;

        font-size: 24px;

        font-weight: 700;

        letter-spacing: -0.02em;
      }

      p {
        color: var(--text-muted);

        font-size: 14px;

        line-height: 1.6;

        margin: 0 0 30px;
      }

      .form-group {
        text-align: left;

        margin-bottom: 25px;
      }

      label {
        display: block;

        font-weight: 600;

        font-size: 13px;

        color: var(--text-main);

        margin-bottom: 8px;

        text-transform: uppercase;

        letter-spacing: 0.05em;
      }

      .custom-select {
        position: relative;
      }

      select {
        width: 100%;

        padding: 14px 45px 14px 16px;

        font-family: inherit;

        font-size: 15px;

        color: var(--text-main);

        background-color: #f8fafc;

        border: 1px solid var(--border-color);

        border-radius: 10px;

        appearance: none;

        outline: none;

        transition: all 0.2s ease;

        cursor: pointer;
      }

      select:focus {
        border-color: var(--primary-color);

        background-color: #fff;

        box-shadow:
          0 0 0 4px rgba(37, 99, 235, 0.1);
      }

      select:disabled {
        cursor: not-allowed;

        opacity: 0.75;
      }

      .custom-select::after {
        content: "▼";

        font-size: 10px;

        color: var(--text-muted);

        position: absolute;

        right: 18px;
        top: 50%;

        transform: translateY(-50%);

        pointer-events: none;
      }

      .action-cards {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 12px;

        margin-top: 20px;
      }

      button {
        border: none;

        padding: 16px 10px;

        min-height: 82px;

        border-radius: 10px;

        font-family: inherit;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 8px;

        transition: all 0.2s ease;

        color: white;
      }

      button:disabled {
        background-color: #cbd5e1 !important;

        box-shadow: none !important;

        cursor: not-allowed;

        transform: none !important;
      }

      .btn-zip {
        background-color: var(--secondary-color);

        box-shadow:
          0 4px 14px 0 rgba(16, 185, 129, 0.39);
      }

      .btn-zip:hover:not(:disabled) {
        background-color: var(--secondary-hover);

        transform: translateY(-2px);
      }

      .btn-pdf {
        background-color: var(--primary-color);

        box-shadow:
          0 4px 14px 0 rgba(37, 99, 235, 0.39);
      }

      .btn-pdf:hover:not(:disabled) {
        background-color: var(--primary-hover);

        transform: translateY(-2px);
      }

      .btn-bill {
        background-color: var(--bill-color);

        box-shadow:
          0 4px 14px 0 rgba(245, 158, 11, 0.39);
      }

      .btn-bill:hover:not(:disabled) {
        background-color: var(--bill-hover);

        transform: translateY(-2px);
      }

      .btn-icon {
        font-size: 18px;
      }

      .status-container {
        margin-top: 25px;

        padding: 15px;

        border-radius: 8px;

        font-size: 14px;

        font-weight: 500;

        display: none;

        align-items: center;

        justify-content: center;

        gap: 10px;

        text-align: center;
      }

      .status-info {
        background: #eff6ff;

        color: #1d4ed8;

        border: 1px solid #bfdbfe;

        display: flex;
      }

      .status-success {
        background: #ecfdf5;

        color: #047857;

        border: 1px solid #a7f3d0;

        display: flex;
      }

      .status-error {
        background: #fef2f2;

        color: #b91c1c;

        border: 1px solid #fecaca;

        display: flex;
      }

      .spinner {
        width: 18px;
        height: 18px;

        border: 3px solid rgba(29, 78, 216, 0.2);

        border-radius: 50%;

        border-top-color: #1d4ed8;

        animation: spin 1s ease-in-out infinite;

        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        .app-wrapper {
          padding: 30px 20px;
        }

        .action-cards {
          grid-template-columns: 1fr;
        }

        button {
          min-height: 65px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app-wrapper">

      <div class="header-icon">
        📥
      </div>

      <h2>
        Invoice Download Hub
      </h2>

      <p>
        Securely fetch and download today's registered invoices
        from the mail server to your local system.
      </p>

      <div class="form-group">

        <label for="vendorSelect">
          Select Vendor Profile
        </label>

        <div class="custom-select">

          <select id="vendorSelect" disabled>
            <option value="">
              Establishing connection...
            </option>
          </select>

        </div>

      </div>

      <div class="action-cards">

        <button
          id="btnZip"
          class="btn-zip"
          type="button"
          onclick="startDownload(true)"
          disabled
        >
          <span class="btn-icon">
            📦
          </span>

          <span>
            ZIP
          </span>
        </button>

        <button
          id="btnIndiv"
          class="btn-pdf"
          type="button"
          onclick="startDownload(false)"
          disabled
        >
          <span class="btn-icon">
            📥
          </span>

          <span>
            PDF
          </span>
        </button>

        <button
          id="btnBill"
          class="btn-bill"
          type="button"
          onclick="startBillProcess()"
          disabled
        >
          <span class="btn-icon">
            🧾
          </span>

          <span>
            Bill
          </span>
        </button>

      </div>

      <div
        id="statusBox"
        class="status-container"
      >
        <div
          id="loadingSpinner"
          class="spinner"
          style="display: none"
        ></div>

        <span id="statusText"></span>
      </div>

    </div>

    <script>
      "use strict";

      /*
       * ============================================================
       * DOM ELEMENTS
       * ============================================================
       */

      const vendorSelect =
        document.getElementById("vendorSelect");

      const btnZip =
        document.getElementById("btnZip");

      const btnIndiv =
        document.getElementById("btnIndiv");

      const btnBill =
        document.getElementById("btnBill");

      /*
       * ============================================================
       * PAGE INITIALIZATION
       * ============================================================
       */

      window.addEventListener("DOMContentLoaded", loadVendors);

      async function loadVendors() {
        disableControls();

        vendorSelect.innerHTML = "";

        const loadingOption =
          document.createElement("option");

        loadingOption.value = "";
        loadingOption.textContent =
          "Establishing connection...";

        vendorSelect.appendChild(loadingOption);

        try {
          /*
           * IMPORTANT:
           * Use a relative URL so this works when Express serves
           * the HTML file.
           */
          const response = await fetch(
            "/api/invoice-vendors",
            {
              method: "GET",
              headers: {
                Accept: "application/json"
              },
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error(
              `Server returned HTTP ${response.status}`
            );
          }

          const vendors =
            await response.json();

          populateDropdown(vendors);

          showStatus(
            "Connected successfully. Select a vendor.",
            "success",
            false
          );

        } catch (error) {

          console.error(
            "Vendor loading error:",
            error
          );

          vendorSelect.innerHTML = "";

          const errorOption =
            document.createElement("option");

          errorOption.value = "";

          errorOption.textContent =
            "Unable to connect to server";

          vendorSelect.appendChild(errorOption);

          showStatus(
            `Failed to establish connection with server: ${error.message}`,
            "error",
            false
          );
        }
      }

      /*
       * ============================================================
       * POPULATE VENDOR DROPDOWN
       * ============================================================
       */

      function populateDropdown(vendors) {

        vendorSelect.innerHTML = "";

        if (
          !vendors ||
          typeof vendors !== "object" ||
          Object.keys(vendors).length === 0
        ) {
          const option =
            document.createElement("option");

          option.value = "";

          option.textContent =
            "No vendor profiles available";

          vendorSelect.appendChild(option);

          disableControls();

          return;
        }

        for (const key of Object.keys(vendors)) {

          const vendor =
            vendors[key];

          const option =
            document.createElement("option");

          option.value = key;

          option.textContent =
            vendor.label || key;

          vendorSelect.appendChild(option);
        }

        enableControls();

        vendorSelect.focus();
      }

      /*
       * ============================================================
       * CONTROL STATE
       * ============================================================
       */

      function disableControls() {

        vendorSelect.disabled = true;

        btnZip.disabled = true;

        btnIndiv.disabled = true;

        btnBill.disabled = true;
      }

      function enableControls() {

        vendorSelect.disabled = false;

        btnZip.disabled = false;

        btnIndiv.disabled = false;

        btnBill.disabled = false;
      }

      /*
       * ============================================================
       * GET SELECTED VENDOR
       * ============================================================
       */

      function getSelectedVendor() {

        const vendorKey =
          vendorSelect.value;

        if (!vendorKey) {
          throw new Error(
            "Please select a vendor."
          );
        }

        const selectedOption =
          vendorSelect.options[
            vendorSelect.selectedIndex
          ];

        const vendorName =
          selectedOption
            ? selectedOption.textContent
            : vendorKey;

        return {
          vendorKey,
          vendorName
        };
      }

      /*
       * ============================================================
       * BILL DOWNLOAD
       * ============================================================
       */

      async function startBillProcess() {

        let vendor;

        try {
          vendor =
            getSelectedVendor();
        } catch (error) {
          showStatus(
            error.message,
            "error"
          );

          return;
        }

        disableControls();

        showStatus(
          `Processing Bills for ${vendor.vendorName}...`,
          "info",
          true
        );

        try {

          const response =
            await fetch(
              "/api/invoice-bill-download",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  Accept:
                    "application/json"
                },

                body: JSON.stringify({
                  vendorKey:
                    vendor.vendorKey
                })
              }
            );

          const data =
            await parseJsonResponse(response);

          if (!response.ok) {
            throw new Error(
              data.detail ||
              data.error ||
              "Server connection failed"
            );
          }

          if (
            !data.files ||
            data.files.length === 0
          ) {
            showStatus(
              "No matching bills found for today.",
              "error"
            );

            return;
          }

          const count =
            data.files.length;

          showStatus(
            `Downloading ${count} bill file(s)...`,
            "info",
            true
          );

          await downloadFiles(
            data.files
          );

          showStatus(
            `Successfully downloaded ${count} bill file(s).`,
            "success"
          );

        } catch (error) {

          console.error(
            "Bill download error:",
            error
          );

          showStatus(
            `Error: ${error.message}`,
            "error"
          );

        } finally {

          enableControls();
        }
      }

      /*
       * ============================================================
       * NORMAL INVOICE DOWNLOAD
       * ============================================================
       */

      async function startDownload(asZip) {

        let vendor;

        try {
          vendor =
            getSelectedVendor();
        } catch (error) {

          showStatus(
            error.message,
            "error"
          );

          return;
        }

        btnZip.disabled = true;
        btnIndiv.disabled = true;
        btnBill.disabled = true;
        vendorSelect.disabled = true;

        showStatus(
          `Scanning mailbox for today's ${vendor.vendorName} invoices...`,
          "info",
          true
        );

        try {

          const response =
            await fetch(
              "/api/invoice-download",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  Accept:
                    "application/json"
                },

                body: JSON.stringify({
                  vendorKey:
                    vendor.vendorKey
                })
              }
            );

          const data =
            await parseJsonResponse(response);

          if (!response.ok) {

            throw new Error(
              data.detail ||
              data.error ||
              "Server connection failed"
            );
          }

          if (
            !data.files ||
            data.files.length === 0
          ) {

            showStatus(
              "No matching invoices found for today.",
              "error"
            );

            return;
          }

          const files =
            data.files;

          if (asZip) {

            showStatus(
              `Creating ZIP containing ${files.length} file(s)...`,
              "info",
              true
            );

            const zip =
              new JSZip();

            files.forEach((file) => {

              zip.file(
                file.name,
                file.data,
                {
                  base64: true
                }
              );
            });

            const content =
              await zip.generateAsync({
                type: "blob"
              });

            const url =
              window.URL.createObjectURL(
                content
              );

            const link =
              document.createElement("a");

            link.href = url;

            link.download =
              `${sanitizeClientFilename(
                vendor.vendorName
              )}_Invoices.zip`;

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(() => {
              window.URL.revokeObjectURL(url);
            }, 1000);

            showStatus(
              "Successfully created and downloaded ZIP.",
              "success"
            );

          } else {

            showStatus(
              `Processing ${files.length} file(s)...`,
              "info",
              true
            );

            await downloadFiles(
              files
            );

            showStatus(
              `Successfully downloaded ${files.length} invoice file(s).`,
              "success"
            );
          }

        } catch (error) {

          console.error(
            "Invoice download error:",
            error
          );

          showStatus(
            `Error: ${error.message}`,
            "error"
          );

        } finally {

          enableControls();
        }
      }

      /*
       * ============================================================
       * DOWNLOAD MULTIPLE FILES
       * ============================================================
       */

      async function downloadFiles(files) {

        for (
          let index = 0;
          index < files.length;
          index++
        ) {

          const file =
            files[index];

          downloadBase64File(
            file
          );

          /*
           * Small delay prevents browsers from blocking a large
           * number of downloads at the same instant.
           */
          if (index < files.length - 1) {
            await sleep(600);
          }
        }
      }

      /*
       * ============================================================
       * BASE64 FILE DOWNLOAD
       * ============================================================
       */

      function downloadBase64File(file) {

        if (
          !file ||
          !file.data ||
          !file.name
        ) {
          console.warn(
            "Invalid file received:",
            file
          );

          return;
        }

        const mimeType =
          file.mimeType ||
          "application/pdf";

        const link =
          document.createElement("a");

        link.href =
          `data:${mimeType};base64,${file.data}`;

        link.download =
          file.name;

        document.body.appendChild(link);

        link.click();

        link.remove();
      }

      /*
       * ============================================================
       * RESPONSE PARSER
       * ============================================================
       */

      async function parseJsonResponse(
        response
      ) {

        const text =
          await response.text();

        if (!text) {
          return {};
        }

        try {

          return JSON.parse(text);

        } catch (error) {

          console.error(
            "Invalid JSON response:",
            text
          );

          throw new Error(
            "Server returned an invalid response."
          );
        }
      }

      /*
       * ============================================================
       * STATUS
       * ============================================================
       */

      function showStatus(
        message,
        type,
        isLoading = false
      ) {

        const statusBox =
          document.getElementById(
            "statusBox"
          );

        const statusText =
          document.getElementById(
            "statusText"
          );

        const spinner =
          document.getElementById(
            "loadingSpinner"
          );

        statusBox.className =
          `status-container status-${type}`;

        statusText.textContent =
          message;

        spinner.style.display =
          isLoading
            ? "block"
            : "none";
      }

      /*
       * ============================================================
       * UTILITIES
       * ============================================================
       */

      function sleep(milliseconds) {

        return new Promise(
          (resolve) =>
            setTimeout(
              resolve,
              milliseconds
            )
        );
      }

      function sanitizeClientFilename(
        filename
      ) {

        return String(filename)
          .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
          .trim()
          .substring(0, 150);
      }
    </script>
  </body>
</html>
