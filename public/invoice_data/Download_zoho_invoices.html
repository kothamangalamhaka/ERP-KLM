<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zoho Invoice Sync Hub</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="/node_xlsx_scripts/jszip.min.js"></script>

    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --secondary-color: #10b981;
        --secondary-hover: #059669;
        --bill-color: #f59e0b;
        --bill-hover: #d97706;
        --check-color: #64748b;
        --check-hover: #475569;

        --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
        --card-bg: #ffffff;
        --input-bg: #f8fafc;
        --input-focus-bg: #ffffff;
        --icon-bg: #eff6ff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --card-shadow:
          0 10px 40px -10px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.02);
        --disabled-btn: #cbd5e1;
      }

      [data-theme="dark"] {
        --bg-gradient: radial-gradient(
          circle at 20% 20%,
          #1e293b 0%,
          #090d16 100%
        );
        --card-bg: #111827;
        --input-bg: #1f2937;
        --input-focus-bg: #1f2937;
        --icon-bg: rgba(37, 99, 235, 0.18);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --card-shadow:
          0 20px 50px -12px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        --disabled-btn: #334155;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-gradient);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: var(--text-main);
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      .app-wrapper {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        width: 100%;
        max-width: 540px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition:
          background-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .app-wrapper::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--secondary-color)
        );
      }

      .theme-toggle-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        min-height: auto !important;
        padding: 6px 12px !important;
        border-radius: 20px !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        flex-direction: row !important;
        gap: 5px !important;
        background: var(--input-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color) !important;
        box-shadow: none !important;
        cursor: pointer;
      }

      .theme-toggle-btn:hover {
        border-color: var(--primary-color) !important;
        transform: none !important;
      }

      .header-icon {
        background: var(--icon-bg);
        color: var(--primary-color);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.15);
      }

      h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 26px;
      }

      .form-group {
        text-align: left;
        margin-bottom: 22px;
      }

      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        color: var(--text-main);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .custom-select {
        position: relative;
      }

      select {
        width: 100%;
        padding: 14px 45px 14px 16px;
        font-family: inherit;
        font-size: 15px;
        color: var(--text-main);
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        appearance: none;
        outline: none;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      select:focus {
        border-color: var(--primary-color);
        background-color: var(--input-focus-bg);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      }

      select:disabled {
        cursor: not-allowed;
        opacity: 0.75;
      }

      .date-corner-wrap {
        position: absolute;
        top: 18px;
        left: 18px;
        display: flex;
        align-items: center;
      }

      .date-emoji-btn {
        min-height: auto !important;
        padding: 6px 10px !important;
        border-radius: 20px !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        flex-direction: row !important;
        gap: 5px !important;
        background: var(--input-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color) !important;
        box-shadow: none !important;
        cursor: pointer;
      }

      .date-emoji-btn:hover {
        border-color: var(--primary-color) !important;
        transform: none !important;
      }

      .date-emoji-btn.has-custom-date {
        border-color: var(--primary-color) !important;
        background: var(--icon-bg);
      }

      #hiddenDatePicker {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .custom-select::after {
        content: "▼";
        font-size: 10px;
        color: var(--text-muted);
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .browser-hint {
        margin-top: 8px;
        font-size: 11.5px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .action-cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: none;
        padding: 16px 10px;
        min-height: 82px;
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        color: white;
      }

      button:disabled {
        background-color: var(--disabled-btn) !important;
        color: #94a3b8 !important;
        box-shadow: none !important;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn-check {
        background-color: var(--check-color);
        box-shadow: 0 4px 14px 0 rgba(100, 116, 139, 0.35);
      }

      .btn-check:hover:not(:disabled) {
        background-color: var(--check-hover);
        transform: translateY(-2px);
      }

      .btn-zip {
        background-color: var(--secondary-color);
        box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.35);
      }

      .btn-zip:hover:not(:disabled) {
        background-color: var(--secondary-hover);
        transform: translateY(-2px);
      }

      .btn-pdf {
        background-color: var(--primary-color);
        box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.35);
      }

      .btn-pdf:hover:not(:disabled) {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
      }

      .btn-bill {
        background-color: var(--bill-color);
        box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.35);
      }

      .btn-bill:hover:not(:disabled) {
        background-color: var(--bill-hover);
        transform: translateY(-2px);
      }

      .btn-icon {
        font-size: 18px;
      }

      .status-container {
        margin-top: 25px;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
      }

      .status-info {
        background: rgba(37, 99, 235, 0.12);
        color: #3b82f6;
        border: 1px solid rgba(59, 130, 246, 0.3);
        display: flex;
      }

      .status-success {
        background: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
        display: flex;
      }

      .status-error {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        display: flex;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(59, 130, 246, 0.25);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        .app-wrapper {
          padding: 36px 20px 30px;
        }

        .action-cards {
          grid-template-columns: 1fr 1fr;
        }

        button {
          min-height: 65px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app-wrapper">
      <div class="date-corner-wrap">
        <button
          type="button"
          id="dateCornerBtn"
          class="date-emoji-btn"
          onclick="openCornerCalendar()"
          title="Select Date (Default: Today)"
        >
          <span>📅</span>
          <span
            id="dateCornerLabel"
            style="font-size: 11px; display: none"
          ></span>
        </button>
        <input
          type="date"
          id="hiddenDatePicker"
          onchange="onCornerDatePicked()"
        />
      </div>

      <button
        type="button"
        id="themeToggleBtn"
        class="theme-toggle-btn"
        onclick="toggleTheme()"
      >
        🌙 Dark
      </button>

      <div class="header-icon">📥</div>

      <h2>Invoice Download Hub</h2>

      <p>
        Securely fetch and download today's registered invoices from the mail
        server to your local system.
      </p>

      <div class="form-group">
        <label for="vendorSelect">Select Vendor Profile</label>

        <div class="custom-select">
          <select id="vendorSelect" disabled>
            <option value="">Establishing connection...</option>
          </select>
        </div>

        <div id="browserModeHint" class="browser-hint"></div>
      </div>

      <div class="action-cards">
        <button
          id="btnCheck"
          class="btn-check"
          type="button"
          onclick="checkFileCount()"
          disabled
        >
          <span class="btn-icon">🔍</span>
          <span>Check</span>
        </button>

        <button
          id="btnZip"
          class="btn-zip"
          type="button"
          onclick="startDownload(true)"
          disabled
        >
          <span class="btn-icon">📦</span>
          <span>ZIP</span>
        </button>

        <button
          id="btnIndiv"
          class="btn-pdf"
          type="button"
          onclick="startDownload(false)"
          disabled
        >
          <span class="btn-icon">📥</span>
          <span>PDF</span>
        </button>

        <button
          id="btnBill"
          class="btn-bill"
          type="button"
          onclick="startBillProcess()"
          disabled
        >
          <span class="btn-icon">🧾</span>
          <span>Bill</span>
        </button>
      </div>

      <div id="statusBox" class="status-container">
        <div id="loadingSpinner" class="spinner" style="display: none"></div>
        <span id="statusText"></span>
      </div>
    </div>

    <script>
      "use strict";

      /* ============================================================
         THEME MANAGEMENT (DARK / LIGHT)
         ============================================================ */
      function applySavedTheme() {
        const saved = localStorage.getItem("zoho_hub_theme") || "dark";
        document.documentElement.setAttribute("data-theme", saved);
        const btn = document.getElementById("themeToggleBtn");
        if (btn) {
          btn.textContent = saved === "dark" ? "☀️ Light" : "🌙 Dark";
        }
      }

      function toggleTheme() {
        const current =
          document.documentElement.getAttribute("data-theme") || "dark";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("zoho_hub_theme", next);
        const btn = document.getElementById("themeToggleBtn");
        if (btn) {
          btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
        }
      }

      applySavedTheme();

      /* ============================================================
         BROWSER DETECTION & FOLDER PICKER SUPPORT
         ============================================================ */
      function detectBrowserInfo() {
        const ua = navigator.userAgent;
        let name = "Browser";
        if (ua.includes("Edg/")) name = "Microsoft Edge";
        else if (ua.includes("Firefox/")) name = "Mozilla Firefox";
        else if (ua.includes("Chrome/")) name = "Google Chrome";
        else if (ua.includes("Safari/")) name = "Safari";

        const supportsFolderPicker =
          typeof window.showDirectoryPicker === "function" &&
          window.isSecureContext;

        return { name, supportsFolderPicker };
      }

      const browserInfo = detectBrowserInfo();

      function updateBrowserHint() {
        const hintEl = document.getElementById("browserModeHint");
        if (!hintEl) return;
        if (browserInfo.supportsFolderPicker) {
          hintEl.textContent = `📁 ${browserInfo.name}: Direct folder save popup enabled for PDF & Bill.`;
        } else {
          hintEl.textContent = `⬇️ ${browserInfo.name}: Files will save to your default Downloads folder.`;
        }
      }

      /* ============================================================
         DOM ELEMENTS
         ============================================================ */
      const vendorSelect = document.getElementById("vendorSelect");
      const hiddenDatePicker = document.getElementById("hiddenDatePicker");
      const dateCornerBtn = document.getElementById("dateCornerBtn");
      const dateCornerLabel = document.getElementById("dateCornerLabel");
      const btnCheck = document.getElementById("btnCheck");
      const btnZip = document.getElementById("btnZip");
      const btnIndiv = document.getElementById("btnIndiv");
      const btnBill = document.getElementById("btnBill");

      function getLocalTodayIso() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function openCornerCalendar() {
        if (!hiddenDatePicker.value) {
          hiddenDatePicker.value = getLocalTodayIso();
        }
        if (typeof hiddenDatePicker.showPicker === "function") {
          hiddenDatePicker.showPicker();
        } else {
          hiddenDatePicker.click();
        }
      }

      function onCornerDatePicked() {
        const val = hiddenDatePicker.value;
        const today = getLocalTodayIso();
        if (!val || val === today) {
          dateCornerBtn.classList.remove("has-custom-date");
          dateCornerLabel.style.display = "none";
          dateCornerLabel.textContent = "";
        } else {
          dateCornerBtn.classList.add("has-custom-date");
          const parts = val.split("-");
          dateCornerLabel.textContent = `${parts[2]}-${parts[1]}`;
          dateCornerLabel.style.display = "inline";
        }
      }

      function getDateFilterParams() {
        const val = hiddenDatePicker ? hiddenDatePicker.value : "";
        const today = getLocalTodayIso();
        if (!val || val === today) {
          return { dateMode: "today", customDate: "", label: "today's" };
        }
        return { dateMode: "custom", customDate: val, label: val };
      }

      /* ============================================================
         PAGE INITIALIZATION
         ============================================================ */
      window.addEventListener("DOMContentLoaded", () => {
        updateBrowserHint();
        loadVendors();
      });

      async function loadVendors() {
        disableControls();
        vendorSelect.innerHTML = "";
        const loadingOption = document.createElement("option");
        loadingOption.value = "";
        loadingOption.textContent = "Establishing connection...";
        vendorSelect.appendChild(loadingOption);

        try {
          const response = await fetch("/api/invoice-vendors", {
            method: "GET",
            headers: { Accept: "application/json" },
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`Server returned HTTP ${response.status}`);
          }

          const vendors = await response.json();
          populateDropdown(vendors);

          showStatus(
            "Connected successfully. Select a vendor.",
            "success",
            false,
          );
        } catch (error) {
          console.error("Vendor loading error:", error);
          vendorSelect.innerHTML = "";
          const errorOption = document.createElement("option");
          errorOption.value = "";
          errorOption.textContent = "Unable to connect to server";
          vendorSelect.appendChild(errorOption);

          showStatus(
            `Failed to establish connection with server: ${error.message}`,
            "error",
            false,
          );
        }
      }

      function populateDropdown(vendors) {
        vendorSelect.innerHTML = "";

        if (
          !vendors ||
          typeof vendors !== "object" ||
          Object.keys(vendors).length === 0
        ) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "No vendor profiles available";
          vendorSelect.appendChild(option);
          disableControls();
          return;
        }

        for (const key of Object.keys(vendors)) {
          const vendor = vendors[key];
          const option = document.createElement("option");
          option.value = key;
          option.textContent = vendor.label || key;
          vendorSelect.appendChild(option);
        }

        enableControls();
        vendorSelect.focus();
      }

      function disableControls() {
        vendorSelect.disabled = true;
        btnCheck.disabled = true;
        btnZip.disabled = true;
        btnIndiv.disabled = true;
        btnBill.disabled = true;
      }

      function enableControls() {
        vendorSelect.disabled = false;
        btnCheck.disabled = false;
        btnZip.disabled = false;
        btnIndiv.disabled = false;
        btnBill.disabled = false;
      }

      function getSelectedVendor() {
        const vendorKey = vendorSelect.value;
        if (!vendorKey) {
          throw new Error("Please select a vendor.");
        }
        const selectedOption = vendorSelect.options[vendorSelect.selectedIndex];
        const vendorName = selectedOption
          ? selectedOption.textContent
          : vendorKey;
        return { vendorKey, vendorName };
      }

      /* ============================================================
         FAST CHECK FILE COUNT (NO HEAVY BASE64 PAYLOAD)
         ============================================================ */
      async function checkFileCount() {
        let vendor, dateParams;
        try {
          vendor = getSelectedVendor();
          dateParams = getDateFilterParams();
        } catch (error) {
          showStatus(error.message, "error");
          return;
        }

        disableControls();
        showStatus(
          `Checking ${dateParams.label} invoices for ${vendor.vendorName}...`,
          "info",
          true,
        );

        try {
          const response = await fetch("/api/invoice-download", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              vendorKey: vendor.vendorKey,
              countOnly: true,
              dateMode: dateParams.dateMode,
              customDate: dateParams.customDate,
            }),
          });

          const data = await parseJsonResponse(response);

          if (!response.ok) {
            throw new Error(
              data.detail || data.error || "Server connection failed",
            );
          }

          const count =
            typeof data.count === "number"
              ? data.count
              : data.files
                ? data.files.length
                : 0;

          if (count === 0) {
            showStatus("No matching invoices found for today.", "error");
            return;
          }

          const billInfo =
            typeof data.billMatchedCount === "number"
              ? ` (${data.billMatchedCount} matched with Bill No)`
              : "";
          showStatus(
            `Found ${count} invoice file(s)${billInfo} ready to download.`,
            "success",
          );
        } catch (error) {
          console.error("Check count error:", error);
          showStatus(`Error: ${error.message}`, "error");
        } finally {
          enableControls();
        }
      }

      /* ============================================================
         FOLDER PICKER HELPER (CHROME / EDGE + FIREFOX FALLBACK)
         ============================================================ */
      async function pickTargetDirectory() {
        if (!browserInfo.supportsFolderPicker) {
          return null;
        }
        try {
          const dirHandle = await window.showDirectoryPicker({
            mode: "readwrite",
          });
          return dirHandle;
        } catch (err) {
          if (err && err.name === "AbortError") {
            throw new Error("Folder selection cancelled.");
          }
          console.warn(
            "Directory picker unavailable, falling back to browser download:",
            err,
          );
          return null;
        }
      }

      function base64ToUint8Array(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
      }

      async function saveFilesToDirectoryOrDownload(
        files,
        dirHandle,
        typeLabel = "file",
      ) {
        const total = files.length;

        if (dirHandle) {
          for (let index = 0; index < total; index++) {
            const file = files[index];
            showStatus(
              `Saving ${index + 1}/${total} ${typeLabel} to "${dirHandle.name}"...`,
              "info",
              true,
            );
            const fileHandle = await dirHandle.getFileHandle(file.name, {
              create: true,
            });
            const writable = await fileHandle.createWritable();
            const bytes = base64ToUint8Array(file.data);
            await writable.write(bytes);
            await writable.close();
          }
          return `Saved ${total} ${typeLabel} file(s) inside folder "${dirHandle.name}".`;
        } else {
          for (let index = 0; index < total; index++) {
            const file = files[index];
            showStatus(
              `Downloading ${index + 1}/${total} ${typeLabel} file(s)...`,
              "info",
              true,
            );
            downloadBase64File(file);
            if (index < total - 1) {
              await sleep(600);
            }
          }
          return `Successfully downloaded ${total} ${typeLabel} file(s).`;
        }
      }

      /* ============================================================
         BILL DOWNLOAD
         ============================================================ */
      async function startBillProcess() {
        let vendor, dateParams;
        try {
          vendor = getSelectedVendor();
          dateParams = getDateFilterParams();
        } catch (error) {
          showStatus(error.message, "error");
          return;
        }

        let dirHandle = null;
        try {
          dirHandle = await pickTargetDirectory();
        } catch (cancelErr) {
          showStatus(cancelErr.message, "error");
          return;
        }

        disableControls();
        showStatus(
          `Processing ${dateParams.label} Bills for ${vendor.vendorName}...`,
          "info",
          true,
        );

        try {
          const response = await fetch("/api/invoice-bill-download", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              vendorKey: vendor.vendorKey,
              dateMode: dateParams.dateMode,
              customDate: dateParams.customDate,
            }),
          });

          const data = await parseJsonResponse(response);

          if (!response.ok) {
            throw new Error(
              data.detail || data.error || "Server connection failed",
            );
          }

          if (!data.files || data.files.length === 0) {
            showStatus("No matching bills found for today.", "error");
            return;
          }

          const doneMsg = await saveFilesToDirectoryOrDownload(
            data.files,
            dirHandle,
            "bill",
          );
          showStatus(doneMsg, "success");
        } catch (error) {
          console.error("Bill download error:", error);
          showStatus(`Error: ${error.message}`, "error");
        } finally {
          enableControls();
        }
      }

      /* ============================================================
         NORMAL INVOICE DOWNLOAD (ZIP OR PDF)
         ============================================================ */
      async function startDownload(asZip) {
        let vendor, dateParams;
        try {
          vendor = getSelectedVendor();
          dateParams = getDateFilterParams();
        } catch (error) {
          showStatus(error.message, "error");
          return;
        }

        let dirHandle = null;
        if (!asZip) {
          try {
            dirHandle = await pickTargetDirectory();
          } catch (cancelErr) {
            showStatus(cancelErr.message, "error");
            return;
          }
        }

        disableControls();
        showStatus(
          `Scanning mailbox for ${dateParams.label} ${vendor.vendorName} invoices...`,
          "info",
          true,
        );

        try {
          const response = await fetch("/api/invoice-download", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              vendorKey: vendor.vendorKey,
              dateMode: dateParams.dateMode,
              customDate: dateParams.customDate,
            }),
          });

          const data = await parseJsonResponse(response);

          if (!response.ok) {
            throw new Error(
              data.detail || data.error || "Server connection failed",
            );
          }

          if (!data.files || data.files.length === 0) {
            showStatus("No matching invoices found for today.", "error");
            return;
          }

          const files = data.files;

          if (asZip) {
            showStatus(
              `Creating ZIP containing ${files.length} file(s)...`,
              "info",
              true,
            );
            const zip = new JSZip();

            files.forEach((file) => {
              zip.file(file.name, file.data, { base64: true });
            });

            const content = await zip.generateAsync({ type: "blob" });
            const url = window.URL.createObjectURL(content);
            const link = document.createElement("a");

            link.href = url;
            link.download = `${sanitizeClientFilename(vendor.vendorName)}_Invoices.zip`;
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => {
              window.URL.revokeObjectURL(url);
            }, 1000);

            showStatus("Successfully created and downloaded ZIP.", "success");
          } else {
            const doneMsg = await saveFilesToDirectoryOrDownload(
              files,
              dirHandle,
              "invoice",
            );
            showStatus(doneMsg, "success");
          }
        } catch (error) {
          console.error("Invoice download error:", error);
          showStatus(`Error: ${error.message}`, "error");
        } finally {
          enableControls();
        }
      }

      /* ============================================================
         BASE64 FILE DOWNLOAD (FALLBACK FOR FIREFOX / NON-HTTPS)
         ============================================================ */
      function downloadBase64File(file) {
        if (!file || !file.data || !file.name) {
          console.warn("Invalid file received:", file);
          return;
        }

        const mimeType = file.mimeType || "application/pdf";
        const link = document.createElement("a");
        link.href = `data:${mimeType};base64,${file.data}`;
        link.download = file.name;

        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function parseJsonResponse(response) {
        const text = await response.text();
        if (!text) {
          return {};
        }
        try {
          return JSON.parse(text);
        } catch (error) {
          console.error("Invalid JSON response:", text);
          throw new Error("Server returned an invalid response.");
        }
      }

      function showStatus(message, type, isLoading = false) {
        const statusBox = document.getElementById("statusBox");
        const statusText = document.getElementById("statusText");
        const spinner = document.getElementById("loadingSpinner");

        statusBox.className = `status-container status-${type}`;
        statusText.textContent = message;
        spinner.style.display = isLoading ? "block" : "none";
      }

      function sleep(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      function sanitizeClientFilename(filename) {
        return String(filename)
          .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
          .trim()
          .substring(0, 150);
      }
    </script>
  </body>
</html>
