<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay - Dashboard</title>
    <style>
        /* അടിസ്ഥാന സ്റ്റൈലിംഗ് */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* നടുവിലെ ബോക്സ് ഡിസൈൻ */
        .dashboard-container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .dashboard-container h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .dashboard-container p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* ലിങ്കുകളെ ബട്ടണുകളാക്കി മാറ്റാനുള്ള കോഡ് */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* ഹോവർ എഫക്ട് - മൗസ് വെക്കുമ്പോൾ ബട്ടൺ അല്പം പൊന്തിവരും */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* ഓരോ ബട്ടണിനും വ്യത്യസ്ത നിറങ്ങൾ */
        .btn-water-non {
            background-color: #3498db; /* നീല */
        }
        .btn-water-non:hover {
            background-color: #2980b9;
        }

        .btn-water-vat {
            background-color: #2ecc71; /* പച്ച */
        }
        .btn-water-vat:hover {
            background-color: #27ae60;
        }

        .btn-delivery {
            background-color: #f39c12; /* ഓറഞ്ച് */
        }
        .btn-delivery:hover {
            background-color: #d68910;
        }

        /* മൊബൈൽ ഫോണുകൾക്കുള്ള റെസ്പോൺസീവ് ഡിസൈൻ */
        @media (max-width: 480px) {
            .dashboard-container {
                padding: 30px 20px;
            }
            .btn {
                font-size: 15px;
                padding: 14px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Welcome, Akshay</h1>
        <p>Please select a document to proceed</p>

        <div class="links-grid">
            <!-- ഐക്കണുകൾ കൂടി ഉൾപ്പെടുത്തിയിട്ടുണ്ട് -->
            <a href="./Water-bill-non-vat.html" class="btn btn-water-non">
                💧 Water Bill (Non-VAT)
            </a>
            
            <a href="./Water-bill-vat.html" class="btn btn-water-vat">
                🧾 Water Bill (VAT)
            </a>
            
            <a href="./Delivery_note.html" class="btn btn-delivery">
                🚚 Delivery Note
            </a>
        </div>
    </div>

</body>
</html>
