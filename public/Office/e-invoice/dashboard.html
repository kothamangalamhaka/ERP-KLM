<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>E-Invoice Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; padding: 25px; color: #1e293b; }
      .container { max-width: 1500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
      .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
      .header-title-group { display: flex; align-items: center; gap: 14px; }
      h2 { margin: 0; color: #0f172a; font-size: 20px; }
      .btn { padding: 8px 16px; border-radius: 5px; font-weight: 600; cursor: pointer; border: none; font-size: 13px; text-decoration: none; }
      .btn-primary { background: #2563eb; color: white; }
      .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
      .btn-detail-toggle { background: #f1f5f9; border: 1.5px solid #cbd5e1; color: #334155; padding: 6px 13px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
      .btn-detail-toggle:hover { background: #e2e8f0; color: #0f172a; }
      .btn-detail-toggle.active { background: #0284c7; color: #ffffff; border-color: #0284c7; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35); }
      .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; vertical-align: middle; }
      th { background: #1e293b; color: white; font-weight: 600; font-size: 11.5px; white-space: nowrap; }
      tr:hover { background: #f8fafc; }
      .inv-tag { font-family: monospace; font-weight: 700; color: #2563eb; white-space: nowrap; }
      .btn-action { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
      .btn-view { background: #0284c7; color: white; }
      .btn-dl { background: #10b981; color: white; }

      /* Detail View Columns Toggle Class */
      .table-wrapper.hide-details .col-detail { display: none !important; }

      /* Multi-line cell styles for SEQ, Hours & Rates */
      .multi-cell-stack { display: flex; flex-direction: column; gap: 4px; }
      .multi-line-item { min-height: 18px; line-height: 18px; white-space: nowrap; font-family: monospace; }
      .multi-line-item.center { text-align: center; }
      .multi-line-item.right { text-align: right; }

      /* Floating Toast Notification */
      #dashToast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #0f172a;
        color: #ffffff;
        padding: 14px 22px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        border-left: 4px solid #10b981;
        display: none;
        align-items: center;
        gap: 12px;
        z-index: 999999;
        transition: all 0.3s ease;
      }
      .toast-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #ffffff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 🟢 Dashboard Floating Toast -->
    <div id="dashToast">
      <div id="dashToastSpinner" class="toast-spinner"></div>
      <span id="dashToastMsg">Preparing Download...</span>
    </div>

    <!-- 🟢 Security Lock Overlay -->
    <div id="securityOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:99999; display:flex; align-items:center; justify-content:center;">
      <div style="background:white; padding:30px; border-radius:10px; width:340px; text-align:center; box-shadow:0 15px 30px rgba(0,0,0,0.3);">
        <div style="font-size:42px; margin-bottom:10px;">🔒</div>
        <h3 style="margin:0 0 10px 0; color:#1e293b;">Security Verification</h3>
        <p style="font-size:12px; color:#64748b; margin-bottom:18px;"></p>
        <input type="password" id="secCodeInput" placeholder="Enter Security Code" style="width:100%; box-sizing:border-box; padding:10px; border:1.5px solid #cbd5e1; border-radius:6px; font-size:14px; text-align:center; outline:none; margin-bottom:12px;" onkeydown="if(event.key==='Enter') verifyDashboardAccess();" />
        <div id="secErrorMsg" style="color:#ef4444; font-size:12px; margin-bottom:10px; display:none;"></div>
        <button class="btn btn-primary" style="width:100%; padding:10px; font-size:13px;" onclick="verifyDashboardAccess()">Unlock Dashboard 🔓</button>
      </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
      <div class="header-bar">
        <div class="header-title-group">
          <h2>🧾 Bill Summary Dashboard</h2>
          <button id="btnDetailToggle" class="btn-detail-toggle" onclick="toggleDetailView()">
            👁️ Detail View
          </button>
        </div>
        <div style="display: flex; gap: 10px;">
          <button onclick="exportDashboardToExcel()" class="btn" style="background: #10b981; color: white;">📊 Export Excel</button>
          <a href="../Billing/index.html" class="btn btn-primary">Admin</a>
          <a href="index.html" class="btn btn-primary">Generate Invoice</a>
          <a href="companydata.html" class="btn btn-outline">⚙️ Company Data</a>
        </div>
      </div>

      <div class="table-wrapper hide-details" id="dashboardTableWrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 85px;">Bill Date</th>
              <th>Bill No</th>
              <th>Company Name</th>
              <th>Vendor Name</th>
              <th>Nick Name</th>
              <th style="width: 80px;">Month</th>
              <th class="col-detail" style="width: 50px; text-align: center;">SEQ</th>
              <th class="col-detail" style="width: 75px; text-align: center;">Normal Hr</th>
              <th class="col-detail" style="width: 70px; text-align: right;">Rate</th>
              <th class="col-detail" style="width: 75px; text-align: center;">Over Time</th>
              <th class="col-detail" style="width: 70px; text-align: right;">Rate</th>
              <th style="width: 85px; text-align: right;">Grand Total</th>
              <th style="width: 140px; text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="invoicesListBody">
            <tr><td colspan="13" style="text-align: center;">Loading dashboard data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function exportDashboardToExcel() {
  try {
    showDashToast("Generating Excel file...", true);
    
    // Tailscale / Funnel-ലും ലോക്കലിലും ഒരുപോലെ വർക്ക് ചെയ്യാൻ പോർട്ട് ഹാർഡ്‌കോഡ് ചെയ്യാതെ പ്രോക്സി വഴി അല്ലെങ്കിൽ കറക്റ്റ് പോർട്ടിലേക്ക് റൂട്ട് ചെയ്യുക
    const isTailscaleOrRemote = window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1";
    
    // Funnel / Remote ആണെങ്കിൽ റിലേറ്റീവ് പാത്ത് (പ്രോക്സി ഉള്ളതെങ്കിൽ) അല്ലെങ്കിൽ കറക്റ്റ് സ്കീം ഉപയോഗിക്കുക
    let exportUrl = `/py/einvoice/export-dashboard-excel`;
    
    // ഒരുപക്ഷേ Node.js റിവേഴ്സ് പ്രോക്സി ഇല്ലാതെ 8001 നേരിട്ടാണ് തുറന്നിട്ടിരിക്കുന്നതെങ്കിൽ മാത്രം:
    if (!isTailscaleOrRemote) {
      exportUrl = `http://${window.location.hostname}:8001/py/einvoice/export-dashboard-excel`;
    }

    const response = await fetch(exportUrl);
    
    if (!response.ok) throw new Error("Excel generation failed: " + response.statusText);
          
          const blob = await response.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = `E_Invoices_Detailed_${new Date().toISOString().slice(0,10)}.xlsx`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(downloadUrl);
          
          showDashToast("✅ Excel Downloaded Successfully!", false);
        } catch (err) {
          console.error(err);
          showDashToast("❌ Export Failed!", false);
        }
      }

      async function loadDashboardInvoices() {
        const res = await fetch("/e-invoice/api/dashboard-invoices");
        const data = await res.json();
        const tbody = document.getElementById("invoicesListBody");
        tbody.innerHTML = "";

        if (data.success && data.invoices.length > 0) {
          data.invoices.forEach(inv => {
            // raw_payload-ൽ നിന്ന് manual_items വേർതിരിച്ചെടുക്കുന്നു
            let items = [];
            if (inv.raw_payload) {
              const payload = typeof inv.raw_payload === 'string' ? JSON.parse(inv.raw_payload) : inv.raw_payload;
              items = payload.manual_items || [];
            }

            // മൾട്ടി-ലൈൻ റോകൾ തയ്യാറാക്കുന്നു (Normal & Overtime ഗ്രൂപ്പിംഗ്)
            const seqList = [];
            const normalHrList = [];
            const normalRateList = [];
            const otHrList = [];
            const otRateList = [];

            if (items && items.length > 0) {
              // 1. Equipments vs Overtime തിരിക്കുന്നു
              const equipments = [];
              const overtimes = [];

              items.forEach((row, idx) => {
                const vtype = (row.vtype || "").trim();
                const cleanV = vtype.toLowerCase();
                const isOT = cleanV.includes("overtime") || cleanV.includes("over time") || /\bot\b/i.test(cleanV);
                const seq = row.seq !== undefined && row.seq !== "" ? String(row.seq).trim() : String(idx + 1);
                const qty = parseFloat(row.qty) || 0;
                const rate = parseFloat(row.rate) || 0;

                if (isOT) {
                  overtimes.push({ seq, qty, rate });
                } else {
                  equipments.push({ seq, qty, rate, otQty: 0, otRate: 0 });
                }
              });

              // Overtime-നെ ഉപകരണങ്ങളുടെ അതേ SEQ-ലേക്ക് മാപ്പ് ചെയ്യുന്നു
              overtimes.forEach(ot => {
                let match = equipments.find(e => e.seq === ot.seq);
                if (!match && equipments.length > 0) match = equipments[0];
                if (match) {
                  match.otQty += ot.qty;
                  match.otRate = ot.rate;
                } else {
                  equipments.push({ seq: ot.seq, qty: 0, rate: 0, otQty: ot.qty, otRate: ot.rate });
                }
              });

              equipments.forEach(eq => {
                seqList.push(`<div class="multi-line-item center">${eq.seq || '-'}</div>`);
                normalHrList.push(`<div class="multi-line-item center">${eq.qty > 0 ? eq.qty : '-'}</div>`);
                normalRateList.push(`<div class="multi-line-item right">${eq.qty > 0 ? parseFloat(eq.rate).toFixed(2) : '-'}</div>`);
                otHrList.push(`<div class="multi-line-item center">${eq.otQty > 0 ? eq.otQty : '-'}</div>`);
                otRateList.push(`<div class="multi-line-item right">${eq.otQty > 0 ? parseFloat(eq.otRate).toFixed(2) : '-'}</div>`);
              });
            }

            const seqHtml = seqList.length > 0 ? `<div class="multi-cell-stack">${seqList.join('')}</div>` : '-';
            const normalHrHtml = normalHrList.length > 0 ? `<div class="multi-cell-stack">${normalHrList.join('')}</div>` : '-';
            const normalRateHtml = normalRateList.length > 0 ? `<div class="multi-cell-stack">${normalRateList.join('')}</div>` : '-';
            const otHrHtml = otHrList.length > 0 ? `<div class="multi-cell-stack">${otHrList.join('')}</div>` : '-';
            const otRateHtml = otRateList.length > 0 ? `<div class="multi-cell-stack">${otRateList.join('')}</div>` : '-';

            tbody.innerHTML += `
              <tr>
                <td style="white-space:nowrap; font-family:monospace;">${inv.invoice_date || '-'}</td>
                <td><span class="inv-tag">${inv.invoice_no}</span></td>
                <td><b>${inv.company_name || '-'}</b></td>
                <td>${inv.vendor_name || '-'}</td>
                <td style="color:#0284c7; font-weight:600;">${inv.nickname || '-'}</td>
                <td style="white-space:nowrap;">${inv.billing_month || '-'}</td>
                <td class="col-detail">${seqHtml}</td>
                <td class="col-detail">${normalHrHtml}</td>
                <td class="col-detail">${normalRateHtml}</td>
                <td class="col-detail">${otHrHtml}</td>
                <td class="col-detail">${otRateHtml}</td>
                <td style="font-weight:700; text-align:right; font-family:monospace;">${parseFloat(inv.grand_total || 0).toFixed(2)}</td>
                <td style="text-align: center;">
                  <div style="display:flex; gap: 6px; justify-content: center; position: relative;">
                    <button class="btn-action btn-view" onclick="viewInvoice(${inv.id})">👁️ View</button>
                    <div style="position: relative; display: inline-block;">
                      <button class="btn-action btn-dl" onclick="toggleDashDlMenu(event, ${inv.id})">⬇️ Download</button>
                      <div id="dlDropdown_${inv.id}" class="dash-dl-menu" style="display: none; position: absolute; right: 0; top: 110%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; box-shadow: 0 8px 18px rgba(0,0,0,0.35); z-index: 1000; min-width: 120px; overflow: hidden;">
                        <button style="width: 100%; text-align: left; padding: 7px 10px; background: transparent; border: none; color: #f8fafc; font-size: 11.5px; font-weight: 700; cursor: pointer;" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='transparent'" onclick="downloadInvoiceDirect(${inv.id}, false)">
                          📄 Bill Only
                        </button>
                        <button style="width: 100%; text-align: left; padding: 7px 10px; background: transparent; border: none; color: #f8fafc; font-size: 11.5px; font-weight: 700; cursor: pointer; border-top: 1px solid #1e293b;" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='transparent'" onclick="downloadInvoiceDirect(${inv.id}, true)">
                          📑 With TS
                        </button>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="13" style="text-align: center; padding: 20px; color: #64748b;">No saved invoices found. Generate one and click "Save to DB".</td></tr>';
        }
      }

      async function prepareInvoicePayload(id) {
        const res = await fetch(`/e-invoice/api/invoice/${id}`);
        const data = await res.json();
        if (!data.success || !data.invoice) {
          throw new Error("Failed to load invoice details");
        }

        const inv = data.invoice;
        let rawData = {};
        if (typeof inv.raw_payload === "object" && inv.raw_payload !== null) {
          rawData = inv.raw_payload;
        } else if (typeof inv.raw_payload === "string") {
          try { rawData = JSON.parse(inv.raw_payload); } catch(e) { rawData = {}; }
        }

        return {
          ...rawData,
          invoice_no: inv.invoice_no,
          company_id: inv.company_id || rawData.company_id || rawData.selected_company?.id,
          company_name: inv.company_name || rawData.company_name,
          vendor_name: inv.vendor_name || rawData.vendor_name,
          billing_month: inv.billing_month || rawData.billing_month,
          invoice_date: inv.invoice_date || rawData.invoice_date,
          remarks: inv.remarks || rawData.remarks || "",
          has_seal: inv.has_seal === true || rawData.has_seal === true
        };
      }

      async function viewInvoice(id) {
        try {
          const payload = await prepareInvoicePayload(id);
          sessionStorage.setItem("activeEInvoiceData", JSON.stringify(payload));
          sessionStorage.removeItem("autoDownloadPdfTrigger");
          window.open("index.html", "_blank");
        } catch (e) {
          alert(e.message || "Server error connecting to invoice API");
        }
      }

      function showDashToast(msg, isLoading = true) {
        const toast = document.getElementById("dashToast");
        const msgEl = document.getElementById("dashToastMsg");
        const spinner = document.getElementById("dashToastSpinner");
        if (!toast) return;

        msgEl.innerText = msg;
        spinner.style.display = isLoading ? "block" : "none";
        toast.style.borderLeftColor = isLoading ? "#0284c7" : "#10b981";
        toast.style.display = "flex";

        if (!isLoading) {
          setTimeout(() => {
            toast.style.display = "none";
          }, 3500);
        }
      }

      function toggleDashDlMenu(event, id) {
        event.stopPropagation();
        document.querySelectorAll(".dash-dl-menu").forEach(menu => {
          if (menu.id !== `dlDropdown_${id}`) menu.style.display = "none";
        });
        const current = document.getElementById(`dlDropdown_${id}`);
        if (current) {
          current.style.display = current.style.display === "block" ? "none" : "block";
        }
      }

      document.addEventListener("click", () => {
        document.querySelectorAll(".dash-dl-menu").forEach(menu => menu.style.display = "none");
      });

      async function downloadInvoiceDirect(id, withTs = true) {
        try {
          document.querySelectorAll(".dash-dl-menu").forEach(menu => menu.style.display = "none");

          showDashToast("Fetching invoice data...", true);

          const payload = await prepareInvoicePayload(id);
          sessionStorage.setItem("activeEInvoiceData", JSON.stringify(payload));
          sessionStorage.setItem("autoDownloadPdfTrigger", "true");

          showDashToast(`Generating PDF for ${payload.invoice_no}...`, true);

          let hiddenFrame = document.getElementById("hiddenDownloadFrame");
          if (!hiddenFrame) {
            hiddenFrame = document.createElement("iframe");
            hiddenFrame.id = "hiddenDownloadFrame";
            hiddenFrame.style.display = "none";
            document.body.appendChild(hiddenFrame);
          }

          hiddenFrame.src = `index.html?directDownload=true&withTs=${withTs}`;

          setTimeout(() => {
            showDashToast(`✅ PDF Downloaded: ${payload.invoice_no}`, false);
          }, 2500);

        } catch (e) {
          showDashToast("❌ Failed to download invoice!", false);
          console.error(e);
        }
      }

      async function verifyDashboardAccess() {
        const inputEl = document.getElementById("secCodeInput");
        const code = inputEl ? inputEl.value.trim() : "";
        const errEl = document.getElementById("secErrorMsg");

        if (!code) {
          errEl.innerText = "Please enter the security code.";
          errEl.style.display = "block";
          return;
        }

        try {
          const res = await fetch("/e-invoice/api/verify-security", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: code }),
          });
          const data = await res.json();

          if (data.success) {
            sessionStorage.setItem("vat_tracker_auth", "true");
            document.getElementById("securityOverlay").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            loadDashboardInvoices();
          } else {
            errEl.innerText = "Invalid Security Code. Access Denied!";
            errEl.style.display = "block";
            if (inputEl) inputEl.value = "";
          }
        } catch (e) {
          errEl.innerText = "Server verification failed.";
          errEl.style.display = "block";
        }
      }

      // Check if already authenticated in this session
      if (sessionStorage.getItem("vat_tracker_auth") === "true") {
        document.getElementById("securityOverlay").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        loadDashboardInvoices();
      } else {
        document.getElementById("securityOverlay").style.display = "flex";
        setTimeout(() => document.getElementById("secCodeInput")?.focus(), 200);
      }

      let isDetailViewActive = false;
      function toggleDetailView() {
        isDetailViewActive = !isDetailViewActive;
        const wrapper = document.getElementById("dashboardTableWrapper");
        const btn = document.getElementById("btnDetailToggle");
        if (!wrapper || !btn) return;

        if (isDetailViewActive) {
          wrapper.classList.remove("hide-details");
          btn.classList.add("active");
          btn.innerHTML = "👁️ Hide Details";
        } else {
          wrapper.classList.add("hide-details");
          btn.classList.remove("active");
          btn.innerHTML = "👁️ Detail View";
        }
      }
    </script>
  </body>
</html>
