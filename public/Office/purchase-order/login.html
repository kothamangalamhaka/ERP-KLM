<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Order - Authentication</title>
    <link rel="stylesheet" href="/node_xlsx_scripts/all.min.css" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("po_theme");
          const theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: rgba(255, 255, 255, 0.88);
        --text: #0f172a;
        --text-muted: #475569;
        --input-bg: #ffffff;
        --border: rgba(15, 23, 42, 0.14);
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --accent-link: #0284c7;
        --shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        --radius: 18px;
      }

      [data-theme="dark"] {
        --bg: #070b14;
        --surface: rgba(30, 41, 59, 0.78);
        --text: #f8fafc;
        --text-muted: #dbeafe;
        --input-bg: rgba(2, 6, 23, 0.5);
        --border: rgba(255, 255, 255, 0.18);
        --primary: #0e7490;
        --primary-hover: #0891b2;
        --accent-link: #67e8f9;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      body {
        position: relative;
        isolation: isolate;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        color: var(--text);
        background: var(--bg);
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      .theme-toggle {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 10;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
        box-shadow: var(--shadow);
      }

      .auth-card {
        position: relative;
        z-index: 1;
        width: min(100%, 390px);
        padding: 36px 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .auth-card h2 {
        margin: 0 0 24px;
        color: var(--text);
        font-size: 23px;
        font-weight: 700;
        text-align: center;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
      }

      .form-group input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 9px;
        outline: none;
        color: var(--text);
        background: var(--input-bg);
        font-size: 14px;
        transition: border-color 0.2s ease;
      }

      .form-group input:focus {
        border-color: var(--primary);
      }

      .btn {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        border: none;
        border-radius: 9px;
        color: #ffffff;
        background: var(--primary);
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        transition:
          background 0.2s ease,
          transform 0.15s ease;
      }

      .btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .toggle-link {
        margin-top: 16px;
        color: var(--accent-link);
        cursor: pointer;
        font-size: 13px;
        text-align: center;
      }

      .toggle-link:hover {
        text-decoration: underline;
      }

      .alert {
        display: none;
        margin-bottom: 16px;
        padding: 11px 13px;
        border-radius: 9px;
        font-size: 13px;
      }

      .alert-error {
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #ef4444;
        background: rgba(239, 68, 68, 0.12);
      }

      .alert-success {
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #10b981;
        background: rgba(16, 185, 129, 0.12);
      }
    </style>
  </head>
  <body>
    <button
      class="theme-toggle"
      id="themeBtn"
      onclick="toggleTheme()"
      title="Toggle Theme"
    >
      <i class="fas fa-moon"></i>
    </button>

    <div class="auth-card">
      <div id="alertBox" class="alert"></div>

      <div id="loginForm">
        <h2>Purchase Order Login</h2>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUser" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="loginPass"
            autocomplete="new-password"
            required
          />
        </div>
        <button class="btn" onclick="handlePoLogin()">Login</button>
        <div class="toggle-link" onclick="toggleView('signup')">
          New User? Sign Up Here
        </div>
      </div>

      <div id="signupForm" style="display: none">
        <h2>User Signup</h2>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signupUser" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="signupPass"
            autocomplete="new-password"
            required
          />
        </div>
        <button class="btn" onclick="handlePoSignup()">Request Access</button>
        <div class="toggle-link" onclick="toggleView('login')">
          Already have an account? Login
        </div>
      </div>
    </div>

    <script src="js/po-session.js"></script>
    <script src="js/po-auth.js"></script>
  </body>
</html>
