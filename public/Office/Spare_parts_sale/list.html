<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spare Parts Hub | Transaction List</title>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("sp_theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-bs-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/node_xlsx_scripts/bootstrap.min.css" />
  <link rel="stylesheet" href="/node_xlsx_scripts/all.min.css" />
  <style>
    @font-face {
      font-family: "InterLocal";
      src: url("/webfonts/Inter-Regular.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "InterLocal";
      src: url("/webfonts/Inter-SemiBold.woff2") format("woff2");
      font-weight: 600;
    }
    @font-face {
      font-family: "InterLocal";
      src: url("/webfonts/Inter-Bold.woff2") format("woff2");
      font-weight: 700;
    }

    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --surface: rgba(255, 255, 255, 0.88);
      --border: rgba(148, 163, 184, 0.35);
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --bg: #0b1120;
      --surface: rgba(30, 41, 59, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
    }

    * {
      font-family: "InterLocal", system-ui, sans-serif;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .glass-nav {
      flex-shrink: 0;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .main-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-bottom: 0.75rem;
    }

    .kpi-strip {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }

    .kpi-card {
      flex: 1 1 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.36rem 0.75rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      white-space: nowrap;
    }

    .glass-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 0.9rem 1.1rem;
    }

    .table-scroll-box {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border-radius: 10px;
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: var(--text);
      --bs-table-border-color: var(--border);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .table-scroll-box thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      box-shadow: inset 0 -1px 0 var(--border);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 700;
      padding: 0.65rem 0.75rem;
      cursor: context-menu;
      user-select: none;
    }

    .table-scroll-box thead th.filtered-col {
      color: var(--primary) !important;
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .header-filter-popup {
      position: fixed;
      z-index: 9999;
      width: 270px;
      background: var(--surface);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 0.75rem;
      display: none;
    }

    .tree-children {
      padding-left: 1.15rem;
      display: none;
    }
    .tree-children.open {
      display: block;
    }
    .tree-toggle {
      cursor: pointer;
      width: 14px;
      display: inline-block;
      text-align: center;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <nav class="navbar glass-nav px-3 py-2 mb-2">
    <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <i class="fas fa-list-ul text-primary fs-5"></i>
        <span class="fw-bold fs-6">All Transactions Daybook</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a href="/Office/Spare_parts_sale/dashboard.html" class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1" style="font-size:0.78rem;">
          <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
        </a>
        <button class="btn btn-sm btn-outline-secondary rounded-circle" id="themeToggle" style="width:32px;height:32px;padding:0;">
          <i class="fas fa-moon" id="themeIcon" style="font-size:0.8rem;"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 main-wrap">
    <!-- SINGLE-LINE KPI STRIP -->
    <div class="kpi-strip">
      <div class="kpi-card">
        <span class="small" style="color: var(--text-muted); font-size:0.74rem;">Total Entries</span>
        <span class="fw-bold" style="font-size:0.86rem;" id="kpiEntries">0</span>
      </div>
      <div class="kpi-card">
        <span class="small text-danger fw-semibold" style="font-size:0.74rem;">Total Cost / EQ Amount</span>
        <span class="fw-bold text-danger" style="font-size:0.86rem;" id="kpiCostAmt">0.00</span>
      </div>
      <div class="kpi-card">
        <span class="small text-success fw-semibold" style="font-size:0.74rem;">Total Sales Amount</span>
        <span class="fw-bold text-success" style="font-size:0.86rem;" id="kpiSalesAmt">0.00</span>
      </div>
    </div>

    <!-- TRANSACTIONS TABLE -->
    <div class="glass-panel">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2 flex-shrink-0">
        <span class="small" style="color: var(--text-muted)">
          <i class="fas fa-filter text-primary me-1"></i>Right-click any <b>Table Header</b> for Excel-style checkbox / date tree filter
        </span>
        <div class="d-flex gap-2">
          <button id="resetFiltersBtn" class="btn btn-sm btn-outline-warning d-none" onclick="resetAllFilters()" style="font-size:0.76rem;">
            Clear Filters
          </button>
          <input type="text" id="listSearchInput" class="form-control form-control-sm" placeholder="Search IN, Chassis, Item, User..." style="width:240px;" />
          <button class="btn btn-sm btn-outline-secondary" onclick="loadTransactions()" title="Refresh">
            <i class="fas fa-rotate"></i>
          </button>
        </div>
      </div>

      <div class="table-scroll-box">
        <table class="table table-hover align-middle mb-0">
          <thead id="txThead"></thead>
          <tbody id="txTbody">
            <tr><td colspan="11" class="text-center py-4">Loading transactions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- RIGHT-CLICK EXCEL-STYLE FILTER POPOVER -->
  <div id="txFilterPopup" class="header-filter-popup">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small fw-bold text-primary text-truncate" id="txFilterTitle">Filter</span>
      <button type="button" class="btn-close btn-close-sm" style="font-size:0.62rem;" onclick="hideTxFilterPopup()"></button>
    </div>
    <input type="text" class="form-control form-control-sm mb-2" id="txFilterSearchInput" placeholder="Search values..." autocomplete="off" />
    <div class="border rounded-3 p-2 mb-2" style="border-color: var(--border) !important; background: var(--bg); max-height: 210px; overflow-y: auto;">
      <div class="form-check small border-bottom pb-1 mb-1" style="border-color: var(--border) !important;">
        <input class="form-check-input" type="checkbox" id="txSelectAllChk" checked />
        <label class="form-check-label fw-bold" for="txSelectAllChk">(Select All)</label>
      </div>
      <div id="txFilterOptionsBox"></div>
    </div>
    <div class="d-flex justify-content-between gap-1">
      <button type="button" class="btn btn-xs btn-outline-secondary py-1 px-2" style="font-size:0.74rem;" onclick="clearSingleTxFilter()">Clear</button>
      <button type="button" class="btn btn-xs btn-primary py-1 px-3" style="font-size:0.74rem;" onclick="applyTxFilter()">Apply</button>
    </div>
  </div>

  <script src="/node_xlsx_scripts/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem("sp_token");
    const user = JSON.parse(localStorage.getItem("sp_user") || "{}");

    if (!token || !user.username) {
      window.location.href = "/Office/Spare_parts_sale/index.html";
    }

    // Theme
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    function updateIcon() {
      const t = document.documentElement.getAttribute("data-theme");
      themeIcon.className = t === "dark" ? "fas fa-sun" : "fas fa-moon";
    }
    updateIcon();
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      document.documentElement.setAttribute("data-bs-theme", next);
      try { localStorage.setItem("sp_theme", next); } catch (e) {}
      updateIcon();
    });

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function fmtAmt(n) {
      return Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtQty(n) {
      const v = Number(n || 0);
      return Number.isInteger(v) ? v.toString() : v.toFixed(2);
    }

    const COLS = [
      { key: "voucher_date", label: "Voucher Date", isDate: true },
      { key: "effective_date", label: "Effective Date", isDate: true },
      { key: "voucher_type", label: "Type" },
      { key: "in_no", label: "IN No" },
      { key: "chassis_no", label: "Chassis No" },
      { key: "debit_account", label: "Debit (Dr)" },
      { key: "credit_account", label: "Credit (Cr)" },
      { key: "item_desc", label: "Item / Particulars" },
      { key: "qty", label: "Quantity", align: "text-center" },
      { key: "amount", label: "Amount", align: "text-end" },
      { key: "narration", label: "Narration" },
      { key: "recorded_by", label: "Recorded By" }
    ];

    let allTransactions = [];
    let activeFilters = {}; // { colKey: Set<string> }
    let currentFilterCol = null;

    function getCellStr(row, key) {
      if (key === "qty") return fmtQty(row.qty);
      if (key === "amount") return fmtAmt(row.amount);
      return String(row[key] ?? "-");
    }

    async function loadTransactions() {
      try {
        const res = await fetch("/api/spare-parts/jv-list/transactions", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) {
          window.location.href = "/Office/Spare_parts_sale/index.html";
          return;
        }
        const data = await res.json();
        if (!data.success) return;

        allTransactions = data.transactions || [];
        applyAllTxFilters();
      } catch (err) {
        console.error(err);
      }
    }

    function applyAllTxFilters() {
      const q = document.getElementById("listSearchInput").value.trim().toLowerCase();
      const hasColFilters = Object.keys(activeFilters).length > 0;
      document.getElementById("resetFiltersBtn").classList.toggle("d-none", !hasColFilters && !q);

      const filtered = allTransactions.filter(r => {
        if (q) {
          const blob = `${r.voucher_date} ${r.effective_date} ${r.voucher_type} ${r.in_no} ${r.chassis_no} ${r.debit_account} ${r.credit_account} ${r.item_desc} ${r.narration} ${r.recorded_by}`.toLowerCase();
          if (!blob.includes(q)) return false;
        }
        for (const [key, allowedSet] of Object.entries(activeFilters)) {
          if (!allowedSet) continue;
          const val = getCellStr(r, key);
          if (!allowedSet.has(val)) return false;
        }
        return true;
      });

      renderTxTable(filtered);
    }

    function renderTxTable(rows) {
      const thead = document.getElementById("txThead");
      const tbody = document.getElementById("txTbody");

      thead.innerHTML = `<tr>` + COLS.map(c => {
        const isFiltered = !!activeFilters[c.key];
        return `<th class="${c.align || ""} ${isFiltered ? "filtered-col" : ""}"
                    oncontextmenu="openTxFilterPopup(event, '${c.key}', '${esc(c.label)}', ${!!c.isDate})"
                    title="Right-click to filter">
                  ${esc(c.label)}${isFiltered ? ' <i class="fas fa-filter" style="font-size:0.65rem;"></i>' : ""}
                </th>`;
      }).join("") + `</tr>`;

      let totalSales = 0;
      let totalCost = 0;

      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${COLS.length}" class="text-center py-4 text-muted">No matching transactions found.</td></tr>`;
      } else {
        tbody.innerHTML = rows.map(r => {
          const amt = Number(r.amount || 0);
          if (r.voucher_type === "SALES") totalSales += amt;
          else if (r.voucher_type === "COST" || r.voucher_type === "NEW EQ") totalCost += amt;

          let typeBadge = "bg-secondary";
          if (r.voucher_type === "SALES") typeBadge = "bg-success";
          else if (r.voucher_type === "COST") typeBadge = "bg-danger";
          else if (r.voucher_type === "NEW EQ") typeBadge = "bg-primary";
          else if (r.voucher_type === "ADD STOCK") typeBadge = "bg-info text-dark";

          return `
            <tr>
              <td>${esc(r.voucher_date)}</td>
              <td>${esc(r.effective_date)}</td>
              <td><span class="badge ${typeBadge}">${esc(r.voucher_type)}</span></td>
              <td class="fw-bold">${esc(r.in_no)}</td>
              <td class="text-primary fw-semibold">${esc(r.chassis_no)}</td>
              <td class="fw-semibold">${esc(r.debit_account)}</td>
              <td style="color: var(--text-muted)">${esc(r.credit_account)}</td>
              <td>${esc(r.item_desc)}</td>
              <td class="text-center fw-semibold">${fmtQty(r.qty)}</td>
              <td class="text-end fw-bold ${r.voucher_type === 'SALES' ? 'text-success' : (amt > 0 ? 'text-danger' : '')}">${fmtAmt(amt)}</td>
              <td style="color: var(--text-muted)">${esc(r.narration || "-")}</td>
              <td><span class="badge bg-secondary bg-opacity-25 text-reset fw-normal">${esc(r.recorded_by)}</span></td>
            </tr>
          `;
        }).join("");
      }

      const isFilteredAny = document.getElementById("listSearchInput").value.trim() !== "" || Object.keys(activeFilters).length > 0;
      document.getElementById("kpiEntries").innerHTML = isFilteredAny
        ? `${rows.length} <span class="fw-normal opacity-75">/ ${allTransactions.length}</span>`
        : `${allTransactions.length}`;
      document.getElementById("kpiCostAmt").textContent = fmtAmt(totalCost);
      document.getElementById("kpiSalesAmt").textContent = fmtAmt(totalSales);
    }

    document.getElementById("listSearchInput").addEventListener("input", applyAllTxFilters);

    function resetAllFilters() {
      activeFilters = {};
      document.getElementById("listSearchInput").value = "";
      applyAllTxFilters();
    }

    // ==========================================
    // 🌲 EXCEL-STYLE DATE TREE & CHECKBOX FILTER POPOVER
    // ==========================================
    const txPopup = document.getElementById("txFilterPopup");
    const txSearchInp = document.getElementById("txFilterSearchInput");
    const txSelectAll = document.getElementById("txSelectAllChk");
    const txOptionsBox = document.getElementById("txFilterOptionsBox");

    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let uniqueValsForCol = [];

    function openTxFilterPopup(e, key, label, isDate) {
      e.preventDefault();
      e.stopPropagation();

      currentFilterCol = { key, label, isDate };
      document.getElementById("txFilterTitle").textContent = `Filter: ${label}`;
      txSearchInp.value = "";

      uniqueValsForCol = Array.from(new Set(allTransactions.map(r => getCellStr(r, key))))
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      renderTxFilterOptions("");

      txPopup.style.display = "block";
      const popW = txPopup.offsetWidth || 270;
      const popH = txPopup.offsetHeight || 310;
      const posX = Math.min(e.clientX, window.innerWidth - popW - 12);
      const posY = Math.min(e.clientY, window.innerHeight - popH - 12);
      txPopup.style.left = `${Math.max(10, posX)}px`;
      txPopup.style.top = `${Math.max(10, posY)}px`;
      txSearchInp.focus();
    }

    function renderTxFilterOptions(searchStr) {
      const q = searchStr.trim().toLowerCase();
      const existingSet = activeFilters[currentFilterCol.key];
      const filteredVals = uniqueValsForCol.filter(v => !q || v.toLowerCase().includes(q));

      if (currentFilterCol.isDate) {
        // Build Year -> Month -> Date Hierarchy
        const tree = {};
        const nonDates = [];
        filteredVals.forEach(v => {
          if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
            const [y, m] = v.split("-");
            if (!tree[y]) tree[y] = {};
            if (!tree[y][m]) tree[y][m] = [];
            tree[y][m].push(v);
          } else {
            nonDates.push(v);
          }
        });

        let html = "";
        Object.keys(tree).sort().forEach(y => {
          html += `
            <div class="mb-1">
              <div class="d-flex align-items-center gap-1 small">
                <span class="tree-toggle text-primary fw-bold" onclick="toggleTreeNode(this)">+</span>
                <input class="form-check-input m-0 tree-year-chk" type="checkbox" data-year="${y}" checked />
                <span class="fw-semibold">${y}</span>
              </div>
              <div class="tree-children">
                ${Object.keys(tree[y]).sort().map(m => {
                  const mLabel = MONTH_NAMES[Number(m) - 1] || m;
                  return `
                    <div class="mt-1">
                      <div class="d-flex align-items-center gap-1 small">
                        <span class="tree-toggle text-primary fw-bold" onclick="toggleTreeNode(this)">+</span>
                        <input class="form-check-input m-0 tree-month-chk" type="checkbox" data-year="${y}" data-month="${m}" checked />
                        <span>${mLabel}</span>
                      </div>
                      <div class="tree-children">
                        ${tree[y][m].map(dStr => {
                          const chk = !existingSet || existingSet.has(dStr);
                          return `
                            <div class="form-check small mb-0">
                              <input class="form-check-input tx-leaf-chk" type="checkbox" value="${dStr}" data-year="${y}" data-month="${m}" ${chk ? "checked" : ""} />
                              <label class="form-check-label">${dStr}</label>
                            </div>
                          `;
                        }).join("")}
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        });

        nonDates.forEach(nd => {
          const chk = !existingSet || existingSet.has(nd);
          html += `
            <div class="form-check small">
              <input class="form-check-input tx-leaf-chk" type="checkbox" value="${esc(nd)}" ${chk ? "checked" : ""} />
              <label class="form-check-label">${esc(nd)}</label>
            </div>
          `;
        });

        txOptionsBox.innerHTML = html;
        syncDateTreeStates();
      } else {
        txOptionsBox.innerHTML = filteredVals.map((val, i) => {
          const chk = !existingSet || existingSet.has(val);
          return `
            <div class="form-check small mb-1">
              <input class="form-check-input tx-leaf-chk" type="checkbox" value="${esc(val)}" id="txOpt_${i}" ${chk ? "checked" : ""} />
              <label class="form-check-label text-truncate d-block" for="txOpt_${i}" title="${esc(val)}">${esc(val)}</label>
            </div>
          `;
        }).join("");
        syncTxSelectAll();
      }
    }

    function toggleTreeNode(el) {
      const childBox = el.parentElement.nextElementSibling;
      if (!childBox) return;
      const isOpen = childBox.classList.toggle("open");
      el.textContent = isOpen ? "-" : "+";
    }

    function syncDateTreeStates() {
      txOptionsBox.querySelectorAll(".tree-month-chk").forEach(mChk => {
        const y = mChk.getAttribute("data-year");
        const m = mChk.getAttribute("data-month");
        const leaves = Array.from(txOptionsBox.querySelectorAll(`.tx-leaf-chk[data-year="${y}"][data-month="${m}"]`));
        const cnt = leaves.filter(l => l.checked).length;
        mChk.indeterminate = cnt > 0 && cnt < leaves.length;
        mChk.checked = leaves.length > 0 && cnt === leaves.length;
      });

      txOptionsBox.querySelectorAll(".tree-year-chk").forEach(yChk => {
        const y = yChk.getAttribute("data-year");
        const leaves = Array.from(txOptionsBox.querySelectorAll(`.tx-leaf-chk[data-year="${y}"]`));
        const cnt = leaves.filter(l => l.checked).length;
        yChk.indeterminate = cnt > 0 && cnt < leaves.length;
        yChk.checked = leaves.length > 0 && cnt === leaves.length;
      });

      syncTxSelectAll();
    }

    function syncTxSelectAll() {
      const leaves = Array.from(txOptionsBox.querySelectorAll(".tx-leaf-chk"));
      const cnt = leaves.filter(l => l.checked).length;
      txSelectAll.indeterminate = cnt > 0 && cnt < leaves.length;
      txSelectAll.checked = leaves.length > 0 && cnt === leaves.length;
    }

    txOptionsBox.addEventListener("change", (e) => {
      const t = e.target;
      if (t.classList.contains("tree-year-chk")) {
        const y = t.getAttribute("data-year");
        txOptionsBox.querySelectorAll(`.tx-leaf-chk[data-year="${y}"]`).forEach(l => l.checked = t.checked);
      } else if (t.classList.contains("tree-month-chk")) {
        const y = t.getAttribute("data-year");
        const m = t.getAttribute("data-month");
        txOptionsBox.querySelectorAll(`.tx-leaf-chk[data-year="${y}"][data-month="${m}"]`).forEach(l => l.checked = t.checked);
      }
      if (currentFilterCol && currentFilterCol.isDate) syncDateTreeStates();
      else syncTxSelectAll();
    });

    txSelectAll.addEventListener("change", function () {
      txOptionsBox.querySelectorAll("input[type='checkbox']").forEach(cb => {
        cb.checked = this.checked;
        cb.indeterminate = false;
      });
    });

    txSearchInp.addEventListener("input", function () {
      renderTxFilterOptions(this.value);
    });

    function hideTxFilterPopup() {
      txPopup.style.display = "none";
    }

    function applyTxFilter() {
      if (!currentFilterCol) return;
      const checked = Array.from(txOptionsBox.querySelectorAll(".tx-leaf-chk:checked")).map(cb => cb.value);
      const selectedSet = new Set(checked);

      if (selectedSet.size === uniqueValsForCol.length && txSearchInp.value.trim() === "") {
        delete activeFilters[currentFilterCol.key];
      } else {
        activeFilters[currentFilterCol.key] = selectedSet;
      }
      hideTxFilterPopup();
      applyAllTxFilters();
    }

    function clearSingleTxFilter() {
      if (currentFilterCol) delete activeFilters[currentFilterCol.key];
      txSearchInp.value = "";
      hideTxFilterPopup();
      applyAllTxFilters();
    }

    document.addEventListener("click", (e) => {
      if (!txPopup.contains(e.target)) hideTxFilterPopup();
    });

    loadTransactions();
  </script>
</body>
</html>
