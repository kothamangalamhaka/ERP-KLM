<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haka ERP | Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.95);
            transition: transform 0.3s ease, background-color 0.3s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 85vh;
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .clickable-text {
            color: #0284c7;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: inline-block;
            font-weight: 700;
        }

        .clickable-text:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        /* Toast Styles */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        #toast.success {
            background-color: #10b981;
        }

        #toast.error {
            background-color: #ef4444;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Sticky Header Fix for Tables */
        table {
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Expandable Search Box */
        .search-box {
            width: 28px;
            transition: width 0.3s ease-in-out;
        }

        .search-box:focus-within,
        .search-box:hover {
            width: 140px;
        }

        /* 🟢 Mobile Sidebar Menu Styles */
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-menu-overlay.show {
            display: block;
            opacity: 1;
        }

        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            /* Hidden off-screen by default */
            width: 260px;
            height: 100vh;
            background: rgb(0, 0, 0);
            z-index: 50;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .mobile-sidebar.show {
            right: 0;
        }

        .mobile-menu-btn {
            display: none;
            /* Hidden on desktop */
            background: transparent;
            border: none;
            color: #475569;
            cursor: pointer;
            padding: 5px;
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            .desktop-nav {
                display: none !important;
            }

            .search-box:focus-within,
            .search-box:hover {
                width: 110px;
                /* slightly smaller expansion on mobile */
            }

            .stat-card {
                padding: 15px;
                /* less padding on mobile */
            }

            .stat-card .text-4xl {
                font-size: 1.75rem;
                /* smaller numbers */
                line-height: 2rem;
            }
        }

        /* 🟢 Dark Mode Overrides */
        .dark body {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .dark .stat-card {
            background-color: #1e293b;
            border-color: #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .dark header {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }

        .dark .bg-white {
            background-color: #1e293b !important;
        }

        .dark .bg-slate-50 {
            background-color: #0f172a !important;
        }

        .dark .bg-slate-100 {
            background-color: #334155 !important;
        }

        .dark .text-slate-900 {
            color: #f8fafc !important;
        }

        .dark .text-slate-800 {
            color: #f1f5f9 !important;
        }

        .dark .text-slate-700 {
            color: #cbd5e1 !important;
        }

        .dark .text-slate-600 {
            color: #94a3b8 !important;
        }

        .dark .text-slate-500 {
            color: #64748b !important;
        }

        .dark .border-slate-200,
        .dark .border-slate-300 {
            border-color: #334155 !important;
        }

        .dark .modal-box {
            background: #1e293b;
        }

        .dark th {
            background-color: #0f172a !important;
            color: #cbd5e1 !important;
            border-color: #334155 !important;
        }

        .dark input,
        .dark select {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            border-color: #334155 !important;
        }

        .dark .hover\:bg-slate-50:hover {
            background-color: #334155 !important;
        }

        .dark .search-box {
            background-color: #0f172a !important;
            border-color: #334155 !important;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        .dark .bg-blue-50 {
            background-color: rgba(59, 130, 246, 0.2) !important;
            color: #60a5fa !important;
        }

        .dark .bg-emerald-50 {
            background-color: rgba(16, 185, 129, 0.2) !important;
            color: #34d399 !important;
            border-color: rgba(16, 185, 129, 0.3) !important;
        }

        .dark .bg-red-50 {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }

        .dark .bg-amber-50 {
            background-color: rgba(245, 158, 11, 0.2) !important;
            color: #fbbf24 !important;
            border-color: rgba(245, 158, 11, 0.3) !important;

        .dark .bg-emerald-100 {
            background-color: rgba(16, 185, 129, 0.2) !important;

        }

        .dark .bg-red-100 {
            background-color: rgba(239, 68, 68, 0.2) !important;

        }

        .dark .bg-amber-100 {
            background-color: rgba(245, 158, 11, 0.2) !important;
            color: #fbbf24 !important;
        }
    </style>
</head>

                            id="modalTitle">Name</h2>

                        <div id="modalControls" class="hidden items-center gap-2">
                            <div class="search-box flex items-center bg-white border border-slate-300 rounded-full px-1.5 py-1 overflow-hidden cursor-pointer shadow-sm"
                                onclick="document.getElementById('modalSearch').focus()">
                                <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                                <input type="text" id="modalSearch" placeholder="Search..." onkeyup="renderModalList()"
                                    class="bg-transparent border-none outline-none text-[10px] w-full ml-1 text-slate-600 placeholder-slate-400">
                            </div>
                            <select id="modalFilter" onchange="renderModalList()"
                                class="text-[10px] text-slate-600 font-bold bg-white border border-slate-300 rounded-full px-1.5 py-1 outline-none cursor-pointer shadow-sm">
                                <option value="All">All</option>
                                <option value="Running">Running</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button onclick="closeModal(true)"
                    class="p-1.5 bg-white border border-slate-300 hover:bg-red-50 hover:text-red-500 rounded transition text-slate-500 shadow-sm shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="p-0 overflow-y-auto bg-white flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead class="text-[10px] md:text-[11px] uppercase font-bold tracking-widest bg-white"
                        id="modalThead">
                    </thead>
                    <tbody id="modalListBody" class="text-[13px] md:text-sm bg-white">
                    </tbody>
                </table>
            </div>

            <div
                class="px-4 md:px-5 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center shrink-0 z-30 relative">
                <div class="flex items-center gap-2">
                    <button onclick="copyModalData()" id="copyBtn"
                        class="px-3 py-2 bg-white border border-slate-300 hover:bg-blue-50 text-slate-600 hover:text-blue-600 font-bold text-xs uppercase tracking-wider rounded transition flex items-center gap-2 shadow-sm"
                        title="Copy Data">
                        <svg class="w-4 h-4 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                        Copy
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total</span>
                    <span class="text-2xl md:text-3xl font-black text-emerald-600" id="modalTotalCount">0</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 🟢 Dark Mode Logic Starts
        function initTheme() {
            const savedTheme = localStorage.getItem('erpTheme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeIcons('light');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('erpTheme', 'light');
                updateThemeIcons('light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('erpTheme', 'dark');
                updateThemeIcons('dark');
            }
        }

        function updateThemeIcons(theme) {
            const moonIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;
            const sunIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`;

            const desktopBtn = document.getElementById('themeBtnDesktop');
            const mobileBtn = document.getElementById('themeBtnMobile');

            if (desktopBtn) desktopBtn.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
            if (mobileBtn) mobileBtn.innerHTML = theme === 'dark' ? `${sunIcon} Light Mode` : `${moonIcon} Dark Mode`;
        }

        // Initialize theme on load
        initTheme();
        // 🟢 Dark Mode Logic Ends

        const token = localStorage.getItem('erpToken');
        const currentUser = JSON.parse(localStorage.getItem('erpUser'));
        if (!token || !currentUser) window.location.href = '/';

        // Reveal Admin and Log buttons if user is Super Admin
        if (currentUser.role === 'Super Admin') {
            const logBtn = document.getElementById('logBtn');
            const adminBtn = document.getElementById('adminBtn');
            const mobileLogBtn = document.getElementById('mobileLogBtn');
            const mobileAdminBtn = document.getElementById('mobileAdminBtn');

            if (logBtn) { logBtn.classList.remove('hidden'); logBtn.classList.add('flex'); }
            if (adminBtn) { adminBtn.classList.remove('hidden'); adminBtn.classList.add('flex'); }
            if (mobileLogBtn) { mobileLogBtn.classList.remove('hidden'); mobileLogBtn.classList.add('flex'); }
            if (mobileAdminBtn) { mobileAdminBtn.classList.remove('hidden'); mobileAdminBtn.classList.add('flex'); }
        }

        // 🟢 Handle Mobile Sidebar Toggle
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            const overlay = document.getElementById('mobileOverlay');

            if (sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            } else {
                sidebar.classList.add('show');
                overlay.classList.add('show');
            }
        }

        let globalSiteCompanyData = [];
        let globalVehicleDetails = [];
        let currentCopyData = [];

        let modalState = {
            type: '',
            name: '',
            data: [],
            site: '',
            company: ''
        };

        function showToast(msg, type = 'success') {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.className = type === 'success' ? 'success' : 'error';
            t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); t.className = ''; }, 3000);
        }

        async function loadSummary() {
            try {
                const res = await fetch('/api/dashboard-summary', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);

                globalSiteCompanyData = data.siteCompany;
                globalVehicleDetails = data.vehicleDetails || [];

                document.getElementById('totalVehicles').innerText = data.overall.total || 0;
                document.getElementById('runningVehicles').innerText = data.overall.running || 0;
                document.getElementById('releasedVehicles').innerText = data.overall.released || 0;
                document.getElementById('replacedVehicles').innerText = data.overall.replaced || 0;

                let siteHtml = '';
                data.sites.forEach(s => {
                    siteHtml += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-4 py-3 border-b border-r border-slate-300">
                                <span class="clickable-text truncate block max-w-[80px] md:max-w-full" onclick="showModal('SITE', '${s.site.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')" title="${s.site}">${s.site}</span>
                            </td>
                            <td class="px-2 md:px-3 py-3 border-b border-r border-slate-300 text-center font-mono font-extrabold text-emerald-700 bg-emerald-50/20">${s.running}</td>
                            <td class="px-2 md:px-3 py-3 border-b border-r border-slate-300 text-center font-mono font-bold text-red-500">${s.released}</td>
                            <td class="px-2 md:px-3 py-3 border-b border-slate-300 text-center font-mono font-bold text-amber-500">${s.replaced}</td>
                        </tr>
                    `;
                });
                document.getElementById('siteTableBody').innerHTML = siteHtml;

                let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('lastUpdatedSite').innerText = time;

                let companyHtml = '';
                const maxCompCount = data.companies.length > 0 ? Math.max(...data.companies.map(c => c.count)) : 1;
                data.companies.forEach(c => {
                    const percentage = (c.count / maxCompCount) * 100;
                    companyHtml += `
                        <div class="flex items-center justify-between gap-3 pb-3 border-b border-slate-200 last:border-0 last:pb-0">
                            <div class="flex-1 min-w-0">
                                <div class="clickable-text text-sm truncate block" onclick="showModal('COMPANY', '${c.company.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')" title="${c.company}">${c.company}</div>
                                <div class="w-full bg-slate-200 rounded-full h-2 mt-2 overflow-hidden">
                                    <div class="bg-blue-500 h-2 rounded-full" style="width: ${percentage}%"></div>
                                </div>
                            </div>
                            <div class="text-base font-black text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-300 shrink-0">${c.count}</div>
                        </div>
                    `;
                });
                document.getElementById('companyList').innerHTML = companyHtml;

                renderOwnerList();

            } catch (error) {
                console.error(error);
                const errMsg = error.message ? error.message.toLowerCase() : "";
                if (errMsg.includes("invalid token") || errMsg.includes("invalid session") || errMsg.includes("no token") || errMsg.includes("access denied")) {
                    logout();
                } else {
                    showToast(error.message, "error");
                }
            }
        }

        function renderOwnerList() {
            const filter = document.getElementById('ownerFilter').value;
            const search = document.getElementById('ownerSearch').value.toLowerCase();

            let filteredDetails = globalVehicleDetails.filter(d => d.owner && d.owner.trim() !== '');

            if (filter === 'Running') {
                filteredDetails = filteredDetails.filter(d => d.status && d.status.toLowerCase() === 'running');
            }

            let ownerCounts = {};
            filteredDetails.forEach(d => {
                if (!ownerCounts[d.owner]) ownerCounts[d.owner] = 0;
                ownerCounts[d.owner]++;
            });

            let ownerArray = Object.keys(ownerCounts).map(k => ({ owner: k, count: ownerCounts[k] }));
            ownerArray.sort((a, b) => a.owner.localeCompare(b.owner, undefined, { sensitivity: 'base' }));

            if (search) {
                ownerArray = ownerArray.filter(o => o.owner.toLowerCase().includes(search));
            }

            document.getElementById('totalOwnersCount').innerText = `${ownerArray.length} Owners`;

            let ownerHtml = '';
            const maxOwnerCount = ownerArray.length > 0 ? Math.max(...ownerArray.map(o => o.count)) : 1;
            ownerArray.forEach(o => {
                const percentage = (o.count / maxOwnerCount) * 100;
                ownerHtml += `
                    <div class="flex items-center justify-between gap-3 pb-3 border-b border-slate-200 last:border-0 last:pb-0">
                        <div class="flex-1 truncate pr-2">
                            <div class="clickable-text text-sm truncate w-full block" onclick="showModal('OWNER', '${o.owner.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')" title="${o.owner}">${o.owner}</div>
                            <div class="w-full bg-slate-200 rounded-full h-2 mt-2 overflow-hidden">
                                <div class="bg-emerald-500 h-2 rounded-full" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                        <div class="text-base font-black text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-300 shadow-sm shrink-0">${o.count}</div>
                    </div>
                `;
            });

            if (ownerArray.length === 0) {
                ownerHtml = `<div class="text-center text-slate-400 text-sm mt-8 font-medium">No owners found.</div>`;
            }

            document.getElementById('ownerList').innerHTML = ownerHtml;
        }

        async function editOwnerName(oldName) {
            const newName = prompt(`Edit Owner Name:\n(This will update all vehicles belonging to "${oldName}")`, oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                try {
                    const res = await fetch('/api/admin/update-owner-name', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ oldName: oldName, newName: newName.trim() })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, 'success');
                        closeModal();
                        loadSummary();
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (e) {
                    showToast("Error updating owner name.", 'error');
                }
            }
        }

        function getStatusColor(statusText) {
            if (!statusText) return 'text-slate-500';
            let s = statusText.toLowerCase();
            if (s === 'running') return 'text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100';
            if (s === 'released') return 'text-red-500 bg-red-50 px-2 py-1 rounded border border-red-100';
            if (s === 'replaced') return 'text-amber-500 bg-amber-50 px-2 py-1 rounded border border-amber-100';
            return 'text-slate-600 bg-slate-50 px-2 py-1 rounded border border-slate-200';
        }

        function showModal(type, name) {
            modalState.type = type;
            modalState.name = name;

            document.getElementById('modalSearch').value = '';
            document.getElementById('modalFilter').value = 'All';

            if (type === 'SITE') {
                modalState.data = globalSiteCompanyData.filter(d => d.site === name).sort((a, b) => a.company.localeCompare(b.company));
                document.getElementById('modalType').innerText = 'Site Breakdown';
                document.getElementById('modalTitle').innerHTML = name;
                document.getElementById('modalControls').classList.add('hidden');
            }
            else if (type === 'COMPANY') {
                modalState.data = globalSiteCompanyData.filter(d => d.company === name).sort((a, b) => a.site.localeCompare(b.site));
                document.getElementById('modalType').innerText = 'Company Breakdown';
                document.getElementById('modalTitle').innerHTML = name;
                document.getElementById('modalControls').classList.add('hidden');
            }
            else if (type === 'OWNER') {
                modalState.data = globalVehicleDetails.filter(d => d.owner === name).sort((a, b) => a.plate_number.localeCompare(b.plate_number));
                document.getElementById('modalType').innerText = 'Owner Vehicles';
                let titleHtml = name;
                if (currentUser && currentUser.role === 'Super Admin') {
                    titleHtml = `${name} <button onclick="editOwnerName('${name.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')" class="text-slate-400 hover:text-blue-600 transition ml-2 align-middle bg-white border border-slate-300 rounded p-1.5 shadow-sm" title="Edit Owner Name"><svg class="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>`;
                }
                document.getElementById('modalTitle').innerHTML = titleHtml;
                document.getElementById('modalControls').classList.remove('hidden');
                document.getElementById('modalControls').classList.add('flex');
            }
            else if (type === 'SITE_COMPANY' || type === 'COMPANY_SITE') {
                const parts = name.split('|');
                // 🟢 FIX: Ensure parts match properly depending on the origin link
                if (type === 'SITE_COMPANY') {
                    modalState.site = parts[0];
                    modalState.company = parts[1];
                } else {
                    modalState.company = parts[0];
                    modalState.site = parts[1];
                }

                modalState.data = globalVehicleDetails.filter(d =>
                    (d.site || "").trim() === modalState.site.trim() &&
                    (d.company || "").trim() === modalState.company.trim()
                ).sort((a, b) => (a.owner || "").localeCompare(b.owner || ""));

                const backTarget = type === 'SITE_COMPANY' ? modalState.site : modalState.company;
                const backType = type === 'SITE_COMPANY' ? 'SITE' : 'COMPANY';
                document.getElementById('modalType').innerHTML = `<span class="clickable-text" onclick="showModal('${backType}', '${backTarget.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')">← Back to ${backTarget}</span>`;
                document.getElementById('modalTitle').innerHTML = (type === 'SITE_COMPANY' ? modalState.company : modalState.site);
                document.getElementById('modalControls').classList.remove('hidden');
                document.getElementById('modalControls').classList.add('flex');
            }

            renderModalList();

            const modal = document.getElementById('detailsModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function renderModalList() {
            let listHtml = '';
            let theadHtml = '';
            let total = 0;

            let filteredData = modalState.data;
            const type = modalState.type;

            if (type === 'OWNER' || type === 'SITE_COMPANY' || type === 'COMPANY_SITE') {
                const filterVal = document.getElementById('modalFilter').value;
                const searchVal = document.getElementById('modalSearch').value.toLowerCase();

                if (filterVal === 'Running') filteredData = filteredData.filter(d => d.status && d.status.toLowerCase() === 'running');
                if (searchVal) {
                    filteredData = filteredData.filter(d =>
                        (d.plate_number && d.plate_number.toLowerCase().includes(searchVal)) ||
                        (d.owner && d.owner.toLowerCase().includes(searchVal))
                    );
                }
            }

            if (type === 'SITE') {
                theadHtml = `<tr><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Company Name</th><th class="px-4 py-3 border-b-2 border-slate-300 bg-emerald-100 text-emerald-800 text-center">Count</th></tr>`;
                filteredData.forEach(d => {
                    listHtml += `<tr class="hover:bg-slate-50"><td class="px-4 py-3 border-b border-r border-slate-300 font-bold text-slate-700"><span class="clickable-text truncate block max-w-[150px] md:max-w-full" onclick="showModal('SITE_COMPANY', '${d.site.replace(/'/g, "\\'").replace(/"/g, "&quot;")}|${d.company.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')">${d.company}</span></td><td class="px-4 py-3 border-b border-slate-300 text-center font-mono font-bold text-emerald-600 text-lg">${d.count}</td></tr>`;
                    total += parseInt(d.count);
                });
            } else if (type === 'COMPANY') {
                theadHtml = `<tr><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Site Name</th><th class="px-4 py-3 border-b-2 border-slate-300 bg-emerald-100 text-emerald-800 text-center">Count</th></tr>`;
                filteredData.forEach(d => {
                    listHtml += `<tr class="hover:bg-slate-50"><td class="px-4 py-3 border-b border-r border-slate-300 font-bold text-slate-700"><span class="clickable-text truncate block max-w-[150px] md:max-w-full" onclick="showModal('COMPANY_SITE', '${d.company.replace(/'/g, "\\'").replace(/"/g, "&quot;")}|${d.site.replace(/'/g, "\\'").replace(/"/g, "&quot;")}')">${d.site}</span></td><td class="px-4 py-3 border-b border-slate-300 text-center font-mono font-bold text-emerald-600 text-lg">${d.count}</td></tr>`;
                    total += parseInt(d.count);
                });
            } else if (type === 'OWNER') {
                theadHtml = `<tr><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Plate No</th><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700 hidden md:table-cell">Site</th><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Company</th><th class="px-4 py-3 border-b-2 border-slate-300 bg-slate-100 text-slate-700">Status</th></tr>`;
                filteredData.forEach(d => {
                    listHtml += `<tr class="hover:bg-slate-50 transition-colors"><td class="px-4 py-3 border-b border-r border-slate-300 font-mono font-bold text-blue-600 whitespace-nowrap">${d.plate_number || '-'}</td><td class="px-4 py-3 border-b border-r border-slate-300 font-semibold text-slate-700 hidden md:table-cell">${d.site || '-'}</td><td class="px-4 py-3 border-b border-r border-slate-300 font-semibold text-slate-500 truncate max-w-[100px]">${d.company || '-'}</td><td class="px-4 py-3 border-b border-slate-300 font-bold text-[10px] uppercase tracking-wider"><span class="${getStatusColor(d.status)}">${d.status || '-'}</span></td></tr>`;
                    total++;
                });
            } else if (type === 'SITE_COMPANY' || type === 'COMPANY_SITE') {
                theadHtml = `<tr><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Plate No</th><th class="px-4 py-3 border-b-2 border-r border-slate-300 bg-slate-100 text-slate-700">Owner</th><th class="px-4 py-3 border-b-2 border-slate-300 bg-slate-100 text-slate-700">Status</th></tr>`;
                filteredData.forEach(d => {
                    listHtml += `<tr class="hover:bg-slate-50 transition-colors"><td class="px-4 py-3 border-b border-r border-slate-300 font-mono font-bold text-blue-600 whitespace-nowrap">${d.plate_number || '-'}</td><td class="px-4 py-3 border-b border-r border-slate-300 font-semibold text-slate-700 truncate max-w-[120px]">${d.owner || '-'}</td><td class="px-4 py-3 border-b border-slate-300 font-bold text-[10px] uppercase tracking-wider"><span class="${getStatusColor(d.status)}">${d.status || '-'}</span></td></tr>`;
                    total++;
                });
            }

            if (filteredData.length === 0) {
                listHtml = `<tr><td colspan="4" class="px-5 py-8 text-center text-slate-400 font-medium border-b border-slate-300">No records found.</td></tr>`;
            }

            currentCopyData = filteredData;
            document.getElementById('modalThead').innerHTML = theadHtml;
            document.getElementById('modalListBody').innerHTML = listHtml;
            document.getElementById('modalTotalCount').innerText = total;
        }

        function copyModalData() {
            if (currentCopyData.length === 0) return;
            let textToCopy = "";
            const type = modalState.type;

            currentCopyData.forEach(d => {
                if (type === 'OWNER') textToCopy += `${d.plate_number || '-'}\t${d.site || '-'}\t${d.company || '-'}\t${d.status || '-'}\n`;
                else if (type === 'SITE') textToCopy += `${d.company}\t${d.count}\n`;
                else if (type === 'COMPANY') textToCopy += `${d.site}\t${d.count}\n`;
                else if (type === 'SITE_COMPANY' || type === 'COMPANY_SITE') textToCopy += `${d.plate_number || '-'}\t${d.owner || '-'}\t${d.status || '-'}\n`;
            });

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="hidden md:inline">Copied</span>`;
                btn.classList.add('border-emerald-300', 'bg-emerald-50', 'text-emerald-700');
                showToast("Data copied to clipboard!", "success");
                setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove('border-emerald-300', 'bg-emerald-50', 'text-emerald-700'); }, 2000);
            });
        }

        function closeModal(force = false) {
            const modal = document.getElementById('detailsModal');
            modal.classList.remove('show');
            setTimeout(() => { if (!modal.classList.contains('show')) modal.style.display = 'none'; }, 300);
        }

        function logout() {
            localStorage.removeItem('erpToken');
            localStorage.removeItem('erpUser');
            window.location.href = 'index.html';
        }

        // 🟢 INACTIVITY AUTO-LOGOUT (30 Minutes)
        let inactivityTimeout;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                showToast("Session expired due to inactivity.", "error");
                setTimeout(logout, 1500);
            }, 30 * 60 * 1000); // 30 minutes
        }

        ['mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach(evt =>
            document.addEventListener(evt, resetInactivityTimer, true)
        );
        resetInactivityTimer();

        loadSummary();
        setInterval(loadSummary, 30000);
    </script>
</body>

</html>
