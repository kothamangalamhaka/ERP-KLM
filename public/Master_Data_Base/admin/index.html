<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | Haka ERP</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <style>
        /* 🟢 GLOBAL DARK STYLES */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* 🟢 TOAST NOTIFICATIONS */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            display: none;
            z-index: 10000;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-size: 13px;
        }

        .toast.success {
            background: #10b981;
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.info {
            background: #3b82f6;
        }

        /* 🔐 LOGIN SCREEN */
        #loginContainer {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .icon-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.1);
            color: #38bdf8;
            margin-bottom: 10px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .login-card h2 {
            color: #f8fafc;
            margin: 10px 0 5px 0;
            font-size: 22px;
            font-weight: 800;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter';
            box-sizing: border-box;
            outline: none;
        }

        .btn-login {
            width: 100%;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* 📊 DASHBOARD STYLES */
        #dashboardContainer {
            flex-grow: 1;
            display: none;
            padding-bottom: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        .brand-text {
            color: #38bdf8;
            font-weight: 800;
            font-size: 18px;
            font-style: italic;
        }

        .brand-version {
            background: #0f172a;
            color: #94a3b8;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        .header-nav {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            background: transparent;
            color: #cbd5e1;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter';
        }

        .btn-logout {
            background: #334155;
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            height: fit-content;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .dash-input,
        .dash-select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter';
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }

        .btn-dash {
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-family: 'Inter';
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-dark {
            background: #334155;
            color: white;
        }

        .btn-green {
            background: #059669;
            color: white;
        }

        .btn-blue {
            background: #3b82f6;
            color: white;
        }

        .btn-red {
            background: #ef4444;
            color: white;
        }

        /* 📱 MOBILE OPTIMIZATIONS */
        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .header-top {
                padding: 12px 15px;
            }

            .brand-text {
                font-size: 16px;
            }

            .card {
                padding: 15px;
            }

            /* Table responsiveness */
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 370px;
            }
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            padding: 10px 8px;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            text-transform: uppercase;
            font-size: 9px;
            font-weight: 800;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid #334155;
        }

        .user-name {
            font-weight: 700;
            color: #f8fafc;
            font-size: 13px;
        }

        .user-id {
            color: #94a3b8;
            font-size: 10px;
        }

        .user-main-id {
            color: #38bdf8;
            font-size: 10px;
            margin-top: 2px;
        }

        .role-box,
        .site-box {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            font-size: 11px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
            width: 80px;
            cursor: pointer;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .action-container {
            display: flex;
            gap: 5px;
        }

        .action-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Modal Styles */
        .admin-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .admin-modal-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #334155;
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"></div>

    <div id="adminPromptModal" class="admin-modal-overlay">
        <div class="admin-modal-box">
            <h3 id="promptTitle" class="admin-modal-title" style="margin-top:0; font-size:16px;">Title</h3>
            <p id="promptText" style="color:#94a3b8; font-size:13px; margin-bottom:15px;">Message</p>
            <input type="text" id="promptInput" class="dash-input"
                onkeypress="if(event.key==='Enter') $('#promptConfirmBtn').click()">
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-dash btn-dark" style="width:auto; padding:8px 15px;"
                    onclick="closeAdminPrompt()">Cancel</button>
                <button id="promptConfirmBtn" class="btn-dash btn-blue"
                    style="width:auto; padding:8px 15px;">Confirm</button>
            </div>
        </div>
    </div>

    <div id="loginContainer">
        <div class="login-card">
            <div class="icon-circle"><span class="material-icons">lock</span></div>
            <h2>Admin Login</h2>
            <p>Authorized Personnel Only</p>
            <input type="text" id="adminUsername" class="login-input" placeholder="Username">
            <input type="password" id="adminPassword" class="login-input" placeholder="••••••••">
            <button class="btn-login" onclick="performAdminLogin()">Sign In</button>
        </div>
    </div>

    <div id="dashboardContainer">
        <div class="header-top">
            <div class="brand-logo">
                <span class="brand-text">HAKA ERP</span>
                <span class="brand-version">V2.0</span>
            </div>
            <div class="header-nav">
                <button class="btn-nav" onclick="window.location.href='../Database.html'">DataBase</button>
                <button class="btn-logout" onclick="adminLogout()">Logout</button>
            </div>
        </div>

        <div class="grid-container">
            <div class="card">
                <div class="card-header">
                    <h3>System Users</h3>
                    <span class="material-icons" style="color:#38bdf8; cursor:pointer; font-size:18px;"
                        onclick="loadUsers()">refresh</span>
                </div>
                <div class="table-wrapper">
                    <table id="userTable">
                        <thead>
                            <tr>
                                <th>Identity</th>
                                <th>Access</th>
                                <th style="width: 90px;">Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4" style="text-align:center; padding:20px; color:#64748b;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="right-col">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><span class="material-icons" style="color: #38bdf8; font-size:18px;">cloud_sync</span>
                            Backup</h3>
                    </div>
                    <label class="form-label">Time</label>
                    <input type="time" id="backupTime" class="dash-input">

                    <label class="form-label">Timezone</label>
                    <select id="timezone" class="dash-select">
                        <option value="Asia/Kolkata">India (IST)</option>
                        <option value="Asia/Riyadh">Saudi Arabia (AST)</option>
                    </select>

                    <label class="form-label">Recipients</label>
                    <input type="text" id="backupEmails" class="dash-input" placeholder="emails...">

                    <button class="btn-dash btn-blue" onclick="updateSettings()">Update Config</button>
                    <button class="btn-dash btn-green" style="margin-top: 8px;" onclick="triggerManualBackup()">Run
                        Backup Now</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><span class="material-icons" style="color: #94a3b8; font-size:18px;">key</span> Root Access
                        </h3>
                    </div>
                    <input type="password" id="newPassword" class="dash-input" placeholder="New Root Password">
                    <button class="btn-dash btn-dark" onclick="changePassword()">Change Password</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let promptCallback = null;

        function openAdminPrompt(title, text, inputType, btnText, btnColorClass, callback) {
            $('#promptTitle').html(title);
            $('#promptText').text(text);
            $('#promptInput').attr('type', inputType).val('');
            $('#promptConfirmBtn').text(btnText).removeClass('btn-blue btn-red btn-green').addClass(btnColorClass);
            promptCallback = callback;
            $('#adminPromptModal').css('display', 'flex');
            $('#promptInput').focus();
        }

        function closeAdminPrompt() {
            $('#adminPromptModal').hide();
            promptCallback = null;
        }

        $('#promptConfirmBtn').click(function () {
            const val = $('#promptInput').val();
            if (promptCallback) promptCallback(val);
            closeAdminPrompt();
        });

        // Auth Logic
        function checkAuth() {
            const token = localStorage.getItem('erpToken');
            const user = JSON.parse(localStorage.getItem('erpUser'));
            if (token && user && user.role === 'Super Admin') {
                $('#loginContainer').hide();
                $('#dashboardContainer').show();
                loadUsers();
                loadSettings();
            } else {
                $('#dashboardContainer').hide();
                $('#loginContainer').show();
            }
        }

        $(document).ready(checkAuth);

        function showToast(msg, type) {
            $('#toast').text(msg).removeClass('success error info').addClass(type).fadeIn().delay(3000).fadeOut();
        }

        async function performAdminLogin() {
            const username = $('#adminUsername').val().trim();
            const password = $('#adminPassword').val().trim();
            if (!username || !password) return showToast("Enter credentials", "error");

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('erpToken', data.token);
                    localStorage.setItem('erpUser', JSON.stringify(data.user));
                    showToast("Welcome Admin", "success");
                    checkAuth();
                } else showToast(data.message, "error");
            } catch (e) { showToast("Connection failed", "error"); }
        }

        function adminLogout() {
            localStorage.clear();
            checkAuth();
        }

        async function loadUsers() {
            try {
                const token = localStorage.getItem('erpToken');
                const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!data.success) return;

                let html = '';
                data.users.forEach(u => {
                    let statusClass = u.status === 'Active' ? 'status-active' : (u.status === 'Pending' ? 'status-pending' : 'status-inactive');
                    html += `<tr>
                        <td>
                            <div class="user-name">${u.display_name}</div>
                            <div class="user-id">@${u.username}</div>
                            <div class="user-main-id">${u.main_id || 'No Email'}</div>
                        </td>
                        <td>
                            <select class="role-box">
                                <option value="Super Admin" ${u.role === 'Super Admin' ? 'selected' : ''}>Super Admin</option>
                                <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>Admin</option>
                                <option value="Site Co" ${u.role === 'Site Co' ? 'selected' : ''}>Site Co</option>
                                <option value="Viewer" ${u.role === 'Viewer' ? 'selected' : ''}>Viewer</option>
                            </select>
                            <input type="text" class="site-box" placeholder="Site" value="${u.site_access || ''}">
                        </td>
                        <td>
                            <select class="status-badge ${statusClass}" onchange="changeStatusColor(this)">
                                <option value="Active" ${u.status === 'Active' ? 'selected' : ''}>ACTIVE</option>
                                <option value="Pending" ${u.status === 'Pending' ? 'selected' : ''}>PENDING</option>
                                <option value="Inactive" ${u.status === 'Inactive' ? 'selected' : ''}>INACTIVE</option>
                            </select>
                        </td>
                        <td>
                            <div class="action-container">
                                <div class="action-icon" style="color:#38bdf8;" onclick="updateUser(${u.id}, this)"><span class="material-icons">check</span></div>
                                <div class="action-icon" style="color:#fbbf24;" onclick="resetUserPassword(${u.id}, '${u.username}')"><span class="material-icons">vpn_key</span></div>
                                <div class="action-icon" style="color:#f87171;" onclick="deleteUser(${u.id}, '${u.username}')"><span class="material-icons">delete</span></div>
                            </div>
                        </td>
                    </tr>`;
                });
                $('#userTable tbody').html(html);
            } catch (e) { showToast("Load error", "error"); }
        }

        function changeStatusColor(sel) {
            $(sel).removeClass('status-active status-pending status-inactive');
            const v = $(sel).val();
            if (v === 'Active') $(sel).addClass('status-active');
            else if (v === 'Pending') $(sel).addClass('status-pending');
            else $(sel).addClass('status-inactive');
        }

        async function updateUser(id, btn) {
            const row = $(btn).closest('tr');
            const payload = {
                userId: id,
                role: row.find('.role-box').val(),
                site: row.find('.site-box').val(),
                status: row.find('.status-badge').val()
            };
            const res = await fetch('/api/admin/update-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'error');
        }

        function resetUserPassword(id, username) {
            openAdminPrompt("Reset Password", `New password for @${username}:`, "text", "Reset", "btn-blue", async (newPass) => {
                if (!newPass) return;
                const res = await fetch('/api/admin/reset-user-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` },
                    body: JSON.stringify({ userId: id, newPassword: newPass })
                });
                const data = await res.json();
                showToast(data.message, data.success ? 'success' : 'error');
            });
        }

        function deleteUser(id, name) {
            openAdminPrompt("Delete User", "Enter Admin Password to confirm:", "password", "Delete", "btn-red", async (pass) => {
                if (!pass) return;
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` },
                    body: JSON.stringify({ userId: id, adminPassword: pass })
                });
                const data = await res.json();
                if (data.success) { showToast("Deleted", "success"); loadUsers(); }
                else showToast(data.message, "error");
            });
        }

        async function loadSettings() {
            const res = await fetch('/api/admin/settings', { headers: { 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` } });
            const data = await res.json();
            if (data.success && data.settings) {
                $('#backupTime').val(data.settings.backup_time);
                $('#backupEmails').val(data.settings.backup_emails);
                $('#timezone').val(data.settings.timezone);
            }
        }

        async function updateSettings() {
            const res = await fetch('/api/admin/update-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` },
                body: JSON.stringify({
                    backup_time: $('#backupTime').val(),
                    backup_emails: $('#backupEmails').val(),
                    timezone: $('#timezone').val()
                })
            });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'error');
        }

        async function changePassword() {
            const newPass = $('#newPassword').val();
            if (newPass.length < 6) return showToast("Min 6 chars", "error");
            const res = await fetch('/api/admin/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` },
                body: JSON.stringify({ newPass })
            });
            const data = await res.json();
            if (data.success) { showToast("Changed", "success"); $('#newPassword').val(''); }
        }

        async function triggerManualBackup() {
            showToast("Starting...", "info");
            const res = await fetch('/api/admin/force-backup', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('erpToken')}` } });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'error');
        }
    </script>
</body>

</html>
