<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDB Issues | Haka ERP</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/mdb_issues.css" />
    <script src="/node_xlsx_scripts/exceljs.min.js"></script>
    <script src="/node_xlsx_scripts/FileSaver.min.js"></script>
    <script src="/node_xlsx_scripts/html2canvas.min.js"></script>
    <script src="/node_xlsx_scripts/jspdf.umd.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <button
          class="icon-button"
          type="button"
          onclick="window.location.href = './Database.html'"
          title="Back to Master Database"
        >
          <span class="material-icons">arrow_back</span>
        </button>
        <div>
          <h1>Master Database Issues</h1>
          <p>Data quality, timeline and expiry audit</p>
        </div>
        <nav class="issue-ribbon" aria-label="Issue categories">
          <button
            class="ribbon-button active"
            type="button"
            data-panel="workStartPanel"
          >
            <span class="material-icons">date_range</span> Work Start Issue
            <span class="count" id="workStartCount">0</span>
          </button>
          <button class="ribbon-button" type="button" data-panel="ownerPanel">
            <span class="material-icons">group</span> Owner
            <span class="count" id="ownerCount">0</span>
          </button>
          <button class="ribbon-button" type="button" data-panel="siteEndPanel">
            <span class="material-icons">event_busy</span> Site End
            <span class="count" id="siteEndCount">0</span>
          </button>
          <button class="ribbon-button" type="button" data-panel="noOwnerPanel">
            <span class="material-icons">person_off</span> No Owner Data
            <span class="count" id="noOwnerCount">0</span>
          </button>
          <button class="ribbon-button" type="button" data-panel="expiryPanel">
            <span class="material-icons">notification_important</span> Expiry
            <span class="count" id="expiryCount">0</span>
          </button>
          <button class="ribbon-button" type="button" data-panel="noDataPanel">
            <span class="material-icons">report_problem</span> No Data
            <span class="count" id="noDataCount">0</span>
          </button>
        </nav>
      </div>
      <div class="top-actions">
        <span class="user-chip"
          ><span class="material-icons">account_circle</span
          ><span id="currentUserName"></span
        ></span>
        <div class="expiry-export-control" id="expiryExportControl">
          <button
            class="expiry-workbook-button"
            id="expiryWorkbookButton"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            onclick="toggleExpiryExportMenu(event)"
          >
            <span class="material-icons">table_view</span>
            Export Excel
            <span class="material-icons expiry-export-arrow"
              >arrow_drop_down</span
            >
          </button>
          <div
            class="expiry-export-menu"
            id="expiryExportMenu"
            role="menu"
            aria-label="Expiry Excel export options"
          >
            <div class="expiry-export-menu-title">Export expiry data</div>
            <div class="expiry-export-scope-list">
              <button
                type="button"
                role="menuitem"
                data-expiry-scope="site"
                onclick="selectExpiryExportScope(event, 'site')"
              >
                By Site
              </button>
              <button
                type="button"
                role="menuitem"
                data-expiry-scope="fieldCo"
                onclick="selectExpiryExportScope(event, 'fieldCo')"
              >
                By Field CO
              </button>
              <button
                type="button"
                role="menuitem"
                data-expiry-scope="siteCo"
                onclick="selectExpiryExportScope(event, 'siteCo')"
              >
                By Site CO
              </button>
              <button
                type="button"
                role="menuitem"
                data-expiry-scope="all"
                onclick="selectExpiryExportScope(event, 'all')"
              >
                All
              </button>
            </div>
            <div class="expiry-export-values" id="expiryExportValues" hidden>
              <div
                class="expiry-export-values-title"
                id="expiryExportValuesTitle"
              ></div>
              <div
                class="expiry-export-value-list"
                id="expiryExportValueList"
              ></div>
            </div>
          </div>
        </div>
        <button class="refresh-button" type="button" onclick="loadIssueData()">
          <span class="material-icons">refresh</span> Refresh
        </button>
      </div>
    </header>

    <main>
            <section class="issue-panel active" id="workStartPanel">
        <div id="workStartTables"></div>
      </section>

      <section class="issue-panel" id="ownerPanel">
        <div class="owner-sub-bar">
          <button type="button" class="owner-sub-btn" id="btnTogglePlateOwner" onclick="toggleOwnerTable('plateOwnerTable', this)">
            🚗 Same Plate · Different Owner <span class="count" id="countPlateOwner">0</span>
          </button>
          <button type="button" class="owner-sub-btn" id="btnToggleMobileOwner" onclick="toggleOwnerTable('mobileOwnerTable', this)">
            📱 Same Mobile · Different Owner <span class="count" id="countMobileOwner">0</span>
          </button>
          <button type="button" class="owner-sub-btn" id="btnToggleOwnerMobile" onclick="toggleOwnerTable('ownerMobileTable', this)">
            👤 Same Owner · Different Mobile <span class="count" id="countOwnerMobile">0</span>
          </button>
        </div>
        <div class="owner-table-stack">
          <div id="plateOwnerTable" style="display: none;"></div>
          <div id="mobileOwnerTable" style="display: none;"></div>
          <div id="ownerMobileTable" style="display: none;"></div>
        </div>
      </section>

      <section class="issue-panel" id="siteEndPanel">
        <div id="siteEndTables"></div>
      </section>

      <section class="issue-panel" id="noOwnerPanel">
        <div id="noOwnerTables"></div>
      </section>

      <section class="issue-panel" id="expiryPanel">
        <div class="expiry-sub-bar">
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('iqama-expiry', this)">
            🪪 Iqama Expiry <span class="count" id="countIqamaExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('licence-expiry', this)">
            💳 Licence Expiry <span class="count" id="countLicenceExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('iqama-licence-expiry', this)">
            🪪+💳 Iqama & Licence <span class="count" id="countIqamaLicenceExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('insurance-expiry', this)">
            🛡️ Insurance Expiry <span class="count" id="countInsuranceExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('fahs-expiry', this)">
            🔍 FAHS / MVPI Expiry <span class="count" id="countFahsExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('insurance-fahs-expiry', this)">
            🛡️+🔍 Insurance & FAHS <span class="count" id="countInsuranceFahsExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('operator-tuv-expiry', this)">
            👷 Operator TUV <span class="count" id="countOperatorTuvExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('eq-tuv-expiry', this)">
            🚜 EQ TUV <span class="count" id="countEqTuvExpiry">0</span>
          </button>
          <button type="button" class="expiry-sub-btn" onclick="toggleExpiryTable('combined-expiry', this)">
            📑 Combined Expiry <span class="count" id="countCombinedExpiry">0</span>
          </button>
        </div>
        <div class="expiry-grid" id="expiryTables"></div>
      </section>

      <section class="issue-panel" id="noDataPanel">
        <div id="noDataTables"></div>
      </section>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <strong>Checking Master Database…</strong>
    </div>
    <div class="excel-filter-popup" id="excelFilterPopup">
      <div class="excel-filter-title" id="excelFilterTitle">Filter</div>
      <div class="excel-sort-actions">
        <button
          id="excelSortAsc"
          type="button"
          onclick="sortActiveExcelColumn('asc')"
        >
          A → Z
        </button>
        <button
          id="excelSortDesc"
          type="button"
          onclick="sortActiveExcelColumn('desc')"
        >
          Z → A
        </button>
      </div>
      <input
        id="excelFilterSearch"
        type="search"
        placeholder="Search values…"
        oninput="searchExcelFilterOptions(this.value)"
      />
      <label class="excel-select-all">
        <input
          id="excelFilterSelectAll"
          type="checkbox"
          onchange="toggleExcelFilterOptions(this.checked)"
        />
        Select All
      </label>
      <div class="excel-filter-options" id="excelFilterOptions"></div>
      <div class="excel-filter-actions">
        <button type="button" onclick="clearActiveExcelFilter()">Clear</button>
        <button type="button" class="apply" onclick="applyActiveExcelFilter()">
          Apply
        </button>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- 🟢 QUICK EXPIRY UPDATE MODAL -->
<div id="expiryUpdateModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:#ffffff; border-radius:10px; width:450px; max-width:90vw; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">
      <h3 style="margin:0; font-size:16px; color:#0f172a;">Update Expiry Dates</h3>
      <span id="modalPlateBadge" style="background:#e0f2fe; color:#0284c7; padding:3px 8px; border-radius:6px; font-weight:700; font-size:12px;"></span>
    </div>
    
    <input type="hidden" id="modalExpiryDbId">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">Iqama Expiry</label>
        <input type="date" id="expInputIqama" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">Licence Expiry</label>
        <input type="date" id="expInputLicence" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">Insurance Expiry</label>
        <input type="date" id="expInputInsurance" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">FAHS / MVPI</label>
        <input type="date" id="expInputFahs" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">Operator TUV</label>
        <input type="date" id="expInputOpTuv" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:11px; font-weight:600; color:#475569;">EQ TUV</label>
        <input type="date" id="expInputEqTuv" style="width:100%; padding:6px; font-size:12px; border:1px solid #cbd5e1; border-radius:4px; box-sizing:border-box;">
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:15px; border-top:1px solid #e2e8f0; padding-top:12px;">
      <button type="button" onclick="closeExpiryModal()" style="padding:6px 14px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer;">Cancel</button>
      <button type="button" onclick="submitExpiryModal()" style="padding:6px 14px; border:none; border-radius:6px; background:#059669; color:#fff; font-weight:600; cursor:pointer;">Save Expiry</button>
    </div>
  </div>
</div>

<!-- 🟢 WORK START & EQ REACHED QUICK MODAL -->
<div id="workStartUpdateModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:#ffffff; border-radius:10px; width:420px; max-width:90vw; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">
      <h3 style="margin:0; font-size:16px; color:#0f172a;">Update Work Start & Timeline</h3>
      <span id="modalWsPlateBadge" style="background:#e0f2fe; color:#0284c7; padding:3px 8px; border-radius:6px; font-weight:700; font-size:12px;"></span>
    </div>
    
    <input type="hidden" id="modalWsDbId">

    <div style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:600; color:#475569; display:block; margin-bottom:4px;">Work Start Date</label>
        <input type="date" id="inputWsDate" style="width:100%; padding:7px; font-size:13px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#475569; display:block; margin-bottom:4px;">Equipment Reached At Site</label>
        <input type="date" id="inputEqReachedDate" style="width:100%; padding:7px; font-size:13px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#475569; display:block; margin-bottom:4px;">Check Data Remark (Reason)</label>
        <textarea id="inputWsRemark" maxlength="2000" rows="3" placeholder="Reason for gap / review remark..." style="width:100%; padding:7px; font-size:12px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; resize:vertical;"></textarea>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="inputWsCleared" style="width:16px; height:16px; cursor:pointer;">
        <label for="inputWsCleared" style="font-size:12px; font-weight:600; color:#0f172a; cursor:pointer;">Mark as Checked / Cleared</label>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid #e2e8f0; padding-top:12px;">
      <button type="button" onclick="closeWorkStartModal()" style="padding:6px 14px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer;">Cancel</button>
      <button type="button" onclick="submitWorkStartModal()" style="padding:6px 14px; border:none; border-radius:6px; background:#0284c7; color:#fff; font-weight:600; cursor:pointer;">Save Changes</button>
    </div>
  </div>
</div>

<!-- 🟢 MISSING OWNER DETAILS QUICK MODAL -->
<div id="ownerUpdateModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:#ffffff; border-radius:10px; width:400px; max-width:90vw; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">
      <h3 style="margin:0; font-size:16px; color:#0f172a;">Update Owner Info</h3>
      <span id="modalOwnerPlateBadge" style="background:#fef3c7; color:#b45309; padding:3px 8px; border-radius:6px; font-weight:700; font-size:12px;"></span>
    </div>
    
    <input type="hidden" id="modalOwnerDbId">

    <div style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="font-size:12px; font-weight:600; color:#475569; display:block; margin-bottom:4px;">Owner Name</label>
        <input type="text" id="inputOwnerName" placeholder="Owner Name..." style="width:100%; padding:7px; font-size:13px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#475569; display:block; margin-bottom:4px;">Owner Mobile No</label>
        <input type="text" id="inputOwnerMobile" placeholder="05XXXXXXXX..." style="width:100%; padding:7px; font-size:13px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid #e2e8f0; padding-top:12px;">
      <button type="button" onclick="closeOwnerModal()" style="padding:6px 14px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer;">Cancel</button>
      <button type="button" onclick="submitOwnerModal()" style="padding:6px 14px; border:none; border-radius:6px; background:#059669; color:#fff; font-weight:600; cursor:pointer;">Save Owner</button>
    </div>
  </div>
</div>

    <script src="script/mdb_issues.js"></script>
  </body>
</html>
