<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Master Database | Haka ERP</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style/mdb.css" />
</head>

<body>
    <!-- Main Header Ribbon -->
    <div class="header-bar">
        <div class="header-left">
            <i class="material-icons dashboard-icon" onclick="window.location.href = './dashboard.html'" title="Live Dashboard">dashboard</i>
            <h2>ERP Master Data</h2>
        </div>

        <div class="header-right">
            <!-- Sync Status -->
            <span id="syncStatus" class="sync-badge live"><span class="material-icons">cloud_done</span> Up to date</span>
            
            <div class="header-divider"></div>

            <!-- Live Users & Add Row -->
            <div class="active-users-badge" onclick="showActiveUsers(event)" title="View Active Users">
                <span class="pulse-dot"></span> <span id="activeUserCount">1</span> Live
            </div>
            <button class="btn-success" style="padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 4px;" onclick="openAddEntryModal()">
                <span class="material-icons" style="font-size: 16px;">add</span> Add New Entry
            </button>

            <div class="header-divider"></div>

            <!-- UI Controls -->
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle Dark/Light Mode"><span class="material-icons" id="themeIcon">dark_mode</span></button>
            <button class="btn-icon" onclick="toggleHighlights()" title="Toggle Colors"><span class="material-icons" id="highlightIcon">format_color_fill</span></button>
            <select id="fontSelector" onchange="changeFont(this.value)" class="font-select">
                <option value="'Inter', sans-serif">Inter</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New</option>
            </select>

            <div class="header-divider"></div>

            <!-- Table Actions -->
            <button class="btn-icon" onclick="exportToExcel()" title="Export Excel"><span class="material-icons">download</span></button>
            
            <button id="btnBulkEdit" class="btn-action" onclick="toggleBulkEditMode()" title="Bulk Edit Data" style="display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; background: #64748b;">
                <span class="material-icons" style="font-size: 16px;">edit_note</span> Bulk Edit
            </button>
            
            <div id="bulkEditControls" style="display: none; gap: 5px;">
                <button class="btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="cancelBulkEdits()">Cancel</button>
                <button class="btn-success" style="padding: 6px 12px; font-size: 12px;" onclick="saveBulkEdits()">Save Changes</button>
            </div>

            <button class="btn-icon" onclick="openColVisModal()" title="Show/Hide/Lock Columns"><span class="material-icons">visibility</span></button>
            
            <div class="header-divider"></div>
            <!-- Collapsible Global Search -->
            <div class="search-container" onclick="document.getElementById('globalSearchInput').focus(); this.classList.add('active');">
                <span class="material-icons search-icon-input" title="Search">search</span>
                <input type="text" id="globalSearchInput" placeholder="Search Plate, Owner..." onkeyup="applyFiltersAndRender()" onblur="if(this.value === '') this.parentElement.classList.remove('active');" />
            </div>

            <div class="header-divider"></div>
            <!-- Global Alignment & Wrap -->
            <button class="btn-icon" onclick="setGlobalAlign('left')" title="Align All Left"><span class="material-icons">format_align_left</span></button>
            <button class="btn-icon" onclick="setGlobalAlign('center')" title="Align All Center"><span class="material-icons">format_align_center</span></button>
            <button class="btn-icon" onclick="setGlobalAlign('right')" title="Align All Right"><span class="material-icons">format_align_right</span></button>
            <button class="btn-icon" onclick="toggleGlobalWrap()" title="Wrap All Text"><span class="material-icons">wrap_text</span></button>
            <div class="header-divider"></div>

            <button class="btn-icon" onclick="clearAllFilters()" title="Clear Filters"><span class="material-icons">filter_alt_off</span></button>
            
            <button class="btn-icon" onclick="performUndo()" title="Undo"><span class="material-icons">undo</span></button>
            <button class="btn-icon" onclick="performRedo()" title="Redo"><span class="material-icons">redo</span></button>

            <div class="header-divider"></div>

            <!-- User Profile & Dropdown -->
            <div class="user-dropdown-container">
                <div class="user-badge" id="userProfileBtn" onclick="toggleUserMenu(event)">
                    <span class="material-icons">account_circle</span>
                    <span id="userInfoDisplay">Loading...</span>
                    <span class="material-icons">expand_more</span>
                </div>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <!-- Dropdown items built in JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div id="loader" class="loader">
            <span class="material-icons spin">sync</span> Loading Secure Data...
        </div>

        <!-- Custom Native Table Wrapper -->
        <div class="table-wrapper" id="tableContainer" style="display: none;">
            <table id="masterTable">
                <thead id="masterHead">
                    <!-- Headers built by JS -->
                </thead>
                <tbody id="masterBody">
                    <!-- Header Right-Click Context Menu -->
    <div id="headerContextMenu" class="custom-context-menu" style="display: none; z-index: 10000; position: fixed;">
        <button class="ud-item" onclick="handleHeaderAction('add_left')"><span class="material-icons">keyboard_tab</span> Add Column Left</button>
        <button class="ud-item" onclick="handleHeaderAction('add_right')"><span class="material-icons">start</span> Add Column Right</button>
        <div class="ud-divider"></div>
        <button class="ud-item" onclick="handleHeaderAction('filter')"><span class="material-icons">filter_list</span> Filter Column</button>
        <div class="ud-divider"></div>
        <button class="ud-item" onclick="handleHeaderAction('align_left')"><span class="material-icons">format_align_left</span> Align Left</button>
        <button class="ud-item" onclick="handleHeaderAction('align_center')"><span class="material-icons">format_align_center</span> Align Center</button>
        <button class="ud-item" onclick="handleHeaderAction('align_right')"><span class="material-icons">format_align_right</span> Align Right</button>
        <div class="ud-divider"></div>
        <button class="ud-item" onclick="handleHeaderAction('wrap')"><span class="material-icons">wrap_text</span> Toggle Wrap</button>
        <div class="ud-divider"></div>
        <button class="ud-item" style="color: var(--warning);" onclick="handleHeaderAction('hide')"><span class="material-icons">visibility_off</span> Hide Column</button>
        <button class="ud-item" id="ctxDeleteColBtn" style="color: var(--danger); display: none;" onclick="handleHeaderAction('delete')"><span class="material-icons">delete_forever</span> Delete Column</button>
    </div>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->

    <!-- Column Visibility & Lock Modal -->
    <div id="colVisModalOverlay" class="modal-overlay">
        <div class="modal-box" style="width: 750px; max-width: 95vw;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; border: none;">Manage Columns</h3>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-outline-sm" onclick="toggleAllColumns(true)">Select All</button>
                    <button class="btn-outline-sm" onclick="toggleAllColumns(false)">Unselect All</button>
                </div>
            </div>
            <div id="colVisList" class="col-vis-grid"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-primary" onclick="closeModal('colVisModalOverlay')">Done</button>
            </div>
        </div>
    </div>

    <!-- Security Pin Prompt for Unlocking -->
    <div id="unlockPromptModal" class="modal-overlay">
        <div class="modal-box" style="width: 350px; text-align: center;">
            <h3 style="margin-bottom: 10px; color: #0f3561;">Security Verification</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Enter the Master Data Lock PIN to unlock this column.</p>
            <input type="password" id="unlockPinInput" class="modal-input" placeholder="Enter PIN" style="text-align: center; letter-spacing: 2px; font-size: 18px;" onkeypress="if(event.key==='Enter') submitUnlockPin();" />
            <input type="hidden" id="unlockTargetCol" />
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button class="btn-outline" onclick="closeModal('unlockPromptModal')">Cancel</button>
                <button class="btn-success" onclick="submitUnlockPin()">Unlock Column</button>
            </div>
        </div>
    </div>

    <!-- Excel-like Filter Menu -->
    <div id="excelFilterMenu" class="excel-filter-menu" onclick="event.stopPropagation()">
        <div class="excel-filter-sort-controls">
            <button onclick="applySort('asc')">🔼 Sort A-Z</button>
            <button onclick="applySort('desc')">🔽 Sort Z-A</button>
        </div>
        <div class="excel-filter-search">
            <input type="text" id="filterSearchInput" placeholder="Search..." />
        </div>
        <div class="filter-item filter-select-all">
            <input type="checkbox" id="filterSelectAll" checked />
            <label for="filterSelectAll">(Select All)</label>
        </div>
        <div class="excel-filter-list" id="filterChecklist"></div>
        <div class="excel-filter-actions">
            <button class="btn-apply-filter" onclick="applyExcelFilter()">Apply</button>
            <button class="btn-clear-filter" onclick="closeExcelFilter()">Cancel</button>
        </div>
    </div>

    <!-- Add Column Modal -->
    <div id="colModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3>Add New Column</h3>
            <input type="text" id="newColName" class="modal-input" placeholder="Enter column name..." />
            <label style="font-size: 12px; font-weight: 600;">Data Type</label>
            <select id="newColType" class="modal-input">
                <option value="varchar" selected>Text</option>
                <option value="int">Number</option>
                <option value="date">Date</option>
            </select>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-outline" onclick="closeModal('colModalOverlay')">Cancel</button>
                <button class="btn-primary" onclick="submitNewColumn()">Save Column</button>
            </div>
        </div>
    </div>

    <!-- Add Entry Modal -->
    <div id="entryModalOverlay" class="modal-overlay">
        <div class="modal-box" style="width: 85vw; max-width: 1000px; max-height: 85vh;">
            <h3>Add New Entry</h3>
            <div id="dynamicFormFields" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; overflow-y: auto; max-height: 60vh; padding-right: 10px; margin-bottom: 20px;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
                <button class="btn-outline" onclick="closeModal('entryModalOverlay')">Cancel</button>
                <button class="btn-success" onclick="submitNewEntry()">Save Entry</button>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast-mini"></div>
    <script src="script/mdb.js"></script>
</body>
</html>
